/* ===== src/ui/dom.js ===== */
// ui/dom.js — a 60-line view layer.
//
// A design office tool must open from a file with no toolchain and no network.
// That rules out a bundled framework, so the view layer is hand-rolled and
// deliberately small. h() builds elements; mount() swaps children.

function h(tag, props = null, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'html') el.innerHTML = v;
      else if (k in el && k !== 'list' && typeof v !== 'object') {
        try { el[k] = v; } catch { el.setAttribute(k, v); }
      } else el.setAttribute(k, v);
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children) {
    if (c === null || c === undefined || c === false || c === true) continue;
    if (Array.isArray(c)) { append(el, c); continue; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function frag(...children) {
  const f = document.createDocumentFragment();
  append(f, children);
  return f;
}

function mount(container, ...children) {
  container.replaceChildren();
  append(container, children);
  return container;
}

function qs(sel, root = document) { return root.querySelector(sel); }

function clear(el) { el.replaceChildren(); return el; }

/** Injects a stylesheet once, keyed by id. */
function injectStyle(id, css) {
  let tag = document.getElementById(id);
  if (!tag) {
    tag = document.createElement('style');
    tag.id = id;
    document.head.appendChild(tag);
  }
  tag.textContent = css;
  return tag;
}

/**
 * Re-rendering replaces DOM nodes, which drops focus and caret position. Any
 * screen that repaints while the user is typing must go through this, or the
 * field loses focus after every keystroke.
 *
 * Controls are matched by id, so every control that lives inside a repainting
 * region needs a stable id.
 */
function preserveFocus(paint) {
  const active = document.activeElement;
  const id = active && active.id ? active.id : null;
  let start = null;
  let end = null;
  if (id && typeof active.selectionStart === 'number') {
    try { start = active.selectionStart; end = active.selectionEnd; } catch { /* type does not support selection */ }
  }
  const scroller = document.querySelector('.tg-board');
  const scrollTop = scroller ? scroller.scrollTop : 0;

  paint();

  if (scroller) scroller.scrollTop = scrollTop;
  if (!id) return;
  const next = document.getElementById(id);
  if (!next || next === document.activeElement) return;
  next.focus({ preventScroll: true });
  if (start !== null && typeof next.setSelectionRange === 'function') {
    try { next.setSelectionRange(start, end); } catch { /* number and date inputs refuse this */ }
  }
}

/** Focus the first invalid or first focusable control inside a container. */
function focusFirst(container) {
  const el = container.querySelector('[data-invalid="true"] input, [data-invalid="true"] select, input, select, textarea, button');
  if (el) el.focus();
}

.tg-fold__count{margin-left:auto;font-size:11px;color:var(--tg-ink-40);font-weight:400}
.tg-fold[data-open="false"] .tg-fold__body{display:none}
.tg-fold{margin-bottom:16px}

/* ---------- forms ---------- */
.tg-form{display:grid;gap:18px}
.tg-fieldset{border:0;padding:0;margin:0;display:grid;gap:12px}
.tg-fieldset__legend{
  font-family:var(--tg-font-display);font-weight:800;font-size:13px;
  padding:0 0 6px;border-bottom:2px solid var(--tg-ink);width:100%;margin-bottom:4px;
}
.tg-grid{display:grid;gap:12px 16px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.tg-grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tg-span-all{grid-column:1/-1}

.tg-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.tg-field__label{font-size:12px;font-weight:600;color:var(--tg-ink-80)}
.tg-field__req{color:var(--tg-red);margin-left:3px}
.tg-field__hint{font-size:11.5px;color:var(--tg-ink-40)}
.tg-field__error{font-size:11.5px;color:var(--tg-red-deep);font-weight:600}
.tg-field input,.tg-field select,.tg-field textarea{
  font:inherit;font-size:14px;color:var(--tg-ink);
  border:1px solid var(--tg-rule);border-radius:var(--tg-radius);
  padding:7px 9px;background:#fff;width:100%;min-width:0;
}
.tg-field textarea{min-height:88px;resize:vertical;line-height:1.55}
.tg-field input:focus,.tg-field select:focus,.tg-field textarea:focus{
  border-color:var(--tg-ink);outline:2px solid var(--tg-red);outline-offset:0;
}
.tg-field[data-invalid="true"] input,
.tg-field[data-invalid="true"] select,
.tg-field[data-invalid="true"] textarea{border-color:var(--tg-red);background:var(--tg-red-tint)}
.tg-field--ident input{font-family:var(--tg-font-ident);letter-spacing:.04em}

/* ---------- buttons ---------- */
.tg-btn{
  font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  padding:8px 15px;border-radius:var(--tg-radius);
  border:1px solid var(--tg-ink);background:var(--tg-ink);color:#fff;
  display:inline-flex;align-items:center;gap:7px;
}
.tg-btn:hover{background:#2A2A2A}
.tg-btn:disabled{opacity:.4;cursor:not-allowed}
.tg-btn--ghost{background:#fff;color:var(--tg-ink)}
.tg-btn--ghost:hover{background:var(--tg-board)}
.tg-btn--quiet{background:transparent;border-color:var(--tg-rule);color:var(--tg-ink-60)}
.tg-btn--quiet:hover{background:var(--tg-board);color:var(--tg-ink)}
.tg-btn--danger{background:var(--tg-red);border-color:var(--tg-red)}
.tg-btn--danger:hover{background:var(--tg-red-deep)}
.tg-btn--sm{padding:5px 10px;font-size:12px}

/* ---------- schedule tables ---------- */
.tg-table{width:100%;border-collapse:collapse;font-size:13px}
.tg-table caption{text-align:left;font-size:11px;letter-spacing:.09em;color:var(--tg-ink-40);padding:0 0 6px}
.tg-table th{
  background:var(--tg-ink);color:#fff;text-align:left;font-weight:600;font-size:11.5px;
  letter-spacing:.05em;padding:7px 10px;border-right:1px solid #333;
}
.tg-table th:last-child{border-right:0}
.tg-table td{padding:7px 10px;border-bottom:1px solid var(--tg-rule-soft);border-right:1px solid var(--tg-rule-soft);vertical-align:top}
.tg-table td:last-child{border-right:0}
.tg-table tbody tr:nth-child(even){background:#FAFAF7}
.tg-table .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--tg-font-ident)}
.tg-table .ident{font-family:var(--tg-font-ident);font-size:12px}
.tg-table__empty{padding:26px 10px;text-align:center;color:var(--tg-ink-40);font-size:13px}

/* ---------- clause reference ---------- */
.tg-clause{
  font-family:var(--tg-font-ident);font-size:11.5px;color:var(--tg-ink-60);
  border-left:2px solid var(--tg-red);padding-left:7px;display:inline-block;
}

/* ---------- status chips and stamps ---------- */
.tg-chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.06em;padding:3px 8px;border:1px solid currentColor;border-radius:var(--tg-radius);
}
.tg-chip--safe{color:var(--tg-safe);background:var(--tg-safe-tint)}
.tg-chip--unsafe{color:var(--tg-unsafe);background:var(--tg-unsafe-tint)}
.tg-chip--caution{color:var(--tg-caution);background:var(--tg-caution-tint)}
.tg-chip--notcov{color:var(--tg-notcov);background:var(--tg-notcov-tint)}
.tg-chip--neutral{color:var(--tg-ink-60);background:#F2F2EE}

.tg-stamp{
  display:inline-block;border:3px solid currentColor;padding:6px 14px;
  font-family:var(--tg-font-display);font-weight:800;font-size:17px;letter-spacing:.14em;
  transform:rotate(-3.5deg);background:transparent;
}
.tg-stamp--safe{color:var(--tg-safe)}
.tg-stamp--unsafe{color:var(--tg-unsafe)}
.tg-stamp--notcov{color:var(--tg-notcov);font-size:13px}

/* ---------- notices ---------- */
.tg-note{border:1px solid var(--tg-rule);border-left:4px solid var(--tg-ink-40);padding:11px 14px;font-size:13px;background:#FBFBF8}
.tg-note h4{font-size:12.5px;margin-bottom:4px}
.tg-note p:last-child{margin-bottom:0}
.tg-note--code{border-left-color:var(--tg-notcov);background:var(--tg-notcov-tint)}
.tg-note--caution{border-left-color:var(--tg-caution);background:var(--tg-caution-tint)}
.tg-note--danger{border-left-color:var(--tg-red);background:var(--tg-red-tint)}
.tg-note__list{margin:6px 0 0;padding-left:18px}
.tg-note__list li{margin-bottom:3px}

/* ---------- welcome ---------- */
.tg-welcome__mark{display:flex;justify-content:center;padding:26px 0 6px}
.tg-welcome__mark img,.tg-welcome__mark svg{width:132px;height:auto;max-width:40vw;display:block}

/* ---------- empty state ---------- */
.tg-empty{text-align:center;padding:56px 24px;max-width:52ch;margin:0 auto}
.tg-empty h2{font-size:${TYPE.scale.xl};margin-bottom:8px}
.tg-empty p{color:var(--tg-ink-60);margin-bottom:18px}

/* ---------- toast ---------- */
.tg-toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:60;max-width:min(380px,90vw)}
.tg-toast{
  background:var(--tg-ink);color:#fff;padding:10px 14px;font-size:13px;
  border-left:4px solid var(--tg-red);border-radius:var(--tg-radius);
  box-shadow:0 6px 18px rgba(0,0,0,.28);
}
.tg-toast--ok{border-left-color:var(--tg-safe)}
.tg-toast--err{border-left-color:var(--tg-red)}

/* ---------- misc ---------- */
.tg-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tg-row--end{justify-content:flex-end}
.tg-muted{color:var(--tg-ink-40)}
.tg-ident{font-family:var(--tg-font-ident)}
.tg-hr{height:1px;background:var(--tg-rule);border:0;margin:16px 0}
[dir="rtl"] .tg-field__label,[dir="rtl"] textarea{text-align:right}
textarea[lang="ar"]{direction:rtl;text-align:right}

@media (max-width:820px){
  .tg-body{grid-template-columns:1fr}
  .tg-rail{flex-direction:row;overflow-x:auto;border-bottom:2px solid var(--tg-red)}
  .tg-rail__group,.tg-rail__foot{display:none}
  .tg-rail__item{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;width:auto}
  .tg-rail__item[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--tg-red)}
  .tg-tb__grid{grid-template-columns:repeat(2,1fr)}
  .tg-tb__cell:nth-child(4n){border-right:1px solid var(--tg-rule)}
  .tg-tb__cell:nth-child(2n){border-right:0}
  .tg-board{padding:12px}
  .tg-sheet__body{padding:14px}
}


.tg-updatebar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--tg-red);color:#fff;padding:8px 18px;font-size:13px;
}
.tg-updatebar__note{color:#FFD9DA;font-size:12px}
.tg-updatebar .tg-btn{background:#fff;color:var(--tg-ink);border-color:#fff}
.tg-updatebar .tg-btn--quiet{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}

.tg-why{font-size:11.5px;color:var(--tg-ink-60);border-left:2px solid var(--tg-red);padding-left:7px;margin-top:5px;line-height:1.45}
.tg-effect{font-size:11px;color:var(--tg-ink-40);margin-top:4px;line-height:1.4}

/* ================= calculation sheet ================= */
.cs-toolbar{max-width:var(--tg-sheet-max);margin:0 auto 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cs-doc{display:grid;gap:18px;justify-items:center}
.cs-page{
  width:210mm;height:297mm;background:#fff;border:1px solid var(--tg-rule);
  display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
  font-size:9.6pt;line-height:1.42;color:#111;
}
.cs-body{padding:9mm 9mm 4mm;overflow:hidden}

.cs-header{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:5mm 9mm 3mm;border-bottom:2px solid var(--tg-ink)}
.cs-logo{height:15mm;width:auto;display:block}
.cs-header__proj{font-family:var(--tg-font-display);font-weight:800;font-size:12pt;line-height:1.15}
.cs-header__sub{font-size:8pt;color:var(--tg-ink-60)}
.cs-header__title{font-size:9pt;font-weight:600;margin-top:2px;border-left:3px solid var(--tg-red);padding-left:6px}
.cs-header__review{
  margin-top:3px;display:inline-block;border:2px solid var(--tg-red);color:var(--tg-red);
  font-family:var(--tg-font-display);font-weight:800;font-size:8pt;letter-spacing:.1em;padding:2px 7px;
}
.cs-header__meta{display:flex;gap:0;margin:0;border:1px solid var(--tg-rule)}
.cs-meta{padding:3px 8px;border-right:1px solid var(--tg-rule);min-width:19mm}
.cs-meta:last-child{border-right:0}
.cs-meta dt{font-size:6.5pt;letter-spacing:.08em;color:var(--tg-ink-40)}
.cs-meta dd{margin:0;font-family:var(--tg-font-ident);font-size:9pt;font-weight:700}

.cs-footer{display:flex;justify-content:space-between;gap:12px;padding:2.5mm 9mm 4mm;
  border-top:1px solid var(--tg-ink);font-size:7.6pt;color:var(--tg-ink-60)}
.cs-footer span{margin-right:12px}
.cs-footer__page{font-family:var(--tg-font-ident);font-weight:700;color:var(--tg-ink);margin-right:0}

.cs-h{font-size:10.5pt;margin:10px 0 5px;padding-bottom:2px;border-bottom:1.5px solid var(--tg-ink);display:flex;gap:8px}
.cs-h__n{color:var(--tg-red);font-family:var(--tg-font-ident)}
.cs-page .cs-h:first-child{margin-top:0}

.cs-table{width:100%;border-collapse:collapse;font-size:8.4pt;margin-bottom:6px}
.cs-table th{background:#EFEFEA;border:1px solid var(--tg-rule);padding:3px 5px;text-align:left;
  font-size:7.6pt;font-weight:700;letter-spacing:.03em}
.cs-table td{border:1px solid var(--tg-rule);padding:3px 5px;vertical-align:top}
.cs-table td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--tg-font-ident)}
.cs-table td.ident{font-family:var(--tg-font-ident);font-size:7.8pt}
.cs-cap{font-size:7.8pt;color:var(--tg-ink-60);margin:0 0 4px}
.cs-cont{font-size:7.8pt;color:var(--tg-ink-40);margin:0 0 3px;font-style:italic}
.cs-expr{font-family:var(--tg-font-ident);font-size:7.8pt;color:#333;margin-top:1px}
.cs-sub{font-family:var(--tg-font-ident);font-size:7.4pt;color:var(--tg-ink-40)}
.cs-flag{font-size:7.8pt;color:var(--tg-caution);margin-top:1px}

.cs-note{border:1px solid var(--tg-rule);border-left:3px solid var(--tg-ink-40);
  padding:5px 8px;margin:5px 0;font-size:8.2pt;background:#FAFAF7}
.cs-note b{display:block;margin-bottom:2px;font-size:8.4pt}
.cs-note p{margin:0}
.cs-note--code{border-left-color:var(--tg-notcov);background:var(--tg-notcov-tint)}
.cs-note--fail{border-left-color:var(--tg-red);background:var(--tg-red-tint)}

.cs-verdict{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
.cs-verdict__body{flex:1;font-size:8.6pt}
.cs-verdict__body p{margin:0 0 3px}
.cs-stamp{border:3px solid currentColor;padding:5px 12px;font-family:var(--tg-font-display);
  font-weight:800;font-size:13pt;letter-spacing:.12em;transform:rotate(-3.5deg);white-space:nowrap}
.cs-stamp--safe{color:var(--tg-safe)}
.cs-stamp--unsafe{color:var(--tg-unsafe)}
.cs-stamp--incomplete{color:var(--tg-notcov)}
.cs-stamp--none{color:var(--tg-ink-40)}

.cs-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cs-sign__box{border:1px solid var(--tg-rule);padding:5px 8px 8px}
.cs-sign__role{font-size:7pt;letter-spacing:.1em;color:var(--tg-ink-40)}
.cs-sign__name{font-size:9pt;font-weight:700;margin:1px 0 12px}
.cs-sign__rule{border-top:1px solid var(--tg-ink);margin-bottom:3px}
.cs-sign__meta{font-size:6.8pt;color:var(--tg-ink-40)}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .tg-topbar,.tg-rail,.cs-toolbar,.tg-toasts{display:none!important}
  .tg-app,.tg-body{display:block;height:auto}
  .tg-board{padding:0;overflow:visible}
  .cs-doc{gap:0;display:block}
  .cs-page{border:0;box-shadow:none;break-after:page;page-break-after:always;margin:0}
  .cs-page:last-child{break-after:auto;page-break-after:auto}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const LOGO_SRC = INLINE_LOGO.startsWith('data:') ? INLINE_LOGO : './assets/logo.jpg';

const ORG = {
  name: 'Trust Group',
  platform: 'Design Platform',
  tagline: 'Structural design, checked and traceable',
};

function logoImg(className = '', alt = 'Trust Group') {
  const img = document.createElement('img');
  img.src = LOGO_SRC;
  img.alt = alt;
  if (className) img.className = className;
  img.decoding = 'async';
  // If the file is opened without its assets folder, fall back to the wordmark
  // rather than showing a broken image in a title block.
  img.onerror = () => { img.replaceWith(fallbackMark(className)); };
  return img;
}

function field({ label, id, hint, error, required, control, ident, span }) {

    dataset: { invalid: error ? 'true' : 'false' },
  },
    h('label', { class: 'tg-field__label', for: id },
      label,
      required ? h('span', { class: 'tg-field__req', title: 'Required' }, '*') : null),
    control,
    error ? h('span', { class: 'tg-field__error', role: 'alert' }, error) : null,
    !error && hint ? h('span', { class: 'tg-field__hint' }, hint) : null,
  );
}

function textInput({ id, value = '', placeholder = '', onInput, type = 'text', ...rest }) {
  return h('input', {
    id, type, value, placeholder,
    onInput: (e) => onInput && onInput(e.target.value, e),
    ...rest,
  });
}

function textArea({ id, value = '', placeholder = '', onInput, rows, lang }) {
  return h('textarea', {
    id, placeholder, rows, lang,
    onInput: (e) => onInput && onInput(e.target.value, e),
  }, value);
}

/**
 * options: array of { value, label } OR array of { group, options: [...] }
 */
function select({ id, value = '', options = [], onChange, placeholder }) {
  const el = h('select', { id, onChange: (e) => onChange && onChange(e.target.value, e) });
  if (placeholder !== undefined) {
    el.appendChild(h('option', { value: '' }, placeholder));
  }
  for (const o of options) {
    if (o && Array.isArray(o.options)) {
      const g = h('optgroup', { label: o.group });
      for (const oo of o.options) g.appendChild(h('option', { value: oo.value }, oo.label));
      el.appendChild(g);
    } else {
      el.appendChild(h('option', { value: o.value }, o.label));
    }
  }
  el.value = value ?? '';
  return el;
}

/**
 * A numeric field that does NOT fight the person typing.
 *
 * The bug this fixes: the screen repaints on every model change, and the
 * repaint rebuilt the input from the model. Selecting "406.4" and typing "5"
 * left the model holding 5 mm for an instant, which produced an impossible
 * section, which produced NaN, which came back and wiped the field.
 *
 * The rule now: while the caret is in the field, the text belongs to the
 * person. Nothing reformats it, nothing recalculates from it. The value is
 * committed on blur or on Enter, when the typing is a finished intention.
 */
const inflight = new Map();

function numberInput({ id, value, onCommit, step = 'any', min, max, placeholder }) {
  const pending = inflight.get(id);
  const shown = pending !== undefined ? pending : formatForEdit(value);

  const el = h('input', {
    id, type: 'text', inputmode: 'decimal', placeholder,
    value: shown,
    autocomplete: 'off', spellcheck: 'false',
    dataset: { numeric: 'true' },
  });

  el.addEventListener('input', () => {
    // Hold the raw text. Do not parse, do not format, do not recalculate.
    inflight.set(id, el.value);
  });

  const commit = () => {
    const raw = el.value.trim();
    inflight.delete(id);
    if (raw === '' || raw === '-' || raw === '.' || raw === '-.') {
      el.value = formatForEdit(value);
      return;
    }
    const n = Number(raw);
    if (!Number.isFinite(n)) {
      el.value = formatForEdit(value);
      toast('That is not a number.', 'err');
      return;
    }
    if (min !== undefined && n < min) { el.value = formatForEdit(value); toast(`Value must be at least ${min}.`, 'err'); return; }
    if (max !== undefined && n > max) { el.value = formatForEdit(value); toast(`Value must be at most ${max}.`, 'err'); return; }
    if (n === Number(value)) return;
    onCommit(n);
  };

  el.addEventListener('blur', commit);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { inflight.delete(id); el.value = formatForEdit(value); el.blur(); }
  });

  return el;
}

/** Trailing zeros are noise when editing; keep the number readable. */
function formatForEdit(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  if (Number.isInteger(n)) return String(n);
  return String(Number(n.toFixed(4)));
}

/** Called when a screen is torn down, so stale text never leaks into another field. */
function clearPendingEdits() {
  inflight.clear();
}

/* ---------------- buttons ---------------- */

function button(label, { onClick, variant = '', type = 'button', disabled, title, small } = {}) {
  const cls = ['tg-btn', variant ? `tg-btn--${variant}` : '', small ? 'tg-btn--sm' : '']
    .filter(Boolean).join(' ');
  return h('button', { class: cls, type, onClick, disabled, title }, label);
}

/* ---------------- collapsible sections ---------------- */

/**
 * Open by default; clicking the heading closes it, clicking again reopens.
 * The open/closed state is remembered per key for the life of the session, so
 * a section closed to get it out of the way stays closed on the next visit.
 */
const foldState = new Map();

function isFoldOpen(key) {
  return foldState.has(key) ? foldState.get(key) : true;
}

function setFoldOpen(key, open) {
  foldState.set(key, open);
}

function fold({ key, title, count, body, onToggle }) {
  const open = isFoldOpen(key);
  const wrap = h('section', { class: 'tg-fold', dataset: { open: String(open) } });
  const toggle = h('button', {
    class: 'tg-fold__toggle', type: 'button',
    'aria-expanded': String(open),
    onClick: () => {
      const next = !isFoldOpen(key);
      setFoldOpen(key, next);
      wrap.dataset.open = String(next);
      toggle.setAttribute('aria-expanded', String(next));
      caret.textContent = next ? '\u25BC' : '\u25B6';
      if (onToggle) onToggle(next);
    },
  });
  const caret = h('span', { class: 'tg-fold__caret' }, open ? '\u25BC' : '\u25B6');
  toggle.append(caret, h('span', null, title),
    count !== undefined && count !== null ? h('span', { class: 'tg-fold__count' }, String(count)) : '');
  wrap.append(toggle, h('div', { class: 'tg-fold__body' }, body));
  return wrap;
}

function sheet({ title, lede, actions, body, foot }) {

function titleBlock({ heading, right, cells }) {

      h('h3', null, heading),

/* ---------------- table ---------------- */

/**
 * columns: [{ key, label, align, ident, render }]
 */
function table({ caption, columns, rows, empty = 'Nothing here yet.' }) {
  const t = h('table', { class: 'tg-table' });
  if (caption) t.appendChild(h('caption', null, caption));
  t.appendChild(h('thead', null, h('tr', null,
    columns.map((c) => h('th', { style: c.width ? { width: c.width } : null }, c.label)))));

    t.appendChild(h('tbody', null, h('tr', null,
      h('td', { colSpan: columns.length, class: 'tg-table__empty' }, empty))));
    return t;
  }
  t.appendChild(h('tbody', null, rows.map((r) => h('tr', null,
    columns.map((c) => h('td', { class: [c.align === 'right' ? 'num' : '', c.ident ? 'ident' : ''].filter(Boolean).join(' ') },
      c.render ? c.render(r) : r[c.key])),

  if (!toastHost) {
    toastHost = h('div', { class: 'tg-toasts', role: 'status', 'aria-live': 'polite' });

/* ===== src/modules/report/calcSheet.js ===== */
// modules/report/calcSheet.js — the printable calculation sheet.
//
// Two responsibilities, kept apart:
//   1. sheetBlocks()      turns a design result into ordered content blocks
//   2. paginateBlocks()   measures those blocks and fills A4 pages
//
// Pagination is done here rather than left to the browser because a checker's
// copy must not split a table across a page without repeating its head, and
// because "Page 3 of 7" has to be right. Browsers cannot be relied on for
// either through CSS alone.


// A4 at 96 dpi, less the printed margins reserved in the stylesheet.
const A4 = {
  widthPx: 794,
  heightPx: 1123,
  headerPx: 96,
  footerPx: 74,
  padPx: 34,
};

function contentHeightPx() {
  return A4.heightPx - A4.headerPx - A4.footerPx - A4.padPx * 2;
}

function contentWidthPx() {
  return A4.widthPx - A4.padPx * 2;
}

/* ------------------------------------------------------------------ */
/* content                                                             */
/* ------------------------------------------------------------------ */

function sectionHeading(n, text) {
  return h('h3', { class: 'cs-h' }, h('span', { class: 'cs-h__n' }, n), text);
}

function dataTable(columns, rows, opts = {}) {
  const t = h('table', { class: `cs-table${opts.class ? ` ${opts.class}` : ''}` });
  t.appendChild(h('thead', null, h('tr', null,
    columns.map((c) => h('th', { style: c.width ? { width: c.width } : null }, c.label)))));
  t.appendChild(h('tbody', null, rows.map((r) => h('tr', null,
    columns.map((c) => h('td', { class: c.align === 'right' ? 'num' : (c.ident ? 'ident' : '') },
      c.render ? c.render(r) : r[c.key]))))));
  return t;
}

/** A block is either a single node, or a splittable table. */
function block(node) { return { node }; }

function splitTable(columns, rows, opts = {}) {
  return {
    split: {
      columns, rows, opts,
      build: (subset, continued) => h('div', null,
        continued ? h('p', { class: 'cs-cont' }, `${opts.caption || 'Table'} (continued)`) : null,
        opts.caption && !continued ? h('p', { class: 'cs-cap' }, opts.caption) : null,
        dataTable(columns, subset, opts)),
    },
  };
}

function sheetBlocks(app, item) {
  const p = app.store.state.project;
  const u = p.units;
  const res = item.result;
  const blocks = [];
  const fmt = (v, d) => (v === null || v === undefined ? '—' : (d ? formatWithUnit(v, d, u) : formatNumber(v, 3)));

  /* 1 — basis of design */
  blocks.push(block(sectionHeading('1', 'Basis of design')));
  const codeRec = app.registry.get(res ? res.runCodeId : item.code);
  blocks.push(block(dataTable(
    [{ label: 'Item', width: '32%' }, { label: 'Value' }],
    [
      ['Member', `${itemLabel(item)} — ${describeSection(item.geometry)}`],
      ['Category', item.category],
      ['Code selected', item.code],
      ['Code used for the calculation', res ? res.runCodeId : '—'],
      ['Edition', codeRec ? codeRec.edition : '—'],
      ['Design basis', codeRec ? codeRec.philosophy : '—'],
      ['Units', u],
      ['Item revision', item.revision],
      ['Status', item.status],
    ].map(([k, v]) => ({ k, v })),
    { },
  )));
  // rebuild with proper renderers
  blocks.pop();
  blocks.push(block(dataTable(
    [{ label: 'Item', width: '32%', render: (r) => r.k }, { label: 'Value', render: (r) => r.v }],
    [
      ['Member', `${itemLabel(item)} — ${describeSection(item.geometry)}`],
      ['Category', item.category],
      ['Code selected', item.code],
      ['Code used for the calculation', res ? res.runCodeId : '—'],
      ['Edition', codeRec ? codeRec.edition : '—'],
      ['Design basis', codeRec ? codeRec.philosophy : '—'],
      ['Units', u],
      ['Item revision', item.revision],
      ['Status', item.status],
    ].map(([k, v]) => ({ k, v })),
  )));

  if (p.quick) {
    blocks.push(block(h('div', { class: 'cs-note cs-note--fail' },
      h('b', null, 'For review only — not for issue'),
      h('p', null, 'This sheet was produced through quick design. It carries no client, job number, checker or approver, and has not been through independent checking. It records a calculation for review and must not be issued for construction.'))));
  }

  if (res && res.substitution) {
    blocks.push(block(h('div', { class: 'cs-note cs-note--code' },
      h('b', null, 'Design code substitution'),
      h('p', null, res.substitution.note))));
  }
  if (codeRec && codeRec.verifyEdition) {
    blocks.push(block(h('div', { class: 'cs-note' },
      h('b', null, 'Edition to be confirmed'),
      h('p', null, `The edition string printed above is carried by the software for reference. Confirm ${codeRec.id} and any National Annex against the office controlled copy before this sheet is issued.`))));
  }

  /* 2 — geometry and materials */
  blocks.push(block(sectionHeading('2', 'Section, materials and actions')));
  const sec = res ? res.ctx.sec : null;
  const g = item.geometry;
  const m = item.materials;
  const a = item.actions;

  blocks.push(block(dataTable(
    [
      { label: 'Property', width: '40%', render: (r) => r.k },
      { label: 'Symbol', width: '16%', ident: true, render: (r) => r.s },
      { label: 'Value', align: 'right', render: (r) => r.v },
    ],
    [
      { k: 'Section', s: '—', v: describeSection(g) },
      { k: 'Column length', s: 'L', v: fmt(g.length, 'length') },
      { k: 'Buckling length', s: 'L_cr', v: res ? fmt(res.ctx.geometry.bucklingLength, 'length') : '—' },
      { k: 'Steel area', s: 'A_a', v: sec ? fmt(sec.Aa, 'area') : '—' },
      { k: 'Concrete area', s: 'A_c', v: sec ? fmt(sec.Ac, 'area') : '—' },
      { k: 'Reinforcement area', s: 'A_s', v: sec ? fmt(sec.As, 'area') : '—' },
      { k: 'Steel yield strength', s: 'f_y', v: fmt(m.fy, 'stress') },
      { k: 'Concrete cylinder strength', s: 'f_ck', v: fmt(m.fck, 'stress') },
      { k: 'Reinforcement yield strength', s: 'f_sk', v: fmt(m.fsk, 'stress') },
      { k: 'Design axial force', s: 'N_Ed', v: fmt(a.NEd, 'force') },
      { k: 'Permanent part of the axial force', s: 'N_G,Ed', v: fmt(a.NGEd, 'force') },
      { k: 'First-order moment about y', s: 'M_y,Ed,0', v: fmt(a.MyEd, 'moment') },
      { k: 'First-order moment about z', s: 'M_z,Ed,0', v: fmt(a.MzEd, 'moment') },
    ],
  )));

  /* 3 — assumptions */
  blocks.push(block(sectionHeading('3', 'Assumptions')));
  blocks.push(splitTable(
    [
      { label: 'Assumption', width: '34%', render: (r) => r.label },
      { label: 'Value', width: '14%', align: 'right', render: (r) => (r.dimension ? formatWithUnit(r.value, r.dimension, u) : String(r.value)) },
      { label: 'Source', width: '12%', render: (r) => (r.source === SOURCE.USER ? 'Engineer' : 'Generated') },
      { label: 'Basis and reason', render: (r) => (r.source === SOURCE.USER && r.reason ? `Changed: ${r.reason}` : r.basis) },
    ],
    item.assumptions || [],
    { caption: 'Every assumption below is an input to the result. Values marked "Engineer" were changed from the generated default and carry the reason given.' },
  ));

  /* 4 — working */
  blocks.push(block(sectionHeading('4', 'Calculations')));
  blocks.push(block(h('p', { class: 'cs-cap' },
    'Every line names the code and clause it comes from. Lines marked "derived" are arithmetic on the values above them and introduce no new code provision.')));
  blocks.push(splitTable(
    [
      { label: 'Symbol', width: '13%', ident: true, render: (s) => s.symbol },
      { label: 'Description and expression', render: (s) => h('div', null,
        h('div', null, s.description),
        s.expression ? h('div', { class: 'cs-expr' }, s.expression) : null,
        s.substitution ? h('div', { class: 'cs-sub' }, s.substitution) : null,
        s.note ? h('div', { class: 'cs-flag' }, s.note) : null) },
      { label: 'Value', width: '17%', align: 'right', render: (s) => (s.value === null ? '—' : fmt(s.value, s.dimension)) },
      { label: 'Reference', width: '22%', ident: true, render: (s) => (s.kind === STEP_KIND.DERIVED
        ? 'derived' : `${s.code} §${s.clause}`) },
    ],
    res ? res.steps : [],
    { caption: null },
  ));

  /* 5 — verification */
  blocks.push(block(sectionHeading('5', 'Verification summary')));
  blocks.push(splitTable(
    [
      { label: 'Check', render: (c) => c.title },
      { label: 'Clause', width: '19%', ident: true, render: (c) => (c.clause ? `${c.code} §${c.clause}` : (c.code || '—')) },
      { label: 'Required', width: '14%', align: 'right', render: (c) => (c.demand === null ? '—' : fmt(c.demand, c.dimension)) },
      { label: 'Available', width: '14%', align: 'right', render: (c) => (c.capacity === null ? '—' : fmt(c.capacity, c.dimension)) },
      { label: 'U', width: '9%', align: 'right', render: (c) => (Number.isFinite(c.utilisation) ? formatNumber(c.utilisation, 3) : '—') },
      { label: 'Result', width: '13%', render: (c) => c.status },
    ],
    res ? res.checks : [],
  ));

  const blocked = res ? res.checks.filter((c) => c.note && c.status !== CHECK_STATUS.PASS) : [];
  for (const c of blocked) {
    blocks.push(block(h('div', { class: `cs-note${c.status === CHECK_STATUS.FAIL ? ' cs-note--fail' : ' cs-note--code'}` },
      h('b', null, `${c.title} — ${c.code}${c.clause ? ` §${c.clause}` : ''} — ${c.status}`),
      h('p', null, c.note))));
  }

  /* 6 — conclusion */
  blocks.push(block(sectionHeading('6', 'Conclusion')));
  const s = res ? res.summary : null;
  blocks.push(block(h('div', { class: 'cs-verdict' },
    h('div', { class: `cs-stamp cs-stamp--${verdictClass(s)}` }, s ? s.overall : 'NOT RUN'),
    h('div', { class: 'cs-verdict__body' },
      s && s.governing
        ? h('div', null,
          h('p', null, h('b', null, 'Governing check: '), s.governing.title,
            s.governing.clause ? ` (${s.governing.code} §${s.governing.clause})` : ''),
          s.governing.failureMode ? h('p', null, h('b', null, 'Failure mode: '), s.governing.failureMode) : null,
          h('p', null, h('b', null, 'Maximum utilisation: '),
            Number.isFinite(s.maxUtilisation) ? formatNumber(s.maxUtilisation, 3) : '—'),
          h('p', null, h('b', null, 'Required against available: '),
            s.governing.demand !== null ? `${fmt(s.governing.demand, s.governing.dimension)} against ${fmt(s.governing.capacity, s.governing.dimension)}` : '—'))
        : h('p', null, 'No governing check could be established.'),
      s && s.counts.blocked
        ? h('p', { class: 'cs-flag' }, `${s.counts.blocked} check${s.counts.blocked > 1 ? 's are' : ' is'} not covered or not calculated. The design cannot be read as satisfactory until they are resolved by other means.`)
        : null,
    ))));

  blocks.push(block(h('div', { class: 'cs-sign' },
    signBox('Designed', item.designer, item.revision),
    signBox('Checked', item.checker, item.revision),
    signBox('Approved', titleBlockAttribution(p).approved, item.revision),
  )));

  return blocks;
}

function signBox(role, name, rev) {
  return h('div', { class: 'cs-sign__box' },
    h('div', { class: 'cs-sign__role' }, role),
    h('div', { class: 'cs-sign__name' }, name || '—'),
    h('div', { class: 'cs-sign__rule' }),
    h('div', { class: 'cs-sign__meta' }, `Signature and date · Rev ${rev}`));
}

function verdictClass(s) {
  if (!s) return 'none';
  if (s.overall === OVERALL.SAFE) return 'safe';
  if (s.overall === OVERALL.UNSAFE) return 'unsafe';
  return 'incomplete';
}

/* ------------------------------------------------------------------ */
/* pagination                                                          */
/* ------------------------------------------------------------------ */

/**
 * Fill pages by measuring real rendered heights. Splittable tables are cut
 * between rows and their head is repeated with a "continued" caption.
 */
function paginateBlocks(blocks, maxHeight, width) {
  const probe = h('div', {
    class: 'cs-probe',
    style: { position: 'absolute', left: '-10000px', top: '0', width: `${width}px`, visibility: 'hidden' },
  });
  document.body.appendChild(probe);

  // Layout may be unavailable (headless rendering, print pre-pass). If the
  // browser reports no height for a known-sized element, fall back to an
  // estimator so the sheet still paginates instead of silently producing one
  // enormous page.
  const gauge = h('div', { style: { height: '100px' } });
  probe.appendChild(gauge);
  const canMeasure = (gauge.offsetHeight || gauge.getBoundingClientRect().height) >= 50;
  probe.replaceChildren();

  const measure = (node) => {
    if (!canMeasure) return estimateHeight(node);
    probe.replaceChildren(node);
    const hgt = node.offsetHeight || node.getBoundingClientRect().height || 0;
    probe.replaceChildren();
    return hgt || estimateHeight(node);
  };

  const pages = [];
  let current = [];
  let used = 0;

  const pushPage = () => { if (current.length) { pages.push(current); current = []; used = 0; } };

  for (const b of blocks) {
    if (b.node) {
      const hgt = measure(b.node) || 28;
      if (used + hgt > maxHeight && current.length) pushPage();
      current.push(b.node);
      used += hgt;
      continue;
    }

    // splittable table
    const { columns, rows, opts, build } = b.split;
    if (!rows.length) {
      const node = build([], false);
      const hgt = measure(node) || 28;
      if (used + hgt > maxHeight && current.length) pushPage();
      current.push(node);
      used += hgt;
      continue;
    }

    let index = 0;
    let continued = false;
    while (index < rows.length) {
      const available = maxHeight - used;
      // Binary-free greedy fit: grow the chunk until it no longer fits.
      let lo = 1;
      let best = 0;
      let bestNode = null;
      while (index + lo <= rows.length) {
        const node = build(rows.slice(index, index + lo), continued);
        const hgt = measure(node);
        if (hgt <= available) { best = lo; bestNode = node; lo += 1; } else break;
        if (lo > rows.length - index) break;
      }
      if (!best) {
        if (current.length) { pushPage(); continued = continued || false; continue; }
        // A single row taller than a whole page: place it anyway rather than loop.
        bestNode = build(rows.slice(index, index + 1), continued);
        best = 1;
      }
      current.push(bestNode);
      used += measure(bestNode);
      index += best;
      continued = true;
      if (index < rows.length) pushPage();
    }
  }

  pushPage();
  probe.remove();
  return pages.length ? pages : [[]];
}

/* ------------------------------------------------------------------ */
/* page furniture                                                      */
/* ------------------------------------------------------------------ */

/**
 * Rough height in pixels, used only when the environment cannot lay out.
 * Deliberately conservative: over-estimating costs a little white space,
 * under-estimating overflows the page and loses content.
 */
function estimateHeight(node) {
  if (!node || node.nodeType !== 1) return 16;
  const tag = node.tagName;
  if (tag === 'TABLE') {
    const head = node.querySelectorAll('thead tr').length * 20;
    let body = 0;
    for (const tr of node.querySelectorAll('tbody tr')) {
      const chars = (tr.textContent || '').length;
      body += Math.max(20, Math.ceil(chars / 95) * 15 + 8);
    }
    return head + body + 10;
  }
  if (tag === 'H3') return 34;
  if (tag === 'P') return Math.max(16, Math.ceil((node.textContent || '').length / 110) * 14 + 6);
  if (node.classList && node.classList.contains('cs-note')) {
    return 26 + Math.ceil((node.textContent || '').length / 110) * 14;
  }
  if (node.classList && node.classList.contains('cs-verdict')) return 120;
  if (node.classList && node.classList.contains('cs-sign')) return 96;
  let total = 0;
  for (const child of node.children) total += estimateHeight(child);
  return total || Math.max(18, Math.ceil((node.textContent || '').length / 110) * 15);
}

function buildPage(app, item, content, pageNo, pageCount) {
  const p = app.store.state.project;
  const res = item.result;
  const att = titleBlockAttribution(p);

  const header = h('header', { class: 'cs-header' },
    h('div', { class: 'cs-header__brand' }, logoImg('cs-logo')),
    h('div', { class: 'cs-header__mid' },
      h('div', { class: 'cs-header__proj' }, p.name || 'Untitled project'),
      h('div', { class: 'cs-header__sub' }, [p.client, p.location].filter(Boolean).join(' · ')),
      h('div', { class: 'cs-header__title' }, `Calculation sheet — ${itemLabel(item)}`),
      p.quick ? h('div', { class: 'cs-header__review' }, 'FOR REVIEW ONLY — NOT FOR ISSUE') : null),
    h('dl', { class: 'cs-header__meta' },
      metaCell('JOB No.', p.number || '—'),
      metaCell('ITEM', item.number || '—'),
      metaCell('REV', item.revision),
      metaCell('DATE', p.revisionDate || '—')),
  );

  const footer = h('footer', { class: 'cs-footer' },
    h('div', null,
      h('span', null, `Designed ${item.designer || '—'}`),
      h('span', null, `Checked ${item.checker || '—'}`),
      h('span', null, `Approved ${att.approved}`)),
    h('div', null,
      h('span', null, res ? res.runCodeId : item.code),
      h('span', null, `Project rev ${p.revision}`),
      h('span', null, `Platform v${(res && res.platformVersion) || PLATFORM_VERSION}`),
      h('span', { class: 'cs-footer__page' }, `Page ${pageNo} of ${pageCount}`)),
  );

  return h('article', { class: 'cs-page' }, header, h('div', { class: 'cs-body' }, content), footer);
}

function metaCell(label, value) {
  return h('div', { class: 'cs-meta' }, h('dt', null, label), h('dd', null, value));
}

function renderCalcSheet(app, item) {
  const blocks = sheetBlocks(app, item);
  const pagesContent = paginateBlocks(blocks, contentHeightPx(), contentWidthPx());
  const wrap = h('div', { class: 'cs-doc' });
  pagesContent.forEach((content, i) => {
    wrap.appendChild(buildPage(app, item, content, i + 1, pagesContent.length));
  });
  return wrap;
}

// modules/report/exports.js — spreadsheet and result exports.
//
// CSV is written with a UTF-8 byte order mark so Excel opens Arabic notes and
// the °, § and superscript characters correctly instead of mojibake. A sep=
// hint is included for the same reason.


const BOM = '\uFEFF';

function esc(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function row(...cells) { return cells.map(esc).join(','); }

function itemCsv(app, item) {
  const p = app.store.state.project;
  const u = p.units;
  const res = item.result;
  const fmt = (v, d) => (v === null || v === undefined ? '' : (d ? formatWithUnit(v, d, u) : formatNumber(v, 4)));
  const L = [];

  L.push('sep=,');
  L.push(row('TRUST GROUP DESIGN PLATFORM — CALCULATION EXPORT'));
  L.push('');
  L.push(row('Project', p.name), row('Job number', p.number), row('Client', p.client));
  L.push(row('Consultant', p.consultant), row('Project revision', p.revision), row('Issue date', p.revisionDate));
  L.push(row('Item', itemLabel(item)), row('Section', describeSection(item.geometry)));
  L.push(row('Item revision', item.revision), row('Status', item.status));
  L.push(row('Designer', item.designer), row('Checker', item.checker));
  L.push(row('Code selected', item.code));
  L.push(row('Code used', res ? res.runCodeId : ''));
  L.push(row('Units', u));
  if (res && res.substitution) L.push(row('Substitution', res.substitution.note));
  L.push('');

  L.push(row('ASSUMPTIONS'));
  L.push(row('Assumption', 'Value', 'Source', 'Basis or reason for change'));
  for (const a of item.assumptions || []) {
    L.push(row(a.label, a.dimension ? fmt(a.value, a.dimension) : a.value,
      a.source === SOURCE.USER ? 'Engineer' : 'Generated',
      a.source === SOURCE.USER && a.reason ? a.reason : a.basis));
  }
  L.push('');

  L.push(row('CALCULATIONS'));
  L.push(row('Symbol', 'Description', 'Expression', 'Substitution', 'Value', 'Code', 'Clause', 'Note'));
  for (const s of (res ? res.steps : [])) {
    L.push(row(s.symbol, s.description, s.expression, s.substitution,
      s.value === null ? '' : fmt(s.value, s.dimension),
      s.kind === STEP_KIND.DERIVED ? 'derived' : s.code,
      s.kind === STEP_KIND.DERIVED ? '' : s.clause,
      s.note));
  }
  L.push('');

  L.push(row('VERIFICATION'));
  L.push(row('Check', 'Code', 'Clause', 'Required', 'Available', 'Utilisation', 'Result', 'Failure mode', 'Note'));
  for (const c of (res ? res.checks : [])) {
    L.push(row(c.title, c.code, c.clause,
      c.demand === null ? '' : fmt(c.demand, c.dimension),
      c.capacity === null ? '' : fmt(c.capacity, c.dimension),
      Number.isFinite(c.utilisation) ? formatNumber(c.utilisation, 4) : '',
      c.status, c.failureMode, c.note));
  }
  L.push('');

  if (res) {
    L.push(row('CONCLUSION'));
    L.push(row('Verdict', res.summary.overall));
    L.push(row('Governing check', res.summary.governing ? res.summary.governing.title : ''));
    L.push(row('Governing clause', res.summary.governing
      ? `${res.summary.governing.code} ${res.summary.governing.clause || ''}`.trim() : ''));
    L.push(row('Maximum utilisation', Number.isFinite(res.summary.maxUtilisation)
      ? formatNumber(res.summary.maxUtilisation, 4) : ''));
    L.push(row('Checks passed', res.summary.counts.passed));
    L.push(row('Checks failed', res.summary.counts.failed));
    L.push(row('Checks not covered or not calculated', res.summary.counts.blocked));
  }

  return BOM + L.join('\r\n');
}

function exportItemCsv(app, item) {
  const p = app.store.state.project;
  const base = [p.number, item.number, item.name].filter(Boolean).join(' ') || 'calculation';
  downloadText(`${safe(base)}_${item.revision}.csv`, itemCsv(app, item), 'text/csv');
}

function exportItemJson(app, item) {
  const p = app.store.state.project;
  const payload = {
    application: 'Trust Group Design Platform',
    exportedAt: new Date().toISOString(),
    project: { name: p.name, number: p.number, client: p.client, revision: p.revision, units: p.units },
    item: {
      number: item.number, name: item.name, category: item.category, revision: item.revision,
      status: item.status, designer: item.designer, checker: item.checker,
      code: item.code, geometry: item.geometry, materials: item.materials, actions: item.actions,
      assumptions: item.assumptions,
    },
    result: item.result ? {
      runCodeId: item.result.runCodeId,
      substitution: item.result.substitution,
      summary: item.result.summary,
      checks: item.result.checks.map(stripSteps),
      steps: item.result.steps,
    } : null,
    note: 'All values are in base units: N, mm, MPa, N*mm.',
  };
  const base = [p.number, item.number].filter(Boolean).join(' ') || 'result';
  downloadText(`${safe(base)}_${item.revision}.result.json`, JSON.stringify(payload, null, 2));
}

function stripSteps(c) {
  const { steps, ...rest } = c;
  return rest;
}

function safe(s) {
  return String(s).replace(/[\\/:*?"<>|]+/g, '-').trim();
}


/* ===== src/ui/screens/projectForm.js ===== */
// ui/screens/projectForm.js — create a project, and edit it afterwards.
//
// The same screen serves both cases. A project is never "half created": the
// draft is a real project record from the first keystroke, validated live, and
// committed when it passes. Every committed field change is written to the
// audit log with its previous value.


function projectFormScreen(app, { mode = 'create' } = {}) {
  const editing = mode === 'edit';

  // Draft lives in the screen, not the store, so an abandoned form leaves no
  // trace. On commit the draft is diffed against the live project.
  const draft = editing ? clone(app.store.state.project) : createProject({ units: app.units });
  let errors = {};
  let touched = editing;

  const host = h('div');

  function set(pathKey, value) {
    draft[pathKey] = value;
    if (touched) errors = validateProject(draft);
    render();
  }

  /**
   * Changing the country refills the code set. Any field the engineer has
   * already changed by hand is left alone — the country is a starting point,
   * not an override.
   */
  function applyJurisdiction(id) {
    const j = jurisdiction(id);
    const previous = jurisdiction(draft.country || DEFAULT_JURISDICTION);
    const next = { ...draft.codes };
    for (const slot of CODE_SLOTS) {
      const current = next[slot.key] || '';
      const wasDefault = !current || current === (previous.codes[slot.key] || '');
      if (wasDefault) next[slot.key] = j.codes[slot.key] || '';
    }
    draft.country = id;
    draft.codes = next;
    if (touched) errors = validateProject(draft);
    render();
  }

  function codeOptionsFor(slot) {
    const groups = app.registry.options({ slot });
    return groups.map((g) => ({
      group: g.family,
      options: g.codes.map((c) => ({ value: c.id, label: `${c.id} — ${c.title}` })),
    }));
  }

  function addMember() {
    draft.team = [...draft.team, newTeamMember({ name: '', role: 'Designer' })];
    render();
  }

  function updateMember(id, key, value) {
    draft.team = draft.team.map((m) => {
      if (m.id !== id) return m;
      const next = { ...m, [key]: value };
      if (key === 'name') next.initials = initials(value);
      return next;
    });
    if (touched) errors = validateProject(draft);
    render();
  }

  function removeMember(id) {
    draft.team = draft.team.filter((m) => m.id !== id);
    if (touched) errors = validateProject(draft);
    render();
  }

  function commit() {
    touched = true;
    errors = validateProject(draft);
    if (Object.keys(errors).length) {
      render();
      const bad = host.querySelector('[data-invalid="true"] input, [data-invalid="true"] select');
      if (bad) bad.focus();
      toast('Some entries still need attention.', 'err');
      return;
    }

    if (!editing) {
      draft.platformVersion = PLATFORM_VERSION;
      app.store.update((s) => { s.project = draft; });
      app.audit.append({
        kind: AUDIT_KINDS.PROJECT_CREATED,
        entity: 'Project',
        entityId: draft.id,
        to: `${draft.number ? draft.number + ' ' : ''}${draft.name}`,
        actor: app.actorName(),
      });
      toast('Project created.', 'ok');
      app.navigate('overview');
      return;
    }

    const before = app.store.state.project;
    const changes = diffProject(before, draft);
    app.store.update((s) => { s.project = draft; });
    for (const c of changes) {
      app.audit.append({
        kind: c.field === 'team' ? AUDIT_KINDS.TEAM_CHANGED
          : c.field.startsWith('codes.') ? AUDIT_KINDS.CODE_CHANGED
            : AUDIT_KINDS.PROJECT_FIELD,
        entity: 'Project',
        entityId: draft.id,
        field: c.field,
        from: c.from,
        to: c.to,
        actor: app.actorName(),
      });
    }
    toast(changes.length ? `${changes.length} change${changes.length > 1 ? 's' : ''} recorded.` : 'No changes to record.', 'ok');
    app.navigate('overview');
  }

  function render() { preserveFocus(paint); }

  function paint() {
    const err = (k) => (touched ? errors[k] : undefined);
    const unitNote = UNIT_SYSTEMS[draft.units]?.note;

    const identity = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Identification'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Project name', id: 'f-name', required: true, error: err('name'), span: true,
          control: textInput({ id: 'f-name', value: draft.name, placeholder: 'Marina Tower — commercial podium', onInput: (v) => set('name', v) }),
        }),
        field({
          label: 'Project number', id: 'f-number', ident: true,
          hint: 'Prints in the title block of every calculation sheet.',
          control: textInput({ id: 'f-number', value: draft.number, placeholder: 'TG-2601', onInput: (v) => set('number', v) }),
        }),
        field({
          label: 'Stage', id: 'f-stage',
          control: select({ id: 'f-stage', value: draft.stage, options: PROJECT_STAGES.map((s) => ({ value: s, label: s })), onChange: (v) => set('stage', v) }),
        }),
        field({
          label: 'Country', id: 'f-country', required: true,
          hint: 'Sets the default design codes below. Every one of them can be changed afterwards.',
          control: select({
            id: 'f-country', value: draft.country || DEFAULT_JURISDICTION,
            options: jurisdictionOptions(),
            onChange: (v) => applyJurisdiction(v),
          }),
        }),
        field({
          label: 'Location', id: 'f-loc',
          control: textInput({ id: 'f-loc', value: draft.location, placeholder: 'New Cairo', onInput: (v) => set('location', v) }),
        }),
      ),
    );

    const parties = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Parties'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Client', id: 'f-client', required: true, error: err('client'),
          control: textInput({ id: 'f-client', value: draft.client, onInput: (v) => set('client', v) }),
        }),
        field({
          label: 'Consultant', id: 'f-consultant',
          control: textInput({ id: 'f-consultant', value: draft.consultant, onInput: (v) => set('consultant', v) }),
        }),
        field({
          label: 'Contractor', id: 'f-contractor',
          control: textInput({ id: 'f-contractor', value: draft.contractor, onInput: (v) => set('contractor', v) }),
        }),
      ),
    );

    const revision = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Revision'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Revision', id: 'f-rev', required: true, ident: true, error: err('revision'),
          hint: 'P-series while preliminary, C-series for construction.',
          control: textInput({ id: 'f-rev', value: draft.revision, onInput: (v) => set('revision', v.toUpperCase()) }),
        }),
        field({
          label: 'Issue date', id: 'f-revdate', required: true, error: err('revisionDate'),
          control: textInput({ id: 'f-revdate', type: 'date', value: draft.revisionDate, onInput: (v) => set('revisionDate', v) }),
        }),
        field({
          label: 'Reason for this revision', id: 'f-revnote', span: true,
          control: textInput({ id: 'f-revnote', value: draft.revisionNote, placeholder: 'First issue', onInput: (v) => set('revisionNote', v) }),
        }),
      ),
    );

    const teamRows = draft.team.map((m) => ({ m }));
    const team = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Team'),
      err('team') ? note({ variant: 'caution', body: err('team') }) : null,
      table({
        columns: [
          { label: 'Name', render: ({ m }) => textInput({ id: `tm-${m.id}-name`, value: m.name, placeholder: 'Full name', onInput: (v) => updateMember(m.id, 'name', v) }) },
          { label: 'Initials', width: '84px', render: ({ m }) => textInput({ id: `tm-${m.id}-ini`, value: m.initials, onInput: (v) => updateMember(m.id, 'initials', v.toUpperCase()) }) },
          { label: 'Role', width: '190px', render: ({ m }) => select({ id: `tm-${m.id}-role`, value: m.role, options: TEAM_ROLES.map((r) => ({ value: r, label: r })), onChange: (v) => updateMember(m.id, 'role', v) }) },
          { label: 'Email', render: ({ m }) => textInput({ id: `tm-${m.id}-mail`, type: 'email', value: m.email, onInput: (v) => updateMember(m.id, 'email', v) }) },
          { label: '', width: '80px', render: ({ m }) => button('Remove', { small: true, variant: 'quiet', onClick: () => removeMember(m.id) }) },
        ],
        rows: teamRows,
        empty: 'No team members yet. Designer and checker initials print in every title block.',
      }),
      h('div', { class: 'tg-row' }, button('Add team member', { variant: 'ghost', small: true, onClick: addMember })),
    );

    const conventions = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Conventions'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Units', id: 'f-units', hint: unitNote,
          control: select({ id: 'f-units', value: draft.units, options: systemList().map((s) => ({ value: s.id, label: s.label })), onChange: (v) => { app.units = v; set('units', v); } }),
        }),
        field({
          label: 'Start date', id: 'f-start',
          control: textInput({ id: 'f-start', type: 'date', value: draft.startDate, onInput: (v) => set('startDate', v) }),
        }),
        field({
          label: 'Due date', id: 'f-due', error: err('dueDate'),
          control: textInput({ id: 'f-due', type: 'date', value: draft.dueDate, onInput: (v) => set('dueDate', v) }),
        }),
      ),
    );

    const codes = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Default design codes'),
      h('p', { class: 'tg-field__hint', style: { margin: '0 0 4px' } },
        'Filled in from the country above. Any design item may override them, and every printed value names the code and clause it came from.'),
      jurisdictionNotice(draft),
      h('div', { class: 'tg-row', style: { marginBottom: '4px' } },
        button('Reset to the country defaults', {
          variant: 'quiet', small: true,
          onClick: () => {
            const j = jurisdiction(draft.country || DEFAULT_JURISDICTION);
            draft.codes = { ...j.codes };
            render();
          },
        })),
      h('div', { class: 'tg-grid' },
        CODE_SLOTS.map((slot) => {
          const j = jurisdiction(draft.country || DEFAULT_JURISDICTION);
          const chosen = draft.codes[slot.key] || '';
          const isDefault = chosen === (j.codes[slot.key] || '');
          const reason = isDefault ? j.reasons[slot.key] : null;
          return h('div', { class: 'tg-field' },
            field({
              label: slot.label, id: `f-code-${slot.key}`,
              control: select({
                id: `f-code-${slot.key}`,
                value: chosen,
                placeholder: 'Not set',

                onChange: (v) => { draft.codes = { ...draft.codes, [slot.key]: v }; render(); },
              }),
            }),
            reason ? h('div', { class: 'tg-why' }, reason) : null,
            h('div', { class: 'tg-effect' }, SLOT_EFFECT[slot.key]),
          );
        }),
      ),
    );

    const notes = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Notes'),
      field({
        label: 'Project notes', id: 'f-notes', span: true,
        hint: 'Design basis, client instructions, agreed departures. Arabic text is supported.',
        control: textArea({ id: 'f-notes', value: draft.notes, rows: 5, onInput: (v) => set('notes', v) }),
      }),
    );

    const actions = [
      editing ? button('Cancel', { variant: 'quiet', onClick: () => app.navigate('overview') }) : null,
      button(editing ? 'Save changes' : 'Create project', { onClick: commit }),
    ];

    host.replaceChildren(sheet({
      title: editing ? 'Project details' : 'New project',
      lede: editing
        ? 'Changes are recorded in the change log with their previous value.'
        : 'Set up the record that every calculation sheet, drawing and export will carry.',
      actions: editing ? [chip(draft.revision, 'neutral')] : null,
      body: h('div', { class: 'tg-form' }, identity, parties, revision, team, conventions, codes, notes),
      foot: [
        h('span', { class: 'tg-muted', style: { fontSize: '12px', marginRight: 'auto' } },
          touched && Object.keys(errors).length
            ? `${Object.keys(errors).length} item${Object.keys(errors).length > 1 ? 's' : ''} need attention`
            : 'Required entries are marked with a red asterisk.'),
        ...actions.filter(Boolean),
      ],
    }));
  }

  render();
  return host;
}

function primaryActor(p) {
  const lead = (p.team || []).find((m) => m.role === 'Project lead');
  const designer = (p.team || []).find((m) => m.role === 'Designer');
  return (lead || designer || {}).name || 'unattributed';
}

/** Field-level diff, flattened for the audit log. */
function diffProject(a, b) {
  const out = [];
  const scalarKeys = [
    'name', 'number', 'stage', 'location', 'client', 'consultant', 'contractor',
    'revision', 'revisionDate', 'revisionNote', 'units', 'startDate', 'dueDate', 'notes',
  ];
  for (const k of scalarKeys) {
    if ((a[k] ?? '') !== (b[k] ?? '')) out.push({ field: k, from: a[k], to: b[k] });
  }
  for (const slot of CODE_SLOTS) {
    const from = (a.codes || {})[slot.key] || '';
    const to = (b.codes || {})[slot.key] || '';
    if (from !== to) out.push({ field: `codes.${slot.key}`, from, to });
  }
  const teamA = JSON.stringify((a.team || []).map(({ name, role, initials, email }) => ({ name, role, initials, email })));
  const teamB = JSON.stringify((b.team || []).map(({ name, role, initials, email }) => ({ name, role, initials, email })));
  if (teamA !== teamB) {
    out.push({
      field: 'team',
      from: `${(a.team || []).length} member(s)`,
      to: `${(b.team || []).length} member(s)`,
    });
  }
  return out;
}

function jurisdictionNotice(draft) {
  const j = jurisdiction(draft.country || DEFAULT_JURISDICTION);
  if (!j.nationalCodeMissing) return null;
  return note({
    variant: 'code',
    title: `${j.nationalCodeMissing} is not installed in this build`,
    body: `The codes below are the documents the national code is derived from, not the national code itself. Confirm each one against ${j.nationalCodeMissing} before this project is issued.`,
  });
}

// ui/screens/items.js — the design items register.


const STATUS_KIND = {
  [ITEM_STATUS.DRAFT]: 'neutral',
  [ITEM_STATUS.FOR_CHECK]: 'caution',
  [ITEM_STATUS.CHECKED]: 'safe',
  [ITEM_STATUS.APPROVED]: 'safe',
  [ITEM_STATUS.SUPERSEDED]: 'notcov',
};

function itemsScreen(app) {
  const host = h('div');

  function addItem() {
    const p = app.store.state.project;
    const fromRegister = (role) => (app.people.find((x) => x.active && x.role === role) || {}).name || '';
    const designer = (app.currentUser && app.currentUser.role === 'Designer' ? app.currentUser.name : '')
      || fromRegister('Designer')
      || (p.team.find((m) => m.role === 'Designer') || {}).name || '';
    const checker = fromRegister('Checker')
      || (p.team.find((m) => m.role === 'Checker') || {}).name || '';
    const item = createItem({
      number: nextItemNumber(p.items),
      name: 'Composite column',
      designer, checker,
      code: p.codes.composite || 'EN 1994-1-1',
    });
    item.assumptions = generateAssumptions(item, item.code);
    app.store.update((s) => { s.project.items = [...s.project.items, item]; });
    app.audit.append({
      kind: AUDIT_KINDS.ITEM_CREATED, entity: itemLabel(item), entityId: item.id,
      to: `${item.category} to ${item.code}`, actor: app.actorName(),
    });
    app.openItem(item.id);
  }

  function render() { preserveFocus(paint); }

  function paint() {
    const p = app.store.state.project;
    const items = p.items || [];

    const rows = items.map((it) => {
      let res = it.result;
      if (!res) {
        try { res = runDesign(app.registry, it); } catch { res = null; }
      }
      return { it, res };
    });

    host.replaceChildren(sheet({
      title: 'Design items',
      lede: 'Each item carries its own code, revision, designer and checker. Status falls back to draft whenever an input changes.',
      actions: [button('Add design item', { onClick: addItem })],
      body: items.length
        ? h('div', null,
          table({
            caption: `${items.length} item${items.length === 1 ? '' : 's'}`,
            columns: [
              { label: 'No.', ident: true, width: '80px', render: ({ it }) => it.number },
              { label: 'Name', render: ({ it }) => h('button', { class: 'tg-btn tg-btn--quiet tg-btn--sm', onClick: () => app.openItem(it.id) }, it.name || 'Untitled') },
              { label: 'Category', render: ({ it }) => it.category },
              { label: 'Code', ident: true, render: ({ it }) => it.code },
              { label: 'Rev', ident: true, width: '60px', render: ({ it }) => it.revision },
              { label: 'Status', width: '110px', render: ({ it }) => chip(it.status, STATUS_KIND[it.status] || 'neutral') },
              { label: 'Verdict', width: '120px', render: ({ res }) => verdictChip(res) },
              { label: 'U max', align: 'right', width: '80px', render: ({ res }) => (res && Number.isFinite(res.summary.maxUtilisation) ? formatNumber(res.summary.maxUtilisation, 3) : '—') },
              { label: 'Designer', render: ({ it }) => it.designer || '—' },
              { label: 'Checker', render: ({ it }) => it.checker || '—' },
              { label: '', width: '90px', render: ({ it }) => button('Sheet', { small: true, variant: 'quiet', onClick: () => app.openSheet(it.id) }) },
            ],
            rows,
          }),
          note({
            title: 'How the verdict is reached',
            body: 'SAFE requires every applicable check to pass. If any check is not covered by the selected code, the item reads INCOMPLETE, never SAFE — a missing check is not a passed check.',
          }),
        )
        : emptyState({
          title: 'No design items yet',
          body: 'Add the first item to start a calculation. Only concrete-filled tubular columns are engineered in this build; other categories can be recorded but not calculated.',
          actions: [button('Add design item', { onClick: addItem })],
        }),
    }));
  }

  render();
  return host;
}

function verdictChip(res) {
  if (!res) return chip('Not run', 'neutral');
  if (res.summary.overall === OVERALL.SAFE) return chip('SAFE', 'safe');
  if (res.summary.overall === OVERALL.UNSAFE) return chip('UNSAFE', 'unsafe');
  return chip('INCOMPLETE', 'caution');
}
