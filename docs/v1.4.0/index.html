function findElement(id) {
  return ELEMENTS.find((e) => e.id === id) || null;
}

/**
 * Free-text search over name, summary and keywords, in either language.
 * An empty query returns everything, available entries first.
 */
function searchElements(query) {
  const q = String(query || '').trim().toLowerCase();
  const scored = ELEMENTS.map((e) => {
    if (!q) return { e, score: e.available ? 2 : 1 };
    const name = e.name.toLowerCase();
    const short = e.short.toLowerCase();
    let score = 0;
    if (name.startsWith(q) || short.toLowerCase().startsWith(q)) score = 100;
    else if (name.includes(q) || short.includes(q)) score = 70;
    else if (e.keywords.some((k) => k.toLowerCase().startsWith(q))) score = 50;
    else if (e.keywords.some((k) => k.toLowerCase().includes(q))) score = 30;
    else if (e.summary.toLowerCase().includes(q)) score = 10;
    return { e, score };
  });
  // Elements that are built rank above ones that are not, whatever the text
  // match. Putting an unusable result first because its name happened to match
  // more literally would waste the engineer's time.
  return scored
    .filter((x) => x.score > 0)
    .sort((a, b) => (b.e.available ? 1 : 0) - (a.e.available ? 1 : 0)
      || b.score - a.score
      || a.e.name.localeCompare(b.e.name))
    .map((x) => x.e);
}


/* ===== src/modules/cfst/assumptions.js ===== */
// modules/cfst/assumptions.js — the assumption manager.
//
// Assumptions are first-class data, not hidden defaults. Each one carries where
// it came from, whether a human has touched it, and what it is used for. The
// engine reads only from this list, so nothing can be assumed silently.


const SOURCE = {
  AUTO: 'auto',        // generated by the platform from the code and the inputs
  USER: 'user',        // set by an engineer, with a reason
  PROJECT: 'project',  // inherited from the project record
};

/**
 * Every assumption: { key, label, value, dimension, source, basis, usedBy,
 *                     options?, min?, max?, reason?, changedAt? }
 * `basis` states where the default came from, in plain language.
 */
function generateAssumptions(item, codeId) {
  const euro = codeId.startsWith('EN');
  const list = [];

  const add = (a) => list.push({ id: uid('asm'), source: SOURCE.AUTO, reason: null, changedAt: null, ...a });

  add({
    key: 'gammaM0', label: 'Partial factor for structural steel, γ_M0',
    value: euro ? 1.0 : 1.0, dimension: null,
    basis: euro ? 'EN 1993-1-1 §6.1, recommended value. Subject to the National Annex.' : 'Not used in the AISC route; resistance factors are applied instead.',
    usedBy: 'Design yield strength of the tube',
    min: 0.9, max: 1.5,
  });
  add({
    key: 'gammaC', label: 'Partial factor for concrete, γ_C',
    value: 1.5, dimension: null,
    basis: 'EN 1992-1-1 Table 2.1N, persistent and transient design situations. Subject to the National Annex.',
    usedBy: 'Design compressive strength of the core',
    min: 1.0, max: 1.8,
  });
  add({
    key: 'gammaS', label: 'Partial factor for reinforcement, γ_S',
    value: 1.15, dimension: null,
    basis: 'EN 1992-1-1 Table 2.1N. Subject to the National Annex.',
    usedBy: 'Design strength of the longitudinal bars',
    min: 1.0, max: 1.5,
  });
  add({
    key: 'phiC', label: 'Resistance factor for compression, φ_c',
    value: 0.75, dimension: null,
    basis: 'AISC 360-22 §I2.2, LRFD.',
    usedBy: 'Design compressive strength in the AISC route',
    min: 0.6, max: 1.0,
  });
  add({
    key: 'creepCoefficient', label: 'Creep coefficient, φ_t',
    value: 1.5, dimension: null,
    basis: 'Assumed value for an interior column at 50% relative humidity, loaded at 28 days. Replace with a value from EN 1992-1-1 §3.1.4 for the actual member size, humidity and loading age.',
    usedBy: 'Effective concrete modulus, and therefore the critical load',
    min: 0, max: 4,
  });
  add({
    key: 'bucklingLengthFactor', label: 'Effective length factor, K',
    value: 1.0, dimension: null,
    basis: 'Pinned at both ends. Change to suit the actual restraint conditions; this factor is not derived by the platform.',
    usedBy: 'Buckling length, and therefore the critical load',
    min: 0.5, max: 3.0,
  });
  add({
    key: 'momentRatio', label: 'End moment ratio, r',
    value: 1.0, dimension: null,
    basis: 'Equal and opposite end moments, giving the most severe value of β. Adjust to the actual moment diagram.',
    usedBy: 'Equivalent moment factor β in the second-order amplification',
    min: -1, max: 1,
  });
  add({
    key: 'introductionLength', label: 'Load introduction length',
    value: introDefault(item), dimension: 'length',
    basis: 'EN 1994-1-1 §6.7.4.2 limits the introduction length to twice the transverse dimension or one third of the column length, whichever is smaller.',
    usedBy: 'Interface shear check at the connection',
    min: 0,
  });
  add({
    key: 'concreteFillMethod', label: 'Concrete placement',
    value: 'Pumped from the base', dimension: null,
    options: ['Pumped from the base', 'Poured from the top', 'Precast core'],
    basis: 'Affects the reliance that may be placed on natural bond at the interface.',
    usedBy: 'Load introduction assumptions and the drawing notes',
  });
  add({
    key: 'fireRating', label: 'Required fire rating',
    value: 'R90', dimension: null,
    options: ['None', 'R30', 'R60', 'R90', 'R120', 'R180'],
    basis: 'Project requirement. Not derived by the platform.',
    usedBy: 'Fire design, which is reported separately',
  });

  return list;
}

function introDefault(item) {
  const g = item.geometry || {};
  const dim = g.shape === 'CHS' ? Number(g.d) : Math.max(Number(g.b) || 0, Number(g.h) || 0);
  const byLength = (Number(g.length) || 0) / 3;
  const byDim = 2 * dim;
  const both = [byDim, byLength].filter((x) => x > 0);
  return both.length ? Math.min(...both) : byDim;
}

/** Flat map for the engine: { key: value }. */
function assumptionValues(list) {
  return Object.fromEntries((list || []).map((a) => [a.key, a.value]));
}

function findAssumption(list, key) {
  return (list || []).find((a) => a.key === key) || null;
}

/**
 * Apply an edit. A reason is mandatory — the caller cannot bypass it, because
 * the audit log rejects assumption changes without one.
 */
function applyAssumptionEdit(list, key, value, reason, at) {
  return (list || []).map((a) => (a.key === key
    ? { ...a, value, source: SOURCE.USER, reason, changedAt: at }
    : a));
}

/** Restore one assumption to the generated default. */
function resetAssumption(list, key, item, codeId) {
  const fresh = generateAssumptions(item, codeId).find((a) => a.key === key);
  if (!fresh) return list;
  return list.map((a) => (a.key === key ? { ...fresh, id: a.id } : a));
}

/**
 * Merge a regenerated set with the existing one, keeping every user edit.
 * Called when the design code changes so the list stays complete without
 * discarding decisions an engineer has already made and justified.
 */
function reconcileAssumptions(existing, item, codeId) {
  const fresh = generateAssumptions(item, codeId);
  return fresh.map((f) => {
    const prev = (existing || []).find((a) => a.key === f.key);
    if (prev && prev.source === SOURCE.USER) {
      return { ...f, id: prev.id, value: prev.value, source: SOURCE.USER, reason: prev.reason, changedAt: prev.changedAt };
    }
    return prev ? { ...f, id: prev.id } : f;
  });
}


/* ===== src/modules/cfst/engine.js ===== */
// modules/cfst/engine.js — the orchestrator.
//
// This file contains no design equations and names no code. It asks the
// registry what the selected code can do, runs whatever handlers it is given,
// and turns refusals into printable notices. Adding a code changes nothing here.


/** EN 1992-1-1 §3.1.3 secant modulus; ACI 318-19 §19.2.2 for the AISC route. */
function materialModel(m) {
  const fck = Number(m.fck) || 0;
  return {
    fy: Number(m.fy) || 0,
    fck,
    fcPrime: fck, // cylinder strength; the two codes use the same basis
    fsk: Number(m.fsk) || 0,
    Ea: 210000,
    Es: 200000,
    Ecm: 22000 * Math.pow((fck + 8) / 10, 0.3),
    Ec: 4700 * Math.sqrt(Math.max(fck, 0)),
  };
}

function buildContext(item, codeId) {
  const sec = sectionProperties(item.geometry);
  const mat = materialModel(item.materials);
  const asm = assumptionValues(item.assumptions);
  const K = Number(asm.bucklingLengthFactor) || 1;
  const L = (Number(item.geometry.length) || 0) * K;

  return {
    codeId,
    sec, mat,
    axis: 'y',
    geometry: { ...item.geometry, bucklingLength: L, K },
    actions: { ...item.actions, momentRatio: asm.momentRatio },
    assumptions: asm,
    partial: {
      gammaM0: Number(asm.gammaM0) || 1,
      gammaC: Number(asm.gammaC) || 1.5,
      gammaS: Number(asm.gammaS) || 1.15,
      phiC: Number(asm.phiC) || 0.75,
    },
  };
}

/**
 * Run the design. Never throws for an unsupported code: an uncovered check
 * becomes a check record with status NOT COVERED and the registry's own words.
 */
function runCfst(registry, item) {
  const codeId = item.code;
  const code = registry.get(codeId);
  const ctx = buildContext(item, codeId);
  const scratch = {};
  const steps = [];
  const checks = [];
  const notices = [];

  // Whole-code substitution, never per-check substitution.
  //
  // A design check is not independent: §6.7.3.5 needs the slenderness from
  // §6.7.3.3, which needs the plastic resistance from §6.7.3.2. Borrowing one
  // handler from another code mid-sequence would run it without its
  // prerequisites and produce a number that looks valid and is not. So either
  // the selected code drives the whole calculation, or — where it publishes
  // nothing at all — a single nominated code does, and every line says so.
  let workingCode = code;
  let substitution = null;

  if (!code || !code.plans || !code.plans.cfst) {
    const nominee = nominateSubstitute(registry, codeId);
    if (nominee) {
      workingCode = nominee.code;
      substitution = { from: codeId, to: nominee.code.id, note: nominee.note };
      notices.push({ cap: 'cfst', from: codeId, to: nominee.code.id, note: nominee.note });
    } else {
      const res = registry.resolve(CFST_CHECK_SEQUENCE[0], codeId);
      checks.push(check({
        id: 'coverage', title: 'Design code coverage', code: codeId, clause: null,
        status: CHECK_STATUS.NOT_COVERED,
        note: res.note || `${codeId} publishes no provisions for concrete-filled tubular columns, and no installed code was nominated in its place.`,
      }));
      return { ctx, scratch, steps, checks, notices, substitution: null,
        summary: summarise(checks), codeId, ranAt: new Date().toISOString() };
    }
  }

  const plan = workingCode.plans.cfst;
  const runCodeId = workingCode.id;

  const geometryProblems = validateGeometry(item.geometry);
  if (geometryProblems.length) {
    checks.push(check({
      id: 'geometry', title: 'Section geometry', code: runCodeId, clause: null,
      status: CHECK_STATUS.NOT_APPLICABLE,
      note: `The section as described cannot be built, so no calculation has been attempted. ${geometryProblems.join(' ')}`,
    }));
    return { ctx, scratch, steps, checks, notices, substitution,
      summary: summarise(checks), codeId, runCodeId, ranAt: new Date().toISOString() };
  }


  for (const entry of plan) {
    const cap = typeof entry === 'string' ? entry : entry.cap;
    const axis = typeof entry === 'string' ? 'y' : (entry.axis || 'y');
    const skipIf = typeof entry === 'string' ? null : entry.skipIf;

    if (skipIf && skipIf(ctx, scratch)) continue;

    // A fire check that has been declared not required is recorded as a signed
    // engineering decision, not quietly dropped. Without a written reason it
    // stays outstanding, so the verdict cannot reach SAFE by omission.
    if (cap === CAP.CFST_FIRE && item.fire && item.fire.required === false) {
      const reason = String(item.fire.reason || '').trim();
      checks.push(check({
        id: cap,
        title: capLabel(cap),
        code: 'EN 1994-1-2', clause: '4.3.5.1',
        clauseTitle: 'Composite columns — simple calculation models',
        status: reason ? CHECK_STATUS.NOT_APPLICABLE : CHECK_STATUS.NOT_COVERED,
        note: reason
          ? `Fire design declared not required for this member. Stated basis: "${reason}". This is a recorded engineering decision, not a calculation, and it prints on the sheet.`
          : 'Fire design has been marked as not required, but no reason has been given. State the basis before this design can be read as satisfactory.',
      }));
      continue;
    }

    const res = registry.resolve(cap, runCodeId);

    if (res.status === COVERAGE.COVERED && typeof res.handler === 'function') {
      ctx.axis = axis;
      let out;
      try {
        out = res.handler(ctx, scratch);
      } catch (err) {
        checks.push(check({
          id: cap, title: capLabel(cap), code: runCodeId, clause: res.clause,
          status: CHECK_STATUS.NOT_IMPLEMENTED,
          note: `The calculation could not be completed: ${err.message}`,
        }));
        continue;
      }
      if (out.steps) steps.push(...out.steps);
      if (out.check) checks.push(decorate(out.check, substitution));
      if (out.scratch) Object.assign(scratch, out.scratch);
      continue;
    }

    checks.push(decorate(check({
      id: cap,
      title: capLabel(cap),
      code: runCodeId,
      clause: res.clause,
      clauseTitle: res.clauseTitle,
      status: res.status === COVERAGE.DECLARED ? CHECK_STATUS.NOT_IMPLEMENTED : CHECK_STATUS.NOT_COVERED,
      note: [res.note, alternativeSentence(res)].filter(Boolean).join(' '),
    }), substitution));
    notices.push({ cap, from: runCodeId, to: null, note: res.note });
  }

  const summary = summarise(checks);
  return { ctx, scratch, steps, checks, notices, substitution, summary, codeId, runCodeId, ranAt: new Date().toISOString() };
}


/**
 * Pick the code that will carry the calculation when the selected one has no
 * provisions. Only a code that declares a complete CFST plan qualifies.
 */
function nominateSubstitute(registry, codeId) {
  const res = registry.resolve(CFST_CHECK_SEQUENCE[0], codeId);
  const declared = (res.alternatives || []).map((a) => registry.get(a.id)).filter(Boolean);
  const scanned = registry.list().filter((c) => c.plans && c.plans.cfst);
  const candidate = declared.find((c) => c.plans && c.plans.cfst) || scanned[0];
  if (!candidate) return null;
  return {
    code: candidate,
    note: `${codeId} publishes no design provisions for concrete-filled tubular columns. ${res.note || ''} This calculation has therefore been carried out to ${candidate.id} (${candidate.edition}). The substitution must be accepted by the checker and stated on the calculation sheet.`.trim(),
  };
}

function alternativeSentence(res) {
  const alts = (res.alternatives || []).map((a) => a.id);
  if (!alts.length) return null;
  return `Installed codes that address this check: ${alts.join(', ')}.`;
}

function decorate(c, substitution) {
  if (!substitution) return c;
  return { ...c, substituted: substitution, note: [`Carried out to ${substitution.to} because ${substitution.from} does not cover it.`, c.note].filter(Boolean).join(' ') };
}


/* ===== src/modules/baseplate/engine.js ===== */
// modules/baseplate/engine.js — orchestrator for the base and anchorage.
//
// Same contract as the CFST engine: no equations, no code names, no branching
// on which code was chosen. It runs the plan the code module publishes.


function buildPlateContext(item) {
  const bp = item.baseplate;
  const plate = plateProperties(bp, item);
  const asm = assumptionValues(item.assumptions);
  const fck = Number(item.materials.fck) || 0;
  return {
    bp, plate,
    mat: { fck, fcPrime: fck, fyPlate: Number(bp.fyPlate) || 355 },
    actions: bp.actions,
    partial: {
      gammaC: Number(asm.gammaC) || 1.5,
      gammaM0: Number(asm.gammaM0) || 1.0,
    },
  };
}

function runBasePlate(registry, item) {
  const bp = item.baseplate;
  if (!bp || !bp.enabled) return { steps: [], checks: [], notices: [], runCodeId: null };

  const codeId = bp.code;
  const code = registry.get(codeId);
  const ctx = buildPlateContext(item);
  const scratch = {};
  const steps = [];
  const checks = [];
  const notices = [];

  if (!code || !code.plans || !code.plans.baseplate) {
    checks.push(check({
      id: 'bp.coverage', title: 'Base and anchorage code coverage',
      code: codeId, status: CHECK_STATUS.NOT_COVERED,
      note: `${codeId} publishes no base plate or anchorage provisions that this platform can run. Select EN 1993-1-8 or ACI 318-19 for the base.`,
    }));
    return { ctx, steps, checks, notices, runCodeId: null };
  }

  for (const cap of code.plans.baseplate) {
    const res = registry.resolve(cap, codeId);
    if (res.status === COVERAGE.COVERED && typeof res.handler === 'function') {
      let out;
      try {
        out = res.handler(ctx, scratch);
      } catch (err) {
        checks.push(check({
          id: cap, title: capLabel(cap), code: codeId, clause: res.clause,
          status: CHECK_STATUS.NOT_IMPLEMENTED,
          note: `The calculation could not be completed: ${err.message}`,
        }));
        continue;
      }
      if (out.steps) steps.push(...out.steps);
      if (out.checks) checks.push(...out.checks);
      if (out.scratch) Object.assign(scratch, out.scratch);
      continue;
    }
    checks.push(check({
      id: cap, title: capLabel(cap), code: codeId, clause: res.clause,
      clauseTitle: res.clauseTitle,
      status: res.status === COVERAGE.DECLARED ? CHECK_STATUS.NOT_IMPLEMENTED : CHECK_STATUS.NOT_COVERED,
      note: res.note,
    }));
    notices.push({ cap, from: codeId, to: null, note: res.note });
  }

  return { ctx, scratch, steps, checks, notices, runCodeId: codeId };
}


/* ===== src/modules/run.js ===== */
// modules/run.js — the single entry point the UI calls.
//
// Runs the member and then the base, and rolls both into one verdict. Keeping
// this separate means the two engines never import each other.


function runDesign(registry, item) {
  const member = runCfst(registry, item);
  const base = runBasePlate(registry, item);

  const checks = [...member.checks, ...base.checks];
  const steps = [...member.steps, ...base.steps];

  return {
    ...member,
    platformVersion: PLATFORM_VERSION,
    baseRunCodeId: base.runCodeId,
    memberSteps: member.steps,
    baseSteps: base.steps,
    memberChecks: member.checks,
    baseChecks: base.checks,
    baseCtx: base.ctx || null,
    steps,
    checks,
    notices: [...member.notices, ...(base.notices || [])],
    summary: summarise(checks),
  };
}


/* ===== src/codes/en1994-cfst.js ===== */
// codes/en1994-cfst.js — the EN 1994-1-1 §6.7.3 simplified method.
//
// Every function here returns steps that name EN 1994-1-1 and a clause. The
// engine has no knowledge of what is inside; it calls what the registry hands
// it and prints what comes back.
//
// Base units throughout: N, mm, MPa, N*mm.


const C = 'EN 1994-1-1';

/* ------------------------------------------------------------------ */
/* material design values                                              */
/* ------------------------------------------------------------------ */

function designStrengths(ctx) {
  const { mat, partial } = ctx;
  return {
    fyd: mat.fy / partial.gammaM0,
    // §6.7.3.2(1): for concrete filled sections the 0.85 coefficient may be
    // replaced by 1.0, because the core is protected from spalling and drying.
    fcd: mat.fck / partial.gammaC,
    fsd: mat.fsk / partial.gammaS,
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.1(9) — maximum wall slenderness                                 */
/* ------------------------------------------------------------------ */

function en_classification(ctx) {
  const { sec, mat } = ctx;
  const eps = Math.sqrt(235 / mat.fy);
  const isCircular = sec.shape === SHAPE.CHS;
  const limit = isCircular ? 90 * eps * eps : 52 * eps;
  const actual = isCircular ? sec.d / sec.t : Math.max(sec.b, sec.h) / sec.t;

  const steps = [
    step({
      code: C, clause: '6.7.1',
      symbol: 'ε', description: 'Material factor',
      expression: 'ε = √(235 / f_y)',
      substitution: `√(235 / ${mat.fy})`,
      value: eps,
    }),
    step({
      code: C, clause: '6.7.1',
      symbol: isCircular ? '(d/t)_max' : '(h/t)_max',
      description: 'Maximum wall slenderness to prevent local buckling before the section yields',
      expression: isCircular ? 'd/t ≤ 90 ε²' : 'h/t ≤ 52 ε',
      substitution: isCircular ? `90 × ${eps.toFixed(4)}²` : `52 × ${eps.toFixed(4)}`,
      value: limit,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'classification',
      title: 'Wall slenderness of the steel tube',
      code: C, clause: '6.7.1',
      clauseTitle: 'Composite columns — General; limits on wall slenderness',
      demand: actual, capacity: limit, dimension: null,
      failureMode: 'Local buckling of the tube wall before the section reaches its plastic resistance',
      steps,
      note: actual > limit
        ? 'The tube wall is too slender for the simplified method of §6.7.3. Increase the wall thickness or use the general method of §6.7.2.'
        : null,
    }),
    scratch: { eps, wallLimit: limit, wallActual: actual },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.2 — plastic resistance of the cross-section                   */
/* ------------------------------------------------------------------ */

function en_plasticResistance(ctx) {
  const { sec, mat, partial } = ctx;
  const d = designStrengths(ctx);

  const Na = sec.Aa * d.fyd;
  const Nc = sec.Ac * d.fcd;
  const Ns = sec.As * d.fsd;
  const NplRd = Na + Nc + Ns;
  const NplRk = sec.Aa * mat.fy + sec.Ac * mat.fck + sec.As * mat.fsk;

  const steps = [
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'f_cd', description: 'Design compressive strength of the core',
      expression: 'f_cd = f_ck / γ_C, with the 0.85 coefficient replaced by 1.0 for filled sections',
      substitution: `${mat.fck} / ${partial.gammaC}`,
      value: d.fcd, dimension: 'stress',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'N_pl,Rd', description: 'Plastic resistance of the cross-section to compression',
      expression: 'N_pl,Rd = A_a·f_yd + A_c·f_cd + A_s·f_sd',
      substitution: `${sec.Aa.toFixed(0)}×${d.fyd.toFixed(1)} + ${sec.Ac.toFixed(0)}×${d.fcd.toFixed(1)} + ${sec.As.toFixed(0)}×${d.fsd.toFixed(1)}`,
      value: NplRd, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'N_pl,Rk', description: 'Characteristic plastic resistance, used for the relative slenderness',
      expression: 'N_pl,Rk = A_a·f_y + A_c·f_ck + A_s·f_sk',
      value: NplRk, dimension: 'force',
    }),
  ];

  return { steps, check: null, scratch: { ...d, Na, Nc, Ns, NplRd, NplRk, NpmRd: Nc } };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.2(6) — confinement in circular sections                       */
/* ------------------------------------------------------------------ */

function en_confinement(ctx, sc) {
  const { sec, mat } = ctx;
  const lam = sc.lambdaBar;
  const e = sc.eccentricity ?? 0;
  const d = sec.shape === SHAPE.CHS ? sec.d : null;

  if (sec.shape !== SHAPE.CHS) {
    return {
      steps: [notice({
        code: C, clause: '6.7.3.2',
        symbol: 'η', description: 'Confinement',
        note: 'The confinement enhancement of §6.7.3.2(6) applies to circular sections only. No enhancement is taken for a rectangular section.',
      })],
      check: null, scratch: { confined: false },
    };
  }
  if (!(lam <= 0.5) || !(e / d < 0.1)) {
    return {
      steps: [notice({
        code: C, clause: '6.7.3.2',
        symbol: 'η', description: 'Confinement',
        note: `§6.7.3.2(6) permits the confinement enhancement only where λ̄ ≤ 0.5 and e/d < 0.1. Here λ̄ = ${lam.toFixed(3)} and e/d = ${(e / d).toFixed(3)}, so no enhancement is taken.`,
      })],
      check: null, scratch: { confined: false },
    };
  }

  const eta_a0 = Math.min(1.0, 0.25 * (3 + 2 * lam));
  const eta_c0 = Math.max(0, 4.9 - 18.5 * lam + 17 * lam * lam);
  const ratio = e / d;
  const eta_a = eta_a0 + (1 - eta_a0) * (10 * ratio);
  const eta_c = eta_c0 * (1 - 10 * ratio);

  const NplRdConf = eta_a * sec.Aa * sc.fyd
    + sec.Ac * sc.fcd * (1 + eta_c * (sec.t / d) * (mat.fy / mat.fck))
    + sec.As * sc.fsd;

  const steps = [
    step({ code: C, clause: '6.7.3.2', symbol: 'η_a0', description: 'Confinement coefficient for the steel at zero eccentricity', expression: 'η_a0 = 0.25 (3 + 2 λ̄) ≤ 1.0', value: eta_a0 }),
    step({ code: C, clause: '6.7.3.2', symbol: 'η_c0', description: 'Confinement coefficient for the concrete at zero eccentricity', expression: 'η_c0 = 4.9 − 18.5 λ̄ + 17 λ̄² ≥ 0', value: eta_c0 }),
    step({ code: C, clause: '6.7.3.2', symbol: 'η_a', description: 'Confinement coefficient for the steel', expression: 'η_a = η_a0 + (1 − η_a0)(10 e/d)', value: eta_a }),
    step({ code: C, clause: '6.7.3.2', symbol: 'η_c', description: 'Confinement coefficient for the concrete', expression: 'η_c = η_c0 (1 − 10 e/d)', value: eta_c }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'N_pl,Rd', description: 'Plastic resistance including confinement',
      expression: 'N_pl,Rd = η_a·A_a·f_yd + A_c·f_cd [1 + η_c (t/d)(f_y/f_ck)] + A_s·f_sd',
      value: NplRdConf, dimension: 'force',
    }),
  ];

  return { steps, check: null, scratch: { confined: true, NplRd: NplRdConf, NpmRd: sc.NpmRd } };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.3 — stiffness and slenderness                                 */
/* ------------------------------------------------------------------ */

function en_stiffness(ctx) {
  const { sec, mat, actions, assumptions } = ctx;
  const Ke = 0.6;
  const phi = Number(assumptions.creepCoefficient) || 0;
  const NGEd = Number(actions.NGEd) || 0;
  const NEd = Number(actions.NEd) || 0;
  const ratioG = NEd > 0 ? Math.min(1, NGEd / NEd) : 0;
  const EcEff = mat.Ecm / (1 + ratioG * phi);

  const axis = ctx.axis === 'z' ? 'Z' : '';
  const Ia = axis ? sec.IaZ : sec.Ia;
  const Ic = axis ? sec.IcZ : sec.Ic;
  const Is = axis ? sec.IsZ : sec.Is;

  const EIeff = mat.Ea * Ia + mat.Es * Is + Ke * EcEff * Ic;

  const steps = [
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'E_c,eff', description: 'Effective modulus of the concrete allowing for creep',
      expression: 'E_c,eff = E_cm / (1 + (N_G,Ed/N_Ed) φ_t)',
      substitution: `${mat.Ecm.toFixed(0)} / (1 + ${ratioG.toFixed(3)} × ${phi})`,
      value: EcEff, dimension: 'stress',
    }),
    step({
      code: C, clause: '6.7.3.3',
      symbol: '(EI)_eff', description: 'Effective flexural stiffness for the elastic critical load',
      expression: '(EI)_eff = E_a I_a + E_s I_s + K_e E_cm I_c, with K_e = 0.6',
      value: EIeff, dimension: null,
    }),
  ];

  return { steps, check: null, scratch: { EIeff, EcEff, Ke, creepRatio: ratioG } };
}

function en_slenderness(ctx, sc) {
  const { geometry } = ctx;
  const L = Number(geometry.bucklingLength);
  const Ncr = Math.PI ** 2 * sc.EIeff / (L * L);
  const lambdaBar = Math.sqrt(sc.NplRk / Ncr);

  const steps = [
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'N_cr', description: 'Elastic critical normal force for the relevant buckling mode',
      expression: 'N_cr = π² (EI)_eff / L²',
      substitution: `π² × (EI)_eff / ${L}²`,
      value: Ncr, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'λ̄', description: 'Relative slenderness',
      expression: 'λ̄ = √(N_pl,Rk / N_cr)',
      value: lambdaBar,
    }),
  ];

  return { steps, check: null, scratch: { Ncr, lambdaBar, L } };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.1 — limits of applicability of the simplified method          */
/* ------------------------------------------------------------------ */

function en_limits(ctx, sc) {
  const { sec } = ctx;
  if (!Number.isFinite(sc.lambdaBar) || !Number.isFinite(sc.NplRd)) {
    throw new Error('the limits of §6.7.3.1 require the plastic resistance and the relative slenderness, which have not been established');
  }
  const delta = (sec.Aa * sc.fyd) / sc.NplRd;
  const rho = sec.rebarRatio;
  const aspect = sec.shape === SHAPE.CHS ? 1 : sec.h / sec.b;

  const tests = [
    { label: 'Steel contribution ratio δ', clause: '6.7.3.1', value: delta, lo: 0.2, hi: 0.9, fmt: (v) => v.toFixed(3) },
    { label: 'Relative slenderness λ̄', clause: '6.7.3.1', value: sc.lambdaBar, lo: 0, hi: 2.0, fmt: (v) => v.toFixed(3) },
    { label: 'Reinforcement ratio ρ_s', clause: '6.7.3.1', value: rho, lo: 0, hi: 0.06, fmt: (v) => `${(v * 100).toFixed(2)}%` },
    { label: 'Depth to width ratio h/b', clause: '6.7.3.1', value: aspect, lo: 0.2, hi: 5.0, fmt: (v) => v.toFixed(2) },
  ];

  const breaches = tests.filter((t) => t.value < t.lo || t.value > t.hi);

  const steps = [
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'δ', description: 'Steel contribution ratio',
      expression: 'δ = A_a f_yd / N_pl,Rd',
      value: delta,
    }),
    ...tests.map((t) => step({
      code: C, clause: t.clause,
      symbol: t.label, description: `Limit of applicability: ${t.lo} ≤ value ≤ ${t.hi}`,
      expression: `${t.lo} ≤ ${t.label} ≤ ${t.hi}`,
      substitution: t.fmt(t.value),
      value: t.value,
      note: (t.value < t.lo || t.value > t.hi) ? 'Outside the range permitted for the simplified method.' : null,
    })),
  ];

  return {
    steps,
    check: check({
      id: 'limits',
      title: 'Limits of applicability of the simplified method',
      code: C, clause: '6.7.3.1',
      clauseTitle: 'Simplified method of design — scope',
      status: breaches.length ? CHECK_STATUS.FAIL : CHECK_STATUS.PASS,
      utilisation: breaches.length ? Infinity : 0,
      failureMode: breaches.length
        ? `Outside the scope of §6.7.3: ${breaches.map((b) => b.label).join(', ')}`
        : null,
      steps,
      note: breaches.length
        ? 'The simplified method may not be used for this member. Either revise the section, or design by the general method of §6.7.2, which this platform does not implement.'
        : null,
    }),
    scratch: { delta, outOfScope: breaches.length > 0 },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.5 — resistance in axial compression                           */
/* ------------------------------------------------------------------ */

function en_axialBuckling(ctx, sc) {
  const { sec, actions } = ctx;
  // Table 6.5: filled sections, ρ_s ≤ 3% use curve a; 3% < ρ_s ≤ 6% use curve b.
  const useCurveB = sec.rebarRatio > 0.03;
  const alpha = useCurveB ? 0.34 : 0.21;
  const curve = useCurveB ? 'b' : 'a';
  const lam = sc.lambdaBar;

  const phi = 0.5 * (1 + alpha * (lam - 0.2) + lam * lam);
  const chi = Math.min(1.0, 1 / (phi + Math.sqrt(Math.max(0, phi * phi - lam * lam))));
  const NbRd = chi * sc.NplRd;
  const NEd = Number(actions.NEd) || 0;

  const steps = [
    step({
      code: C, clause: '6.7.3.5',
      symbol: 'buckling curve', description: 'Buckling curve for a concrete filled section',
      expression: 'Table 6.5: curve a for ρ_s ≤ 3%, curve b for 3% < ρ_s ≤ 6%',
      substitution: `ρ_s = ${(sec.rebarRatio * 100).toFixed(2)}% → curve ${curve}, α = ${alpha}`,
    }),
    step({
      code: 'EN 1993-1-1', clause: '6.3.1.2',
      symbol: 'Φ', description: 'Buckling reduction parameter, taken from EN 1993-1-1 as directed by EN 1994-1-1 §6.7.3.5',
      expression: 'Φ = 0.5 [1 + α (λ̄ − 0.2) + λ̄²]',
      value: phi,
    }),
    step({
      code: 'EN 1993-1-1', clause: '6.3.1.2',
      symbol: 'χ', description: 'Reduction factor for flexural buckling',
      expression: 'χ = 1 / (Φ + √(Φ² − λ̄²)) ≤ 1.0',
      value: chi,
    }),
    step({
      code: C, clause: '6.7.3.5',
      symbol: 'N_b,Rd', description: 'Design buckling resistance',
      expression: 'N_b,Rd = χ N_pl,Rd',
      substitution: `${chi.toFixed(4)} × N_pl,Rd`,
      value: NbRd, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'axial',
      title: 'Member resistance in axial compression',
      code: C, clause: '6.7.3.5',
      clauseTitle: 'Resistance of members in axial compression',
      demand: NEd, capacity: NbRd, dimension: 'force',
      failureMode: 'Flexural buckling of the composite member',
      steps,
    }),
    scratch: { chi, alpha, curve, NbRd, phiBuck: phi },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.4 — second-order effects and imperfections                    */
/* ------------------------------------------------------------------ */

function en_secondOrder(ctx, sc) {
  const { sec, mat, actions, geometry } = ctx;
  const K0 = 0.9;
  const KeII = 0.5;
  const axisZ = ctx.axis === 'z';
  const Ia = axisZ ? sec.IaZ : sec.Ia;
  const Ic = axisZ ? sec.IcZ : sec.Ic;
  const Is = axisZ ? sec.IsZ : sec.Is;

  const EIeffII = K0 * (mat.Ea * Ia + mat.Es * Is + KeII * sc.EcEff * Ic);
  const L = sc.L;
  const NcrEff = Math.PI ** 2 * EIeffII / (L * L);

  // Table 6.5: member imperfection L/300 for curve a, L/200 for curve b.
  const e0 = L / (sc.curve === 'b' ? 200 : 300);
  const NEd = Number(actions.NEd) || 0;
  const r = Number(actions.momentRatio ?? 1);

  const beta = Math.max(0.44, 0.66 + 0.44 * r);
  const denom = 1 - NEd / NcrEff;
  const safeDenom = denom > 0 ? denom : null;

  const kMoment = safeDenom ? Math.max(1.0, beta / safeDenom) : Infinity;
  const kImp = safeDenom ? Math.max(1.0, 1.0 / safeDenom) : Infinity;

  const MimpY = NEd * e0;
  const M0y = Number(actions.MyEd) || 0;
  const M0z = Number(actions.MzEd) || 0;
  const MyEd = Number.isFinite(kMoment) ? kMoment * M0y + kImp * MimpY : Infinity;
  const MzEd = Number.isFinite(kMoment) ? kMoment * M0z : Infinity;

  const steps = [
    step({
      code: C, clause: '6.7.3.4',
      symbol: '(EI)_eff,II', description: 'Effective flexural stiffness for second-order analysis',
      expression: '(EI)_eff,II = K_0 (E_a I_a + E_s I_s + K_e,II E_cm I_c), K_0 = 0.9, K_e,II = 0.5',
      value: EIeffII,
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'N_cr,eff', description: 'Critical load using the second-order stiffness',
      expression: 'N_cr,eff = π² (EI)_eff,II / L²',
      value: NcrEff, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'e_0', description: 'Member imperfection',
      expression: 'Table 6.5: L/300 for buckling curve a, L/200 for curve b',
      substitution: `L / ${sc.curve === 'b' ? 200 : 300}`,
      value: e0, dimension: 'length',
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'β', description: 'Equivalent moment factor for the end moments',
      expression: 'β = 0.66 + 0.44 r ≥ 0.44',
      substitution: `0.66 + 0.44 × ${r}`,
      value: beta,
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'k', description: 'Amplification factor applied to the first-order moment',
      expression: 'k = β / (1 − N_Ed/N_cr,eff) ≥ 1.0',
      value: kMoment,
      note: Number.isFinite(kMoment) ? null : 'N_Ed reaches or exceeds N_cr,eff; the member is unstable and no amplified moment exists.',
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'M_y,Ed', description: 'Design moment including second-order effects and the member imperfection',
      expression: 'M_y,Ed = k·M_y,Ed,0 + k_imp·N_Ed·e_0',
      value: MyEd, dimension: 'moment',
    }),
  ];

  const stable = Number.isFinite(kMoment);
  return {
    steps,
    check: check({
      id: 'stability',
      title: 'Second-order stability of the member',
      code: C, clause: '6.7.3.4',
      clauseTitle: 'Methods of analysis and member imperfections',
      demand: NEd, capacity: NcrEff, dimension: 'force',
      status: stable ? undefined : CHECK_STATUS.FAIL,
      failureMode: 'Loss of stability — the axial force approaches the critical load and the moment amplifier diverges',
      steps,
      note: stable ? null : 'N_Ed ≥ N_cr,eff. The member has no stable second-order solution.',
    }),
    scratch: { EIeffII, NcrEff, e0, beta, kMoment, MyEd, MzEd, M0y, M0z },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.2(5) — interaction polygon                                    */
/* ------------------------------------------------------------------ */

function interactionPolygon(ctx, sc, axis) {
  const { sec, mat } = ctx;
  const z = axis === 'z';
  const Wpa = z ? sec.WpaZ : sec.Wpa;
  const Wpc = z ? sec.WpcZ : sec.Wpc;
  const Wps = z ? sec.WpsZ : sec.Wps;
  const width = sec.shape === SHAPE.CHS ? sec.d : (z ? sec.h : sec.b);
  const inner = sec.shape === SHAPE.CHS ? sec.di : (z ? sec.hi : sec.bi);

  const { fyd, fcd, fsd } = sc;

  // Neutral axis offset for the maximum-moment point.
  // Reinforcement lying within the region 2 h_n is not deducted; see note.
  const hn = (sec.Ac * fcd) / (2 * width * fcd + 4 * sec.t * (2 * fyd - fcd));

  const Wpcn = inner * hn * hn;
  const Wpan = width * hn * hn - Wpcn;

  const MmaxRd = Wpa * fyd + Wps * fsd + 0.5 * Wpc * fcd;
  const MnRd = Wpan * fyd + 0.5 * Wpcn * fcd;
  const MplRd = MmaxRd - MnRd;
  const NpmRd = sec.Ac * fcd;

  return { hn, Wpa, Wpc, Wps, Wpan, Wpcn, MmaxRd, MnRd, MplRd, NpmRd, width, inner, mat };
}

/** μ_d from the four-point polygon of Figure 6.19. */
function muFactor(poly, NEd, NplRd) {
  const { NpmRd, MplRd, MmaxRd } = poly;
  let M;
  if (NEd >= NpmRd) {
    M = NplRd > NpmRd ? MplRd * (NplRd - NEd) / (NplRd - NpmRd) : 0;
  } else if (NEd >= NpmRd / 2) {
    M = MmaxRd + (MplRd - MmaxRd) * (NEd - NpmRd / 2) / (NpmRd / 2);
  } else {
    M = MplRd + (MmaxRd - MplRd) * (NEd / (NpmRd / 2));
  }
  M = Math.max(0, M);
  return { M, mu: MplRd > 0 ? M / MplRd : 0 };
}

function alphaM(fy) {
  // §6.7.3.6(1): 0.9 for S235 to S355, 0.8 for S420 and S460.
  return fy <= 355 ? 0.9 : 0.8;
}

function en_uniaxial(ctx, sc) {
  const { mat, actions } = ctx;
  const axis = ctx.axis === 'z' ? 'z' : 'y';
  const poly = interactionPolygon(ctx, sc, axis);
  const NEd = Number(actions.NEd) || 0;
  const { M, mu } = muFactor(poly, NEd, sc.NplRd);
  const aM = alphaM(mat.fy);
  const capacity = aM * M;
  const MEd = axis === 'z' ? sc.MzEd : sc.MyEd;

  const steps = [
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'h_n', description: 'Neutral axis offset defining the maximum-moment point of the interaction curve',
      expression: 'h_n = A_c f_cd / (2 b f_cd + 4 t (2 f_yd − f_cd))',
      value: poly.hn, dimension: 'length',
      note: 'Reinforcement falling within the depth 2 h_n is not deducted. Verify this for heavily reinforced cores.',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'M_max,Rd', description: 'Maximum moment resistance, at point D of the interaction curve',
      expression: 'M_max,Rd = W_pa f_yd + W_ps f_sd + 0.5 W_pc f_cd',
      value: poly.MmaxRd, dimension: 'moment',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'M_pl,Rd', description: 'Plastic moment resistance, at points B and C of the interaction curve',
      expression: 'M_pl,Rd = M_max,Rd − M_n,Rd',
      value: poly.MplRd, dimension: 'moment',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'N_pm,Rd', description: 'Axial force at point C, equal to the resistance of the concrete alone',
      expression: 'N_pm,Rd = A_c f_cd',
      value: poly.NpmRd, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.6',
      symbol: 'μ_d', description: 'Moment resistance ratio read from the interaction curve at N_Ed',
      expression: 'Figure 6.19: linear interpolation between points A, C, D and B',
      value: mu,
    }),
    step({
      code: C, clause: '6.7.3.6',
      symbol: 'α_M', description: 'Coefficient allowing for the difference between the plastic and the actual resistance',
      expression: '0.9 for S235 to S355; 0.8 for S420 and S460',
      substitution: `f_y = ${mat.fy} MPa`,
      value: aM,
    }),
    step({
      code: C, clause: '6.7.3.6',
      symbol: 'M_Rd', description: 'Moment resistance available at the design axial force',
      expression: 'M_Rd = α_M μ_d M_pl,Rd',
      value: capacity, dimension: 'moment',
    }),
  ];

  return {
    steps,
    check: check({
      id: `uniaxial_${axis}`,
      title: `Compression with bending about the ${axis}-axis`,
      code: C, clause: '6.7.3.6',
      clauseTitle: 'Resistance of members in combined compression and uniaxial bending',
      demand: MEd, capacity, dimension: 'moment',
      failureMode: `Formation of a plastic hinge under combined axial force and ${axis}-axis bending`,
      steps,
    }),
    scratch: axis === 'z'
      ? { polyZ: poly, muZ: mu, MRdZ: capacity, alphaM: aM }
      : { polyY: poly, muY: mu, MRdY: capacity, alphaM: aM },
  };
}

function en_biaxial(ctx, sc) {
  const { actions } = ctx;
  const MyEd = sc.MyEd || 0;
  const MzEd = sc.MzEd || 0;

  if (!(Math.abs(Number(actions.MyEd) || 0) > 0 && Math.abs(Number(actions.MzEd) || 0) > 0)) {
    return {
      steps: [notice({
        code: C, clause: '6.7.3.7', symbol: 'biaxial',
        description: 'Combined compression and biaxial bending',
        note: 'Only one bending axis is loaded, so the biaxial interaction of §6.7.3.7 does not apply.',
      })],
      check: check({
        id: 'biaxial', title: 'Compression with biaxial bending',
        code: C, clause: '6.7.3.7', clauseTitle: 'Combined compression and biaxial bending',
        status: CHECK_STATUS.NOT_APPLICABLE,
      }),
      scratch: {},
    };
  }

  const polyY = sc.polyY;
  const polyZ = sc.polyZ;
  const uy = polyY && sc.muY > 0 ? MyEd / (sc.muY * polyY.MplRd) : Infinity;
  const uz = polyZ && sc.muZ > 0 ? MzEd / (sc.muZ * polyZ.MplRd) : Infinity;
  const combined = uy + uz;

  const steps = [
    step({
      code: C, clause: '6.7.3.7',
      symbol: 'M_y,Ed / (μ_dy M_pl,y,Rd)', description: 'Utilisation about the y-axis, without α_M',
      expression: 'M_y,Ed ≤ α_M,y μ_dy M_pl,y,Rd', value: uy,
    }),
    step({
      code: C, clause: '6.7.3.7',
      symbol: 'M_z,Ed / (μ_dz M_pl,z,Rd)', description: 'Utilisation about the z-axis, without α_M',
      expression: 'M_z,Ed ≤ α_M,z μ_dz M_pl,z,Rd', value: uz,
    }),
    step({
      code: C, clause: '6.7.3.7',
      symbol: 'Σ', description: 'Linear interaction of the two bending axes',
      expression: 'M_y,Ed/(μ_dy M_pl,y,Rd) + M_z,Ed/(μ_dz M_pl,z,Rd) ≤ 1.0',
      value: combined,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'biaxial',
      title: 'Compression with biaxial bending',
      code: C, clause: '6.7.3.7', clauseTitle: 'Combined compression and biaxial bending',
      utilisation: combined, limit: 1.0,
      failureMode: 'Combined axial force with bending about both principal axes',
      steps,
    }),
    scratch: { biaxialUy: uy, biaxialUz: uz },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.4.2 — load introduction                                         */
/* ------------------------------------------------------------------ */

function en_loadTransfer(ctx, sc) {
  const { sec, assumptions, actions } = ctx;
  // §6.7.4.2(4): design shear strength at the interface, filled sections.
  const tauRd = sec.shape === SHAPE.CHS ? 0.55 : 0.40;
  const Lintro = Number(assumptions.introductionLength) || Math.min(2 * (sec.b || sec.d), sec.h ? sec.h * 2 : 2 * (sec.d || sec.b));
  const area = sec.perimeterInner * Lintro;
  const capacity = area * tauRd;
  const NcShare = (sc.Nc + sc.Ns) / sc.NplRd * (Number(actions.NEd) || 0);

  const steps = [
    step({
      code: C, clause: '6.7.4.2',
      symbol: 'τ_Rd', description: 'Design shear strength at the steel–concrete interface',
      expression: 'Table 6.6: 0.55 MPa for circular filled sections, 0.40 MPa for rectangular filled sections',
      value: tauRd, dimension: 'stress',
      verify: true,
    }),
    step({
      code: C, clause: '6.7.4.2',
      symbol: 'V_Rd', description: 'Resistance available over the introduction length',
      expression: 'V_Rd = perimeter × L_intro × τ_Rd',
      value: capacity, dimension: 'force',
    }),
    derived({
      symbol: 'V_Ed', description: 'Force that must be transferred into the concrete core',
      expression: 'V_Ed = N_Ed (A_c f_cd + A_s f_sd) / N_pl,Rd',
      value: NcShare, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'loadTransfer',
      title: 'Load introduction into the concrete core',
      code: C, clause: '6.7.4.2', clauseTitle: 'Load introduction',
      demand: NcShare, capacity, dimension: 'force',
      failureMode: 'Slip at the steel–concrete interface within the introduction length',
      steps, verify: true,
      note: 'The interface shear strengths of Table 6.6 must be confirmed against your controlled copy. Where the check fails, shear connectors or bearing plates are required.',
    }),
    scratch: { tauRd, Lintro },
  };
}

/* ------------------------------------------------------------------ */
/* fire — deliberately not implemented                                 */
/* ------------------------------------------------------------------ */

function en_fire() {
  return {
    steps: [notice({
      code: 'EN 1994-1-2', clause: '4.3.5.1',
      symbol: 'fire', description: 'Fire resistance of the filled composite column',
      note: 'Not calculated. The clause that governs is identified, but the tabulated temperature-dependent reduction factors it depends on are not reproduced in this build, and this platform will not substitute approximations for published tables.',
    })],
    check: check({
      id: 'fire',
      title: 'Fire resistance',
      code: 'EN 1994-1-2', clause: '4.3.5.1',
      clauseTitle: 'Composite columns — simple calculation models',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Loss of resistance at elevated temperature',
      note: 'EN 1994-1-2 §4.3.5.1 with Annex H governs filled hollow sections. Carry out this check separately against the controlled copy, or by testing, before issuing the design.',
      verify: true,
    }),
    scratch: {},
  };
}

const EN1994_CFST_HANDLERS = {
  classification: en_classification,
  plastic: en_plasticResistance,
  confinement: en_confinement,
  stiffness: en_stiffness,
  slenderness: en_slenderness,
  limits: en_limits,
  buckling: en_axialBuckling,
  secondOrder: en_secondOrder,
  uniaxial: en_uniaxial,
  biaxial: en_biaxial,
  loadTransfer: en_loadTransfer,
  fire: en_fire,
};


/* ===== src/codes/aisc360-cfst.js ===== */
// codes/aisc360-cfst.js — AISC 360-22 Chapter I, filled composite members.
//
// Scope of this implementation: axial compression (I2.2) and the local buckling
// classification (I1.4). Flexure and combined loading are NOT implemented and
// return a formal notice rather than a number. See the note in each handler.
//
// Base units are N, mm, MPa. The published equations are dimensionally
// consistent, so no unit conversion is required; the classification limits that
// contain numeric coefficients are expressed in the √(E/F_y) form, which is
// also unit-independent.


const A = 'AISC 360-22';

/**
 * Local buckling limits, held as DATA so they can be corrected in one place
 * without touching the engine. Flagged for office verification because the
 * coefficients come from Table I1.1a and must match the controlled copy.
 */
const AISC_I11A = {
  rectangular: { compact: 2.26, noncompact: 3.00, maximum: 5.00, form: 'sqrt' },
  round: { compact: 0.15, noncompact: 0.19, maximum: 0.31, form: 'linear' },
  source: 'Table I1.1a — axial compression',
  verify: true,
};

function aisc_classification(ctx) {
  const { sec, mat } = ctx;
  const round = sec.shape === SHAPE.CHS;
  const set = round ? AISC_I11A.round : AISC_I11A.rectangular;
  const base = round ? (mat.Ea / mat.fy) : Math.sqrt(mat.Ea / mat.fy);
  const lp = set.compact * base;
  const lr = set.noncompact * base;
  const lmax = set.maximum * base;
  const lam = sec.slendernessRatio;

  const klass = lam <= lp ? 'Compact' : lam <= lr ? 'Noncompact' : 'Slender';

  const steps = [
    step({
      code: A, clause: 'I1.4',
      symbol: 'λ', description: `Wall slenderness, ${sec.slendernessLabel}`,
      value: lam,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_p', description: 'Limit for a compact filled section in axial compression',
      expression: round ? 'λ_p = 0.15 E/F_y' : 'λ_p = 2.26 √(E/F_y)',
      value: lp, verify: true,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_r', description: 'Limit for a noncompact filled section in axial compression',
      expression: round ? 'λ_r = 0.19 E/F_y' : 'λ_r = 3.00 √(E/F_y)',
      value: lr, verify: true,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_max', description: 'Maximum permitted wall slenderness',
      value: lmax, verify: true,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'classification',
      title: `Local buckling classification — section is ${klass.toLowerCase()}`,
      code: A, clause: 'I1.4',
      clauseTitle: 'Classification of filled composite sections for local buckling',
      demand: lam, capacity: lmax, dimension: null,
      failureMode: 'Local buckling of the tube wall',
      steps, verify: true,
      note: klass === 'Compact'
        ? null
        : `The section is ${klass.toLowerCase()}. AISC 360 §I2.2b gives reduced nominal strength equations for noncompact and slender filled sections, which are not implemented in this build. Use a compact section, or carry out this case by hand.`,
    }),
    scratch: { klass, lambdaWall: lam, lp, lr, lmax, compact: klass === 'Compact' },
  };
}

function aisc_axial(ctx, sc) {
  const { sec, mat, geometry, actions, partial } = ctx;
  const round = sec.shape === SHAPE.CHS;
  const C2 = round ? 0.95 : 0.85;

  // I2.2b requires the compact equations; anything else is out of scope here.
  if (!sc.compact) {
    return {
      steps: [notice({
        code: A, clause: 'I2.2',
        symbol: 'P_n', description: 'Compressive strength',
        note: 'Only the compact-section equations of §I2.2b are implemented. No number is produced for a noncompact or slender filled section.',
      })],
      check: check({
        id: 'axial', title: 'Axial compressive strength',
        code: A, clause: 'I2.2', clauseTitle: 'Filled composite members — compressive strength',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Flexural buckling of the composite member',
        note: 'Section is not compact. Complete this check by hand against §I2.2b.',
      }),
      scratch: {},
    };
  }

  const Es = mat.Ea;
  const Ec = mat.Ec;
  const Pno = mat.fy * sec.Aa + C2 * mat.fcPrime * (sec.Ac + sec.As * (Es / Ec));
  const C3 = Math.min(0.9, 0.45 + 3 * ((sec.Aa + sec.As) / sec.Ag));
  const axisZ = ctx.axis === 'z';
  const Ia = axisZ ? sec.IaZ : sec.Ia;
  const Ic = axisZ ? sec.IcZ : sec.Ic;
  const Is = axisZ ? sec.IsZ : sec.Is;
  const EIeff = Es * Ia + Es * Is + C3 * Ec * Ic;
  const Lc = Number(geometry.bucklingLength);
  const Pe = Math.PI ** 2 * EIeff / (Lc * Lc);

  const ratio = Pno / Pe;
  const Pn = ratio <= 2.25 ? Pno * Math.pow(0.658, ratio) : 0.877 * Pe;
  const phi = partial.phiC ?? 0.75;
  const design = phi * Pn;
  const NEd = Number(actions.NEd) || 0;

  const steps = [
    step({
      code: A, clause: 'I2.2',
      symbol: 'C_2', description: 'Coefficient on the concrete contribution',
      expression: '0.85 for rectangular filled sections, 0.95 for round filled sections',
      value: C2,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_no', description: 'Nominal axial compressive strength without slenderness effects',
      expression: 'P_no = F_y A_s + C_2 f′_c (A_c + A_sr E_s/E_c)',
      value: Pno, dimension: 'force',
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'C_3', description: 'Coefficient for the effective rigidity',
      expression: 'C_3 = 0.45 + 3 (A_s + A_sr)/A_g ≤ 0.9',
      value: C3,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'EI_eff', description: 'Effective stiffness of the composite section',
      expression: 'EI_eff = E_s I_s + E_s I_sr + C_3 E_c I_c',
      value: EIeff,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_e', description: 'Elastic critical buckling load',
      expression: 'P_e = π² (EI_eff) / L_c²',
      value: Pe, dimension: 'force',
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_n', description: 'Nominal compressive strength',
      expression: ratio <= 2.25 ? 'P_n = P_no [0.658^(P_no/P_e)]' : 'P_n = 0.877 P_e',
      substitution: `P_no/P_e = ${ratio.toFixed(3)} ${ratio <= 2.25 ? '≤' : '>'} 2.25`,
      value: Pn, dimension: 'force',
    }),
    step({
      code: A, clause: 'I1.2',
      symbol: 'φ_c P_n', description: 'Design compressive strength',
      expression: 'φ_c = 0.75 (LRFD)',
      value: design, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'axial',
      title: 'Axial compressive strength',
      code: A, clause: 'I2.2',
      clauseTitle: 'Filled composite members — compressive strength',
      demand: NEd, capacity: design, dimension: 'force',
      failureMode: 'Flexural buckling of the composite member',
      steps,
    }),
    scratch: { Pno, Pe, Pn, EIeff, C2, C3, design },
  };
}

function aisc_flexure() {
  return {
    steps: [notice({
      code: A, clause: 'I3.4',
      symbol: 'M_n', description: 'Flexural strength of a filled composite member',
      note: 'Not implemented. §I3.4 defines the plastic stress distribution for filled sections, but this build does not compute it. No moment resistance is produced under AISC 360.',
    })],
    check: check({
      id: 'uniaxial_y', title: 'Compression with uniaxial bending',
      code: A, clause: 'I5', clauseTitle: 'Combined flexure and axial force',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined axial force and bending',
      note: 'Use EN 1994-1-1 §6.7.3.6 for a computed interaction, or complete §I5 by hand.',
    }),
    scratch: {},
  };
}

const AISC360_CFST_HANDLERS = {
  classification: aisc_classification,
  axial: aisc_axial,
  flexure: aisc_flexure,
};


/* ===== src/codes/en1993-baseplate.js ===== */
// codes/en1993-baseplate.js — EN 1993-1-8 §6.2.5 column bases.
//
// Scope: concentric compression. Base plates under moment require the
// equivalent T-stub in tension and the lever-arm model of §6.2.8, which is not
// implemented; that case returns a notice, not a number.


const C18 = 'EN 1993-1-8';

function en_bp_bearing(ctx) {
  const { plate, bp, mat, partial } = ctx;
  const fcd = mat.fck / partial.gammaC;

  // §6.2.5(7): the joint coefficient. 2/3 is the recommended value where the
  // grout strength is at least 0.2 f_ck and the grout is no thicker than 0.2
  // times the smaller plate dimension.
  const betaJ = 2 / 3;
  const kj = Math.min(3.0, Math.sqrt(plate.A2 / plate.A1));
  const fjd = betaJ * kj * fcd;

  // §6.2.5(4): additional bearing width developed by the plate in bending.
  const cFromPlate = bp.tp * Math.sqrt(mat.fyPlate / (3 * fjd * partial.gammaM0));
  const c = Math.min(cFromPlate, plate.overhang);
  const Aeff = plate.perimeterCol * c + effectiveCore(plate, c);
  const NjRd = Aeff * fjd;
  const NEd = Math.max(0, Number(ctx.actions.NEd) || 0);

  const tReq = plate.overhang * Math.sqrt(3 * fjd * partial.gammaM0 / mat.fyPlate);

  const grLimit = 0.2 * Math.min(plate.round ? bp.Dp : bp.B, plate.round ? bp.Dp : bp.N);

  const steps = [
    step({
      code: 'EN 1992-1-1', clause: '6.7',
      symbol: 'k_j', description: 'Concentration factor for the supporting area, as referred to by EN 1993-1-8 §6.2.5',
      expression: 'k_j = √(A_2/A_1) ≤ 3.0',
      substitution: `√(${plate.A2.toFixed(0)} / ${plate.A1.toFixed(0)})`,
      value: kj,
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'β_j', description: 'Joint coefficient for the grout and bedding',
      expression: 'β_j = 2/3, provided the grout strength is at least 0.2 f_ck and its thickness does not exceed 0.2 times the smaller plate dimension',
      substitution: `grout ${bp.grout} mm against a limit of ${grLimit.toFixed(0)} mm`,
      value: betaJ,
      note: bp.grout > grLimit
        ? 'The grout is thicker than the limit for β_j = 2/3. Verify the joint against §6.2.5(7) before relying on this value.'
        : null,
      verify: bp.grout > grLimit,
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'f_jd', description: 'Design bearing strength of the joint',
      expression: 'f_jd = β_j k_j f_cd',
      value: fjd, dimension: 'stress',
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'c', description: 'Additional bearing width the plate can develop in bending',
      expression: 'c = t_p √(f_y / (3 f_jd γ_M0))',
      substitution: `${bp.tp} × √(${mat.fyPlate} / (3 × ${fjd.toFixed(2)} × ${partial.gammaM0}))`,
      value: cFromPlate, dimension: 'length',
      note: cFromPlate > plate.overhang
        ? `The plate could develop ${cFromPlate.toFixed(0)} mm but only ${plate.overhang.toFixed(0)} mm of overhang is available, so the smaller value governs.`
        : null,
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'A_eff', description: 'Effective bearing area under the column',
      expression: 'The column footprint extended by c on all sides, bounded by the plate',
      value: Aeff, dimension: 'area',
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'N_j,Rd', description: 'Design bearing resistance of the base',
      expression: 'N_j,Rd = A_eff f_jd',
      value: NjRd, dimension: 'force',
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'bp.bearing', title: 'Concrete bearing under the base plate',
        code: C18, clause: '6.2.5', clauseTitle: 'Design resistance of column bases with base plates',
        demand: NEd, capacity: NjRd, dimension: 'force',
        failureMode: 'Crushing of the grout and concrete beneath the effective bearing area',
        steps,
      }),
      check({
        id: 'bp.thickness', title: 'Base plate thickness',
        code: C18, clause: '6.2.5', clauseTitle: 'Additional bearing width developed by the plate',
        demand: tReq, capacity: bp.tp, dimension: 'length',
        failureMode: 'Yielding of the plate in bending across the overhang, so the assumed bearing area cannot develop',
        steps: [step({
          code: C18, clause: '6.2.5',
          symbol: 't_p,min', description: 'Plate thickness needed to develop the full overhang as bearing area',
          expression: 't_p,min = overhang × √(3 f_jd γ_M0 / f_y)',
          value: tReq, dimension: 'length',
        })],
      }),
    ],
    scratch: { fjd, kj, betaJ, c, Aeff, NjRd, tReq },
  };
}

function effectiveCore(plate, c) {
  // Corners of the spread strip, plus the column's own footprint.
  const core = plate.round
    ? Math.PI / 4 * plate.colOuterB * plate.colOuterB
    : plate.colOuterB * plate.colOuterN;
  const corners = plate.round ? Math.PI * c * c : 4 * c * c;
  return core + corners;
}

function en_bp_moment(ctx) {
  const M = Math.abs(Number(ctx.actions.MEd) || 0);
  if (!M) {
    return {
      steps: [notice({
        code: C18, clause: '6.2.8', symbol: 'M_j,Rd',
        description: 'Moment resistance of the column base',
        note: 'No moment is applied at the base, so the base is verified for concentric compression alone.',
      })],
      checks: [check({
        id: 'bp.moment', title: 'Column base under moment',
        code: C18, clause: '6.2.8', clauseTitle: 'Design moment resistance of beam-to-column joints and splices',
        status: CHECK_STATUS.NOT_APPLICABLE,
      })],
      scratch: {},
    };
  }
  return {
    steps: [notice({
      code: C18, clause: '6.2.8', symbol: 'M_j,Rd',
      description: 'Moment resistance of the column base',
      note: 'Not calculated. A base plate under moment requires the equivalent T-stub in tension of §6.2.6.11 together with the lever-arm model of §6.2.8. That model is not implemented in this build and no approximation has been substituted.',
    })],
    checks: [check({
      id: 'bp.moment', title: 'Column base under moment',
      code: C18, clause: '6.2.8', clauseTitle: 'Design moment resistance',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined compression and moment at the base',
      note: 'A moment is applied at the base. Complete this check by hand against §6.2.8, or apply the base moment as an equivalent anchor tension in the uplift input.',
    })],
    scratch: {},
  };
}

function en_anchor_tension(ctx) {
  const { plate, bp } = ctx;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);
  // §6.2.6.12 / Table 3.4: tension resistance of a bolt.
  const k2 = 0.9;
  const gammaM2 = 1.25;
  const FtRd = k2 * bp.anchors.futa * plate.Ase / gammaM2;
  const total = FtRd * plate.anchorCount;

  const steps = [
    step({
      code: C18, clause: '3.6.1',
      symbol: 'F_t,Rd', description: 'Tension resistance of one anchor in the steel',
      expression: 'F_t,Rd = k_2 f_ub A_s / γ_M2, with k_2 = 0.9',
      substitution: `0.9 × ${bp.anchors.futa} × ${plate.Ase.toFixed(0)} / 1.25`,
      value: FtRd, dimension: 'force',
    }),
    step({
      code: C18, clause: '3.6.1',
      symbol: 'ΣF_t,Rd', description: 'Tension resistance of the anchor group in the steel',
      expression: 'n × F_t,Rd',
      value: total, dimension: 'force',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.tension', title: 'Anchor steel in tension',
      code: C18, clause: '3.6.1', clauseTitle: 'Design resistance of individual fasteners',
      demand: T, capacity: total, dimension: 'force',
      failureMode: 'Tensile fracture of the anchor steel',
      steps,
    })],
    scratch: { FtRd, anchorTensionCap: total },
  };
}

function en_anchor_breakout() {
  return {
    steps: [notice({
      code: C18, clause: '6.2.6.11', symbol: 'N_Rd,c',
      description: 'Concrete cone breakout of the anchors',
      note: 'EN 1993-1-8 does not give a concrete cone breakout resistance. That check belongs to EN 1992-4, which is not installed in this build.',
    })],
    checks: [check({
      id: 'anchor.breakout', title: 'Concrete breakout of the anchors',
      code: C18, clause: '6.2.6.11', clauseTitle: 'Anchor bolts in tension',
      status: CHECK_STATUS.NOT_COVERED,
      failureMode: 'Concrete cone pulling out around the anchor group',
      note: 'Not covered by EN 1993-1-8. Installed codes that address this check: ACI 318-19 Chapter 17. Select the ACI route for the base, or carry out the check to EN 1992-4 separately.',
    })],
    scratch: {},
  };
}

const EN1993_BP_HANDLERS = {
  bearing: en_bp_bearing,
  moment: en_bp_moment,
  anchorTension: en_anchor_tension,
  anchorBreakout: en_anchor_breakout,
};


/* ===== src/codes/aci318-anchor.js ===== */
// codes/aci318-anchor.js — ACI 318-19 Chapter 17 anchorage, with the base plate
// bearing of AISC 360-22 §J8 and the thickness rule of AISC Design Guide 1.
//
// SI units throughout: N, mm, MPa. The Chapter 17 coefficients used here are the
// SI values of ACI 318M.
//
// NOT IMPLEMENTED, by decision rather than oversight:
//   - concrete breakout in shear (§17.7.2), which is strongly edge-dependent
//   - anchor groups closer to an edge than 1.5 h_ef, where the projected area
//     A_Nc must be cut by the edge
//   - side-face blowout (§17.6.4)
// Each returns a notice naming its clause. None returns a number.


const ACI = 'ACI 318-19';
const AISC = 'AISC 360-22';
const DG1 = 'AISC Design Guide 1';

/* ---------------- bearing and plate thickness ---------------- */

function aci_bp_bearing(ctx) {
  const { plate, bp, mat } = ctx;
  const phiC = 0.65;
  const ratio = Math.min(2.0, Math.sqrt(plate.A2 / plate.A1));
  const Pp = Math.min(0.85 * mat.fcPrime * plate.A1 * ratio, 1.7 * mat.fcPrime * plate.A1);
  const design = phiC * Pp;
  const Pu = Math.max(0, Number(ctx.actions.NEd) || 0);

  // Design Guide 1 cantilever lengths. λ is taken as 1.0, which is the
  // conservative simplification the guide permits.
  const m = plate.round
    ? (bp.Dp - 0.80 * plate.colOuterB) / 2
    : (bp.N - 0.95 * plate.colOuterN) / 2;
  const n = plate.round
    ? m
    : (bp.B - 0.95 * plate.colOuterB) / 2;
  const nPrime = plate.round
    ? plate.colOuterB / 4
    : Math.sqrt(plate.colOuterB * plate.colOuterN) / 4;
  const l = Math.max(m, n, nPrime);

  const B = plate.round ? bp.Dp : bp.B;
  const N = plate.round ? bp.Dp : bp.N;
  const tMin = l * Math.sqrt((2 * Pu) / (0.9 * bp.fyPlate * B * N));

  const steps = [
    step({
      code: AISC, clause: 'J8',
      symbol: 'P_p', description: 'Nominal bearing strength of the concrete under the plate',
      expression: 'P_p = 0.85 f′_c A_1 √(A_2/A_1) ≤ 1.7 f′_c A_1',
      substitution: `√(A_2/A_1) = ${ratio.toFixed(3)} (capped at 2.0)`,
      value: Pp, dimension: 'force',
    }),
    step({
      code: AISC, clause: 'J8',
      symbol: 'φ_c P_p', description: 'Design bearing strength',
      expression: 'φ_c = 0.65',
      value: design, dimension: 'force',
    }),
    step({
      code: DG1, clause: '3',
      symbol: 'l', description: 'Governing plate cantilever length',
      expression: 'l = max(m, n, λn′), with λ taken as 1.0',
      substitution: `m = ${m.toFixed(1)}, n = ${n.toFixed(1)}, n′ = ${nPrime.toFixed(1)}`,
      value: l, dimension: 'length',
      verify: true,
    }),
    step({
      code: DG1, clause: '3',
      symbol: 't_min', description: 'Required base plate thickness',
      expression: 't_min = l √(2 P_u / (0.9 F_y B N))',
      value: tMin, dimension: 'length',
      verify: true,
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'bp.bearing', title: 'Concrete bearing under the base plate',
        code: AISC, clause: 'J8', clauseTitle: 'Bearing strength on concrete',
        demand: Pu, capacity: design, dimension: 'force',
        failureMode: 'Crushing of the concrete beneath the plate',
        steps,
      }),
      check({
        id: 'bp.thickness', title: 'Base plate thickness',
        code: DG1, clause: '3', clauseTitle: 'Design of axially loaded base plates',
        demand: tMin, capacity: bp.tp, dimension: 'length',
        failureMode: 'Yielding of the plate in bending across the cantilever',
        verify: true,
        note: 'Taken from a design guide rather than a code. λ has been taken as 1.0, which is conservative.',
      }),
    ],
    scratch: { Pp, bearingDesign: design, tMin, l },
  };
}

/* ---------------- anchors ---------------- */

function aci_anchor_tension(ctx) {
  const { plate, bp } = ctx;
  const phi = 0.75;
  const Nsa = plate.Ase * bp.anchors.futa;
  const total = phi * Nsa * plate.anchorCount;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);

  const steps = [
    step({
      code: ACI, clause: '17.6.1',
      symbol: 'N_sa', description: 'Nominal steel strength of one anchor in tension',
      expression: 'N_sa = A_se,N f_uta',
      substitution: `${plate.Ase.toFixed(0)} × ${bp.anchors.futa}`,
      value: Nsa, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ N_sa', description: 'Design steel strength of the anchor group in tension',
      expression: 'φ = 0.75 for a ductile steel element',
      value: total, dimension: 'force',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.tension', title: 'Anchor steel in tension',
      code: ACI, clause: '17.6.1', clauseTitle: 'Steel strength of anchor in tension',
      demand: T, capacity: total, dimension: 'force',
      failureMode: 'Tensile fracture of the anchor steel',
      steps,
    })],
    scratch: { NsaGroup: total },
  };
}

function aci_anchor_shear(ctx) {
  const { plate, bp } = ctx;
  const phi = 0.65;
  const Vsa = 0.6 * plate.Ase * bp.anchors.futa;
  const total = phi * Vsa * plate.anchorCount;
  const V = Math.abs(Number(ctx.actions.VEd) || 0);

  const steps = [
    step({
      code: ACI, clause: '17.7.1',
      symbol: 'V_sa', description: 'Nominal steel strength of one cast-in headed anchor in shear',
      expression: 'V_sa = 0.6 A_se,V f_uta',
      value: Vsa, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ V_sa', description: 'Design steel strength of the anchor group in shear',
      expression: 'φ = 0.65 for a ductile steel element in shear',
      value: total, dimension: 'force',
      note: 'Where the anchors bear on an oversized hole or through grout, §17.7.1 requires the strength to be reduced. Confirm the detail before relying on this value.',
      verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.shear', title: 'Anchor steel in shear',
      code: ACI, clause: '17.7.1', clauseTitle: 'Steel strength of anchor in shear',
      demand: V, capacity: total, dimension: 'force',
      failureMode: 'Shear fracture of the anchor steel',
      steps, verify: true,
    })],
    scratch: { VsaGroup: total },
  };
}

function aci_anchor_breakout(ctx) {
  const { plate, bp, mat } = ctx;
  const a = bp.anchors;
  const hef = Number(a.hef) || 0;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);

  // The projected area A_Nc is only equal to n·A_Nco where no edge cuts it and
  // the anchors do not overlap. Outside that, the projection must be drawn.
  const edgeOk = a.edge >= 1.5 * hef;
  const spacingOk = a.spacing >= 3 * hef;

  if (!edgeOk || !spacingOk) {
    const why = [
      !edgeOk ? `the smallest edge distance ${a.edge} mm is less than 1.5 h_ef = ${(1.5 * hef).toFixed(0)} mm` : null,
      !spacingOk ? `the anchor spacing ${a.spacing} mm is less than 3 h_ef = ${(3 * hef).toFixed(0)} mm` : null,
    ].filter(Boolean).join(', and ');
    return {
      steps: [notice({
        code: ACI, clause: '17.6.2',
        symbol: 'N_cbg', description: 'Concrete breakout strength of the anchor group in tension',
        note: `Not calculated because ${why}. The projected failure area A_Nc must then be drawn against the edges and the overlapping cones, which this build does not do.`,
      })],
      checks: [check({
        id: 'anchor.breakout', title: 'Concrete breakout of the anchors in tension',
        code: ACI, clause: '17.6.2', clauseTitle: 'Concrete breakout strength of anchor in tension',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Concrete cone pulling out around the anchor group',
        note: `Edge or spacing effects govern the projected area: ${why}. Complete §17.6.2 by hand, or increase the edge distance and spacing above 1.5 h_ef and 3 h_ef.`,
      })],
      scratch: { breakoutLimited: true },
    };
  }

  const kc = 10; // SI value for cast-in anchors
  const lambdaA = 1.0; // normal weight concrete
  const Nb = kc * lambdaA * Math.sqrt(mat.fcPrime) * Math.pow(hef, 1.5);
  const ANco = 9 * hef * hef;
  const ANc = ANco * plate.anchorCount;
  const psiEd = 1.0;
  const psiC = 1.0; // no supplementary reinforcement, cracked concrete assumed
  const Ncbg = (ANc / ANco) * psiEd * psiC * Nb;
  const phi = 0.70; // Condition B, no supplementary reinforcement
  const design = phi * Ncbg;

  const steps = [
    step({
      code: ACI, clause: '17.6.2',
      symbol: 'N_b', description: 'Basic concrete breakout strength of a single cast-in anchor',
      expression: 'N_b = k_c λ_a √f′_c h_ef^1.5, with k_c = 10 in SI units',
      value: Nb, dimension: 'force', verify: true,
    }),
    step({
      code: ACI, clause: '17.6.2',
      symbol: 'A_Nco', description: 'Projected area of one anchor with no edge or spacing effects',
      expression: 'A_Nco = 9 h_ef²',
      value: ANco, dimension: 'area',
    }),
    step({
      code: ACI, clause: '17.6.2',
      symbol: 'N_cbg', description: 'Concrete breakout strength of the anchor group',
      expression: 'N_cbg = (A_Nc/A_Nco) ψ_ed,N ψ_c,N N_b, with ψ = 1.0 where no edge cuts the cone',
      value: Ncbg, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ N_cbg', description: 'Design concrete breakout strength',
      expression: 'φ = 0.70, Condition B, cracked concrete with no supplementary reinforcement',
      value: design, dimension: 'force', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.breakout', title: 'Concrete breakout of the anchors in tension',
      code: ACI, clause: '17.6.2', clauseTitle: 'Concrete breakout strength of anchor in tension',
      demand: T, capacity: design, dimension: 'force',
      failureMode: 'Concrete cone pulling out around the anchor group',
      steps, verify: true,
      note: 'Cracked concrete and Condition B have been assumed. Confirm the strength reduction factor and the cracking assumption against §17.5.3 for this member.',
    })],
    scratch: { NcbgDesign: design, hef },
  };
}

function aci_anchor_pullout(ctx) {
  const { plate, mat } = ctx;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);
  const Np = 8 * plate.Abrg * mat.fcPrime;
  const phi = 0.70;
  const design = phi * Np * plate.anchorCount;

  const steps = [
    step({
      code: ACI, clause: '17.6.3',
      symbol: 'N_p', description: 'Pullout strength of one headed anchor',
      expression: 'N_p = 8 A_brg f′_c',
      substitution: `8 × ${plate.Abrg.toFixed(0)} × ${mat.fcPrime}`,
      value: Np, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ N_pn', description: 'Design pullout strength of the group',
      expression: 'φ = 0.70; ψ_c,P taken as 1.0 for cracked concrete',
      value: design, dimension: 'force', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.pullout', title: 'Anchor pullout',
      code: ACI, clause: '17.6.3', clauseTitle: 'Pullout strength of a single anchor in tension',
      demand: T, capacity: design, dimension: 'force',
      failureMode: 'The anchor head pulling through the concrete',
      steps, verify: true,
    })],
    scratch: { pulloutDesign: design },
  };
}

function aci_anchor_shear_breakout(ctx) {
  return {
    steps: [notice({
      code: ACI, clause: '17.7.2',
      symbol: 'V_cbg', description: 'Concrete breakout strength of the anchors in shear',
      note: 'Not calculated. §17.7.2 depends on the edge distance in the direction of the shear and on the projected area A_Vc, which this build does not draw. Where shear is transferred by bearing on a shear lug or by friction under §17.5.1.3, this check may not govern.',
    })],
    checks: [check({
      id: 'anchor.shearBreakout', title: 'Concrete breakout of the anchors in shear',
      code: ACI, clause: '17.7.2', clauseTitle: 'Concrete breakout strength of anchor in shear',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Concrete breaking out towards a free edge under shear',
      note: 'Complete §17.7.2 by hand, or transfer the shear by a shear lug so that anchor shear breakout does not govern.',
    })],
    scratch: {},
  };
}

function aci_anchor_interaction(ctx, sc) {
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);
  const V = Math.abs(Number(ctx.actions.VEd) || 0);

  const Nn = minDefined([sc.NsaGroup, sc.NcbgDesign, sc.pulloutDesign]);
  const Vn = sc.VsaGroup;

  if (!Nn || !Vn) {
    return {
      steps: [notice({
        code: ACI, clause: '17.8',
        symbol: 'interaction', description: 'Tension and shear interaction',
        note: 'Not evaluated because one of the governing tension or shear strengths was not established. The interaction of §17.8 cannot be applied to an incomplete set.',
      })],
      checks: [check({
        id: 'anchor.interaction', title: 'Anchor tension and shear interaction',
        code: ACI, clause: '17.8', clauseTitle: 'Tension and shear interaction',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        note: 'A governing tension or shear strength is missing, so the interaction cannot be evaluated.',
      })],
      scratch: {},
    };
  }

  const rn = T / Nn;
  const rv = V / Vn;

  if (rn <= 0.2 || rv <= 0.2) {
    return {
      steps: [step({
        code: ACI, clause: '17.8.1',
        symbol: 'interaction', description: 'Tension and shear interaction may be disregarded',
        expression: '§17.8.1 and §17.8.2: where either N_ua ≤ 0.2 φN_n or V_ua ≤ 0.2 φV_n, the full strength may be taken in the other direction',
        substitution: `N ratio ${rn.toFixed(3)}, V ratio ${rv.toFixed(3)}`,
        value: Math.max(rn, rv),
      })],
      checks: [check({
        id: 'anchor.interaction', title: 'Anchor tension and shear interaction',
        code: ACI, clause: '17.8.1', clauseTitle: 'Tension and shear interaction',
        status: CHECK_STATUS.NOT_APPLICABLE,
        note: 'One action is at or below 20% of its strength, so §17.8 permits the interaction to be disregarded.',
      })],
      scratch: {},
    };
  }

  const value = Math.pow(rn, 5 / 3) + Math.pow(rv, 5 / 3);
  const steps = [
    step({
      code: ACI, clause: '17.8.3',
      symbol: 'Σ', description: 'Combined tension and shear on the anchor group',
      expression: '(N_ua/φN_n)^(5/3) + (V_ua/φV_n)^(5/3) ≤ 1.2',
      substitution: `(${rn.toFixed(3)})^(5/3) + (${rv.toFixed(3)})^(5/3)`,
      value,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.interaction', title: 'Anchor tension and shear interaction',
      code: ACI, clause: '17.8.3', clauseTitle: 'Tension and shear interaction',
      utilisation: value / 1.2, limit: 1.0,
      failureMode: 'Combined tension and shear on the anchor group',
      steps,
    })],
    scratch: { interaction: value },
  };
}

function minDefined(arr) {
  const vals = arr.filter((x) => Number.isFinite(x) && x > 0);
  return vals.length ? Math.min(...vals) : null;
}

const ACI318_ANCHOR_HANDLERS = {
  bearing: aci_bp_bearing,
  anchorTension: aci_anchor_tension,
  anchorShear: aci_anchor_shear,
  anchorBreakout: aci_anchor_breakout,
  anchorPullout: aci_anchor_pullout,
  anchorShearBreakout: aci_anchor_shear_breakout,
  anchorInteraction: aci_anchor_interaction,
};

/* ===== src/codes/index.js ===== */
// codes/index.js — the one place a new design code is plugged in.
//
// TO ADD A CODE:
//   1. create codes/<yourcode>.js exporting a module object (see registry.js)
//   2. import it here and add it to the array below
//   3. nothing else changes — not the engine, not the UI, not the sheet
//
// The registry validates shape on registration, so a malformed module fails
// loudly at start-up rather than silently producing wrong numbers later.


const ALL_CODE_MODULES = [
  ...EGYPTIAN_CODES,
  ...EUROCODES,
  ...AMERICAN_CODES,
];

let installed = false;

function installCodes() {
  if (installed) return registry;
  registry.registerAll(ALL_CODE_MODULES);
  installed = true;
  return registry;
}

//   #C4171D  deeper red of the lower arc / shadow side
//   #000000  true black of the TRUST wordmark (not an off-black)
