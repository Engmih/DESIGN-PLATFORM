// ui/screens/designer.js — the CFST design workspace.
//
// Every edit recalculates immediately. Assumption edits require a reason before
// they are accepted, and the reason is written to the audit log with the old and
// new values.


const CHECK_KIND = {
  [CHECK_STATUS.PASS]: 'safe',
  [CHECK_STATUS.FAIL]: 'unsafe',
  [CHECK_STATUS.NOT_COVERED]: 'notcov',
  [CHECK_STATUS.NOT_IMPLEMENTED]: 'caution',
  [CHECK_STATUS.NOT_APPLICABLE]: 'neutral',
};

function designerScreen(app, itemId) {
  const host = h('div');
  let showSteps = false;

  const project = () => app.store.state.project;
  const item = () => project().items.find((i) => i.id === itemId);
  const units = () => project().units;

  function mutate(fn, { audit } = {}) {
    app.store.update((s) => {
      const idx = s.project.items.findIndex((i) => i.id === itemId);
      const next = fn({ ...s.project.items[idx] });
      s.project.items[idx] = demoteOnChange(next);
    });
    if (audit) app.audit.append(audit);
    recalc();
    render();
  }

  function recalc() {
    app.store.update((s) => {
      const idx = s.project.items.findIndex((i) => i.id === itemId);
      const it = s.project.items[idx];
      try {
        s.project.items[idx] = { ...it, result: runDesign(app.registry, it) };
      } catch (err) {
        s.project.items[idx] = { ...it, result: null, resultError: err.message };
      }
    });
  }

  function setGeom(key, raw, dimension) {
    const v = dimension ? toBase(raw, dimension, units()) : Number(raw);
    mutate((it) => ({ ...it, geometry: { ...it.geometry, [key]: v } }));
  }

  function setAction(key, raw, dimension) {
    const v = toBase(raw, dimension, units());
    mutate((it) => ({ ...it, actions: { ...it.actions, [key]: v } }));
  }

  function editAssumption(a, raw) {
    const value = a.options ? raw : Number(raw);
    if (!a.options && !Number.isFinite(value)) { toast('Enter a number.', 'err'); return; }
    if (value === a.value) return;
    const reason = window.prompt(
      `Reason for changing "${a.label}"\nfrom ${a.value} to ${value}:`, '');
    if (reason === null) { render(); return; }
    if (!String(reason).trim()) {
      toast('An assumption cannot be changed without a reason.', 'err');
      render();
      return;
    }
    const it = item();
    mutate((x) => ({
      ...x,
      assumptions: applyAssumptionEdit(x.assumptions, a.key, value, reason, new Date().toISOString()),
    }), {
      audit: {
        kind: AUDIT_KINDS.ASSUMPTION_CHANGED,
        entity: itemLabel(it), entityId: it.id,
        field: `assumptions.${a.key}`,
        from: a.value, to: value, reason,
        actor: app.actorName(),
      },
    });
    toast('Assumption changed and logged.', 'ok');
  }

  function changeCode(codeId) {
    const it = item();
    mutate((x) => ({
      ...x, code: codeId,
      assumptions: reconcileAssumptions(x.assumptions, x, codeId),
    }), {
      audit: {
        kind: AUDIT_KINDS.CODE_CHANGED, entity: itemLabel(it), entityId: it.id,
        field: 'code', from: it.code, to: codeId, actor: app.actorName(),
      },
    });
  }

  function render() { preserveFocus(paint); }

  function paint() {
    const it = item();
    if (!it) { host.replaceChildren(h('p', null, 'This item no longer exists.')); return; }
    const res = it.result;
    const u = units();
    const g = it.geometry;
    const circular = g.shape === SHAPE.CHS;

    /* ---------- verdict ---------- */
    const s = res ? res.summary : null;
    const verdictKind = !s ? 'neutral'
      : s.overall === OVERALL.SAFE ? 'safe'
        : s.overall === OVERALL.UNSAFE ? 'unsafe' : 'notcov';

    const verdict = sheet({
      title: itemLabel(it),
      lede: describeSection(g) + ` · ${it.code}`,
      actions: [
        chip(it.revision, 'neutral'),
        button('Calculation sheet', { variant: 'ghost', small: true, onClick: () => app.openSheet(itemId) }),
        button('Back to register', { variant: 'quiet', small: true, onClick: () => app.navigate('items') }),
      ],
      body: h('div', null,
        project().quick ? h('div', { class: 'tg-quickbar' },
          h('div', { class: 'tg-quickbar__text' },
            h('b', null, 'Quick design — for review only'),
            'No client, job number or checker, so the sheet prints FOR REVIEW ONLY. Turn it into a project when it needs to be issued.'),
          button('Turn into a project', { small: true, onClick: () => convertQuickToProject(app) }),
          button('Export as JSON', { small: true, variant: 'ghost', onClick: () => { exportItemJson(app, item()); toast('Exported.', 'ok'); } }),
        ) : null,
        h('div', { class: 'tg-row', style: { gap: '22px', alignItems: 'center', marginBottom: '14px' } },
          s ? stamp(s.overall, verdictKind) : chip('Not run', 'neutral'),
          s && s.governing ? h('div', null,
            h('div', { style: { fontSize: '12px', color: 'var(--tg-ink-40)' } }, 'Governing check'),
            h('div', { style: { fontWeight: 700 } }, s.governing.title),
            h('div', { style: { fontSize: '12.5px', color: 'var(--tg-ink-60)' } }, s.governing.failureMode || ''),
          ) : null,
          s && Number.isFinite(s.maxUtilisation) ? h('div', null,
            h('div', { style: { fontSize: '12px', color: 'var(--tg-ink-40)' } }, 'Utilisation'),
            h('div', { class: 'tg-ident', style: { fontSize: '26px', fontWeight: 800, color: s.maxUtilisation > 1 ? 'var(--tg-unsafe)' : 'var(--tg-safe)' } },
              formatNumber(s.maxUtilisation, 3)),
          ) : null,
        ),
        s && s.governing && s.governing.clause
          ? clauseRef(app.registry.citation(s.governing.code, s.governing.clause))
          : null,
        s && s.blocked.length
          ? note({
            variant: 'code',
            title: `${s.blocked.length} check${s.blocked.length > 1 ? 's are' : ' is'} not available under ${it.code}`,
            body: 'The design cannot read as SAFE until these are resolved. Each is listed below with the exact wording of the limitation.',
            list: s.blocked.map((b) => `${b.title} — ${b.code}${b.clause ? ` §${b.clause}` : ''}`),
          })
          : null,
        it.resultError ? note({ variant: 'danger', title: 'The calculation stopped', body: it.resultError }) : null,
      ),
    });

    /* ---------- inputs ---------- */
    const L = (dim) => symbolFor(u, dim);
    const numField = (label, key, dimension, target = 'geometry') => field({
      label: `${label} (${L(dimension)})`, id: `in-${key}`, ident: true,
      control: numberInput({
        id: `in-${key}`,
        value: fromBase((target === 'geometry' ? g : it.actions)[key], dimension, u),
        onCommit: (v) => (target === 'geometry' ? setGeom(key, v, dimension) : setAction(key, v, dimension)),
      }),
    });

    const inputs = sheet({
      title: 'Inputs',
      body: h('div', { class: 'tg-form' },
        fold({ key: 'cfst.section', title: 'Section', body:
          h('div', { class: 'tg-grid' },
            field({
              label: 'Shape', id: 'in-shape',
              control: select({
                id: 'in-shape', value: g.shape,
                options: Object.keys(SHAPE_LABELS).map((k) => ({ value: k, label: SHAPE_LABELS[k] })),
                onChange: (v) => setGeom('shape', v),
              }),
            }),
            circular ? numField('Outside diameter d', 'd', 'length') : numField('Width b', 'b', 'length'),
            circular ? null : (g.shape === SHAPE.SHS ? null : numField('Depth h', 'h', 'length')),
            numField('Wall thickness t', 't', 'length'),
            numField('Column length', 'length', 'length'),
          ) }),
        fold({ key: 'cfst.materials', title: 'Materials', body:
          h('div', { class: 'tg-grid' },
            matField(it, 'fy', 'Steel yield strength f_y', u, mutate),
            matField(it, 'fck', 'Concrete cylinder strength f_ck', u, mutate),
            matField(it, 'fsk', 'Reinforcement yield f_sk', u, mutate),
            field({
              label: 'Bars', id: 'in-nbar', ident: true,
              control: numberInput({
                id: 'in-nbar', value: g.rebar.n, min: 0, max: 64,
                onCommit: (v) => mutate((x) => ({ ...x, geometry: { ...x.geometry, rebar: { ...x.geometry.rebar, n: Math.round(v) } } })),
              }),
            }),
            field({
              label: `Bar diameter (${L('length')})`, id: 'in-dbar', ident: true,
              control: numberInput({
                id: 'in-dbar', value: fromBase(g.rebar.dia, 'length', u), min: 0,
                onCommit: (v) => mutate((x) => ({ ...x, geometry: { ...x.geometry, rebar: { ...x.geometry.rebar, dia: toBase(v, 'length', u) } } })),
              }),
            }),
          ) }),
        fold({ key: 'cfst.actions', title: 'Design actions', body:
          h('div', { class: 'tg-grid' },
            numField('Axial force N_Ed', 'NEd', 'force', 'actions'),
            numField('Permanent part N_G,Ed', 'NGEd', 'force', 'actions'),
            numField('First-order moment M_y,Ed', 'MyEd', 'moment', 'actions'),
            numField('First-order moment M_z,Ed', 'MzEd', 'moment', 'actions'),
          ) }),
        fold({ key: 'cfst.base', title: it.baseplate.enabled
          ? `Base and anchorage — ${describePlate(it.baseplate)}`
          : 'Base and anchorage — not in scope', body:
          h('div', null,
            checkRow({
              id: 'bp-enabled', checked: it.baseplate.enabled,
              label: 'Design the base and anchorage here',
              hint: it.baseplate.enabled
                ? 'The base checks below count towards the verdict for this item.'
                : 'The base is outside the scope of this calculation. The sheet will say so, and no base check counts towards the verdict.',
              onChange: (v) => mutate((x) => ({ ...x, baseplate: { ...x.baseplate, enabled: v } })),
            }),
            !it.baseplate.enabled ? null : h('div', { class: 'tg-grid' },
            field({
              label: 'Base design code', id: 'bp-code',
              hint: 'EN 1993-1-8 covers bearing and the plate; ACI 318-19 additionally covers concrete breakout and pullout.',
              control: select({
                id: 'bp-code', value: it.baseplate.code,
                options: [{ value: 'EN 1993-1-8', label: 'EN 1993-1-8 — column bases' }, { value: 'ACI 318-19', label: 'ACI 318-19 Ch. 17 with AISC J8 and DG1' }],
                onChange: (v) => mutate((x) => ({ ...x, baseplate: { ...x.baseplate, code: v } })),
              }),
            }),
            bpNum(it, 'tp', 'Plate thickness', 'length', u, mutate),
            it.baseplate.shape === PLATE_SHAPE.ROUND ? bpNum(it, 'Dp', 'Plate diameter', 'length', u, mutate) : bpNum(it, 'B', 'Plate width B', 'length', u, mutate),
            it.baseplate.shape === PLATE_SHAPE.ROUND ? null : bpNum(it, 'N', 'Plate depth N', 'length', u, mutate),
            bpNum(it, 'grout', 'Grout thickness', 'length', u, mutate),
            bpNum(it, 'fyPlate', 'Plate yield strength', 'stress', u, mutate),
            bpNum(it, 'pedB', 'Pedestal width', 'length', u, mutate),
            bpNum(it, 'pedN', 'Pedestal depth', 'length', u, mutate),
            bpAnchor(it, 'n', 'Number of anchors', null, u, mutate),
            bpAnchor(it, 'dia', 'Anchor diameter', 'length', u, mutate),
            bpAnchor(it, 'futa', 'Anchor tensile strength f_uta', 'stress', u, mutate),
            bpAnchor(it, 'hef', 'Effective embedment h_ef', 'length', u, mutate),
            bpAnchor(it, 'edge', 'Smallest edge distance', 'length', u, mutate),
            bpAnchor(it, 'spacing', 'Anchor spacing', 'length', u, mutate),
            bpAction(it, 'NEd', 'Compression at the base', 'force', u, mutate),
            bpAction(it, 'upliftEd', 'Net uplift on the anchors', 'force', u, mutate),
            bpAction(it, 'VEd', 'Shear at the base', 'force', u, mutate),
            bpAction(it, 'MEd', 'Moment at the base', 'moment', u, mutate),
            )) }),

        fold({ key: 'cfst.fire', title: 'Fire', body:
          h('div', null,
            checkRow({
              id: 'fire-required', checked: it.fire.required,
              label: 'Fire design is required for this member',
              hint: it.fire.required
                ? 'Fire resistance is verified separately; the item stays incomplete until it is resolved.'
                : 'State below why fire design does not apply. Without a reason the item stays incomplete.',
              onChange: (v) => mutate((x) => ({ ...x, fire: { ...x.fire, required: v } }), {
                audit: {
                  kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                  field: 'fire.required', from: it.fire.required, to: v,
                  reason: v ? 'Fire design reinstated.' : 'Fire design declared not required.',
                  actor: app.actorName(),
                },
              }),
            }),
            it.fire.required ? null : field({
              label: 'Why fire design is not required', id: 'fire-reason', span: true, required: true,
              error: String(it.fire.reason || '').trim() ? null : 'A written basis is required before this item can read as satisfactory.',
              hint: 'This prints on the calculation sheet as a recorded engineering decision, with your name against it.',
              control: textArea({
                id: 'fire-reason', value: it.fire.reason, rows: 3,
                placeholder: 'For example: open basement, below the threshold for a fire rating under the project fire strategy.',
                onInput: (v) => { it.fire.reason = v; },
              }),
            }),
            it.fire.required ? null : button('Record this decision', {
              small: true,
              onClick: () => {
                const reason = String(item().fire.reason || '').trim();
                if (!reason) { toast('State the basis first.', 'err'); return; }
                mutate((x) => ({ ...x, fire: { ...x.fire, reason } }), {
                  audit: {
                    kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                    field: 'fire.reason', from: null, to: reason,
                    reason, actor: app.actorName(),
                  },
                });
                toast('Decision recorded and logged.', 'ok');
              },
            }),
          ) }),
        fold({ key: 'cfst.code', title: 'Design code and status', body:
          h('div', { class: 'tg-grid' },
            field({
              label: 'Design code', id: 'in-code',
              hint: 'Changing the code re-runs every check and keeps any assumption you have justified.',
              control: select({
                id: 'in-code', value: it.code,
                options: app.registry.options({ slot: 'composite' }).map((gr) => ({
                  group: gr.family, options: gr.codes.map((c) => ({ value: c.id, label: c.id })),
                })),
                onChange: changeCode,
              }),
            }),
            field({
              label: 'Status', id: 'in-status',
              hint: statusHint(app, it),
              control: select({
                id: 'in-status', value: it.status,
                options: STATUS_ORDER.filter((x) => allowedStatus(app, it, x)).map((x) => ({ value: x, label: x })),
                onChange: (v) => mutate((x) => ({ ...x, status: v }), {
                  audit: { kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id, field: 'status', from: it.status, to: v },
                }),
              }),
            }),
            field({
              label: 'Designer', id: 'in-designer',
              control: app.people.length
                ? select({ id: 'in-designer', value: it.designer, placeholder: 'Not assigned', options: peopleOptions(app.people), onChange: (v) => mutate((x) => ({ ...x, designer: v })) })
                : textInput({ id: 'in-designer', value: it.designer, onChange: (v) => mutate((x) => ({ ...x, designer: v })) }),
            }),
            field({
              label: 'Checker', id: 'in-checker',
              hint: it.designer && it.checker && it.designer === it.checker
                ? 'The checker and the designer are the same person. Independent checking is required before issue.'
                : null,
              control: app.people.length
                ? select({ id: 'in-checker', value: it.checker, placeholder: 'Not assigned', options: peopleOptions(app.people).filter((o) => o.value !== it.designer), onChange: (v) => mutate((x) => ({ ...x, checker: v })) })
                : textInput({ id: 'in-checker', value: it.checker, onChange: (v) => mutate((x) => ({ ...x, checker: v })) }),
            }),
          ) }),
      ),
    });

    /* ---------- checks ---------- */
    const checksTable = table({
      caption: 'Verification summary',
      columns: [
        { label: 'Check', render: (c) => c.title },
        { label: 'Code and clause', ident: true, width: '190px', render: (c) => (c.clause ? `${c.code} §${c.clause}` : (c.code || '—')) },
        { label: 'Required', align: 'right', render: (c) => (c.demand === null ? '—' : fmt(c.demand, c.dimension, u)) },
        { label: 'Available', align: 'right', render: (c) => (c.capacity === null ? '—' : fmt(c.capacity, c.dimension, u)) },
        { label: 'U', align: 'right', width: '70px', render: (c) => (Number.isFinite(c.utilisation) ? formatNumber(c.utilisation, 3) : '—') },
        { label: 'Result', width: '120px', render: (c) => chip(c.status, CHECK_KIND[c.status] || 'neutral') },
      ],
      rows: res ? res.checks : [],
      empty: 'No checks have been run.',
    });

    const blockedNotes = res ? res.checks.filter((c) => c.note) : [];

    const checksSheet = sheet({
      title: 'Checks',
      lede: 'Required against available, with the clause each capacity came from.',
      actions: [button(showSteps ? 'Hide working' : 'Show working', { variant: 'ghost', small: true, onClick: () => { showSteps = !showSteps; render(); } })],
      body: h('div', null,
        checksTable,
        blockedNotes.length ? h('div', { style: { display: 'grid', gap: '8px', marginTop: '12px' } },
          blockedNotes.map((c) => note({
            variant: c.status === CHECK_STATUS.NOT_COVERED ? 'code' : c.status === CHECK_STATUS.FAIL ? 'danger' : 'caution',
            title: `${c.title} — ${c.code}${c.clause ? ` §${c.clause}` : ''}`,
            body: c.note,
          }))) : null,
        showSteps && res ? stepsTable(res, u) : null,
      ),
    });

    /* ---------- assumptions ---------- */
    const assumptions = sheet({
      title: 'Assumptions',
      lede: 'Generated automatically, editable, and recalculated the moment they change. A reason is required and is written to the change log.',
      body: table({
        columns: [
          { label: 'Assumption', render: (a) => h('div', null,
            h('div', { style: { fontWeight: 600 } }, a.label),
            h('div', { style: { fontSize: '11.5px', color: 'var(--tg-ink-40)' } }, a.basis)) },
          { label: 'Value', width: '170px', render: (a) => (a.options
            ? select({ id: `asm-${a.key}`, value: String(a.value), options: a.options.map((o) => ({ value: o, label: o })), onChange: (v) => editAssumption(a, v) })
            : numberInput({
              id: `asm-${a.key}`,
              value: a.dimension ? fromBase(a.value, a.dimension, u) : a.value,
              onCommit: (v) => editAssumption(a, a.dimension ? toBase(v, a.dimension, u) : v),
            })) },
          { label: 'Units', width: '70px', ident: true, render: (a) => (a.dimension ? symbolFor(u, a.dimension) : '—') },
          { label: 'Source', width: '90px', render: (a) => chip(a.source === SOURCE.USER ? 'Edited' : 'Auto', a.source === SOURCE.USER ? 'caution' : 'neutral') },
          { label: 'Reason for change', render: (a) => a.reason || '—' },
          { label: '', width: '80px', render: (a) => (a.source === SOURCE.USER
            ? button('Reset', { small: true, variant: 'quiet', onClick: () => {
              mutate((x) => ({ ...x, assumptions: resetAssumption(x.assumptions, a.key, x, x.code) }), {
                audit: { kind: AUDIT_KINDS.ASSUMPTION_CHANGED, entity: itemLabel(it), entityId: it.id, field: `assumptions.${a.key}`, from: a.value, to: 'default', reason: 'Reset to the generated default.', actor: it.designer || 'unattributed' },
              });
            } })
            : '') },
        ],
        rows: it.assumptions || [],
        empty: 'No assumptions generated.',
      }),
    });

    host.replaceChildren(verdict, inputs, checksSheet, assumptions);
  }

  if (!item().result) recalc();
  render();
  return host;
}

function bpNum(it, key, label, dimension, u, mutate) {
  return field({
    label: dimension ? `${label} (${symbolFor(u, dimension)})` : label, id: `bp-${key}`, ident: true,
    control: numberInput({
      id: `bp-${key}`, value: fromBase(it.baseplate[key], dimension, u), min: 0,
      onCommit: (v) => mutate((x) => ({ ...x, baseplate: { ...x.baseplate, [key]: toBase(v, dimension, u) } })),
    }),
  });
}

function bpAnchor(it, key, label, dimension, u, mutate) {
  const raw = it.baseplate.anchors[key];
  return field({
    label: dimension ? `${label} (${symbolFor(u, dimension)})` : label, id: `bpa-${key}`, ident: true,
    control: numberInput({
      id: `bpa-${key}`, value: dimension ? fromBase(raw, dimension, u) : raw, min: 0,
      onCommit: (v) => mutate((x) => ({ ...x, baseplate: { ...x.baseplate, anchors: { ...x.baseplate.anchors, [key]: dimension ? toBase(v, dimension, u) : v } } })),
    }),
  });
}

function bpAction(it, key, label, dimension, u, mutate) {
  return field({
    label: `${label} (${symbolFor(u, dimension)})`, id: `bpx-${key}`, ident: true,
    control: numberInput({
      id: `bpx-${key}`, value: fromBase(it.baseplate.actions[key], dimension, u),
      onCommit: (v) => mutate((x) => ({ ...x, baseplate: { ...x.baseplate, actions: { ...x.baseplate.actions, [key]: toBase(v, dimension, u) } } })),
    }),
  });
}

function matField(it, key, label, u, mutate) {
  return field({
    label: `${label} (${symbolFor(u, 'stress')})`, id: `mat-${key}`, ident: true,
    control: numberInput({
      id: `mat-${key}`, value: fromBase(it.materials[key], 'stress', u), min: 0,
      onCommit: (v) => mutate((x) => ({ ...x, materials: { ...x.materials, [key]: toBase(v, 'stress', u) } })),
    }),
  });
}

function fmt(v, dim, u) {
  if (v === null || v === undefined) return '—';
  if (!dim) return formatNumber(v, 3);
  return formatWithUnit(v, dim, u);
}

function stepsTable(res, u) {
  return h('div', { style: { marginTop: '16px' } },
    table({
      caption: 'Working — every line names its source',
      columns: [
        { label: 'Symbol', ident: true, width: '120px', render: (s) => s.symbol },
        { label: 'Description', render: (s) => h('div', null,
          h('div', null, s.description),
          s.expression ? h('div', { class: 'tg-ident', style: { fontSize: '11.5px', color: 'var(--tg-ink-60)' } }, s.expression) : null,
          s.substitution ? h('div', { class: 'tg-ident', style: { fontSize: '11.5px', color: 'var(--tg-ink-40)' } }, s.substitution) : null,
          s.note ? h('div', { style: { fontSize: '11.5px', color: 'var(--tg-caution)' } }, s.note) : null) },
        { label: 'Value', align: 'right', width: '150px', render: (s) => (s.value === null ? '—' : fmt(s.value, s.dimension, u)) },
        { label: 'Source', ident: true, width: '180px', render: (s) => (s.kind === STEP_KIND.DERIVED
          ? 'derived from the above'
          : s.kind === STEP_KIND.NOTICE ? `${s.code} §${s.clause}` : `${s.code} §${s.clause}`) },
      ],
      rows: res.steps,
      empty: 'No steps.',
    }),
  );
}

/**
 * Which statuses this person may set. A designer can move work forward to
 * "for check" but cannot sign it off, and nobody signs a check on their own
 * design. The control simply does not offer what the role may not do.
 */
function allowedStatus(app, item, status) {
  if (!app.people.length || !app.currentUser) return true;
  if (status === ITEM_STATUS.DRAFT || status === ITEM_STATUS.FOR_CHECK) return true;
  if (status === ITEM_STATUS.SUPERSEDED) return app.can('editItems') || app.can('approve');
  if (status === ITEM_STATUS.CHECKED) return canCheckItem(app.currentUser, item).allowed;
  if (status === ITEM_STATUS.APPROVED) return app.can('approve');
  return true;
}

function statusHint(app, item) {
  if (!app.people.length) return 'Add engineers to the register to attribute checks and approvals.';
  if (!app.currentUser) return 'No engineer is signed in, so every status is offered and changes are recorded as unattributed.';
  const verdict = canCheckItem(app.currentUser, item);
  if (!verdict.allowed) return verdict.reason;
  return `Signed in as ${app.currentUser.name} — ${app.currentUser.role}.`;
}

/** A labelled checkbox with the explanation sitting under it. */
function checkRow({ id, checked, label, hint, onChange }) {
  const box = h('input', { id, type: 'checkbox', checked });
  box.addEventListener('change', () => onChange(box.checked));
  return h('div', { class: 'tg-check' },
    h('label', { class: 'tg-check__line', for: id }, box, h('span', null, label)),
    hint ? h('div', { class: 'tg-check__hint' }, hint) : null,
  );
}

// ui/screens/sheet.js — the calculation sheet preview.


function sheetScreen(app, itemId) {
  const item = app.store.state.project.items.find((i) => i.id === itemId);
  if (!item) return h('p', null, 'This item no longer exists.');

  const res = item.result;
  const unsafe = res && res.summary.overall !== OVERALL.SAFE;

  const toolbar = h('div', { class: 'cs-toolbar' },
    button('Back to design', { variant: 'quiet', small: true, onClick: () => app.openItem(itemId) }),
    button('Print or save as PDF', { onClick: () => window.print() }),
    button('Export to spreadsheet', { variant: 'ghost', small: true, onClick: () => { exportItemCsv(app, item); toast('Spreadsheet exported.', 'ok'); } }),
    button('Export result as JSON', { variant: 'ghost', small: true, onClick: () => { exportItemJson(app, item); toast('Result exported.', 'ok'); } }),
    h('span', { class: 'tg-muted', style: { fontSize: '12px', marginLeft: 'auto' } },
      'Print at A4, 100% scale, background graphics on.'),
  );

  const warning = unsafe
    ? h('div', { style: { maxWidth: '210mm', margin: '0 auto 14px' } }, note({
      variant: res.summary.overall === OVERALL.UNSAFE ? 'danger' : 'code',
      title: `This sheet records a ${res.summary.overall} result`,
      body: 'It may be issued as a record of the check carried out, but it does not demonstrate an adequate design. Resolve the failing or uncovered checks before issuing for construction.',
    }))
    : null;

  return h('div', null, toolbar, warning, renderCalcSheet(app, item));
}

// ui/screens/compare.js — what changed when a project was recalculated.
//
// Recalculating on a newer platform version is never silent. This screen is
// shown immediately afterwards so the engineer sees which numbers moved before
// signing the new revision.


const VERDICT_KIND = {
  [OVERALL.SAFE]: 'safe',
  [OVERALL.UNSAFE]: 'unsafe',
  [OVERALL.INCOMPLETE]: 'caution',
};

function compareScreen(app) {
  const p = app.store.state.project;
  const diffs = app.lastComparison || [];

  if (!diffs.length) {
    return sheet({
      title: 'Version comparison',
      body: note({
        title: 'Nothing to compare',
        body: 'This project has not been recalculated on a different platform version.',
      }),
      foot: [button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') })],
    });
  }

  const anyChange = diffs.some((d) => d.diff.changed);
  const verdictChanges = diffs.filter((d) => d.diff.verdictChanged);

  const header = sheet({
    title: 'What changed in this recalculation',
    lede: `Every design item was recalculated from v${diffs[0].diff.beforeVersion || '—'} to v${diffs[0].diff.afterVersion}. The project was raised to revision ${p.revision}.`,
    actions: [
      button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') }),
      button('Open design items', { variant: 'ghost', small: true, onClick: () => app.navigate('items') }),
    ],
    body: h('div', null,
      anyChange
        ? note({
          variant: verdictChanges.length ? 'danger' : 'caution',
          title: verdictChanges.length
            ? `${verdictChanges.length} item${verdictChanges.length > 1 ? 's' : ''} changed verdict`
            : 'Numbers moved, but no verdict changed',
          body: verdictChanges.length
            ? 'Review these before signing the new revision. A sheet already issued under the previous revision remains valid as a record of what was checked at that time.'
            : 'The utilisation figures below moved. The overall verdict for every item is unchanged.',
          list: verdictChanges.map((d) => `${itemLabel(d.item)} — ${d.diff.beforeOverall} → ${d.diff.afterOverall}`),
        })
        : note({
          variant: 'code',
          title: 'No numbers changed',
          body: 'This platform version produces identical results for every check in this project. The new revision records the recalculation; the values are the same.',
        }),
    ),
  });

  const perItem = diffs.map(({ item, diff }) => sheet({
    title: itemLabel(item),
    lede: `${diff.beforeOverall} → ${diff.afterOverall}`,
    actions: [
      chip(`v${diff.beforeVersion || '—'}`, 'neutral'),
      chip(`v${diff.afterVersion}`, VERDICT_KIND[diff.afterOverall] || 'neutral'),
      button('Open', { variant: 'quiet', small: true, onClick: () => app.openItem(item.id) }),
    ],
    body: table({
      caption: diff.changed ? 'Rows that moved are marked' : 'No row changed',
      columns: [
        { label: 'Check', render: (r) => h('div', null,
          h('div', null, r.title),
          r.note ? h('div', { style: { fontSize: '11.5px', color: 'var(--tg-caution)' } }, r.note) : null) },
        { label: 'Clause', ident: true, width: '170px', render: (r) => (r.clause ? `${r.code} §${r.clause}` : (r.code || '—')) },
        { label: 'Was', align: 'right', width: '90px', render: (r) => fmtU(r.utilBefore) },
        { label: 'Now', align: 'right', width: '90px', render: (r) => fmtU(r.utilAfter) },
        { label: 'Capacity was', align: 'right', render: (r) => fmtCap(r.capacityBefore, r.dimension, p.units) },
        { label: 'Capacity now', align: 'right', render: (r) => fmtCap(r.capacityAfter, r.dimension, p.units) },
        { label: '', width: '96px', render: (r) => (r.moved ? chip('Changed', 'caution') : '') },
      ],
      rows: diff.rows,
    }),
  }));

  return h('div', null, header, ...perItem);
}

function fmtU(v) {
  return Number.isFinite(v) ? formatNumber(v, 3) : '—';
}

function fmtCap(v, dim, units) {
  if (v === null || v === undefined) return '—';
  return dim ? formatWithUnit(v, dim, units) : formatNumber(v, 3);
}

// ui/screens/people.js — the office register.


const ROLE_KIND = {
  [ROLE.LEAD]: 'caution',
  [ROLE.DESIGNER]: 'neutral',
  [ROLE.CHECKER]: 'safe',
  [ROLE.APPROVER]: 'safe',
  [ROLE.VIEWER]: 'neutral',
};

function peopleScreen(app) {
  const host = h('div');

  function people() { return app.people; }

  function add() {
    app.people = [...app.people, newPerson({ name: '', role: ROLE.DESIGNER })];
    render();
  }

  function update(id, key, value) {
    app.people = app.people.map((p) => {
      if (p.id !== id) return p;
      const next = { ...p, [key]: value };
      if (key === 'name') next.initials = initials(value);
      return next;
    });
    if (app.currentUser && app.currentUser.id === id) {
      app.currentUser = app.people.find((p) => p.id === id);
    }
    render();
  }

  function remove(id) {
    const person = app.people.find((p) => p.id === id);
    if (app.currentUser && app.currentUser.id === id) {
      toast('You cannot remove the person currently working.', 'err');
      return;
    }
    app.people = app.people.filter((p) => p.id !== id);
    app.audit.append({
      kind: AUDIT_KINDS.TEAM_CHANGED, entity: 'Office register',
      field: 'people', from: person ? person.name : null, to: null,
      actor: app.currentUser ? app.currentUser.name : 'unattributed',
    });
    render();
  }

  function signIn(id) {
    const person = app.people.find((p) => p.id === id) || null;
    const before = app.currentUser ? app.currentUser.name : null;
    app.currentUser = person;
    app.audit.append({
      kind: AUDIT_KINDS.TEAM_CHANGED, entity: 'Session', field: 'currentUser',
      from: before, to: person ? person.name : null,
      actor: person ? person.name : 'unattributed',
    });
    app.render();
  }

  function paint() {
    const list = people();
    const me = app.currentUser;

    const whoIsWorking = sheet({
      title: 'Who is working',
      lede: 'Your name is attached to every change you make and prints on every sheet you produce.',
      body: h('div', null,
        list.length
          ? h('div', { class: 'tg-grid', style: { maxWidth: '520px' } },
            field({
              label: 'Signed in as', id: 'who-am-i',
              hint: me ? `Role: ${me.role}` : 'Until you choose a name, changes are recorded as "unattributed".',
              control: select({
                id: 'who-am-i',
                value: me ? me.id : '',
                placeholder: 'Not signed in',
                options: list.filter((p) => p.active).map((p) => ({ value: p.id, label: `${p.name || '(unnamed)'} — ${p.role}` })),
                onChange: signIn,
              }),
            }),
          )
          : emptyState({
            title: 'The register is empty',
            body: 'Add the engineers in the office. Each one gets a role that decides which actions they are offered.',
            actions: [button('Add the first engineer', { onClick: add })],
          }),
        me ? permissionSummary(me) : null,
      ),
    });

    const register = sheet({
      title: 'Office register',
      lede: 'Held with the platform, not with the project, so names do not have to be retyped for every job.',
      actions: [button('Add engineer', { onClick: add })],
      body: h('div', null,
        table({
          columns: [
            { label: 'Name', render: (p) => textInput({ id: `per-${p.id}-name`, value: p.name, placeholder: 'Full name', onInput: (v) => update(p.id, 'name', v) }) },
            { label: 'Initials', width: '86px', render: (p) => textInput({ id: `per-${p.id}-ini`, value: p.initials, onInput: (v) => update(p.id, 'initials', v.toUpperCase()) }) },
            { label: 'Role', width: '175px', render: (p) => select({ id: `per-${p.id}-role`, value: p.role, options: ROLES.map((r) => ({ value: r, label: r })), onChange: (v) => update(p.id, 'role', v) }) },
            { label: 'Title', render: (p) => textInput({ id: `per-${p.id}-title`, value: p.title, placeholder: 'Structural engineer', onInput: (v) => update(p.id, 'title', v) }) },
            { label: 'Status', width: '110px', render: (p) => (app.currentUser && app.currentUser.id === p.id
              ? chip('Working now', 'safe')
              : chip(p.role, ROLE_KIND[p.role] || 'neutral')) },
            { label: '', width: '86px', render: (p) => button('Remove', { small: true, variant: 'quiet', onClick: () => remove(p.id) }) },
          ],
          rows: list,
          empty: 'No engineers in the register.',
        }),
        note({
          variant: 'code',
          title: 'This is accountability, not a lock',
          body: 'There is no password. A program that runs entirely in the browser cannot enforce one, and pretending otherwise would be worse than being clear about it. What this does give you is a name against every change, the right names printed on every sheet, and controls that are not offered to the wrong role.',
        }),
      ),
    });

    host.replaceChildren(whoIsWorking, register);
  }

  function render() { preserveFocus(paint); }
  render();
  return host;
}

function permissionSummary(person) {
  const p = PERMISSIONS[person.role] || {};
  const rows = [
    ['Edit project details', p.editProject],
    ['Edit design items', p.editItems],
    ['Sign a check', p.check],
    ['Approve for issue', p.approve],
    ['Manage the register', p.managePeople],
  ];
  return h('div', { style: { marginTop: '14px' } },
    table({
      caption: `What ${person.name || 'this role'} can do`,
      columns: [
        { label: 'Action', render: (r) => r[0] },
        { label: '', width: '110px', render: (r) => chip(r[1] ? 'Allowed' : 'Not offered', r[1] ? 'safe' : 'neutral') },
      ],
      rows,
    }),
    person.role === ROLE.CHECKER || person.role === ROLE.APPROVER
      ? note({ title: 'Independent checking', body: 'You will not be offered the check action on an item you designed yourself.' })
      : null,
  );
}

// ui/screens/quick.js — the quick design gateway.
//
// A way into a calculation without first creating a project, naming a client
// and filling a register. It exists for reviewing an element, not for issuing
// work: what it produces is stamped FOR REVIEW ONLY and can be turned into a
// real project in one step if it turns out to matter.


function quickScreen(app) {
  const host = h('div');
  let query = '';
  let country = app.quickCountry || DEFAULT_JURISDICTION;

  function start(element) {
    if (!element.available) {
      toast(`${element.short} is not built yet.`, 'err');
      return;
    }
    const j = jurisdiction(country);
    const project = createProject({
      name: `Quick design — ${element.short}`,
      client: '—',
      country,
      units: app.units,
      codes: { ...j.codes },
      quick: true,
      stage: 'Concept',
      revisionNote: 'Quick design for review',
    });
    const item = createItem({
      number: nextItemNumber([], 'Q'),
      name: element.short,
      category: element.category,
      code: j.codes.composite || element.codes[0],
      designer: app.currentUser ? app.currentUser.name : '',
    });
    item.assumptions = generateAssumptions(item, item.code);
    project.items = [item];

    app.quickCountry = country;
    app.store.replace({ project });
    app.audit.append({
      kind: AUDIT_KINDS.ITEM_CREATED,
      entity: `Quick design — ${element.short}`,
      entityId: item.id,
      to: `${element.short} to ${item.code} (${j.label})`,
      actor: app.actorName(),
    });
    app.openItem(item.id);
  }

  function paint() {
    const results = searchElements(query);
    const j = jurisdiction(country);

    const controls = h('div', { class: 'tg-grid tg-grid--2', style: { maxWidth: '760px' } },
      field({
        label: 'Search for an element', id: 'quick-search',
        hint: 'Type in English or Arabic: column, composite, footing, عمود, قاعدة.',
        control: textInput({
          id: 'quick-search', value: query, placeholder: 'composite column',
          onInput: (v) => { query = v; render(); },
        }),
      }),
      field({
        label: 'Country', id: 'quick-country',
        hint: 'Sets the design codes for this calculation. Nothing else is needed.',
        control: select({
          id: 'quick-country', value: country,
          options: jurisdictionOptions(),
          onChange: (v) => { country = v; render(); },
        }),
      }),
    );

    const cards = results.length
      ? h('div', { class: 'tg-cards' }, results.map((e) => h('div', {
        class: `tg-card${e.available ? '' : ' tg-card--soon'}`,
      },
        h('div', { class: 'tg-card__head' },
          h('h3', null, e.name),
          e.available ? chip('Ready', 'safe') : chip('Not built yet', 'neutral')),
        h('p', { class: 'tg-card__body' }, e.summary),
        h('div', { class: 'tg-card__codes' }, e.codes.join(' · ')),
        h('div', { class: 'tg-card__foot' },
          e.available
            ? button(`Design to ${j.codes.composite || e.codes[0]}`, { small: true, onClick: () => start(e) })
            : button('Not available', { small: true, variant: 'quiet', disabled: true })),
      )))
      : emptyState({
        title: 'Nothing matches that',
        body: 'Try a shorter word, or clear the search to see everything the platform covers.',
        actions: [button('Show everything', { variant: 'ghost', onClick: () => { query = ''; render(); } })],
      });

    host.replaceChildren(sheet({
      title: 'Quick design',
      lede: 'Go straight to a calculation. No project, no client, no register — pick the element and the country and start.',
      actions: [
        h('div', { style: { minWidth: '210px' } }, field({
          label: 'Units', id: 'quick-units',
          control: select({
            id: 'quick-units', value: app.units,
            options: systemList().map((s) => ({ value: s.id, label: s.label })),
            onChange: (v) => { app.setUnits(v); render(); },
          }),
        })),
      ],
      body: h('div', null,
        controls,
        h('hr', { class: 'tg-hr' }),
        cards,
        note({
          variant: 'code',
          title: 'For review, not for issue',
          body: 'A quick design carries no client, job number or checker, so its calculation sheet prints FOR REVIEW ONLY. If the work needs to be issued, turn it into a project from the button on the design screen; nothing is lost when you do.',
        }),
      ),
    }));
  }

  function render() { preserveFocus(paint); }
  render();
  return host;
}

/**
 * Promote a quick design to a real project, keeping the element exactly as it
 * is. Nothing is recalculated; only the record around it changes.
 */
function convertQuickToProject(app) {
  const p = app.store.state.project;
  if (!p || !p.quick) return;
  app.store.update((s) => {
    s.project.quick = false;
    s.project.name = '';
    s.project.client = '';
    s.project.revisionNote = 'First issue';
    s.project.stage = 'Detailed design';
    s.project.items = s.project.items.map((it, i) => ({ ...it, number: `C-${String(i + 1).padStart(2, '0')}` }));
  });
  app.audit.append({
    kind: AUDIT_KINDS.PROJECT_FIELD, entity: 'Project', entityId: p.id,
    field: 'quick', from: true, to: false,
    reason: 'Quick design promoted to a project.', actor: app.actorName(),
  });
  toast('Now a project. Fill in the client and revision before issuing.', 'ok');
  app.navigate('project');
}

// ui/screens/overview.js — the project record as a drawing title block.


function overviewScreen(app) {
  const p = app.store.state.project;
  const att = titleBlockAttribution(p);
  const advisories = projectAdvisories(p);

  const tb = titleBlock({
    heading: 'PROJECT TITLE BLOCK',
    right: [chip(p.stage, 'neutral')],
    cells: [
      { label: 'PROJECT', value: p.name, wide: true },
      { label: 'JOB No.', value: p.number, ident: true },
      { label: 'REV', value: p.revision, ident: true },
      { label: 'CLIENT', value: p.client, wide: true },
      { label: 'CONSULTANT', value: p.consultant, wide: true },
      { label: 'CONTRACTOR', value: p.contractor },
      { label: 'LOCATION', value: p.location },
      { label: 'ISSUE DATE', value: p.revisionDate, ident: true },
      { label: 'UNITS', value: UNIT_SYSTEMS[p.units]?.label || p.units },
      { label: 'DESIGNED', value: att.designed, ident: true },
      { label: 'CHECKED', value: att.checked, ident: true },
      { label: 'APPROVED', value: att.approved, ident: true },
      { label: 'REASON FOR ISSUE', value: p.revisionNote },
      { label: 'PLATFORM', value: `v${p.platformVersion || PLATFORM_VERSION}`, ident: true },
    ],
  });

  const codeRows = CODE_SLOTS.map((slot) => {
    const id = (p.codes || {})[slot.key];
    const code = id ? app.registry.get(id) : null;
    return { slot, id, code };
  });

  const codeTable = table({
    caption: 'Design basis',
    columns: [
      { label: 'Discipline', render: (r) => r.slot.label },
      { label: 'Code', ident: true, render: (r) => (r.id || '—') },
      { label: 'Edition', render: (r) => (r.code ? r.code.edition : '') },
      { label: 'Basis', render: (r) => (r.code ? chip(r.code.philosophy || '—', 'neutral') : '') },
    ],
    rows: codeRows,
    empty: 'No design codes set.',
  });

  const unverified = codeRows.filter((r) => r.code && r.code.verifyEdition).map((r) => r.id);

  const recent = app.audit.list().slice(0, 8);
  const logTable = table({
    caption: 'Recent changes',
    columns: [
      { label: 'When', ident: true, render: (e) => e.ts.replace('T', ' ').slice(0, 16) },
      { label: 'What', render: (e) => (e.field ? e.field : e.kind) },
      { label: 'From', render: (e) => valueText(e.from) },
      { label: 'To', render: (e) => valueText(e.to) },
      { label: 'By', render: (e) => e.actor },
    ],
    rows: recent,
    empty: 'No changes recorded yet.',
  });

  /**
   * Recalculate every item on the current platform version.
   * This is deliberately an explicit act: it raises a new project revision,
   * stamps the new version, and hands back a line-by-line comparison. The
   * previously issued revision and its sheets are untouched.
   */
  function onRecalculateOnCurrentVersion() {
    const from = p.platformVersion || '(unrecorded)';
    const ok = window.confirm(
      `Recalculate every design item on platform v${PLATFORM_VERSION}?\n\n`
      + `This project was last calculated on v${from}.\n\n`
      + 'A new project revision will be raised and you will be shown exactly which numbers moved. '
      + 'Sheets already issued under the current revision are not altered.',
    );
    if (!ok) return;

    const comparison = [];
    app.store.update((s) => {
      s.project.items = s.project.items.map((it) => {
        const before = snapshotResult(it.result, it.result ? (it.result.platformVersion || from) : from);
        const after = runDesign(app.registry, it);
        comparison.push({ item: it, diff: diffResults(before, after) });
        return {
          ...reviseItem(it, `Recalculated on platform v${PLATFORM_VERSION}`),
          previousResult: before,
          result: after,
        };
      });
      const r = issueRevision(s.project, { note: `Recalculated on platform v${PLATFORM_VERSION}` });
      s.project.platformVersion = PLATFORM_VERSION;
      app.audit.append({
        kind: AUDIT_KINDS.REVISION_ISSUED,
        entity: 'Project', entityId: s.project.id, field: 'platformVersion',
        from, to: PLATFORM_VERSION,
        reason: `Recalculated on platform v${PLATFORM_VERSION}; revision ${r.from} superseded by ${r.to}.`,
      });
    });

    for (const { item, diff } of comparison) {
      app.audit.append({
        kind: AUDIT_KINDS.CALC_RUN,
        entity: itemLabel(item), entityId: item.id, field: 'result',
        from: `${diff.beforeOverall} (v${diff.beforeVersion || from})`,
        to: `${diff.afterOverall} (v${PLATFORM_VERSION})`,
        reason: diff.changed ? 'Values changed on the new platform version.' : 'No values changed.',
      });
    }

    app.lastComparison = comparison;
    app.navigate('compare');
  }

  function onIssueRevision() {
    const reason = window.prompt('Reason for the new revision:', '');
    if (reason === null) return;
    let from; let to;
    app.store.update((s) => {
      const r = issueRevision(s.project, { note: reason });
      from = r.from; to = r.to;
    });
    app.audit.append({
      kind: AUDIT_KINDS.REVISION_ISSUED,
      entity: 'Project', entityId: p.id, field: 'revision',
      from, to, reason: reason || null,
    });
    app.render();
  }

  const revHistory = (p.revisionHistory || []).length
    ? table({
      caption: 'Revision history',
      columns: [
        { label: 'Rev', ident: true, render: (r) => r.revision },
        { label: 'Date', ident: true, render: (r) => r.date },
        { label: 'Reason for issue', render: (r) => r.note || '—' },
      ],
      rows: [...p.revisionHistory].reverse(),
    })
    : null;

  return h('div', null,
    sheet({
      title: p.name || 'Untitled project',
      lede: 'Everything printed by this platform inherits these details.',
      actions: [
        button('Edit details', { variant: 'ghost', onClick: () => app.navigate('project') }),
        button('Issue new revision', { onClick: onIssueRevision }),
      ],
      body: h('div', null,
        tb,
        versionBanner(app, p, onRecalculateOnCurrentVersion),
        advisories.length
          ? note({ variant: 'caution', title: 'Before issue', list: advisories })
          : null,
        h('hr', { class: 'tg-hr' }),
        codeTable,
        unverified.length
          ? note({
            variant: 'code',
            title: 'Code editions must be confirmed',
            body: 'This build ships edition strings for reference. Confirm them against the office controlled copies, including any National Annex, before the calculations are issued.',
            list: unverified,
          })
          : null,
        p.notes ? h('div', null,
          h('hr', { class: 'tg-hr' }),
          h('h3', { style: { fontSize: '13px', marginBottom: '6px' } }, 'Project notes'),
          h('p', { class: 'tg-muted', style: { whiteSpace: 'pre-wrap' } }, p.notes)) : null,
      ),
      foot: [clauseRef('Every calculated value in this platform prints its code and clause. Values without a clause are not produced.')],
    }),
    revHistory ? sheet({ title: 'Revisions', body: revHistory }) : null,
    sheet({
      title: 'Change log',
      lede: 'Append-only. Entries are never edited or deleted.',
      actions: [button('Open full log', { variant: 'quiet', small: true, onClick: () => app.navigate('log') })],
      body: logTable,
    }),
  );
}

function valueText(v) {
  if (v === null || v === undefined || v === '') return '(empty)';
  return String(v);
}

/**
 * Shown when the open project was calculated on an older platform version.
 * The project is NOT recalculated automatically: doing so would change numbers
 * under a revision that may already have been issued and signed.
 */
function versionBanner(app, p, onRecalculate) {
  const stored = p.platformVersion;
  if (!stored) return null;
  if (!isOlderThanCurrent(stored)) return null;
  return h('div', null,
    note({
      variant: 'caution',
      title: `This project was calculated on platform v${stored}. This build is v${PLATFORM_VERSION}.`,
      body: 'The results shown are the ones produced by the older version and have been left exactly as they were, so any sheet already issued still reproduces. Recalculating raises a new revision and shows you every number that moved.',
    }),
    h('div', { class: 'tg-row', style: { margin: '8px 0 4px' } },
      button(`Recalculate on v${PLATFORM_VERSION} and raise a new revision`, { onClick: onRecalculate }),
      app.lastComparison && app.lastComparison.length
        ? button('View the last comparison', { variant: 'quiet', small: true, onClick: () => app.navigate('compare') })
        : null),
  );
}

// ui/screens/codes.js — the installed code library and its coverage.
//
// This screen exists so the coverage question is answered before design starts,
// not discovered halfway through a calculation. It reads entirely from the
// registry; adding a code file makes it appear here with no change to this file.


const COVERAGE_CHIP = {
  [COVERAGE.COVERED]: ['Engine installed', 'safe'],
  [COVERAGE.DECLARED]: ['Clause declared', 'caution'],
  [COVERAGE.NOT_COVERED]: ['Not covered', 'notcov'],
  [COVERAGE.UNKNOWN]: ['Silent', 'neutral'],
};

function codesScreen(app, state = {}) {
  let selectedId = state.selected || app.store.state.project?.codes?.composite || 'EN 1994-1-1';
  const host = h('div');

  function render() { preserveFocus(paint); }

  function paint() {
    const families = app.registry.families();
    const all = app.registry.list();

    const library = table({
      caption: `${all.length} codes installed`,
      columns: [
        { label: 'Code', ident: true, render: (c) => c.id },
        { label: 'Title', render: (c) => c.title },
        { label: 'Edition', render: (c) => c.edition },
        { label: 'Basis', render: (c) => c.philosophy || '—' },
        { label: 'CFST', render: (c) => cfstVerdict(app, c.id) },
      ],
      rows: families.flatMap((f) => f.codes),
    });

    const chosen = app.registry.get(selectedId);
    const matrixRows = CFST_CHECK_SEQUENCE.map((cap) => {
      const r = app.registry.resolve(cap, selectedId);
      return { cap, r };
    });

    const matrix = table({
      caption: chosen ? `Coverage of ${chosen.id} for concrete-filled tubular columns` : 'Select a code',
      columns: [
        { label: 'Design check', render: ({ cap }) => capLabel(cap) },
        { label: 'Status', width: '150px', render: ({ r }) => {
          const [label, kind] = COVERAGE_CHIP[r.status] || COVERAGE_CHIP[COVERAGE.UNKNOWN];
          return chip(label, kind);
        } },
        { label: 'Clause', ident: true, width: '130px', render: ({ r }) => r.clause || '—' },
        { label: 'Note', render: ({ r }) => (r.note ? h('span', { class: 'tg-muted' }, r.note) : (r.clauseTitle || '')) },
      ],
      rows: matrixRows,
    });

    const notCoveredCount = matrixRows.filter(({ r }) => r.status !== COVERAGE.COVERED && r.status !== COVERAGE.DECLARED).length;

    host.replaceChildren(
      sheet({
        title: 'Design codes',
        lede: 'Codes are plug-in modules. Adding one is a new file and one line in codes/index.js — the calculation engine is not touched.',
        body: h('div', null,
          library,
          note({
            variant: 'code',
            title: 'How coverage is decided',
            body: 'A code either publishes a provision for a check or it does not. Where it does not, this platform states so and produces no number. No formula is carried across from another code, and no default is assumed.',
          }),
        ),
      }),
      sheet({
        title: 'Coverage matrix',
        lede: 'What a chosen code can and cannot verify for a filled composite column.',
        actions: [
          h('div', { style: { minWidth: '260px' } }, field({
            label: 'Code', id: 'cov-code',
            control: select({
              id: 'cov-code',
              value: selectedId,
              options: app.registry.families().map((f) => ({
                group: f.family,
                options: f.codes.map((c) => ({ value: c.id, label: c.id })),
              })),
              onChange: (v) => { selectedId = v; render(); },
            }),
          })),
        ],
        body: h('div', null,
          matrix,
          notCoveredCount
            ? note({
              variant: 'caution',
              title: `${notCoveredCount} of ${matrixRows.length} checks are not available under ${selectedId}`,
              body: 'A design item using this code will stop at those checks and print a formal notice in place of a result. Where another installed code covers the check, it is offered as an alternative on the item itself.',
            })
            : null,
        ),
        foot: [button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') })],
      }),
    );
  }

  render();
  return host;
}

function cfstVerdict(app, codeId) {
  const covered = CFST_CHECK_SEQUENCE.filter((c) => {
    const s = app.registry.coverage(codeId, c);
    return s === COVERAGE.COVERED || s === COVERAGE.DECLARED;
  }).length;
  if (covered === 0) return chip('No provisions', 'notcov');
  if (covered >= CFST_CHECK_SEQUENCE.length - 3) return chip(`${covered}/${CFST_CHECK_SEQUENCE.length}`, 'safe');
  return chip(`${covered}/${CFST_CHECK_SEQUENCE.length}`, 'caution');
}


/* ===== src/ui/screens/log.js ===== */
// ui/screens/log.js — the complete change log.


const KIND_LABELS = {
  [AUDIT_KINDS.PROJECT_CREATED]: 'Project created',
  [AUDIT_KINDS.PROJECT_FIELD]: 'Project field changed',
  [AUDIT_KINDS.REVISION_ISSUED]: 'Revision issued',
  [AUDIT_KINDS.TEAM_CHANGED]: 'Team changed',
  [AUDIT_KINDS.ITEM_CREATED]: 'Design item created',
  [AUDIT_KINDS.ITEM_FIELD]: 'Design item changed',
  [AUDIT_KINDS.ASSUMPTION_CHANGED]: 'Assumption changed',
  [AUDIT_KINDS.CODE_CHANGED]: 'Design code changed',
  [AUDIT_KINDS.CALC_RUN]: 'Calculation run',
  [AUDIT_KINDS.IMPORTED]: 'Project imported',
};

function logScreen(app) {
  let kind = '';
  const host = h('div');

  function render() { preserveFocus(paint); }

  function paint() {
    const rows = app.audit.list(kind ? { kind } : {});
    host.replaceChildren(sheet({
      title: 'Change log',
      lede: 'Append-only record of every change, with its previous value and the person responsible.',
      actions: [
        h('div', { style: { minWidth: '240px' } }, field({
          label: 'Filter', id: 'log-kind',
          control: select({
            id: 'log-kind', value: kind, placeholder: 'All entries',
            options: Object.entries(KIND_LABELS).map(([v, l]) => ({ value: v, label: l })),
            onChange: (v) => { kind = v; render(); },
          }),
        })),
      ],
      body: h('div', null,
        table({
          caption: `${rows.length} entr${rows.length === 1 ? 'y' : 'ies'}`,
          columns: [
            { label: 'Timestamp (UTC)', ident: true, width: '160px', render: (e) => e.ts.replace('T', ' ').replace('Z', '').slice(0, 19) },
            { label: 'Event', width: '170px', render: (e) => KIND_LABELS[e.kind] || e.kind },
            { label: 'Field', ident: true, render: (e) => e.field || '—' },
            { label: 'From', render: (e) => auditValueText(e.from) },
            { label: 'To', render: (e) => auditValueText(e.to) },
            { label: 'Reason', render: (e) => e.reason || '—' },
            { label: 'By', width: '130px', render: (e) => e.actor },
          ],
          rows,
          empty: 'No entries match this filter.',
        }),
        note({
          title: 'Why this log exists',
          body: 'A checker must be able to ask of any number: who changed it, when, from what, and why. Entries cannot be edited or removed; a correction is recorded as a new entry.',
        }),
      ),
      foot: [button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') })],
    }));
  }

  render();
  return host;
}


/* ===== src/ui/screens/welcome.js ===== */
// ui/screens/welcome.js — the start state.


function welcomeScreen(app) {
  async function openProject() {
    try {
      const { name, text } = await pickTextFile();
      const { project, audit, people, currentUserId } = deserialise(text);
      app.load(project, audit, people, currentUserId);
      app.audit.append({ kind: AUDIT_KINDS.IMPORTED, entity: 'Project', entityId: project.id, to: name });
      toast(`Opened ${project.name || name}.`, 'ok');
      app.navigate('overview');
    } catch (err) {
      toast(err.message, 'err');
    }
  }

  return sheet({
    body: h('div', null,
      h('div', { class: 'tg-welcome__mark' }, logoImg('', 'Trust Group')),
      emptyState({
        title: 'Start a project',
        body: 'Every calculation, drawing and export produced here is tied to a project record: its client, its revision, its units, and the codes it is designed to.',
        actions: [
          button('Create new project', { onClick: () => app.navigate('project') }),
          button('Open a saved project', { variant: 'ghost', onClick: openProject }),
        ],
      }),
      note({
        variant: 'code',
        title: 'What this build contains',
        body: 'The project record, the design items register, and the CFST column engine to EN 1994-1-1 §6.7.3 and AISC 360-22 Chapter I, with base and anchorage to EN 1993-1-8 or ACI 318-19. Every value prints the code and clause it came from, and any check the chosen code does not cover is stated rather than assumed. Shop drawings follow in a later release.',
      }),
    ),
  });
}


/* ===== src/ui/shell.js ===== */
// ui/shell.js — frame, navigation and file actions.


const ROUTES = [
  { id: 'overview', label: 'Project', group: 'PROJECT', needsProject: true },
  { id: 'project', label: 'Details', group: 'PROJECT', needsProject: false },
  { id: 'items', label: 'Design items', group: 'DESIGN', needsProject: true, count: (s) => (s.project?.items || []).length },
  { id: 'codes', label: 'Design codes', group: 'DESIGN', needsProject: false },
  { id: 'log', label: 'Change log', group: 'RECORDS', needsProject: true },
  { id: 'people', label: 'Engineers', group: 'RECORDS', needsProject: false, count: (s, a) => a.people.length },
];

/** Screens that stand on their own, with no project open. */
const PROJECT_FREE_ROUTES = ROUTES.filter((r) => !r.needsProject).map((r) => r.id);

function createShell(app) {
  injectStyle('tg-styles', stylesheet());

  const board = h('main', { class: 'tg-board', id: 'tg-board', tabindex: '-1' });
  const rail = h('nav', { class: 'tg-rail', 'aria-label': 'Sections' });
  const topbarMeta = h('div', { class: 'tg-topbar__meta' });

  // The badge sits next to the mark so the exact build in front of you is never
  // in doubt while the platform is being changed often.
  const badge = h('button', {
    class: 'tg-topbar__badge', type: 'button',
    title: 'Click for build details',
    onClick: () => toggleBuildPanel(),
  },
    h('b', null, `v${PLATFORM_VERSION}`),
    h('span', null, buildLabel()),
  );

  let buildPanel = null;

  function toggleBuildPanel() {
    if (buildPanel) { buildPanel.remove(); buildPanel = null; return; }
    const current = VERSION_HISTORY.find((v) => v.version === PLATFORM_VERSION);
    buildPanel = h('div', { class: 'tg-buildpanel' },
      h('h4', null, `Version ${PLATFORM_VERSION}`),
      current ? h('p', null, current.notes) : null,
      h('dl', { class: 'tg-buildpanel__facts' },
        h('div', null, h('dt', null, 'Build'), h('dd', null, IS_BUNDLED ? String(BUILD_NUMBER) : 'running from source')),
        h('div', null, h('dt', null, 'Built'), h('dd', null, buildLabel())),
        h('div', null, h('dt', null, 'Codes installed'), h('dd', null, String(app.registry.list().length))),
      ),
      h('h5', null, 'Earlier versions'),
      h('ul', null, VERSION_HISTORY.map((v) => h('li', null,
        h('b', null, `v${v.version}`), ` — ${v.date}`,
        h('div', { class: 'tg-buildpanel__note' }, v.notes)))),
      h('p', { class: 'tg-buildpanel__note' },
        'A sheet prints the version it was calculated on. Open the matching pinned address to reproduce it exactly.'),
      button('Close', { variant: 'quiet', small: true, onClick: () => toggleBuildPanel() }),
    );
    root.appendChild(buildPanel);
  }

  // Language switch and the hover translator sit together: same dictionary.
  const langBtn = h('button', {
    class: 'tg-topbar__tool', type: 'button', title: 'Switch interface language',
    onClick: () => {
      setLang(lang() === LANGS.EN ? LANGS.AR : LANGS.EN);
      langBtn.textContent = lang() === LANGS.EN ? 'ع' : 'EN';
      app.render();
    },
  }, 'ع');

  const trBtn = h('button', {
    class: 'tg-topbar__tool', type: 'button',
    title: 'Translation helper: point at anything to see it in Arabic',
    onClick: () => {
      setTranslateMode(!isTranslateMode());
      trBtn.classList.toggle('tg-topbar__tool--on', isTranslateMode());
      document.body.classList.toggle('tg-translating', isTranslateMode());
      if (!isTranslateMode()) hideTip();
    },
  }, '\u2637');

  const tip = h('div', { class: 'tg-tip', hidden: true });
  document.body.appendChild(tip);

  function hideTip() { tip.hidden = true; }

  document.addEventListener('mouseover', (e) => {
    if (!isTranslateMode()) return;
    const el = e.target.closest('button, a, label, th, td, dt, dd, h1, h2, h3, h4, legend, p, span, li, option');
    if (!el || el.closest('.tg-tip')) return;
    const info = explain(el.textContent);
    if (!info) { hideTip(); return; }
    tip.replaceChildren(
      h('div', { class: 'tg-tip__src' }, info.source.slice(0, 120)),
      info.whole ? h('div', { class: 'tg-tip__ar' }, info.whole) : null,
      info.terms.length
        ? h('dl', { class: 'tg-tip__terms' }, info.terms.map((x) => h('div', null,
          h('dt', null, x.term), h('dd', null, x.ar))))
        : null,
    );
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const top = r.bottom + 8 + tip.offsetHeight > window.innerHeight ? r.top - tip.offsetHeight - 8 : r.bottom + 8;
    tip.style.top = `${Math.max(8, top)}px`;
    tip.style.left = `${Math.min(Math.max(8, r.left), window.innerWidth - tip.offsetWidth - 8)}px`;
  });
  document.addEventListener('mouseout', (e) => { if (isTranslateMode() && !e.relatedTarget) hideTip(); });

  const quickBtn = h('button', {
    class: 'tg-topbar__quick', type: 'button',
    title: 'Go straight to an element calculation without setting up a project',
    onClick: () => app.navigate('quick'),
  }, h('b', null, 'QUICK DESIGN'), h('span', null, 'straight to an element'));

  const clock = h('div', { class: 'tg-topbar__clock' });
  // Slot reserved for the signed-in engineer. Adding users later drops a node
  // in here; nothing else in the bar has to move.
  const userSlot = h('div', { class: 'tg-topbar__slot' });

  const topbar = h('header', { class: 'tg-topbar' },
    logoImg('tg-topbar__logo'),
    h('div', null,
      h('div', { class: 'tg-topbar__name' }, ORG.name.toUpperCase()),
      h('div', { class: 'tg-topbar__sub' }, ORG.platform.toUpperCase())),
    badge,
    clock,
    h('div', { class: 'tg-topbar__spacer' }),
    quickBtn,
    langBtn,
    trBtn,
    userSlot,
    topbarMeta,
  );

  function paintClock() {
    const now = new Date();
    const day = now.toLocaleDateString('en-GB', { weekday: 'long' });
    const date = now.toLocaleDateString('en-GB');
    const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    clock.replaceChildren(h('b', null, `${date} — ${time}`), h('span', null, day));
  }
  paintClock();
  setInterval(paintClock, 1000);

  const root = h('div', { class: 'tg-app' },
    topbar,
    h('div', { class: 'tg-body' }, rail, board),
  );

  /** Units are chosen here, for the whole platform, not just displayed. */
  function unitsControl() {
    const sel = select({
      id: 'topbar-units', value: app.units,
      options: systemList().map((x) => ({ value: x.id, label: x.label })),
      onChange: (v) => app.setUnits(v),
    });
    sel.className = 'tg-topbar__units';
    return h('div', { class: 'tg-topbar__field' }, sel, h('span', null, 'UNITS'));
  }

  function metaField(label, value, word) {
    return h('div', { class: `tg-topbar__field${word ? ' tg-topbar__field--word' : ''}` },
      h('b', null, value || '—'),
      h('span', null, label));
  }

  function saveProject() {
    const p = app.store.state.project;
    if (!p) return;
    const payload = serialise(p, app.audit, { build: app.build, people: app.people, currentUser: app.currentUser });
    downloadText(suggestedFileName(p), JSON.stringify(payload, null, 2));
    toast('Project file saved.', 'ok');
  }

  async function openProject() {
    try {
      const { name, text } = await pickTextFile();
      const { project, audit, people, currentUserId } = deserialise(text);
      app.load(project, audit, people, currentUserId);
      app.audit.append({ kind: AUDIT_KINDS.IMPORTED, entity: 'Project', entityId: project.id, to: name });
      toast(`Opened ${project.name || name}.`, 'ok');
      app.navigate('overview');
    } catch (err) {
      toast(err.message, 'err');
    }
  }

  function renderTopbar() {
    const p = app.store.state.project;
    const me = app.currentUser;
    userSlot.replaceChildren(h('button', {
      class: `tg-topbar__user${me ? '' : ' tg-topbar__user--none'}`,
      type: 'button',
      title: me ? `Signed in as ${me.name} — ${me.role}` : 'No engineer signed in. Changes will be recorded as unattributed.',
      onClick: () => app.navigate('people'),
    },
      h('b', null, me ? (me.name || '(unnamed)') : 'Not signed in'),
      h('span', null, me ? me.role : 'changes recorded as unattributed'),
    ));
    topbarMeta.replaceChildren();
    if (p) {
      topbarMeta.append(
        metaField('JOB No.', p.number),
        metaField('REV', p.revision),
      );
    }
    // Units are a platform setting, so the control is present even before a
    // project exists — quick design needs somewhere to read them from.
    topbarMeta.append(unitsControl());
    if (p) topbarMeta.append(button('Save', { variant: 'ghost', small: true, onClick: saveProject }));
    topbarMeta.append(button('Open', { variant: 'quiet', small: true, onClick: openProject }));
  }

  function renderRail() {
    const p = app.store.state.project;
    rail.replaceChildren();
    let lastGroup = null;
    for (const r of ROUTES) {
      if (r.group !== lastGroup) {
        rail.appendChild(h('div', { class: 'tg-rail__group' }, r.group));
        lastGroup = r.group;
      }
      const disabled = r.needsProject && !p;
      rail.appendChild(h('button', {
        class: 'tg-rail__item',
        'aria-current': String(app.route === r.id),
        disabled,
        title: disabled ? 'Create a project first' : '',
        onClick: () => app.navigate(r.id),
      },
        h('span', null, r.label),
        r.count && (p || !r.needsProject) ? h('span', { class: 'tg-rail__count' }, String(r.count(app.store.state, app))) : null,
      ));
    }
    rail.appendChild(h('div', { class: 'tg-rail__foot' },
      h('div', null, `${app.registry.list().length} design codes installed`),
      h('div', null, `${app.audit.length} log entries`),
    ));
  }

  /**
   * When served from a web address, ask the site which version is live. If the
   * page was loaded from a pinned folder or from a local file, this simply
   * finds nothing and stays quiet.
   */
  async function checkForUpdate() {
    if (!/^https?:/.test(window.location.protocol)) return;
    try {
      const res = await fetch('../version.json', { cache: 'no-store' })
        .catch(() => fetch('version.json', { cache: 'no-store' }));
      if (!res || !res.ok) return;
      const data = await res.json();
      if (!data || !data.version) return;
      const newerVersion = compareVersions(PLATFORM_VERSION, data.version) < 0;
      const newerBuild = data.version === PLATFORM_VERSION
        && Number(data.build) > BUILD_NUMBER;
      if (!newerVersion && !newerBuild) return;
      badge.classList.add('tg-topbar__badge--stale');
      badge.title = `A newer build is available (v${data.version} build ${data.build}). You may be seeing a cached page.`;
      showUpdateBar(newerVersion ? data.version : `${data.version} build ${data.build}`);
    } catch { /* offline, or no version file: nothing to report */ }
  }

  function showUpdateBar(latest) {
    const bar = h('div', { class: 'tg-updatebar' },
      h('span', null, `You are on platform v${PLATFORM_VERSION}. Version v${latest} is available.`),
      h('span', { class: 'tg-updatebar__note' },
        'Your open project keeps its current results until you choose to recalculate.'),
      button('Reload the latest', {
        small: true,
        onClick: () => {
          const base = window.location.href.replace(/\/v[\d.]+\/?$/, '/').split('?')[0];
          window.location.href = `${base}?b=${Date.now()}`;
        },
      }),
      button('Stay here', { variant: 'quiet', small: true, onClick: () => bar.remove() }),
    );
    root.insertBefore(bar, root.firstChild);
  }

  return {
    root,
    board,
    checkForUpdate,
    refreshChrome() { renderTopbar(); renderRail(); translateTree(topbar); translateTree(rail); },
    setContent(node) { mount(board, node); translateTree(root); board.scrollTop = 0; },
  };
}


/* ===== src/main.js ===== */
// main.js — composition root.
//
// This is the only file that knows about all three layers at once. Core does
// not import UI; UI does not import code modules directly; code modules import
// nothing but the capability vocabulary.



const BUILD = PLATFORM_VERSION;

function boot(mountEl) {
  installCodes();

  const app = {
    build: BUILD,
    registry,
    store: new Store({ project: null }),
    audit: new AuditLog(),
    route: 'welcome',
    openItemId: null,
    lastComparison: null,
    people: defaultRegister(),
    quickCountry: null,
    // Units belong to the platform and are inherited by a new project, so a
    // quick design has somewhere to read them from before a project exists.
    units: DEFAULT_SYSTEM,
    setUnits(u) {
      app.units = u;
      const p = app.store.state.project;
      if (p && p.units !== u) {
        app.audit.append({
          kind: AUDIT_KINDS.PROJECT_FIELD, entity: 'Project', entityId: p.id,
          field: 'units', from: p.units, to: u, actor: app.actorName(),
        });
        app.store.update((s) => { s.project.units = u; });
      }
      app.render();
    },
    currentUser: null,
    actorName() { return app.currentUser ? app.currentUser.name : 'unattributed'; },
    can(action) { return can(app.currentUser, action); },
    openItem(id) { app.openItemId = id; app.route = 'designer'; app.render(); },
    openSheet(id) { app.openItemId = id; app.route = 'sheet'; app.render(); },
    navigate(route) { app.route = route; app.render(); },
    load(project, audit, people, currentUserId) {
      app.store.replace({ project });
      app.audit = audit instanceof AuditLog ? audit : new AuditLog();
      if (Array.isArray(people) && people.length) app.people = people;
      if (project && project.units) app.units = project.units;
      app.currentUser = currentUserId ? (app.people.find((x) => x.id === currentUserId) || null) : null;
    },
    render() {},
  };

  const shell = createShell(app);
  mountEl.replaceChildren(shell.root);

  app.render = () => {
    const hasProject = !!app.store.state.project;
    let route = app.route;
    // A screen that does not need a project must not be bounced to the welcome
    // screen. The rail already decides what is reachable; the router should
    // agree with it rather than keep a second, drifting list.
    if (!hasProject && !PROJECT_FREE_ROUTES.includes(route)) route = 'welcome';
    if (hasProject && route === 'welcome') route = 'overview';
    app.route = route;

    shell.refreshChrome();
    shell.setContent(screenFor(app, route));
  };

  // Any state change re-renders. Phase 2 attaches recalculation to this channel.
  app.store.subscribe(() => shell.refreshChrome());

  app.render();
  shell.checkForUpdate();
  return app;
}

function screenFor(app, route) {
  switch (route) {
    case 'project':
      return projectFormScreen(app, { mode: app.store.state.project ? 'edit' : 'create' });
    case 'overview': return overviewScreen(app);
    case 'items': return itemsScreen(app);
    case 'designer': return app.openItemId ? designerScreen(app, app.openItemId) : itemsScreen(app);
    case 'sheet': return app.openItemId ? sheetScreen(app, app.openItemId) : itemsScreen(app);
    case 'compare': return compareScreen(app);
    case 'people': return peopleScreen(app);
    case 'quick': return quickScreen(app);
    case 'codes': return codesScreen(app);
    case 'log': return logScreen(app);
    default: return welcomeScreen(app);
  }
}

/**
 * Public API, deliberately exposed on window.TGP.
 * It gives an engineer a console into the running platform and gives the test
 * harness a way in without reaching through the UI. Keep it small and stable.
 */
function publicApi(app) {
  return {
    version: PLATFORM_VERSION,
    PLATFORM_VERSION, isOlderThanCurrent, diffResults, snapshotResult,
    jurisdiction, jurisdictionOptions,
    newPerson, ROLES, ROLE, can, canCheckItem, peopleOptions,
    ELEMENTS, searchElements, findElement, convertQuickToProject,
    BUILD_NUMBER, buildLabel,
    lang, setLang, t, explainTerm: explain, LANGS, sheetLanguage, setSheetLanguage, UI, GLOSSARY,
    app,
    registry,
    // core services
    createProject, validateProject, issueRevision,
    createItem, runCfst, runDesign, sectionProperties, generateAssumptions,
    defaultBasePlate, plateProperties,
    sheetBlocks, paginateBlocks, itemCsv,
    serialise, deserialise, suggestedFileName,
    AuditLog,
    // units
    toBase, fromBase, format, formatWithUnit, UNIT_SYSTEMS,
    nextRevision,
    // vocabulary
    CAP, CFST_CHECK_SEQUENCE, COVERAGE,
  };
}

if (typeof document !== 'undefined') {
  const el = document.getElementById('app');
  if (el) {
    const app = boot(el);
    if (typeof window !== 'undefined') window.TGP = publicApi(app);
  }
}

})();
