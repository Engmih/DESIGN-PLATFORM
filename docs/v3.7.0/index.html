/* ===== src/codes/aisc360-cfst.js ===== */
// codes/aisc360-cfst.js — AISC 360-22 Chapter I, filled composite members.
//
// Scope of this implementation: axial compression (I2.2) and the local buckling
// classification (I1.4). Flexure and combined loading are NOT implemented and
// return a formal notice rather than a number. See the note in each handler.
//
// Base units are N, mm, MPa. The published equations are dimensionally
// consistent, so no unit conversion is required; the classification limits that
// contain numeric coefficients are expressed in the √(E/F_y) form, which is
// also unit-independent.


const A = 'AISC 360-22';

/**
 * Local buckling limits, held as DATA so they can be corrected in one place
 * without touching the engine. Flagged for office verification because the
 * coefficients come from Table I1.1a and must match the controlled copy.
 */
const AISC_I11A = {
  rectangular: { compact: 2.26, noncompact: 3.00, maximum: 5.00, form: 'sqrt' },
  round: { compact: 0.15, noncompact: 0.19, maximum: 0.31, form: 'linear' },
  source: 'Table I1.1a — axial compression',
  verify: true,
};

function aisc_classification(ctx) {
  const { sec, mat } = ctx;
  const round = sec.shape === SHAPE.CHS;
  const set = round ? AISC_I11A.round : AISC_I11A.rectangular;
  const base = round ? (mat.Ea / mat.fy) : Math.sqrt(mat.Ea / mat.fy);
  const lp = set.compact * base;
  const lr = set.noncompact * base;
  const lmax = set.maximum * base;
  const lam = sec.slendernessRatio;

  const klass = lam <= lp ? 'Compact' : lam <= lr ? 'Noncompact' : 'Slender';

  const steps = [
    step({
      code: A, clause: 'I1.4',
      symbol: 'λ', description: `Wall slenderness, ${sec.slendernessLabel}`,
      value: lam,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_p', description: 'Limit for a compact filled section in axial compression',
      expression: round ? 'λ_p = 0.15 E/F_y' : 'λ_p = 2.26 √(E/F_y)',
      value: lp, verify: true,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_r', description: 'Limit for a noncompact filled section in axial compression',
      expression: round ? 'λ_r = 0.19 E/F_y' : 'λ_r = 3.00 √(E/F_y)',
      value: lr, verify: true,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_max', description: 'Maximum permitted wall slenderness',
      value: lmax, verify: true,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'classification',
      title: `Local buckling classification — section is ${klass.toLowerCase()}`,
      code: A, clause: 'I1.4',
      clauseTitle: 'Classification of filled composite sections for local buckling',
      demand: lam, capacity: lmax, dimension: null,
      failureMode: 'Local buckling of the tube wall',
      steps, verify: true,
      note: klass === 'Compact'
        ? null
        : `The section is ${klass.toLowerCase()}. AISC 360 §I2.2b gives reduced nominal strength equations for noncompact and slender filled sections, which are not implemented in this build. Use a compact section, or carry out this case by hand.`,
    }),
    scratch: { klass, lambdaWall: lam, lp, lr, lmax, compact: klass === 'Compact' },
  };
}

function aisc_axial(ctx, sc) {
  const { sec, mat, geometry, actions, partial } = ctx;
  const round = sec.shape === SHAPE.CHS;
  const C2 = round ? 0.95 : 0.85;

  // I2.2b requires the compact equations; anything else is out of scope here.
  if (!sc.compact) {
    return {
      steps: [notice({
        code: A, clause: 'I2.2',
        symbol: 'P_n', description: 'Compressive strength',
        note: 'Only the compact-section equations of §I2.2b are implemented. No number is produced for a noncompact or slender filled section.',
      })],
      check: check({
        id: 'axial', title: 'Axial compressive strength',
        code: A, clause: 'I2.2', clauseTitle: 'Filled composite members — compressive strength',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Flexural buckling of the composite member',
        note: 'Section is not compact. Complete this check by hand against §I2.2b.',
      }),
      scratch: {},
    };
  }

  const Es = mat.Ea;
  const Ec = mat.Ec;
  const Pno = mat.fy * sec.Aa + C2 * mat.fcPrime * (sec.Ac + sec.As * (Es / Ec));
  const C3 = Math.min(0.9, 0.45 + 3 * ((sec.Aa + sec.As) / sec.Ag));
  const axisZ = ctx.axis === 'z';
  const Ia = axisZ ? sec.IaZ : sec.Ia;
  const Ic = axisZ ? sec.IcZ : sec.Ic;
  const Is = axisZ ? sec.IsZ : sec.Is;
  const EIeff = Es * Ia + Es * Is + C3 * Ec * Ic;
  const Lc = Number(geometry.bucklingLength);
  const Pe = Math.PI ** 2 * EIeff / (Lc * Lc);

  const ratio = Pno / Pe;
  const Pn = ratio <= 2.25 ? Pno * Math.pow(0.658, ratio) : 0.877 * Pe;
  const phi = partial.phiC ?? 0.75;
  const design = phi * Pn;
  const NEd = Number(actions.NEd) || 0;

  const steps = [
    step({
      code: A, clause: 'I2.2',
      symbol: 'C_2', description: 'Coefficient on the concrete contribution',
      expression: '0.85 for rectangular filled sections, 0.95 for round filled sections',
      value: C2,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_no', description: 'Nominal axial compressive strength without slenderness effects',
      expression: 'P_no = F_y A_s + C_2 f′_c (A_c + A_sr E_s/E_c)',
      value: Pno, dimension: 'force',
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'C_3', description: 'Coefficient for the effective rigidity',
      expression: 'C_3 = 0.45 + 3 (A_s + A_sr)/A_g ≤ 0.9',
      value: C3,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'EI_eff', description: 'Effective stiffness of the composite section',
      expression: 'EI_eff = E_s I_s + E_s I_sr + C_3 E_c I_c',
      value: EIeff,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_e', description: 'Elastic critical buckling load',
      expression: 'P_e = π² (EI_eff) / L_c²',
      value: Pe, dimension: 'force',
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_n', description: 'Nominal compressive strength',
      expression: ratio <= 2.25 ? 'P_n = P_no [0.658^(P_no/P_e)]' : 'P_n = 0.877 P_e',
      substitution: `P_no/P_e = ${ratio.toFixed(3)} ${ratio <= 2.25 ? '≤' : '>'} 2.25`,
      value: Pn, dimension: 'force',
    }),
    step({
      code: A, clause: 'I1.2',
      symbol: 'φ_c P_n', description: 'Design compressive strength',
      expression: 'φ_c = 0.75 (LRFD)',
      value: design, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'axial',
      title: 'Axial compressive strength',
      code: A, clause: 'I2.2',
      clauseTitle: 'Filled composite members — compressive strength',
      demand: NEd, capacity: design, dimension: 'force',
      failureMode: 'Flexural buckling of the composite member',
      steps,
    }),
    scratch: { Pno, Pe, Pn, EIeff, C2, C3, design },
  };
}

function aisc_flexure() {
  return {
    steps: [notice({
      code: A, clause: 'I3.4',
      symbol: 'M_n', description: 'Flexural strength of a filled composite member',
      note: 'Not implemented. §I3.4 defines the plastic stress distribution for filled sections, but this build does not compute it. No moment resistance is produced under AISC 360.',
    })],
    check: check({
      id: 'uniaxial_y', title: 'Compression with uniaxial bending',
      code: A, clause: 'I5', clauseTitle: 'Combined flexure and axial force',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined axial force and bending',
      note: 'Use EN 1994-1-1 §6.7.3.6 for a computed interaction, or complete §I5 by hand.',
    }),
    scratch: {},
  };
}

const AISC360_CFST_HANDLERS = {
  classification: aisc_classification,
  axial: aisc_axial,
  flexure: aisc_flexure,
};


/* ===== src/codes/aisc360-flexure.js ===== */
// codes/aisc360-flexure.js — rolled I-shape in flexure and shear, AISC 360-16.
//
// Written for the sections that come out of a SAP model: doubly symmetric
// I-shapes, bent about the major axis. That is Chapter F Section F2, with the
// compactness limits of Table B4.1b and the shear provisions of G2.1.
//
// Lateral torsional buckling is computed, not waved away, because on a steel
// beam it usually governs and leaving it out would be the difference between a
// safe answer and a wrong one.


const AISCF = 'AISC 360-16';

const AISC_FLEX_DATA = {
  phiB: { value: 0.90, clause: 'F1', desc: 'Resistance factor for flexure, LRFD', verify: true },
  phiV: { value: 1.00, clause: 'G1', desc: 'Resistance factor for shear of rolled I-shaped members meeting G2.1(a)', verify: true },
  E: { value: 200000, clause: 'B3', desc: 'Modulus of elasticity of steel, N/mm2', verify: false },
};

function aD(k) { return AISC_FLEX_DATA[k].value; }

/* ---------------- compactness ---------------- */

function aiscb_compactness(ctx) {
  const { sec, mat } = ctx;
  const E = aD('E');
  const root = Math.sqrt(E / mat.fy);

  const flangeRatio = sec.bf / (2 * sec.tf);
  const lpFlange = 0.38 * root;
  const lrFlange = 1.0 * root;

  const webRatio = sec.h / sec.tw;
  const lpWeb = 3.76 * root;
  const lrWeb = 5.70 * root;

  const flangeCompact = flangeRatio <= lpFlange;
  const webCompact = webRatio <= lpWeb;
  const compact = flangeCompact && webCompact;

  const steps = [
    step({
      code: AISCF, clause: 'Table B4.1b', symbol: 'b_f/2t_f',
      description: 'Flange slenderness against the compact limit',
      expression: 'λ_p = 0.38 √(E/F_y)',
      substitution: `${flangeRatio.toFixed(2)} against ${lpFlange.toFixed(2)}`,
      value: flangeRatio, verify: true,
    }),
    step({
      code: AISCF, clause: 'Table B4.1b', symbol: 'h/t_w',
      description: 'Web slenderness against the compact limit',
      expression: 'λ_p = 3.76 √(E/F_y)',
      substitution: `${webRatio.toFixed(2)} against ${lpWeb.toFixed(2)}`,
      value: webRatio, verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'compactness',
      title: compact ? 'Section is compact' : (flangeCompact ? 'Web is noncompact' : 'Flange is noncompact'),
      code: AISCF, clause: 'Table B4.1b', clauseTitle: 'Width-to-thickness ratios for members subject to flexure',
      demand: compact ? 0 : 1, capacity: 1, dimension: null,
      status: compact ? CHECK_STATUS.PASS : CHECK_STATUS.FAIL,
      failureMode: 'Local buckling of the flange or web before the section reaches its plastic moment',
      steps, verify: true,
      note: compact ? null : 'Sections F3 and F4 give reduced strengths for noncompact flanges and webs. They are not implemented here, so no moment resistance is produced for a noncompact section.',
    })],
    scratch: { compact, flangeRatio, webRatio, lpFlange, lpWeb, lrFlange, lrWeb, root, E },
  };
}

/* ---------------- flexure, F2 ---------------- */

function aiscb_flexure(ctx, sc) {
  const { sec, mat, geometry, actions } = ctx;
  const phi = aD('phiB');
  const MuReq = Math.abs(Number(actions.Mu) || 0);

  // Section F2 is written for doubly symmetric members. A girder with unequal
  // flanges is singly symmetric and belongs to F4, whose strength is the least
  // of yielding, lateral torsional buckling and compression flange local
  // buckling, each on properties that depend on where the neutral axis sits.
  // Running it through F2 would produce a number that looked right.
  if (sec.symmetric === false) {
    return {
      steps: [notice({
        code: AISCF, clause: 'F4', symbol: 'M_n',
        description: 'Flexural strength of a singly symmetric I-shaped member',
        note: `The flanges are not equal (${sec.bfTop} × ${sec.tfTop} above, ${sec.bfBot} × ${sec.tfBot} below), so the section is singly symmetric and Section F4 governs. F4 is not implemented in this build, and F2 is not applicable to it, so no moment resistance is produced.`,
      })],
      checks: [check({
        id: 'flexure', title: 'Flexural strength',
        code: AISCF, clause: 'F4',
        clauseTitle: 'Other I-shaped members with compact or noncompact webs bent about their major axis',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Flexure of a singly symmetric section',
        note: 'Make the flanges equal to use F2, or complete F4 by hand.',
      })],
      scratch: { singlySymmetric: true },
    };
  }

  if (!sc.compact) {
    return {
      steps: [notice({
        code: AISCF, clause: 'F3', symbol: 'M_n',
        description: 'Flexural strength of a noncompact section',
        note: 'Not calculated. Sections F3 and F4 cover noncompact flanges and webs; only the compact case of F2 is implemented.',
      })],
      checks: [check({
        id: 'flexure', title: 'Flexural strength',
        code: AISCF, clause: 'F3', clauseTitle: 'Doubly symmetric I-shaped members with compact webs and noncompact flanges',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Local buckling under flexure',
      })],
      scratch: {},
    };
  }

  const E = sc.E;
  const Mp = mat.fy * sec.Zx;
  const Lb = Number(geometry.Lb) || 0;
  const Cb = Number(geometry.Cb) || 1.0;

  // F2.2: limiting lengths
  const Lp = 1.76 * sec.ry * Math.sqrt(E / mat.fy);
  const c = 1.0; // doubly symmetric I-shape
  const term = (sec.J * c) / (sec.Sx * sec.ho);
  const inner = term + Math.sqrt(term * term + 6.76 * Math.pow((0.7 * mat.fy) / E, 2));
  const Lr = 1.95 * sec.rts * (E / (0.7 * mat.fy)) * Math.sqrt(inner);

  let Mn;
  let regime;
  if (Lb <= Lp) {
    Mn = Mp;
    regime = 'Yielding governs: the compression flange is braced within L_p.';
  } else if (Lb <= Lr) {
    Mn = Math.min(Mp, Cb * (Mp - (Mp - 0.7 * mat.fy * sec.Sx) * ((Lb - Lp) / (Lr - Lp))));
    regime = 'Inelastic lateral torsional buckling governs.';
  } else {
    const ratio = Lb / sec.rts;
    const Fcr = ((Cb * Math.PI * Math.PI * E) / (ratio * ratio))
      * Math.sqrt(1 + 0.078 * ((sec.J * c) / (sec.Sx * sec.ho)) * ratio * ratio);
    Mn = Math.min(Mp, Fcr * sec.Sx);
    regime = 'Elastic lateral torsional buckling governs.';
  }

  const design = phi * Mn;

  const steps = [
    input({
      symbol: 'Z_x', description: sec.source
        ? `Plastic section modulus, published value for ${sec.source}`
        : 'Plastic section modulus, derived from the plate dimensions',
      value: sec.Zx,
      note: sec.source
        ? null
        : 'Derived without a root radius, which makes it about five per cent low for a rolled section. Name a catalogue section to use its published properties.',
    }),
    step({
      code: AISCF, clause: 'F2.1', symbol: 'M_p', description: 'Plastic moment',
      expression: 'M_p = F_y Z_x', substitution: `${mat.fy} × ${(sec.Zx / 1e3).toFixed(0)}e3`,
      value: Mp, dimension: 'moment',
    }),
    step({
      code: AISCF, clause: 'F2.2', symbol: 'L_p', description: 'Limiting unbraced length for yielding',
      expression: 'L_p = 1.76 r_y √(E/F_y)', value: Lp, dimension: 'length',
    }),
    step({
      code: AISCF, clause: 'F2.2', symbol: 'L_r', description: 'Limiting unbraced length for inelastic lateral torsional buckling',
      expression: 'L_r = 1.95 r_ts (E/0.7F_y) √[ Jc/(S_x h_o) + √( (Jc/(S_x h_o))² + 6.76 (0.7F_y/E)² ) ]',
      value: Lr, dimension: 'length', verify: true,
    }),
    input({
      symbol: 'C_b', description: 'Lateral torsional buckling modification factor',
      value: Cb,
      note: geometry.CbFrom
        ? `Computed from the moment diagram of member ${geometry.CbFrom} using AISC 360-16 Equation F1-1, rather than assumed. It applies to the member as a whole; if the compression flange is braced part way along, the segment between braces gives a different value.`
        : `${describeCb(Cb)} Taken as entered: C_b depends on the shape of the moment diagram between brace points, which this engine does not read unless a diagram was imported. Confirm the case matches this member before issue.`,
    }),
    step({
      code: AISCF, clause: 'F2', symbol: 'M_n', description: `Nominal flexural strength. ${regime}`,
      value: Mn, dimension: 'moment',
    }),
    step({
      code: AISCF, clause: 'F1', symbol: 'φ_b M_n', description: 'Design flexural strength',
      expression: 'φ_b = 0.90', value: design, dimension: 'moment', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'flexure', title: 'Flexural strength',
      code: AISCF, clause: 'F2', clauseTitle: 'Doubly symmetric compact I-shaped members bent about their major axis',
      demand: MuReq, capacity: design, dimension: 'moment',
      failureMode: Lb <= Lp
        ? 'Yielding of the section in flexure'
        : 'Lateral torsional buckling of the compression flange between brace points',
      steps, verify: true,
    })],
    scratch: { Mp, Lp, Lr, Mn, MnDesign: design, ltbRegime: regime },
  };
}

/* ---------------- shear, G2.1 ---------------- */

function aiscb_shear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const phi = aD('phiV');
  const E = sc.E || aD('E');
  const Vreq = Math.abs(Number(actions.Vu) || 0);

  const Aw = sec.d * sec.tw;
  const webRatio = sec.h / sec.tw;
  const limit = 2.24 * Math.sqrt(E / mat.fy);
  const meetsG21a = webRatio <= limit;
  const Cv1 = meetsG21a ? 1.0 : Math.min(1.0, (1.10 * Math.sqrt(5.34 * E / mat.fy)) / webRatio);
  const Vn = 0.6 * mat.fy * Aw * Cv1;
  const design = (meetsG21a ? 1.00 : 0.90) * Vn;

  const steps = [
    step({
      code: AISCF, clause: 'G2.1', symbol: 'A_w', description: 'Web area, taken as the overall depth times the web thickness',
      expression: 'A_w = d t_w', value: Aw, dimension: 'area',
    }),
    step({
      code: AISCF, clause: 'G2.1', symbol: 'h/t_w', description: 'Web slenderness against the limit of G2.1(a)',
      expression: 'h/t_w ≤ 2.24 √(E/F_y) gives C_v1 = 1.0 and φ_v = 1.00',
      substitution: `${webRatio.toFixed(2)} against ${limit.toFixed(2)}`,
      value: webRatio, verify: true,
    }),
    step({
      code: AISCF, clause: 'G2.1', symbol: 'C_v1', description: 'Web shear strength coefficient',
      value: Cv1, verify: true,
    }),
    step({
      code: AISCF, clause: 'G2.1', symbol: 'φ_v V_n', description: 'Design shear strength',
      expression: 'V_n = 0.6 F_y A_w C_v1',
      value: design, dimension: 'force', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'shear', title: 'Shear strength of the web',
      code: AISCF, clause: 'G2.1', clauseTitle: 'Shear strength of webs without tension field action',
      demand: Vreq, capacity: design, dimension: 'force',
      failureMode: 'Shear yielding or shear buckling of the web',
      steps, verify: true,
    })],
    scratch: { Aw, Cv1, VnDesign: design },
  };
}

const AISC360_FLEX_HANDLERS = {
  compactness: aiscb_compactness,
  flexure: aiscb_flexure,
  shear: aiscb_shear,
};

/** The case a value of C_b corresponds to, so the sheet says more than a number. */
function describeCb(value) {
  const cases = {
    1: 'Uniform moment between brace points.',
    1.14: 'Simple span with a uniformly distributed load.',
    1.25: 'Simple span with a point load at midspan.',
    1.28: 'Cantilever with a point load at the tip.',
    1.67: 'Simple span with equal point loads at the third points.',
    2.27: 'Equal and opposite end moments.',
  };
  return cases[Number(value)] || 'Value entered directly.';
}


/* ===== src/codes/aisc360-builtup.js ===== */
// codes/aisc360-builtup.js — double channel members, AISC 360-16.
//
// A pair of channels is not one member until something makes it one. Battens or
// lacing hold the two apart, and between those connections each channel can
// buckle on its own. Chapter E6 handles this with a modified slenderness that
// adds the single channel's slenderness between connectors to the slenderness
// of the pair. If the connectors are far apart, the modified value is what
// governs, and a design that ignored it would be reading a strength the member
// does not have.
//
// The E6 coefficients are flagged for confirmation. The structure of the
// calculation is the code's; the numbers must be checked against the published
// specification before anything is issued.


const A16 = 'AISC 360-16';

const AISC_BUILTUP_DATA = {
  phiC: { value: 0.90, clause: 'E1', desc: 'Resistance factor for compression, LRFD', verify: true },
  battenLimit: { value: 0.75, clause: 'E6.2', desc: 'The slenderness of an individual component between connectors shall not exceed three quarters of the governing slenderness of the built-up member', verify: true },
  E: { value: 200000, clause: 'B3', desc: 'Modulus of elasticity, N/mm2', verify: false },
};

function bD(k) { return AISC_BUILTUP_DATA[k].value; }

/* ---------------- built-up slenderness, E6 ---------------- */

function bu_slenderness(ctx) {
  const { sec, geometry, pairing } = ctx;
  const Lc = Number(geometry.Lc) || 0;
  const a = Number(geometry.connectorSpacing) || 0;
  const connection = geometry.connection || CONNECTION.BATTENS;

  const rxPair = sec.rx;
  const ryPair = sec.ry;
  const rGoverning = Math.min(rxPair, ryPair);
  const lambdaPair = rGoverning > 0 ? Lc / rGoverning : Infinity;

  // Slenderness of one channel about its own weak axis, between connectors
  const ri = sec.singleRy;
  const lambdaSingle = ri > 0 ? a / ri : Infinity;

  // E6.1: modified slenderness for members with intermediate connectors
  const lambdaModified = Math.sqrt(lambdaPair * lambdaPair + lambdaSingle * lambdaSingle);

  const limit = bD('battenLimit') * lambdaPair;
  const spacingOk = lambdaSingle <= limit;

  const steps = [
    step({
      code: A16, clause: 'E6.1', symbol: '(L_c/r)_pair',
      description: 'Slenderness of the pair about its governing axis',
      expression: 'L_c / min(r_x, r_y)',
      substitution: `${Lc} / ${rGoverning.toFixed(1)}`,
      value: lambdaPair,
    }),
    step({
      code: A16, clause: 'E6.1', symbol: '(a/r_i)',
      description: 'Slenderness of one channel about its own weak axis, between connectors',
      expression: 'a / r_i, with a the clear spacing of the connectors',
      substitution: `${a} / ${ri.toFixed(1)}`,
      value: lambdaSingle,
    }),
    step({
      code: A16, clause: 'E6.1', symbol: '(L_c/r)_m',
      description: 'Modified slenderness of the built-up member',
      expression: '(L_c/r)_m = √[ (L_c/r)² + (a/r_i)² ]',
      value: lambdaModified, verify: true,
    }),
    input({
      symbol: 'connection', description: 'How the two channels are connected',
      value: connection === CONNECTION.LACING ? 'Lacing bars' : 'Batten plates',
      note: connection === CONNECTION.LACING
        ? 'Lacing bars carry a transverse shear of their own, which E6 requires to be designed for. That check is not made here.'
        : 'Batten plates and their welds or bolts carry a transverse shear that E6 requires to be designed for. That check is not made here.',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'connectorSpacing',
      title: 'Spacing of the connectors',
      code: A16, clause: 'E6.2', clauseTitle: 'Dimensional requirements for built-up members',
      demand: lambdaSingle, capacity: limit, dimension: null,
      failureMode: 'One channel buckles on its own between connectors before the pair buckles as a unit',
      steps, verify: true,
      note: spacingOk
        ? null
        : `The connectors are too far apart: a single channel is slenderer between them than the pair is overall. Bring the spacing below about ${(limit * ri).toFixed(0)} mm.`,
    })],
    scratch: { lambdaPair, lambdaSingle, lambdaModified, connectorOk: spacingOk, Lc },
  };
}

/* ---------------- axial compression, E3 ---------------- */

function bu_compression(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const E = bD('E');
  const phi = bD('phiC');
  const Pu = Math.abs(Number(actions.Pu) || 0);

  const lam = sc.lambdaModified;
  const Fe = (Math.PI * Math.PI * E) / (lam * lam);
  const limit = 4.71 * Math.sqrt(E / mat.fy);

  let Fcr;
  let regime;
  if (lam <= limit) {
    Fcr = Math.pow(0.658, mat.fy / Fe) * mat.fy;
    regime = 'Inelastic buckling governs.';
  } else {
    Fcr = 0.877 * Fe;
    regime = 'Elastic buckling governs.';
  }
  const Pn = Fcr * sec.A;
  const design = phi * Pn;

  const steps = [
    step({
      code: A16, clause: 'E3', symbol: 'F_e', description: 'Elastic buckling stress on the modified slenderness',
      expression: 'F_e = π² E / (L_c/r)_m²', value: Fe, dimension: 'stress',
    }),
    step({
      code: A16, clause: 'E3', symbol: '4.71√(E/F_y)',
      description: 'Limit separating inelastic from elastic buckling',
      substitution: `${lam.toFixed(1)} against ${limit.toFixed(1)}`,
      value: limit, verify: true,
    }),
    step({
      code: A16, clause: 'E3', symbol: 'F_cr', description: `Critical stress. ${regime}`,
      expression: lam <= limit ? 'F_cr = [0.658^(F_y/F_e)] F_y' : 'F_cr = 0.877 F_e',
      value: Fcr, dimension: 'stress',
    }),
    step({
      code: A16, clause: 'E1', symbol: 'φ_c P_n', description: 'Design compressive strength',
      expression: 'P_n = F_cr A_g, φ_c = 0.90',
      value: design, dimension: 'force', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'compression', title: 'Axial compressive strength',
      code: A16, clause: 'E3', clauseTitle: 'Flexural buckling of members without slender elements',
      demand: Pu, capacity: design, dimension: 'force',
      failureMode: 'Flexural buckling of the built-up member',
      steps, verify: true,
      note: 'Torsional and flexural-torsional buckling of E4 are not checked. For a doubly symmetric pair of channels flexural buckling normally governs, but confirm it for slender arrangements.',
    })],
    scratch: { Fe, Fcr, PnDesign: design },
  };
}

/* ---------------- bending ---------------- */

function bu_bending(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const phi = 0.90;
  const Mu = Math.abs(Number(actions.Mu) || 0);
  const Mp = mat.fy * sec.Wplx;
  const My = mat.fy * sec.Welx;
  const design = phi * Mp;

  const steps = [
    input({
      symbol: 'W_pl,x', description: `Plastic modulus of the pair, twice the published value for one channel (${sec.source})`,
      value: sec.Wplx,
    }),
    step({
      code: A16, clause: 'F2.1', symbol: 'M_p', description: 'Plastic moment of the pair about the strong axis',
      expression: 'M_p = F_y W_pl,x', value: Mp, dimension: 'moment',
    }),
    step({
      code: A16, clause: 'F1', symbol: 'φ_b M_p', description: 'Design flexural strength',
      expression: 'φ_b = 0.90', value: design, dimension: 'moment', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'bending', title: 'Bending about the strong axis',
      code: A16, clause: 'F2', clauseTitle: 'Doubly symmetric compact I-shaped members bent about their major axis',
      demand: Mu, capacity: design, dimension: 'moment',
      failureMode: 'Yielding of the section in bending',
      steps, verify: true,
      note: 'Yielding only. Lateral torsional buckling is not checked for this arrangement: the pair has a much larger weak-axis stiffness than a single channel, but where the compression flange runs unbraced over a long length, §F2.2 must still be satisfied and is not evaluated here.',
    })],
    scratch: { Mp, My, MnDesign: design },
  };
}

/* ---------------- combined ---------------- */

function bu_interaction(ctx, sc) {
  const { actions } = ctx;
  const Pu = Math.abs(Number(actions.Pu) || 0);
  const Mu = Math.abs(Number(actions.Mu) || 0);

  if (!sc.PnDesign || !sc.MnDesign || (!Pu && !Mu)) {
    return { steps: [], checks: [], scratch: {} };
  }

  const pr = Pu / sc.PnDesign;
  const value = pr >= 0.2
    ? pr + (8 / 9) * (Mu / sc.MnDesign)
    : pr / 2 + (Mu / sc.MnDesign);

  const steps = [
    step({
      code: A16, clause: 'H1.1', symbol: 'P_r/P_c', description: 'Axial utilisation, which decides the form of the interaction',
      value: pr,
    }),
    step({
      code: A16, clause: pr >= 0.2 ? 'H1-1a' : 'H1-1b', symbol: 'Σ',
      description: 'Combined axial force and bending',
      expression: pr >= 0.2
        ? 'P_r/P_c + (8/9)(M_r/M_c) ≤ 1.0'
        : 'P_r/(2P_c) + (M_r/M_c) ≤ 1.0',
      value,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'interaction', title: 'Combined axial force and bending',
      code: A16, clause: 'H1.1', clauseTitle: 'Doubly and singly symmetric members subject to flexure and axial force',
      utilisation: value, limit: 1.0,
      failureMode: 'Combined compression and bending',
      steps,
    })],
    scratch: { interaction: value },
  };
}

const AISC360_BUILTUP_HANDLERS = {
  slenderness: bu_slenderness,
  compression: bu_compression,
  bending: bu_bending,
  interaction: bu_interaction,
};


/* ===== src/codes/en1993-baseplate.js ===== */
// codes/en1993-baseplate.js — EN 1993-1-8 §6.2.5 column bases.
//
// Scope: concentric compression. Base plates under moment require the
// equivalent T-stub in tension and the lever-arm model of §6.2.8, which is not
// implemented; that case returns a notice, not a number.


const C18 = 'EN 1993-1-8';

function en_bp_bearing(ctx) {
  const { plate, bp, mat, partial } = ctx;
  const fcd = mat.fck / partial.gammaC;

  // §6.2.5(7): the joint coefficient. 2/3 is the recommended value where the
  // grout strength is at least 0.2 f_ck and the grout is no thicker than 0.2
  // times the smaller plate dimension.
  const betaJ = 2 / 3;
  const kj = Math.min(3.0, Math.sqrt(plate.A2 / plate.A1));
  const fjd = betaJ * kj * fcd;

  // §6.2.5(4): additional bearing width developed by the plate in bending.
  const cFromPlate = bp.tp * Math.sqrt(mat.fyPlate / (3 * fjd * partial.gammaM0));
  const c = Math.min(cFromPlate, plate.overhang);
  const Aeff = plate.perimeterCol * c + effectiveCore(plate, c);
  const NjRd = Aeff * fjd;
  const NEd = Math.max(0, Number(ctx.actions.NEd) || 0);

  const tReq = plate.overhang * Math.sqrt(3 * fjd * partial.gammaM0 / mat.fyPlate);

  const grLimit = 0.2 * Math.min(plate.round ? bp.Dp : bp.B, plate.round ? bp.Dp : bp.N);

  const steps = [
    step({
      code: 'EN 1992-1-1', clause: '6.7',
      symbol: 'k_j', description: 'Concentration factor for the supporting area, as referred to by EN 1993-1-8 §6.2.5',
      expression: 'k_j = √(A_2/A_1) ≤ 3.0',
      substitution: `√(${plate.A2.toFixed(0)} / ${plate.A1.toFixed(0)})`,
      value: kj,
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'β_j', description: 'Joint coefficient for the grout and bedding',
      expression: 'β_j = 2/3, provided the grout strength is at least 0.2 f_ck and its thickness does not exceed 0.2 times the smaller plate dimension',
      substitution: `grout ${bp.grout} mm against a limit of ${grLimit.toFixed(0)} mm`,
      value: betaJ,
      note: bp.grout > grLimit
        ? 'The grout is thicker than the limit for β_j = 2/3. Verify the joint against §6.2.5(7) before relying on this value.'
        : null,
      verify: bp.grout > grLimit,
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'f_jd', description: 'Design bearing strength of the joint',
      expression: 'f_jd = β_j k_j f_cd',
      value: fjd, dimension: 'stress',
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'c', description: 'Additional bearing width the plate can develop in bending',
      expression: 'c = t_p √(f_y / (3 f_jd γ_M0))',
      substitution: `${bp.tp} × √(${mat.fyPlate} / (3 × ${fjd.toFixed(2)} × ${partial.gammaM0}))`,
      value: cFromPlate, dimension: 'length',
      note: cFromPlate > plate.overhang
        ? `The plate could develop ${cFromPlate.toFixed(0)} mm but only ${plate.overhang.toFixed(0)} mm of overhang is available, so the smaller value governs.`
        : null,
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'A_eff', description: 'Effective bearing area under the column',
      expression: 'The column footprint extended by c on all sides, bounded by the plate',
      value: Aeff, dimension: 'area',
    }),
    step({
      code: C18, clause: '6.2.5',
      symbol: 'N_j,Rd', description: 'Design bearing resistance of the base',
      expression: 'N_j,Rd = A_eff f_jd',
      value: NjRd, dimension: 'force',
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'bp.bearing', title: 'Concrete bearing under the base plate',
        code: C18, clause: '6.2.5', clauseTitle: 'Design resistance of column bases with base plates',
        demand: NEd, capacity: NjRd, dimension: 'force',
        failureMode: 'Crushing of the grout and concrete beneath the effective bearing area',
        steps,
      }),
      check({
        id: 'bp.thickness', title: 'Base plate thickness',
        code: C18, clause: '6.2.5', clauseTitle: 'Additional bearing width developed by the plate',
        demand: tReq, capacity: bp.tp, dimension: 'length',
        failureMode: 'Yielding of the plate in bending across the overhang, so the assumed bearing area cannot develop',
        steps: [step({
          code: C18, clause: '6.2.5',
          symbol: 't_p,min', description: 'Plate thickness needed to develop the full overhang as bearing area',
          expression: 't_p,min = overhang × √(3 f_jd γ_M0 / f_y)',
          value: tReq, dimension: 'length',
        })],
      }),
    ],
    scratch: { fjd, kj, betaJ, c, Aeff, NjRd, tReq },
  };
}

function effectiveCore(plate, c) {
  // Corners of the spread strip, plus the column's own footprint.
  const core = plate.round
    ? Math.PI / 4 * plate.colOuterB * plate.colOuterB
    : plate.colOuterB * plate.colOuterN;
  const corners = plate.round ? Math.PI * c * c : 4 * c * c;
  return core + corners;
}

function en_bp_moment(ctx) {
  const M = Math.abs(Number(ctx.actions.MEd) || 0);
  if (!M) {
    return {
      steps: [notice({
        code: C18, clause: '6.2.8', symbol: 'M_j,Rd',
        description: 'Moment resistance of the column base',
        note: 'No moment is applied at the base, so the base is verified for concentric compression alone.',
      })],
      checks: [check({
        id: 'bp.moment', title: 'Column base under moment',
        code: C18, clause: '6.2.8', clauseTitle: 'Design moment resistance of beam-to-column joints and splices',
        status: CHECK_STATUS.NOT_APPLICABLE,
      })],
      scratch: {},
    };
  }
  return {
    steps: [notice({
      code: C18, clause: '6.2.8', symbol: 'M_j,Rd',
      description: 'Moment resistance of the column base',
      note: 'Not calculated. A base plate under moment requires the equivalent T-stub in tension of §6.2.6.11 together with the lever-arm model of §6.2.8. That model is not implemented in this build and no approximation has been substituted.',
    })],
    checks: [check({
      id: 'bp.moment', title: 'Column base under moment',
      code: C18, clause: '6.2.8', clauseTitle: 'Design moment resistance',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined compression and moment at the base',
      note: 'A moment is applied at the base. Complete this check by hand against §6.2.8, or apply the base moment as an equivalent anchor tension in the uplift input.',
    })],
    scratch: {},
  };
}

function en_anchor_tension(ctx) {
  const { plate, bp } = ctx;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);
  // §6.2.6.12 / Table 3.4: tension resistance of a bolt.
  const k2 = 0.9;
  const gammaM2 = 1.25;
  const FtRd = k2 * bp.anchors.futa * plate.Ase / gammaM2;
  const total = FtRd * plate.anchorCount;

  const steps = [
    step({
      code: C18, clause: '3.6.1',
      symbol: 'F_t,Rd', description: 'Tension resistance of one anchor in the steel',
      expression: 'F_t,Rd = k_2 f_ub A_s / γ_M2, with k_2 = 0.9',
      substitution: `0.9 × ${bp.anchors.futa} × ${plate.Ase.toFixed(0)} / 1.25`,
      value: FtRd, dimension: 'force',
    }),
    step({
      code: C18, clause: '3.6.1',
      symbol: 'ΣF_t,Rd', description: 'Tension resistance of the anchor group in the steel',
      expression: 'n × F_t,Rd',
      value: total, dimension: 'force',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.tension', title: 'Anchor steel in tension',
      code: C18, clause: '3.6.1', clauseTitle: 'Design resistance of individual fasteners',
      demand: T, capacity: total, dimension: 'force',
      failureMode: 'Tensile fracture of the anchor steel',
      steps,
    })],
    scratch: { FtRd, anchorTensionCap: total },
  };
}

function en_anchor_breakout() {
  return {
    steps: [notice({
      code: C18, clause: '6.2.6.11', symbol: 'N_Rd,c',
      description: 'Concrete cone breakout of the anchors',
      note: 'EN 1993-1-8 does not give a concrete cone breakout resistance. That check belongs to EN 1992-4, which is not installed in this build.',
    })],
    checks: [check({
      id: 'anchor.breakout', title: 'Concrete breakout of the anchors',
      code: C18, clause: '6.2.6.11', clauseTitle: 'Anchor bolts in tension',
      status: CHECK_STATUS.NOT_COVERED,
      failureMode: 'Concrete cone pulling out around the anchor group',
      note: 'Not covered by EN 1993-1-8. Installed codes that address this check: ACI 318-19 Chapter 17. Select the ACI route for the base, or carry out the check to EN 1992-4 separately.',
    })],
    scratch: {},
  };
}

const EN1993_BP_HANDLERS = {
  bearing: en_bp_bearing,
  moment: en_bp_moment,
  anchorTension: en_anchor_tension,
  anchorBreakout: en_anchor_breakout,
};


/* ===== src/codes/en1993-plate.js ===== */
// codes/en1993-plate.js — welded plate girder, EN 1993-1-1.
//
// WHY EUROCODE AND NOT ECP 205
// The office sheet for built-up sections is Egyptian practice, and ECP 205 is
// the right document for it. But ECP 205 expresses its slenderness limits and
// resistance factors in coefficients this engine cannot derive, and they are
// not reproduced here. Rather than write ECP 205 equations from memory and
// flag every number, the element is built against EN 1993-1-1, which is stated
// in full on every line. ECP 205 remains selectable and returns a formal
// notice until the office supplies its table values.


const EN3 = 'EN 1993-1-1';

const EN1993_PLATE_DATA = {
  gammaM0: { value: 1.00, clause: '6.1', desc: 'Partial factor for cross-section resistance', verify: true },
  gammaM1: { value: 1.00, clause: '6.1', desc: 'Partial factor for member instability', verify: true },
};

/* ---------------- classification ---------------- */

function en3_classify(ctx) {
  const { sec, mat } = ctx;
  const eps = Math.sqrt(235 / mat.fy);

  // Outstand flange in compression, Table 5.2 sheet 2
  const cFlange = (sec.bf - sec.tw) / 2 - sec.weldLeg;
  const flangeRatio = sec.tf > 0 ? cFlange / sec.tf : Infinity;
  const flangeClass = flangeRatio <= 9 * eps ? 1 : flangeRatio <= 10 * eps ? 2 : flangeRatio <= 14 * eps ? 3 : 4;

  // Web in bending, Table 5.2 sheet 1
  const cWeb = sec.hw - 2 * sec.weldLeg;
  const webRatio = sec.tw > 0 ? cWeb / sec.tw : Infinity;
  const webClass = webRatio <= 72 * eps ? 1 : webRatio <= 83 * eps ? 2 : webRatio <= 124 * eps ? 3 : 4;

  const cls = Math.max(flangeClass, webClass);

  const steps = [
    step({
      code: EN3, clause: '5.5.2', symbol: 'ε', description: 'Material factor',
      expression: 'ε = √(235 / f_y)', substitution: `√(235 / ${mat.fy})`, value: eps,
    }),
    step({
      code: EN3, clause: '5.5.2', symbol: 'c/t flange',
      description: 'Outstand flange in compression, Table 5.2',
      expression: 'Class 1 ≤ 9ε · Class 2 ≤ 10ε · Class 3 ≤ 14ε',
      substitution: `${flangeRatio.toFixed(2)} against 9ε = ${(9 * eps).toFixed(2)}`,
      value: flangeRatio,
    }),
    step({
      code: EN3, clause: '5.5.2', symbol: 'c/t web',
      description: 'Web in bending, Table 5.2',
      expression: 'Class 1 ≤ 72ε · Class 2 ≤ 83ε · Class 3 ≤ 124ε',
      substitution: `${webRatio.toFixed(2)} against 72ε = ${(72 * eps).toFixed(2)}`,
      value: webRatio,
    }),
    derived({
      symbol: 'Class', description: 'Governing cross-section class', value: cls,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'classification',
      title: `Cross-section is class ${cls}`,
      code: EN3, clause: '5.5.2', clauseTitle: 'Classification of cross-sections',
      demand: cls, capacity: 3, dimension: null,
      failureMode: 'Local buckling of the flange or web before the section reaches its resistance',
      steps,
      note: cls === 4
        ? 'A class 4 section requires effective widths to EN 1993-1-5, which this engine does not compute. Thicken the plates or add web stiffeners.'
        : null,
    })],
    scratch: { eps, cls, flangeClass, webClass, flangeRatio, webRatio },
  };
}

/* ---------------- bending ---------------- */

function en3_bending(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gM0 = EN1993_PLATE_DATA.gammaM0.value;
  const MEd = Math.abs(Number(actions.MEd) || 0);

  // A girder with unequal flanges is mono-symmetric. Its elastic modulus
  // differs top and bottom, its shear centre is not at the centroid, and the
  // lateral torsional buckling treatment of §6.3.2 needs properties this engine
  // does not compute. The cross-section equations below assume symmetry, so a
  // mono-symmetric girder is refused rather than run through them.
  if (sec.symmetric === false) {
    return {
      steps: [notice({
        code: C18, clause: '6.2.5', symbol: 'M_c,Rd',
        description: 'Bending resistance of a mono-symmetric girder',
        note: `The flanges are not equal (${sec.bfTop} × ${sec.tfTop} above, ${sec.bfBot} × ${sec.tfBot} below). The section modulus differs on the two faces, W_el = ${(sec.Sxc / 1e3).toFixed(0)}e3 in compression against ${(sec.Sxt / 1e3).toFixed(0)}e3 in tension, and the lateral torsional buckling treatment of §6.3.2 needs the mono-symmetry parameter, which is not computed here. No resistance is produced.`,
      })],
      checks: [check({
        id: 'bending', title: 'Bending resistance of the cross-section',
        code: C18, clause: '6.2.5', clauseTitle: 'Bending moment',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Bending of a mono-symmetric girder',
        note: 'Make the flanges equal, or complete the mono-symmetric case by hand against §6.2.5 and §6.3.2.',
      })],
      scratch: { monoSymmetric: true },
    };
  }

  if (sc.cls === 4) {
    return {
      steps: [notice({
        code: EN3, clause: '6.2.5', symbol: 'M_c,Rd',
        description: 'Bending resistance of a class 4 section',
        note: 'Not calculated. A class 4 section is designed on effective widths to EN 1993-1-5, which this engine does not implement.',
      })],
      checks: [check({
        id: 'bending', title: 'Bending resistance',
        code: EN3, clause: '6.2.5', clauseTitle: 'Bending moment',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Local buckling of a slender section under bending',
      })],
      scratch: {},
    };
  }

  const plastic = sc.cls <= 2;
  const W = plastic ? sec.Wpl : sec.Wel;
  const McRd = (W * mat.fy) / gM0;

  const steps = [
    step({
      code: EN3, clause: '6.2.5', symbol: plastic ? 'W_pl' : 'W_el',
      description: plastic ? 'Plastic section modulus' : 'Elastic section modulus, used because the section is class 3',
      expression: plastic
        ? 'W_pl = b_f t_f (h − t_f) + t_w (h − 2 t_f)² / 4'
        : 'W_el = 2 I / h',
      value: W,
    }),
    step({
      code: EN3, clause: '6.2.5', symbol: 'M_c,Rd', description: 'Design bending resistance of the cross-section',
      expression: plastic ? 'M_c,Rd = W_pl f_y / γ_M0' : 'M_c,Rd = W_el f_y / γ_M0',
      value: McRd, dimension: 'moment', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'bending', title: 'Bending resistance of the cross-section',
      code: EN3, clause: '6.2.5', clauseTitle: 'Bending moment',
      demand: MEd, capacity: McRd, dimension: 'moment',
      failureMode: 'Yielding of the cross-section in bending',
      steps, verify: true,
      note: 'Lateral torsional buckling is not verified here. Where the compression flange is not restrained along its length, §6.3.2 governs and must be checked separately.',
    })],
    scratch: { McRd, W, plastic },
  };
}

/* ---------------- shear ---------------- */

function en3_shear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gM0 = EN1993_PLATE_DATA.gammaM0.value;
  const VEd = Math.abs(Number(actions.VEd) || 0);

  // Welded I-section loaded parallel to the web
  const Av = sec.hw * sec.tw;
  const VplRd = (Av * mat.fy) / (Math.sqrt(3) * gM0);

  // Web shear buckling check, §6.2.6(6)
  const eta = 1.0;
  const webSlenderness = sec.tw > 0 ? sec.hw / sec.tw : Infinity;
  const bucklingLimit = 72 * sc.eps / eta;
  const needsBucklingCheck = webSlenderness > bucklingLimit;

  const steps = [
    step({
      code: EN3, clause: '6.2.6', symbol: 'A_v', description: 'Shear area of a welded section, taken as the web',
      expression: 'A_v = h_w t_w', value: Av, dimension: 'area',
    }),
    step({
      code: EN3, clause: '6.2.6', symbol: 'V_pl,Rd', description: 'Design plastic shear resistance',
      expression: 'V_pl,Rd = A_v f_y / (√3 γ_M0)', value: VplRd, dimension: 'force',
    }),
    step({
      code: EN3, clause: '6.2.6', symbol: 'h_w/t_w', description: 'Web slenderness, against the limit beyond which shear buckling must be verified',
      expression: 'h_w/t_w ≤ 72 ε / η with η = 1.0',
      substitution: `${webSlenderness.toFixed(1)} against ${bucklingLimit.toFixed(1)}`,
      value: webSlenderness,
      note: needsBucklingCheck
        ? 'The web is slender enough that shear buckling must be verified to EN 1993-1-5 §5, which this engine does not do.'
        : null,
    }),
  ];

  const checks = [check({
    id: 'shear', title: 'Shear resistance of the web',
    code: EN3, clause: '6.2.6', clauseTitle: 'Shear',
    demand: VEd, capacity: VplRd, dimension: 'force',
    failureMode: 'Yielding of the web in shear',
    steps,
  })];

  if (needsBucklingCheck) {
    checks.push(check({
      id: 'shearBuckling', title: 'Shear buckling of the web',
      code: 'EN 1993-1-5', clause: '5', clauseTitle: 'Resistance to shear',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Shear buckling of a slender web',
      note: `The web slenderness ${webSlenderness.toFixed(1)} exceeds 72ε = ${bucklingLimit.toFixed(1)}, so shear buckling governs and must be verified to EN 1993-1-5, or transverse stiffeners added.`,
    }));
  }

  return { steps, checks, scratch: { Av, VplRd, webSlenderness, needsBucklingCheck } };
}

/* ---------------- moment and shear interaction ---------------- */

function en3_interaction(ctx, sc) {
  const { actions } = ctx;
  const VEd = Math.abs(Number(actions.VEd) || 0);
  const MEd = Math.abs(Number(actions.MEd) || 0);

  if (!sc.VplRd || !sc.McRd) {
    return {
      steps: [notice({
        code: EN3, clause: '6.2.8', symbol: 'M_V,Rd',
        description: 'Bending and shear interaction',
        note: 'Not evaluated, because either the bending or the shear resistance was not established.',
      })],
      checks: [], scratch: {},
    };
  }

  const ratio = VEd / sc.VplRd;
  if (ratio <= 0.5) {
    return {
      steps: [step({
        code: EN3, clause: '6.2.8', symbol: 'V_Ed / V_pl,Rd',
        description: 'Shear is below half the plastic shear resistance, so no reduction to the moment resistance is required',
        expression: '§6.2.8(2): no allowance is needed where V_Ed ≤ 0.5 V_pl,Rd',
        value: ratio,
      })],
      checks: [check({
        id: 'interaction', title: 'Bending and shear interaction',
        code: EN3, clause: '6.2.8', clauseTitle: 'Bending and shear',
        status: CHECK_STATUS.NOT_APPLICABLE,
        note: 'Shear is below half the plastic resistance, so §6.2.8 requires no reduction.',
      })],
      scratch: { shearRatio: ratio },
    };
  }

  const rho = Math.pow(2 * ratio - 1, 2);
  const McRdRed = sc.McRd * (1 - rho);

  const steps = [
    step({
      code: EN3, clause: '6.2.8', symbol: 'ρ', description: 'Reduction factor on the yield strength of the shear area',
      expression: 'ρ = (2 V_Ed / V_pl,Rd − 1)²', value: rho,
    }),
    step({
      code: EN3, clause: '6.2.8', symbol: 'M_V,Rd', description: 'Reduced bending resistance allowing for coexisting shear',
      value: McRdRed, dimension: 'moment',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'interaction', title: 'Bending with coexisting shear',
      code: EN3, clause: '6.2.8', clauseTitle: 'Bending and shear',
      demand: MEd, capacity: McRdRed, dimension: 'moment',
      failureMode: 'Combined bending and shear: the web cannot carry its share of the moment while carrying this shear',
      steps,
    })],
    scratch: { rho, McRdRed, shearRatio: ratio },
  };
}

const EN1993_PLATE_HANDLERS = {
  classify: en3_classify,
  bending: en3_bending,
  shear: en3_shear,
  interaction: en3_interaction,
};


/* ===== src/codes/aci318-anchor.js ===== */
// codes/aci318-anchor.js — ACI 318-19 Chapter 17 anchorage, with the base plate
// bearing of AISC 360-22 §J8 and the thickness rule of AISC Design Guide 1.
//
// SI units throughout: N, mm, MPa. The Chapter 17 coefficients used here are the
// SI values of ACI 318M.
//
// NOT IMPLEMENTED, by decision rather than oversight:
//   - concrete breakout in shear (§17.7.2), which is strongly edge-dependent
//   - anchor groups closer to an edge than 1.5 h_ef, where the projected area
//     A_Nc must be cut by the edge
//   - side-face blowout (§17.6.4)
// Each returns a notice naming its clause. None returns a number.


const ACI = 'ACI 318-19';
const AISC = 'AISC 360-22';
const DG1 = 'AISC Design Guide 1';

/* ---------------- bearing and plate thickness ---------------- */

function aci_bp_bearing(ctx) {
  const { plate, bp, mat } = ctx;
  const phiC = 0.65;
  const ratio = Math.min(2.0, Math.sqrt(plate.A2 / plate.A1));
  const Pp = Math.min(0.85 * mat.fcPrime * plate.A1 * ratio, 1.7 * mat.fcPrime * plate.A1);
  const design = phiC * Pp;
  const Pu = Math.max(0, Number(ctx.actions.NEd) || 0);

  // Design Guide 1 cantilever lengths. λ is taken as 1.0, which is the
  // conservative simplification the guide permits.
  const m = plate.round
    ? (bp.Dp - 0.80 * plate.colOuterB) / 2
    : (bp.N - 0.95 * plate.colOuterN) / 2;
  const n = plate.round
    ? m
    : (bp.B - 0.95 * plate.colOuterB) / 2;
  const nPrime = plate.round
    ? plate.colOuterB / 4
    : Math.sqrt(plate.colOuterB * plate.colOuterN) / 4;
  const l = Math.max(m, n, nPrime);

  const B = plate.round ? bp.Dp : bp.B;
  const N = plate.round ? bp.Dp : bp.N;
  const tMin = l * Math.sqrt((2 * Pu) / (0.9 * bp.fyPlate * B * N));

  const steps = [
    step({
      code: AISC, clause: 'J8',
      symbol: 'P_p', description: 'Nominal bearing strength of the concrete under the plate',
      expression: 'P_p = 0.85 f′_c A_1 √(A_2/A_1) ≤ 1.7 f′_c A_1',
      substitution: `√(A_2/A_1) = ${ratio.toFixed(3)} (capped at 2.0)`,
      value: Pp, dimension: 'force',
    }),
    step({
      code: AISC, clause: 'J8',
      symbol: 'φ_c P_p', description: 'Design bearing strength',
      expression: 'φ_c = 0.65',
      value: design, dimension: 'force',
    }),
    step({
      code: DG1, clause: '3',
      symbol: 'l', description: 'Governing plate cantilever length',
      expression: 'l = max(m, n, λn′), with λ taken as 1.0',
      substitution: `m = ${m.toFixed(1)}, n = ${n.toFixed(1)}, n′ = ${nPrime.toFixed(1)}`,
      value: l, dimension: 'length',
      verify: true,
    }),
    step({
      code: DG1, clause: '3',
      symbol: 't_min', description: 'Required base plate thickness',
      expression: 't_min = l √(2 P_u / (0.9 F_y B N))',
      value: tMin, dimension: 'length',
      verify: true,
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'bp.bearing', title: 'Concrete bearing under the base plate',
        code: AISC, clause: 'J8', clauseTitle: 'Bearing strength on concrete',
        demand: Pu, capacity: design, dimension: 'force',
        failureMode: 'Crushing of the concrete beneath the plate',
        steps,
      }),
      check({
        id: 'bp.thickness', title: 'Base plate thickness',
        code: DG1, clause: '3', clauseTitle: 'Design of axially loaded base plates',
        demand: tMin, capacity: bp.tp, dimension: 'length',
        failureMode: 'Yielding of the plate in bending across the cantilever',
        verify: true,
        note: 'Taken from a design guide rather than a code. λ has been taken as 1.0, which is conservative.',
      }),
    ],
    scratch: { Pp, bearingDesign: design, tMin, l },
  };
}

/* ---------------- anchors ---------------- */

function aci_anchor_tension(ctx) {
  const { plate, bp } = ctx;
  const phi = 0.75;
  const Nsa = plate.Ase * bp.anchors.futa;
  const total = phi * Nsa * plate.anchorCount;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);

  const steps = [
    step({
      code: ACI, clause: '17.6.1',
      symbol: 'N_sa', description: 'Nominal steel strength of one anchor in tension',
      expression: 'N_sa = A_se,N f_uta',
      substitution: `${plate.Ase.toFixed(0)} × ${bp.anchors.futa}`,
      value: Nsa, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ N_sa', description: 'Design steel strength of the anchor group in tension',
      expression: 'φ = 0.75 for a ductile steel element',
      value: total, dimension: 'force',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.tension', title: 'Anchor steel in tension',
      code: ACI, clause: '17.6.1', clauseTitle: 'Steel strength of anchor in tension',
      demand: T, capacity: total, dimension: 'force',
      failureMode: 'Tensile fracture of the anchor steel',
      steps,
    })],
    scratch: { NsaGroup: total },
  };
}

function aci_anchor_shear(ctx) {
  const { plate, bp } = ctx;
  const phi = 0.65;
  const Vsa = 0.6 * plate.Ase * bp.anchors.futa;
  const total = phi * Vsa * plate.anchorCount;
  const V = Math.abs(Number(ctx.actions.VEd) || 0);

  const steps = [
    step({
      code: ACI, clause: '17.7.1',
      symbol: 'V_sa', description: 'Nominal steel strength of one cast-in headed anchor in shear',
      expression: 'V_sa = 0.6 A_se,V f_uta',
      value: Vsa, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ V_sa', description: 'Design steel strength of the anchor group in shear',
      expression: 'φ = 0.65 for a ductile steel element in shear',
      value: total, dimension: 'force',
      note: 'Where the anchors bear on an oversized hole or through grout, §17.7.1 requires the strength to be reduced. Confirm the detail before relying on this value.',
      verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.shear', title: 'Anchor steel in shear',
      code: ACI, clause: '17.7.1', clauseTitle: 'Steel strength of anchor in shear',
      demand: V, capacity: total, dimension: 'force',
      failureMode: 'Shear fracture of the anchor steel',
      steps, verify: true,
    })],
    scratch: { VsaGroup: total },
  };
}

function aci_anchor_breakout(ctx) {
  const { plate, bp, mat } = ctx;
  const a = bp.anchors;
  const hef = Number(a.hef) || 0;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);

  // The projected area A_Nc is only equal to n·A_Nco where no edge cuts it and
  // the anchors do not overlap. Outside that, the projection must be drawn.
  const edgeOk = a.edge >= 1.5 * hef;
  const spacingOk = a.spacing >= 3 * hef;

  if (!edgeOk || !spacingOk) {
    const why = [
      !edgeOk ? `the smallest edge distance ${a.edge} mm is less than 1.5 h_ef = ${(1.5 * hef).toFixed(0)} mm` : null,
      !spacingOk ? `the anchor spacing ${a.spacing} mm is less than 3 h_ef = ${(3 * hef).toFixed(0)} mm` : null,
    ].filter(Boolean).join(', and ');
    return {
      steps: [notice({
        code: ACI, clause: '17.6.2',
        symbol: 'N_cbg', description: 'Concrete breakout strength of the anchor group in tension',
        note: `Not calculated because ${why}. The projected failure area A_Nc must then be drawn against the edges and the overlapping cones, which this build does not do.`,
      })],
      checks: [check({
        id: 'anchor.breakout', title: 'Concrete breakout of the anchors in tension',
        code: ACI, clause: '17.6.2', clauseTitle: 'Concrete breakout strength of anchor in tension',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Concrete cone pulling out around the anchor group',
        note: `Edge or spacing effects govern the projected area: ${why}. Complete §17.6.2 by hand, or increase the edge distance and spacing above 1.5 h_ef and 3 h_ef.`,
      })],
      scratch: { breakoutLimited: true },
    };
  }

  const kc = 10; // SI value for cast-in anchors
  const lambdaA = 1.0; // normal weight concrete
  const Nb = kc * lambdaA * Math.sqrt(mat.fcPrime) * Math.pow(hef, 1.5);
  const ANco = 9 * hef * hef;
  const ANc = ANco * plate.anchorCount;
  const psiEd = 1.0;
  const psiC = 1.0; // no supplementary reinforcement, cracked concrete assumed
  const Ncbg = (ANc / ANco) * psiEd * psiC * Nb;
  const phi = 0.70; // Condition B, no supplementary reinforcement
  const design = phi * Ncbg;

  const steps = [
    step({
      code: ACI, clause: '17.6.2',
      symbol: 'N_b', description: 'Basic concrete breakout strength of a single cast-in anchor',
      expression: 'N_b = k_c λ_a √f′_c h_ef^1.5, with k_c = 10 in SI units',
      value: Nb, dimension: 'force', verify: true,
    }),
    step({
      code: ACI, clause: '17.6.2',
      symbol: 'A_Nco', description: 'Projected area of one anchor with no edge or spacing effects',
      expression: 'A_Nco = 9 h_ef²',
      value: ANco, dimension: 'area',
    }),
    step({
      code: ACI, clause: '17.6.2',
      symbol: 'N_cbg', description: 'Concrete breakout strength of the anchor group',
      expression: 'N_cbg = (A_Nc/A_Nco) ψ_ed,N ψ_c,N N_b, with ψ = 1.0 where no edge cuts the cone',
      value: Ncbg, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ N_cbg', description: 'Design concrete breakout strength',
      expression: 'φ = 0.70, Condition B, cracked concrete with no supplementary reinforcement',
      value: design, dimension: 'force', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.breakout', title: 'Concrete breakout of the anchors in tension',
      code: ACI, clause: '17.6.2', clauseTitle: 'Concrete breakout strength of anchor in tension',
      demand: T, capacity: design, dimension: 'force',
      failureMode: 'Concrete cone pulling out around the anchor group',
      steps, verify: true,
      note: 'Cracked concrete and Condition B have been assumed. Confirm the strength reduction factor and the cracking assumption against §17.5.3 for this member.',
    })],
    scratch: { NcbgDesign: design, hef },
  };
}

function aci_anchor_pullout(ctx) {
  const { plate, mat } = ctx;
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);
  const Np = 8 * plate.Abrg * mat.fcPrime;
  const phi = 0.70;
  const design = phi * Np * plate.anchorCount;

  const steps = [
    step({
      code: ACI, clause: '17.6.3',
      symbol: 'N_p', description: 'Pullout strength of one headed anchor',
      expression: 'N_p = 8 A_brg f′_c',
      substitution: `8 × ${plate.Abrg.toFixed(0)} × ${mat.fcPrime}`,
      value: Np, dimension: 'force',
    }),
    step({
      code: ACI, clause: '17.5.3',
      symbol: 'φ N_pn', description: 'Design pullout strength of the group',
      expression: 'φ = 0.70; ψ_c,P taken as 1.0 for cracked concrete',
      value: design, dimension: 'force', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.pullout', title: 'Anchor pullout',
      code: ACI, clause: '17.6.3', clauseTitle: 'Pullout strength of a single anchor in tension',
      demand: T, capacity: design, dimension: 'force',
      failureMode: 'The anchor head pulling through the concrete',
      steps, verify: true,
    })],
    scratch: { pulloutDesign: design },
  };
}

function aci_anchor_shear_breakout(ctx) {
  return {
    steps: [notice({
      code: ACI, clause: '17.7.2',
      symbol: 'V_cbg', description: 'Concrete breakout strength of the anchors in shear',
      note: 'Not calculated. §17.7.2 depends on the edge distance in the direction of the shear and on the projected area A_Vc, which this build does not draw. Where shear is transferred by bearing on a shear lug or by friction under §17.5.1.3, this check may not govern.',
    })],
    checks: [check({
      id: 'anchor.shearBreakout', title: 'Concrete breakout of the anchors in shear',
      code: ACI, clause: '17.7.2', clauseTitle: 'Concrete breakout strength of anchor in shear',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Concrete breaking out towards a free edge under shear',
      note: 'Complete §17.7.2 by hand, or transfer the shear by a shear lug so that anchor shear breakout does not govern.',
    })],
    scratch: {},
  };
}

function aci_anchor_interaction(ctx, sc) {
  const T = Math.max(0, Number(ctx.actions.upliftEd) || 0);
  const V = Math.abs(Number(ctx.actions.VEd) || 0);

  const Nn = minDefined([sc.NsaGroup, sc.NcbgDesign, sc.pulloutDesign]);
  const Vn = sc.VsaGroup;

  if (!Nn || !Vn) {
    return {
      steps: [notice({
        code: ACI, clause: '17.8',
        symbol: 'interaction', description: 'Tension and shear interaction',
        note: 'Not evaluated because one of the governing tension or shear strengths was not established. The interaction of §17.8 cannot be applied to an incomplete set.',
      })],
      checks: [check({
        id: 'anchor.interaction', title: 'Anchor tension and shear interaction',
        code: ACI, clause: '17.8', clauseTitle: 'Tension and shear interaction',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        note: 'A governing tension or shear strength is missing, so the interaction cannot be evaluated.',
      })],
      scratch: {},
    };
  }

  const rn = T / Nn;
  const rv = V / Vn;

  if (rn <= 0.2 || rv <= 0.2) {
    return {
      steps: [step({
        code: ACI, clause: '17.8.1',
        symbol: 'interaction', description: 'Tension and shear interaction may be disregarded',
        expression: '§17.8.1 and §17.8.2: where either N_ua ≤ 0.2 φN_n or V_ua ≤ 0.2 φV_n, the full strength may be taken in the other direction',
        substitution: `N ratio ${rn.toFixed(3)}, V ratio ${rv.toFixed(3)}`,
        value: Math.max(rn, rv),
      })],
      checks: [check({
        id: 'anchor.interaction', title: 'Anchor tension and shear interaction',
        code: ACI, clause: '17.8.1', clauseTitle: 'Tension and shear interaction',
        status: CHECK_STATUS.NOT_APPLICABLE,
        note: 'One action is at or below 20% of its strength, so §17.8 permits the interaction to be disregarded.',
      })],
      scratch: {},
    };
  }

  const value = Math.pow(rn, 5 / 3) + Math.pow(rv, 5 / 3);
  const steps = [
    step({
      code: ACI, clause: '17.8.3',
      symbol: 'Σ', description: 'Combined tension and shear on the anchor group',
      expression: '(N_ua/φN_n)^(5/3) + (V_ua/φV_n)^(5/3) ≤ 1.2',
      substitution: `(${rn.toFixed(3)})^(5/3) + (${rv.toFixed(3)})^(5/3)`,
      value,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'anchor.interaction', title: 'Anchor tension and shear interaction',
      code: ACI, clause: '17.8.3', clauseTitle: 'Tension and shear interaction',
      utilisation: value / 1.2, limit: 1.0,
      failureMode: 'Combined tension and shear on the anchor group',
      steps,
    })],
    scratch: { interaction: value },
  };
}

function minDefined(arr) {
  const vals = arr.filter((x) => Number.isFinite(x) && x > 0);
  return vals.length ? Math.min(...vals) : null;
}

// codes/index.js — the one place a new design code is plugged in.
//
// TO ADD A CODE:
//   1. create codes/<yourcode>.js exporting a module object (see registry.js)
//   2. import it here and add it to the array below
//   3. nothing else changes — not the engine, not the UI, not the sheet
//
// The registry validates shape on registration, so a malformed module fails
// loudly at start-up rather than silently producing wrong numbers later.


const ALL_CODE_MODULES = [
  ...EGYPTIAN_CODES,
  ...EUROCODES,
  ...AMERICAN_CODES,
];

let installed = false;

function installCodes() {
  if (installed) return registry;
  registry.registerAll(ALL_CODE_MODULES);
  installed = true;
  return registry;
}

// ui/theme.js — visual identity derived from the Trust Group logo.
//
// Values were sampled from the supplied artwork, not guessed:
//   #E41D24  dominant red of the upper arc  (most frequent saturated pixel)
//   #C4171D  deeper red of the lower arc / shadow side
//   #000000  true black of the TRUST wordmark (not an off-black)
//   #FFFFFF  field
//
// Identity rules that follow from the mark:
//   - The mark is a heavy slab wordmark with hard corners. Radii stay at 0–2px.
//   - The mark uses red as a gesture, not a field. Red is therefore reserved
//     for the brand rail and for critical status. Primary buttons are ink.
//     This keeps UNSAFE legible instead of drowning in brand colour.
//   - Black carries structure (rails, title blocks, table heads); white carries
//     content. Grey is used only for rules and secondary text.

const BRAND = {
  red: '#E41D24',
  redDeep: '#C4171D',
  redDark: '#8E0F15',
  redTint: '#FDECEC',
  ink: '#000000',
  ink80: '#1A1A1A',
  ink60: '#4A4A48',
  ink40: '#77776F',
  rule: '#D6D6D0',
  ruleSoft: '#E8E8E2',
  paper: '#FFFFFF',
  board: '#EDEDE8',
  boardDeep: '#DEDED7',
};

const STATUS = {
  safe: '#166B34',
  safeTint: '#E7F3EA',

  unsafeTint: BRAND.redTint,
  caution: '#8A5A00',

const TYPE = {

/* ===== src/ui/dom.js ===== */
// ui/dom.js — a 60-line view layer.
//
// A design office tool must open from a file with no toolchain and no network.
// That rules out a bundled framework, so the view layer is hand-rolled and
// deliberately small. h() builds elements; mount() swaps children.

function h(tag, props = null, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'html') el.innerHTML = v;
      else if (k in el && k !== 'list' && typeof v !== 'object') {
        try { el[k] = v; } catch { el.setAttribute(k, v); }
      } else el.setAttribute(k, v);
    }
  }
  append(el, children);
  return el;
}

function append(el, children) {
  for (const c of children) {
    if (c === null || c === undefined || c === false || c === true) continue;
    if (Array.isArray(c)) { append(el, c); continue; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function frag(...children) {
  const f = document.createDocumentFragment();
  append(f, children);
  return f;
}

function mount(container, ...children) {
  container.replaceChildren();
  append(container, children);
  return container;
}

function qs(sel, root = document) { return root.querySelector(sel); }

function clear(el) { el.replaceChildren(); return el; }

/** Injects a stylesheet once, keyed by id. */
function injectStyle(id, css) {
  let tag = document.getElementById(id);
  if (!tag) {
    tag = document.createElement('style');
    tag.id = id;
    document.head.appendChild(tag);
  }
  tag.textContent = css;
  return tag;
}

/**
 * Re-rendering replaces DOM nodes, which drops focus and caret position. Any
 * screen that repaints while the user is typing must go through this, or the
 * field loses focus after every keystroke.
 *
 * Controls are matched by id, so every control that lives inside a repainting
 * region needs a stable id.
 */
function preserveFocus(paint) {
  const active = document.activeElement;
  const id = active && active.id ? active.id : null;
  let start = null;
  let end = null;
  if (id && typeof active.selectionStart === 'number') {
    try { start = active.selectionStart; end = active.selectionEnd; } catch { /* type does not support selection */ }
  }
  const scroller = document.querySelector('.tg-board');
  const scrollTop = scroller ? scroller.scrollTop : 0;

  paint();

  if (scroller) scroller.scrollTop = scrollTop;
  if (!id) return;
  const next = document.getElementById(id);
  if (!next || next === document.activeElement) return;
  next.focus({ preventScroll: true });
  if (start !== null && typeof next.setSelectionRange === 'function') {
    try { next.setSelectionRange(start, end); } catch { /* number and date inputs refuse this */ }
  }
}

/** Focus the first invalid or first focusable control inside a container. */
function focusFirst(container) {
  const el = container.querySelector('[data-invalid="true"] input, [data-invalid="true"] select, input, select, textarea, button');
  if (el) el.focus();
}
