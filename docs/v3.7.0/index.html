/* ===== src/core/ids.js ===== */
// core/ids.js — identifier and revision utilities.
// No dependencies. Pure functions only.

let _seq = 0;

/** Short, collision-resistant id. Not cryptographic. */
function uid(prefix = 'id') {
  _seq += 1;
  const t = Date.now().toString(36);
  const r = Math.random().toString(36).slice(2, 7);
  return `${prefix}_${t}${_seq.toString(36)}${r}`;
}

/** ISO-8601 timestamp in UTC, used for every audit record. */
function nowIso() {
  return new Date().toISOString();
}

/** Today as yyyy-mm-dd, for date inputs. */
function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

/**
 * Revision labels follow drawing-office convention:
 *   P01, P02 ... for preliminary issues
 *   C01, C02 ... for construction issues
 * Returns the next label in the same series.
 */
function nextRevision(label) {
  const m = /^([A-Z]*)(\d+)$/.exec(String(label || '').trim().toUpperCase());
  if (!m) return 'P01';
  const width = m[2].length;
  const n = parseInt(m[2], 10) + 1;
  return m[1] + String(n).padStart(width, '0');
}

/** "Mohamed Adel Hassan" -> "MAH". Used in title blocks. */
function initials(name) {
  return String(name || '')
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 3)
    .map((w) => w[0].toUpperCase())
    .join('');
}


/* ===== src/core/units.js ===== */
// core/units.js — unit systems and quantity formatting.
//
// ARCHITECTURAL RULE (do not break):
//   Every value stored in the model and every value entering a design engine
//   is in BASE units. Conversion happens only at the UI boundary.
//
//   BASE UNITS:  length mm | force N | stress N/mm^2 (MPa) | moment N*mm
//                area mm^2 | mass kg | density kg/m^3 | temperature degC
//
// This keeps code modules (EN, AISC, ACI, ECP) free of unit logic entirely.

const DIMENSIONS = [
  'length', 'force', 'stress', 'moment', 'area', 'inertia',
  'mass', 'density', 'temperature', 'angle', 'lineLoad', 'areaLoad',
];

/**
 * Each entry: display symbol + factor such that
 *   baseValue = displayValue * factor
 *   displayValue = baseValue / factor
 */
const UNIT_SYSTEMS = {
  SI: {
    id: 'SI',
    label: 'SI — kN, mm, MPa',
    note: 'Newton-based. Default for Eurocode and AISC (metric) work.',
    units: {
      length:      { symbol: 'mm',     factor: 1,        decimals: 1 },
      force:       { symbol: 'kN',     factor: 1e3,      decimals: 2 },
      stress:      { symbol: 'MPa',    factor: 1,        decimals: 2 },

const DEFAULT_SYSTEM = 'SI';

function systemList() {
  return Object.values(UNIT_SYSTEMS).map((s) => ({ id: s.id, label: s.label, note: s.note }));
}

function unitDef(systemId, dimension) {
  const sys = UNIT_SYSTEMS[systemId] || UNIT_SYSTEMS[DEFAULT_SYSTEM];
  const def = sys.units[dimension];
  if (!def) throw new Error(`units: unknown dimension "${dimension}"`);
  return def;
}

function symbolFor(systemId, dimension) {
  return unitDef(systemId, dimension).symbol;
}

/** Display value -> base value. */
function toBase(value, dimension, systemId) {
  const v = Number(value);
  if (!Number.isFinite(v)) return NaN;
  const def = unitDef(systemId, dimension);
  if (def.offset && dimension === 'temperature') return (v - 32) * (5 / 9);
  return v * def.factor;
}

/** Base value -> display value. */
function fromBase(value, dimension, systemId) {
  const v = Number(value);
  if (!Number.isFinite(v)) return NaN;
  const def = unitDef(systemId, dimension);
  if (def.offset && dimension === 'temperature') return v * (9 / 5) + 32;
  return v / def.factor;
}

/**
 * Format a base-unit value for display.
 * Returns { value, text, symbol } — never a pre-joined string only, because
 * calculation sheets need to align the number and the symbol in separate cells.
 */
function format(baseValue, dimension, systemId, opts = {}) {
  const def = unitDef(systemId, dimension);
  const decimals = opts.decimals ?? def.decimals;
  const v = fromBase(baseValue, dimension, systemId);
  if (!Number.isFinite(v)) return { value: NaN, text: '—', symbol: def.symbol };
  const abs = Math.abs(v);
  let text;
  if (abs !== 0 && (abs >= 1e6 || abs < 1e-3)) {
    text = v.toExponential(Math.min(decimals, 3));
  } else {
    text = v.toFixed(decimals);
  }
  return { value: v, text, symbol: def.symbol };
}

/** Convenience: "1234.56 kN" */
function formatWithUnit(baseValue, dimension, systemId, opts) {
  const f = format(baseValue, dimension, systemId, opts);
  return f.text === '—' ? '—' : `${f.text} ${f.symbol}`;
}

/** Plain number formatting for dimensionless quantities (ratios, factors). */
function formatNumber(value, decimals = 3) {
  const v = Number(value);
  if (!Number.isFinite(v)) return '—';
  return v.toFixed(decimals);
}


/**
 * A strength shown in the project's units, with the SI value beside it when
 * they differ.
 *
 * Steel and concrete grades are named in MPa everywhere — S355, C30/37, f_cu 30
 * — whatever units a project works in. On an MKS project the same strength
 * reads 3619.99 kg/cm², which is correct and tells the engineer nothing about
 * which grade is in front of them. Both are shown so the number stays usable
 * and the grade stays recognisable.
 */
function formatStrength(valueMPa, units) {
  const v = Number(valueMPa);
  if (!Number.isFinite(v)) return '—';
  const si = `${Number(v.toFixed(v < 10 ? 2 : 0))} MPa`;
  const sym = symbolFor(units, 'stress');
  if (sym === 'MPa') return si;
  const local = fromBase(v, 'stress', units);
  return `${si} (${Number(local.toFixed(local < 10 ? 2 : 0))} ${sym})`;
}

function compareVersions(a, b) {
  const pa = String(a || '0').split('.').map(Number);
  const pb = String(b || '0').split('.').map(Number);
  for (let i = 0; i < 3; i += 1) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d) return d < 0 ? -1 : 1;
  }
  return 0;
}

function isOlderThanCurrent(v) {
  return !!v && compareVersions(v, PLATFORM_VERSION) < 0;
}

/** A compact, storable snapshot of a result, kept so it can be compared later. */
function snapshotResult(result, version) {
  if (!result) return null;
  return {
    platformVersion: version,
    takenAt: new Date().toISOString(),
    runCodeId: result.runCodeId || null,
    overall: result.summary.overall,
    maxUtilisation: result.summary.maxUtilisation,
    governing: result.summary.governing ? result.summary.governing.title : null,
    checks: result.checks.map((c) => ({
      id: c.id, title: c.title, code: c.code, clause: c.clause,
      status: c.status, utilisation: c.utilisation,
      demand: c.demand, capacity: c.capacity, dimension: c.dimension,
    })),
  };
}

/**
 * Line-by-line difference between an old snapshot and a fresh result.
 * Returns rows the UI prints verbatim, plus whether anything moved at all.
 */
function diffResults(before, after) {
  if (!before || !after) return { rows: [], changed: false, verdictChanged: false };
  const map = new Map(before.checks.map((c) => [c.id, c]));
  const seen = new Set();
  const rows = [];

  for (const now of after.checks) {
    const was = map.get(now.id) || null;
    seen.add(now.id);
    rows.push(buildRow(now.id, now.title, was, now));
  }
  for (const was of before.checks) {
    if (seen.has(was.id)) continue;
    rows.push(buildRow(was.id, was.title, was, null));
  }

  const changed = rows.some((r) => r.moved);
  return {
    rows,
    changed,
    verdictChanged: before.overall !== after.summary.overall,
    beforeOverall: before.overall,
    afterOverall: after.summary.overall,
    beforeVersion: before.platformVersion,
    afterVersion: PLATFORM_VERSION,
  };
}

function buildRow(id, title, was, now) {
  const uWas = was && Number.isFinite(was.utilisation) ? was.utilisation : null;
  const uNow = now && Number.isFinite(now.utilisation) ? now.utilisation : null;
  const statusMoved = (was ? was.status : null) !== (now ? now.status : null);
  const uMoved = uWas !== null && uNow !== null
    ? Math.abs(uWas - uNow) > 1e-6
    : uWas !== uNow;

  let note = null;
  if (!was) note = 'New check in this version';
  else if (!now) note = 'This check no longer applies in this version';

  return {
    id,
    title: title || (was && was.title) || id,
    code: (now && now.code) || (was && was.code) || null,
    clause: (now && now.clause) || (was && was.clause) || null,
    statusBefore: was ? was.status : null,
    statusAfter: now ? now.status : null,
    utilBefore: uWas,
    utilAfter: uNow,
    capacityBefore: was ? was.capacity : null,
    capacityAfter: now ? now.capacity : null,
    dimension: (now && now.dimension) || (was && was.dimension) || null,
    moved: statusMoved || uMoved || !was || !now,
    note,
  };
}

// core/build.js — which exact build is running.
//
// PLATFORM_VERSION answers "which engineering release is this", and only moves
// when a published equation moves. BUILD_NUMBER answers "which exact build am I
// looking at", and moves every single time the bundler runs.
//
// The two are deliberately separate. A signed sheet is reproducible from the
// version; the build number is there so that during active development nobody
// argues with a cached page.
//
// The tokens below are replaced by tools/bundle.mjs. Unbundled source keeps the
// tokens, which is how the code detects it is running from src/ directly.

const RAW_NUMBER = "206";
const RAW_TIME = "2026-09-15T19:30:43.950Z";

const IS_BUNDLED = !RAW_NUMBER.startsWith('__');
const BUILD_NUMBER = IS_BUNDLED ? Number(RAW_NUMBER) : 0;
const BUILD_TIME = IS_BUNDLED ? RAW_TIME : new Date().toISOString();

/** "build 12 · 07/09 03:15" — short enough for the header badge. */
function buildLabel() {
  if (!IS_BUNDLED) return 'dev build';
  const d = new Date(BUILD_TIME);
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `build ${BUILD_NUMBER} · ${dd}/${mm} ${hh}:${mi}`;
}

function buildStamp() {
  return IS_BUNDLED ? `${BUILD_NUMBER}` : 'dev';
}

// core/i18n.js — language, direction, and the translation tool.
//
// HOW THIS WORKS, AND WHAT IT DELIBERATELY LEAVES ALONE
//
// Translation happens as a pass over the rendered page rather than by threading
// a t() call through every one of the forty-odd view files. That choice is
// pragmatic: it covers the whole interface at once and it powers the hover
// translator from the same dictionary, at the cost of only translating strings
// the dictionary knows.
//
// NEVER TRANSLATED, by design:
//   - clause references     EN 1994-1-1 §6.7.3.5
//   - symbols               N_pl,Rd   λ̄   h_ef
//   - equations as published
//   - code titles and editions
//   - anything the engineer typed
// These are the reference trail. Translating them would break the match against
// the office's controlled copy, which is the one thing a checker relies on.

const LANGS = { EN: 'en', AR: 'ar' };

let current = LANGS.EN;
let sheetLang = LANGS.EN;
let translateMode = false;

function lang() { return current; }
function sheetLanguage() { return sheetLang; }
function setSheetLanguage(l) { sheetLang = l; }
function isTranslateMode() { return translateMode; }
function setTranslateMode(on) { translateMode = on; }

function setLang(l) {
  current = l === LANGS.AR ? LANGS.AR : LANGS.EN;
  const html = document.documentElement;
  html.lang = current;
  html.dir = current === LANGS.AR ? 'rtl' : 'ltr';
  return current;
}

  'Your name is attached to every change you make and prints on every sheet you produce.':

    'يُطبع هذا على ورقة الحسابات كقرار هندسي مسجّل، باسمك.',
  'EN 1993-1-8 covers bearing and the plate; ACI 318-19 additionally covers concrete breakout and pullout.':

  'Each item carries its own code, revision, designer and checker. Status falls back to draft whenever an input changes.':

  'Every calculation, drawing and export produced here is tied to a project record: its client, its revision, its units, and the codes it is designed to.':

  'Generated automatically, editable, and recalculated the moment they change. A reason is required and is written to the change log.':
    'تُولَّد تلقائياً، وقابلة للتعديل، ويُعاد الحساب فور تغييرها. السبب إلزامي ويُكتب في سجل التغييرات.',
  'Held with the platform, not with the project, so names do not have to be retyped for every job.':
    'محفوظ مع المنصة لا مع المشروع، فلا تُعاد كتابة الأسماء لكل مشروع.',

/** Translate one interface string. Unknown strings come back unchanged. */
function t(text) {
  if (current === LANGS.EN) return text;
  return UI[text] || text;
}

/**
 * What the hover translator shows for a piece of text: the whole-string
 * translation if the dictionary has it, otherwise every glossary term found
 * inside it. Returns null when there is nothing useful to say.
 */
function explain(text) {
  const clean = String(text || '').trim();
  if (!clean || clean.length > 1200) return null;
  if (LOOKS_TECHNICAL.test(clean)) return null;

  const whole = UI[clean];
  const lower = clean.toLowerCase();
  const terms = [];
  for (const [term, ar] of Object.entries(GLOSSARY)) {
    if (lower.includes(term)) terms.push({ term, ar });
  }
  terms.sort((a, b) => b.term.length - a.term.length);
  const trimmed = [];
  for (const found of terms) {
    if (trimmed.some((x) => x.term.includes(found.term))) continue;
    trimmed.push(found);
  }
  if (!whole && !trimmed.length) return null;
  return { source: clean, whole: whole || null, terms: trimmed.slice(0, 6) };
}

// Clause references, symbols and equations are reference material, not prose.
const LOOKS_TECHNICAL = /§|=|\d\.\d\.\d|^[A-Z]{2,4}\s?\d|_[a-zA-Z0-9]|[λχδφηβ√π]/;

const SKIP_TAGS = new Set(['SCRIPT', 'STYLE', 'INPUT', 'TEXTAREA', 'OPTION', 'SELECT']);
const SKIP_CLASSES = ['tg-ident', 'tg-clause', 'cs-expr', 'cs-sub', 'tg-topbar__badge', 'tg-buildpanel__facts'];

/**
 * Translate the interface in place. Only exact dictionary matches are touched,
 * and reference material is skipped, so an untranslated string simply stays in
 * English rather than being mangled.
 */
function translateTree(root) {
  if (current === LANGS.EN) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      const parent = node.parentElement;
      if (!parent) return NodeFilter.FILTER_REJECT;
      if (SKIP_TAGS.has(parent.tagName)) return NodeFilter.FILTER_REJECT;
      if (parent.closest('.cs-page')) return NodeFilter.FILTER_REJECT;
      for (const c of SKIP_CLASSES) if (parent.closest(`.${c}`)) return NodeFilter.FILTER_REJECT;
      return node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    },
  });
  const jobs = [];
  let n = walker.nextNode();
  while (n) { jobs.push(n); n = walker.nextNode(); }
  for (const node of jobs) {
    const raw = node.nodeValue.trim();
    const hit = UI[raw];
    if (hit) node.nodeValue = node.nodeValue.replace(raw, hit);
  }
}

  ITEM_FIELD: 'item.field',
  ASSUMPTION_CHANGED: 'assumption.changed',
  CODE_CHANGED: 'design.code',
  CALC_RUN: 'design.calculated',
  IMPORTED: 'project.imported',
};

class AuditLog {
  constructor(entries = []) {
    this._entries = [...entries];
  }

  /**
   * @param {object} e
   * @param {string} e.kind      one of AUDIT_KINDS
   * @param {string} [e.entity]  human label, e.g. "Project" or "C-01 CFST column"
   * @param {string} [e.entityId]
   * @param {string} [e.field]   dotted path, e.g. "client" or "assumptions.fck"
   * @param {*}      [e.from]
   * @param {*}      [e.to]
   * @param {string} [e.reason]  free text; required for assumption changes
   * @param {string} [e.actor]   team member name
   */
  append(e) {
    if (!e || !e.kind) throw new Error('audit: kind is required');
    if (e.kind === AUDIT_KINDS.ASSUMPTION_CHANGED && !String(e.reason || '').trim()) {
      throw new Error('audit: a reason is required for every assumption change');
    }
    const entry = {
      id: uid('log'),
      ts: nowIso(),
      kind: e.kind,
      entity: e.entity ?? null,
      entityId: e.entityId ?? null,
      field: e.field ?? null,
      from: normalise(e.from),
      to: normalise(e.to),
      reason: e.reason ? String(e.reason) : null,
      actor: e.actor ?? 'unattributed',
    };
    this._entries.push(entry);
    return entry;
  }

  /** Newest first. Optional filter by kind / entityId / field. */
  list(filter = {}) {
    let out = [...this._entries].reverse();
    if (filter.kind) out = out.filter((x) => x.kind === filter.kind);
    if (filter.entityId) out = out.filter((x) => x.entityId === filter.entityId);
    if (filter.field) out = out.filter((x) => x.field === filter.field);
    if (filter.since) out = out.filter((x) => x.ts >= filter.since);
    return out;
  }

  get length() { return this._entries.length; }

  toJSON() { return this._entries; }

  static fromJSON(arr) { return new AuditLog(Array.isArray(arr) ? arr : []); }
}

function normalise(v) {
  if (v === undefined) return null;
  if (v === null || typeof v === 'number' || typeof v === 'boolean') return v;
  if (typeof v === 'string') return v;
  try { return JSON.parse(JSON.stringify(v)); } catch { return String(v); }
}

/** Renders a log value for display without leaking [object Object]. */
function auditValueText(v) {
  if (v === null || v === undefined || v === '') return '(empty)';
  if (typeof v === 'object') return JSON.stringify(v);
  return String(v);
}


/* ===== src/core/store.js ===== */
// core/store.js — minimal observable state container.
//
// Deliberately dependency-free. The platform needs one thing from a store:
// "when anything changes, re-render and re-run affected calculations".
// Phase 2 attaches the recalculation hook to the same subscribe channel.

function clone(v) {
  if (v === null || typeof v !== 'object') return v;
  if (v instanceof Date) return new Date(v.getTime());
  if (Array.isArray(v)) return v.map(clone);
  const out = {};
  for (const k of Object.keys(v)) out[k] = clone(v[k]);
  return out;
}

function getPath(obj, path) {
  return String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}

function setPath(obj, path, value) {
  const keys = String(path).split('.');
  const last = keys.pop();
  let cur = obj;
  for (const k of keys) {
    if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = {};
    cur = cur[k];
  }
  cur[last] = value;
  return obj;
}

class Store {
  constructor(initial = {}) {
    this._state = initial;
    this._subs = new Set();
    this._depth = 0;
    this._dirty = false;
  }

  get state() { return this._state; }

  subscribe(fn) {
    this._subs.add(fn);
    return () => this._subs.delete(fn);
  }

  /** Replace the whole state (project load, new project). */
  replace(next) {
    this._state = next;
    this._notify();
  }

  /**
   * Mutate inside a transaction. Nested transactions notify once, at the end,
   * so a batch of assumption edits triggers exactly one recalculation pass.
   */
  update(mutator) {
    this._depth += 1;
    try {
      mutator(this._state);
      this._dirty = true;
    } finally {
      this._depth -= 1;
      if (this._depth === 0 && this._dirty) {
        this._dirty = false;
        this._notify();
      }
    }
    return this._state;
  }

  /** Set one dotted path. Returns { changed, from, to }. */
  set(path, value) {
    const from = getPath(this._state, path);
    if (from === value) return { changed: false, from, to: value };
    this.update((s) => setPath(s, path, value));
    return { changed: true, from, to: value };
  }

  _notify() {
    for (const fn of [...this._subs]) {
      try { fn(this._state); } catch (err) { console.error('store subscriber failed', err); }
    }
  }
}

// core/people.js — the office register of engineers.
//
// WHAT THIS IS AND IS NOT
// This is accountability, not access control. There is no password, because a
// program that runs entirely inside the browser cannot enforce one: anything
// checked in the page can be edited in the page. That was a deliberate, stated
// decision.
//
// What it does buy is real:
//   - every change in the audit log carries a name instead of "unattributed"
//   - the designer and checker print on the sheet without being retyped
//   - actions that belong to a role are not offered to someone in another role,
//     which prevents mistakes even though it does not prevent determined misuse


const ROLE = {
  LEAD: 'Project lead',
  DESIGNER: 'Designer',
  CHECKER: 'Checker',
  APPROVER: 'Approver',
  VIEWER: 'Viewer',
};

const ROLES = [ROLE.LEAD, ROLE.DESIGNER, ROLE.CHECKER, ROLE.APPROVER, ROLE.VIEWER];

/**
 * What each role may do. Read by the UI to decide which controls to offer.
 * A role that cannot do something simply is not shown the control.
 */
const PERMISSIONS = {
  [ROLE.LEAD]: { editProject: true, editItems: true, check: true, approve: true, managePeople: true },
  [ROLE.DESIGNER]: { editProject: false, editItems: true, check: false, approve: false, managePeople: false },
  [ROLE.CHECKER]: { editProject: false, editItems: false, check: true, approve: false, managePeople: false },
  [ROLE.APPROVER]: { editProject: false, editItems: false, check: true, approve: true, managePeople: false },
  [ROLE.VIEWER]: { editProject: false, editItems: false, check: false, approve: false, managePeople: false },
};

function newPerson(patch = {}) {
  const name = patch.name || '';
  return {
    id: patch.id || uid('per'),
    name,
    initials: patch.initials || initials(name),
    role: patch.role || ROLE.DESIGNER,
    title: patch.title || '',
    email: patch.email || '',
    active: patch.active !== false,
    addedAt: patch.addedAt || nowIso(),
  };
}

function can(person, action) {
  if (!person) return false;
  const p = PERMISSIONS[person.role] || PERMISSIONS[ROLE.VIEWER];
  return !!p[action];
}

/**
 * A checker may not check work they designed themselves. This is the one rule
 * that is genuinely about engineering quality rather than convenience, so it is
 * enforced wherever the check action is offered.
 */
function canCheckItem(person, item) {
  if (!can(person, 'check')) return { allowed: false, reason: `${person ? person.role : 'This role'} cannot sign a check.` };
  if (item && item.designer && person && item.designer === person.name) {
    return { allowed: false, reason: 'A design cannot be checked by the person who produced it. Independent checking is required.' };
  }
  return { allowed: true, reason: null };
}

function personByName(people, name) {
  return (people || []).find((p) => p.name === name) || null;
}

function activePeople(people, role) {
  return (people || []).filter((p) => p.active && (!role || p.role === role));
}

function peopleOptions(people, role) {
  return activePeople(people, role).map((p) => ({
    value: p.name,
    label: `${p.name}${p.initials ? ` (${p.initials})` : ''}${p.title ? ` — ${p.title}` : ''}`,
  }));
}

/** Seeded so the register is never empty on a fresh install. */
function defaultRegister() {
  return [];
}

// core/review.js — review comments and how a review is recorded.
//
// The office may review on screen or on paper, and the platform should not
// insist. What it does insist on is that a comment raised against an item is
// answered before that item is marked as checked: a comment that is still open
// is the checker saying the design is not yet right, and letting the status
// move past it would quietly overrule them.
//
// Comments are kept whatever the method, because a comment written here costs
// nothing and a reprint costs a morning. What the method changes is the sheet.


const REVIEW_METHOD = {
  ELECTRONIC: 'electronic',
  PAPER: 'paper',
  BOTH: 'both',
};

const REVIEW_METHOD_LABELS = {
  electronic: 'On screen — comments and sign-off in the platform',
  paper: 'On paper — the sheet prints a comments box and signature lines',
  both: 'Both — comments here, final signature on paper',
};

const COMMENT_STATUS = {
  OPEN: 'Open',
  ANSWERED: 'Answered',
  CLOSED: 'Closed',
};

function newComment({ text, by, role, about }) {
  return {
    id: uid('cmt'),
    at: nowIso(),
    by: by || 'unattributed',
    role: role || null,
    about: about || null,      // which check, or null for the item as a whole
    text: String(text || '').trim(),
    status: COMMENT_STATUS.OPEN,
    reply: null,
    repliedBy: null,
    repliedAt: null,
    closedBy: null,
    closedAt: null,
  };
}

function openComments(item) {
  return (item.comments || []).filter((c) => c.status !== COMMENT_STATUS.CLOSED);
}

function unansweredComments(item) {
  return (item.comments || []).filter((c) => c.status === COMMENT_STATUS.OPEN);
}

/**
 * Whether an item may move to a given status.
 *
 * The rule that matters: nothing reaches checked or approved while a comment is
 * still open. The person who raised it decides when it is closed, not the
 * person answering it.
 */
function statusBlocked(item, status) {
  if (status !== 'Checked' && status !== 'Approved') return null;
  const open = openComments(item);
  if (!open.length) return null;
  const answered = open.filter((c) => c.status === COMMENT_STATUS.ANSWERED).length;
  return `${open.length} review comment${open.length === 1 ? ' is' : 's are'} still open`
    + (answered ? `, ${answered} answered but not closed` : '')
    + '. A comment is closed by the person who raised it.';
}

function replyTo(item, id, text, by) {
  return (item.comments || []).map((c) => (c.id === id
    ? { ...c, reply: String(text).trim(), repliedBy: by, repliedAt: nowIso(), status: COMMENT_STATUS.ANSWERED }
    : c));
}

function closeComment(item, id, by) {
  return (item.comments || []).map((c) => (c.id === id
    ? { ...c, status: COMMENT_STATUS.CLOSED, closedBy: by, closedAt: nowIso() }
    : c));
}

function reopenComment(item, id) {
  return (item.comments || []).map((c) => (c.id === id
    ? { ...c, status: c.reply ? COMMENT_STATUS.ANSWERED : COMMENT_STATUS.OPEN, closedBy: null, closedAt: null }
    : c));
}

/** What the calculation sheet should carry, given the project's method. */
function sheetReviewBlock(project, item) {
  const method = (project && project.reviewMethod) || REVIEW_METHOD.BOTH;
  const comments = item.comments || [];
  const open = openComments(item);
  return {
    method,
    printCommentBox: method === REVIEW_METHOD.PAPER || method === REVIEW_METHOD.BOTH,
    printSignatureLines: method === REVIEW_METHOD.PAPER || method === REVIEW_METHOD.BOTH,
    printCommentList: comments.length > 0,
    comments,
    openCount: open.length,
    statement: method === REVIEW_METHOD.ELECTRONIC
      ? 'Reviewed in the platform. The comments raised and their answers are listed above and are held in the change log.'
      : method === REVIEW_METHOD.PAPER
        ? 'Reviewed on paper. Comments and signatures are written on this sheet.'
        : 'Comments raised in the platform; the final signature is given on this sheet.',
  };
}

function createProject(patch = {}) {

    stage: 'Detailed design',
    country: DEFAULT_JURISDICTION,
    location: '',

    // Parties

    consultant: '',
    contractor: '',

    // Revision control

    revisionDate: today,
    revisionNote: 'First issue',
    revisionHistory: [],

    // People
    team: [],

    // Conventions
    units: DEFAULT_SYSTEM,
    codes: { ...jurisdiction(DEFAULT_JURISDICTION).codes },

    // Dates
    startDate: today,
    dueDate: '',

    // How work is reviewed on this project
    reviewMethod: 'both',

    // Free text
    notes: '',

    // Contents (Phase 2 populates this)
    items: [],

    platformVersion: null,
    createdAt: nowIso(),
    updatedAt: nowIso(),
  };
  return Object.assign(p, patch);
}

/**
 * Validation returns a map of field -> message. Empty map means valid.
 * Rules are intentionally few: a design office should not be blocked from
 * starting work, but a project cannot be nameless or unattributed.
 */
function validateProject(p) {
  const errors = {};
  if (!String(p.name || '').trim()) errors.name = 'Give the project a name.';
  if (!String(p.client || '').trim()) errors.client = 'Name the client this work is issued to.';
  if (!/^[A-Za-z]*\d+$/.test(String(p.revision || '').trim())) {
    errors.revision = 'Use a revision label such as P01 or C02.';
  }
  if (!String(p.revisionDate || '').trim()) errors.revisionDate = 'Set the issue date for this revision.';
  if (p.dueDate && p.startDate && p.dueDate < p.startDate) {
    errors.dueDate = 'The due date falls before the start date.';
  }
  const designers = (p.team || []).filter((m) => m.role === 'Designer');
  const checkers = (p.team || []).filter((m) => m.role === 'Checker');
  if (designers.length && !checkers.length) {
    errors.team = 'A designer is listed with no checker. Independent checking is required before issue.';
  }
  return errors;
}

/** Non-blocking advisories shown alongside the project, not gates on saving. */
function projectAdvisories(p) {
  const out = [];
  if (!String(p.number || '').trim()) {
    out.push('No project number set. Calculation sheets will print without a job number.');
  }
  if (!(p.team || []).length) {
    out.push('No team members yet. Designer and checker names print in the title block.');
  }
  if (!Object.values(p.codes || {}).some(Boolean)) {
    out.push('No default design codes selected. Each design item will have to name its own code.');
  }
  return out;
}

/**
 * Close the current revision into history and open the next one.
 * Returns { project, from, to }.
 */
function issueRevision(p, { note = '', by = '', date = todayIso() } = {}) {
  const from = p.revision;
  const entry = {
    id: uid('rev'),
    revision: p.revision,
    date: p.revisionDate,
    note: p.revisionNote || '',
    issuedAt: nowIso(),
  };
  p.revisionHistory = [...(p.revisionHistory || []), entry];
  p.revision = nextRevision(p.revision);
  p.revisionDate = date;
  p.revisionNote = note;
  p.revisionIssuedBy = by;
  p.updatedAt = nowIso();
  return { project: p, from, to: p.revision };
}

function teamByRole(p, role) {
  return (p.team || []).filter((m) => m.role === role);
}

/** Title-block line: "Designed MAH · Checked ASK". */
function titleBlockAttribution(p) {
  const d = teamByRole(p, 'Designer').map((m) => m.initials || initials(m.name));
  const c = teamByRole(p, 'Checker').map((m) => m.initials || initials(m.name));
  return {
    designed: d.join(', ') || '—',
    checked: c.join(', ') || '—',
    approved: teamByRole(p, 'Approver').map((m) => m.initials || initials(m.name)).join(', ') || '—',
  };
}

/* ===== src/core/registry.js ===== */
// core/registry.js — the plug-in boundary for design codes.
//
// CONTRACT
// A design code is a self-contained module. The engine never names a code and
// never contains an "if (code === 'EN1994')" branch. It asks the registry:
//
//     registry.resolve('cfst.axial.buckling', 'EN1994-1-1')
//
// and gets back either a handler with its clause reference, or a formal
// "not covered" result. Adding a code later means adding one file and one
// register() call. Nothing in core or in the modules changes.
//
// A code module has this shape:
// {
//   id:        'EN1994-1-1',                   // stable key, used in saved files
//   family:    'Eurocode',
//   title:     'Design of composite steel and concrete structures — General rules',
//   edition:   'EN 1994-1-1:2004 + AC:2009',
//   authority: 'CEN',
//   jurisdiction: 'European Union',
//   philosophy:  'LSD',                        // LSD | LRFD | ASD | WSD
//   slots:     ['composite'],                  // which project code slots it can fill
//   clauses:   { '6.7.3.2': 'Resistance of cross-sections', ... },
//   capabilities: {
//     'cfst.axial.plastic': { clause: '6.7.3.2', handler: fn|null },
//     ...
//   },
//   notCovered: {
//     'cfst.fire': 'Fire design is not in Part 1-1; see EN 1994-1-2.',
//   },
//   alternatives: { 'cfst.fire': ['EN1994-1-2'] },
//   status: 'engine' | 'declared' | 'reference',
// }

const COVERAGE = {
  COVERED: 'covered',       // code covers it and an engine is installed
  DECLARED: 'declared',     // code covers it, engine not yet implemented
  NOT_COVERED: 'not-covered', // code demonstrably does not address it
  UNKNOWN: 'unknown',       // code says nothing either way
};

const REQUIRED_FIELDS = ['id', 'family', 'title', 'edition', 'authority'];

class DesignCodeRegistry {
  constructor() {
    this._codes = new Map();
  }

  register(mod) {
    for (const f of REQUIRED_FIELDS) {
      if (!mod || !mod[f]) throw new Error(`registry: code module missing "${f}"`);
    }
    if (this._codes.has(mod.id)) {
      throw new Error(`registry: duplicate code id "${mod.id}"`);
    }
    const normalised = {
      jurisdiction: '', philosophy: '', slots: [], clauses: {},
      capabilities: {}, notCovered: {}, alternatives: {}, status: 'declared',
      notes: '', ...mod,
    };
    this._codes.set(mod.id, Object.freeze(normalised));
    return normalised;
  }

  registerAll(mods) { mods.forEach((m) => this.register(m)); return this; }

  has(id) { return this._codes.has(id); }

  get(id) { return this._codes.get(id) || null; }

  /** All codes, optionally filtered by family / slot / capability key. */
  list({ family, slot, capability } = {}) {
    let out = [...this._codes.values()];
    if (family) out = out.filter((c) => c.family === family);
    if (slot) out = out.filter((c) => (c.slots || []).includes(slot));
    if (capability) out = out.filter((c) => this.coverage(c.id, capability) !== COVERAGE.UNKNOWN);
    return out.sort((a, b) => a.family.localeCompare(b.family) || a.id.localeCompare(b.id));
  }

  families() {
    const seen = new Map();
    for (const c of this._codes.values()) {
      if (!seen.has(c.family)) seen.set(c.family, []);
      seen.get(c.family).push(c);
    }
    return [...seen.entries()]
      .map(([family, codes]) => ({ family, codes: codes.sort((a, b) => a.id.localeCompare(b.id)) }))
      .sort((a, b) => a.family.localeCompare(b.family));
  }

  /** Grouped options ready for a <select> with <optgroup>. */
  options({ slot, capability } = {}) {
    return this.families()
      .map(({ family, codes }) => ({
        family,
        codes: codes.filter((c) => {
          if (slot && !(c.slots || []).includes(slot)) return false;
          if (capability && this.coverage(c.id, capability) === COVERAGE.UNKNOWN) return false;
          return true;
        }),
      }))
      .filter((g) => g.codes.length);
  }

  coverage(codeId, capability) {
    const c = this.get(codeId);
    if (!c) return COVERAGE.UNKNOWN;
    if (matchKey(c.capabilities, capability)) {
      const cap = matchKey(c.capabilities, capability);
      return typeof cap.handler === 'function' ? COVERAGE.COVERED : COVERAGE.DECLARED;
    }
    if (matchKey(c.notCovered, capability)) return COVERAGE.NOT_COVERED;
    return COVERAGE.UNKNOWN;
  }

  /**
   * The single call every engineering module uses.
   * Never throws for an unsupported code — it returns a describable result the
   * UI can print verbatim on the calculation sheet.
   */
  resolve(capability, codeId) {
    const code = this.get(codeId);
    if (!code) {
      return {
        status: COVERAGE.UNKNOWN, capability, codeId, code: null, handler: null,
        clause: null, clauseTitle: null,
        note: `No design code is selected for "${capability}". Select a code before calculating.`,
        alternatives: [],
      };
    }

    const cap = matchKey(code.capabilities, capability);
    if (cap) {
      return {
        status: typeof cap.handler === 'function' ? COVERAGE.COVERED : COVERAGE.DECLARED,
        capability, codeId, code, handler: cap.handler || null,
        clause: cap.clause || null,
        clauseTitle: cap.clause ? (code.clauses[cap.clause] || null) : null,
        note: typeof cap.handler === 'function'
          ? null
          : `${code.id} addresses this in clause ${cap.clause || '(unspecified)'}, but the calculation engine for it is not installed in this build. No numbers are produced.`,
        alternatives: this._resolveAlternatives(code, capability),
      };
    }

    const nc = matchKey(code.notCovered, capability);
    if (nc) {
      return {
        status: COVERAGE.NOT_COVERED, capability, codeId, code, handler: null,
        clause: null, clauseTitle: null,
        note: typeof nc === 'string' ? nc : String(nc),
        alternatives: this._resolveAlternatives(code, capability),
      };
    }

    return {
      status: COVERAGE.UNKNOWN, capability, codeId, code, handler: null,
      clause: null, clauseTitle: null,
      note: `${code.id} (${code.edition}) contains no provisions addressing "${capability}", and this platform will not substitute a formula from another source. Select a code that covers this check.`,
      alternatives: this._resolveAlternatives(code, capability),
    };
  }

  _resolveAlternatives(code, capability) {
    const declared = matchKey(code.alternatives, capability);
    const ids = Array.isArray(declared) ? declared : [];
    const fromScan = this.list()
      .filter((c) => c.id !== code.id && this.coverage(c.id, capability) === COVERAGE.COVERED)
      .map((c) => c.id);
    const merged = [...new Set([...ids, ...fromScan])];
    return merged.map((id) => this.get(id)).filter(Boolean).map((c) => ({
      id: c.id, title: c.title, family: c.family, edition: c.edition,
      coverage: this.coverage(c.id, capability),
    }));
  }

  /** Formal citation string used on every printed line. */
  citation(codeId, clause) {
    const c = this.get(codeId);
    if (!c) return clause ? `[unknown code] ${clause}` : '[unknown code]';
    if (!clause) return `${c.id} (${c.edition})`;
    const title = c.clauses[clause];
    return title ? `${c.id} §${clause} — ${title}` : `${c.id} §${clause}`;
  }
}

/**
 * Supports wildcard keys: a module may declare notCovered['cfst.*'].
 * Exact keys win over wildcards; longer wildcards win over shorter ones.
 */
function matchKey(map, key) {
  if (!map) return null;
  if (Object.prototype.hasOwnProperty.call(map, key)) return map[key];
  let best = null;
  let bestLen = -1;
  for (const k of Object.keys(map)) {
    if (!k.endsWith('*')) continue;
    const prefix = k.slice(0, -1);
    if (key.startsWith(prefix) && prefix.length > bestLen) {
      best = map[k];
      bestLen = prefix.length;
    }
  }
  return best;
}

const registry = new DesignCodeRegistry();


/* ===== src/core/persistence.js ===== */
// core/persistence.js — project file format and I/O.
//
// The .tgp file is plain JSON and is the authoritative record. It is versioned
// and carries the audit log, so a project handed to a checker arrives with its
// full change history attached.
//
// No browser storage is used. Session state lives in memory; durability comes
// from an explicit save. StorageAdapter exists as the seam where a desktop
// build swaps in the file system or a database without touching anything else.


const FILE_EXTENSION = 'tgp.json';
const FILE_MAGIC = 'trust-group-design-platform';

function serialise(project, auditLog, meta = {}) {
  return {
    magic: FILE_MAGIC,
    schemaVersion: SCHEMA_VERSION,
    savedAt: nowIso(),
    application: { name: 'Trust Group Design Platform', version: PLATFORM_VERSION, build: meta.build || PLATFORM_VERSION },
    project,
    people: meta.people || [],
    currentUser: meta.currentUser ? meta.currentUser.id : null,
    audit: auditLog instanceof AuditLog ? auditLog.toJSON() : (auditLog || []),
  };
}

/**
 * Parse a saved file. Throws a message written for the person opening it,
 * not a stack trace.
 */
function deserialise(text) {
  let data;
  try {
    data = typeof text === 'string' ? JSON.parse(text) : text;
  } catch {
    throw new Error('That file is not valid JSON. Open a project saved from this platform.');
  }
  if (!data || data.magic !== FILE_MAGIC) {
    throw new Error('That file was not written by the Trust Group Design Platform.');
  }
  if (typeof data.schemaVersion !== 'number') {
    throw new Error('The file has no schema version and cannot be opened safely.');
  }
  if (data.schemaVersion > SCHEMA_VERSION) {
    throw new Error(
      `The file was saved by a newer build (schema ${data.schemaVersion}); this build reads up to ${SCHEMA_VERSION}. Update the platform before opening it.`,
    );
  }
  const project = migrate(data.project, data.schemaVersion);
  const savedWithVersion = (data.application && data.application.version) || null;
  return {
    project,
    people: Array.isArray(data.people) ? data.people : [],
    currentUserId: data.currentUser || null,
    audit: AuditLog.fromJSON(data.audit || []),
    savedAt: data.savedAt || null,
    savedWithVersion,
  };
}

/**
 * Forward migrations. Each step is small and named, so an old project file
 * stays openable for the life of the archive.
 */
function migrate(project, fromVersion) {
  let p = project;
  let v = fromVersion;
  // v0 -> v1: no released schema before 1; placeholder for the pattern.
  if (v < 1) { p = { ...p, schemaVersion: 1 }; v = 1; }
  return { ...p, schemaVersion: SCHEMA_VERSION };
}

/** Safe file name: "TG-2401 Marina Tower_P02.tgp.json" */
function suggestedFileName(project) {
  const parts = [project.number, project.name].filter(Boolean).join(' ');
  const base = (parts || 'project').replace(/[\\/:*?"<>|]+/g, '-').trim();
  return `${base}_${project.revision || 'P01'}.${FILE_EXTENSION}`;
}

/** Browser download of any text payload. */
function downloadText(filename, text, mime = 'application/json') {
  const blob = new Blob([text], { type: `${mime};charset=utf-8` });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/** Opens a file picker and resolves with the file text. */
function pickTextFile(accept = '.json,.tgp.json,application/json') {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => {
      const f = input.files && input.files[0];
      if (!f) return reject(new Error('No file selected.'));
      const r = new FileReader();
      r.onload = () => resolve({ name: f.name, text: String(r.result) });
      r.onerror = () => reject(new Error('The file could not be read.'));
      r.readAsText(f);
    };
    input.click();
  });
}

/**
 * Storage seam. MemoryAdapter is the only implementation in this build.
 * A desktop build registers a FileSystemAdapter with the same three methods
 * and nothing above this line changes.
 */
class StorageAdapter {
  async read() { throw new Error('not implemented'); }
  async write() { throw new Error('not implemented'); }
  async list() { throw new Error('not implemented'); }
}

class MemoryAdapter extends StorageAdapter {
  constructor() { super(); this._m = new Map(); }
  async read(key) { return this._m.has(key) ? this._m.get(key) : null; }
  async write(key, value) { this._m.set(key, value); return true; }
  async list(prefix = '') { return [...this._m.keys()].filter((k) => k.startsWith(prefix)); }
}


/* ===== src/core/calc.js ===== */
// core/calc.js — the record types every engineering module must produce.
//
// THE TRACEABILITY RULE IS ENFORCED HERE, NOT BY CONVENTION.
// A CalcStep cannot be constructed without a code id and a clause. If an engine
// tries to emit a value with no provenance, step() throws and the calculation
// fails loudly rather than printing an unattributable number.
//
// The only way to produce output without a clause is to declare it explicitly
// as a `derived` step (an arithmetic restatement of prior cited steps, such as
// a utilisation ratio) or as a `notice` (a formal statement that the code does
// not cover something).

const STEP_KIND = {
  CODE: 'code',       // a value taken from or computed by a cited clause
  DERIVED: 'derived', // arithmetic on already-cited values, e.g. a ratio
  INPUT: 'input',     // a user assumption, carries its own justification
  NOTICE: 'notice',   // a formal statement, produces no number
};

/**
 * @param {object} s
 * @param {string} s.symbol       e.g. "N_pl,Rd"
 * @param {string} s.description  plain language, what it is
 * @param {string} [s.expression] the formula as written in the code
 * @param {string} [s.substitution] the formula with numbers in
 * @param {number} [s.value]      BASE units
 * @param {string} [s.dimension]  units dimension key, null for dimensionless
 * @param {string} s.code         code id, required for CODE steps
 * @param {string} s.clause       clause, required for CODE steps
 * @param {string} [s.note]
 * @param {boolean} [s.verify]    true if the clause data needs office confirmation
 */
function step(s) {
  const kind = s.kind || STEP_KIND.CODE;
  if (kind === STEP_KIND.CODE) {
    if (!s.code) throw new Error(`calc: step "${s.symbol}" has no code id. Every code step must name its source.`);
    if (!s.clause) throw new Error(`calc: step "${s.symbol}" has no clause. Every code step must name its clause.`);
  }
  if (!s.symbol) throw new Error('calc: every step needs a symbol.');
  return {
    kind,
    symbol: s.symbol,
    description: s.description || '',
    expression: s.expression || null,
    substitution: s.substitution || null,
    value: s.value ?? null,
    dimension: s.dimension ?? null,
    code: s.code || null,
    clause: s.clause || null,
    note: s.note || null,
    verify: !!s.verify,
  };
}

const derived = (s) => step({ ...s, kind: STEP_KIND.DERIVED });
const input = (s) => step({ ...s, kind: STEP_KIND.INPUT });
const notice = (s) => step({ ...s, kind: STEP_KIND.NOTICE, value: null });

const CHECK_STATUS = {
  PASS: 'PASS',
  FAIL: 'FAIL',
  NOT_COVERED: 'NOT COVERED',
  NOT_IMPLEMENTED: 'NOT IMPLEMENTED',
  NOT_APPLICABLE: 'N/A',
  // Work that belongs to a different design item, not to this one. It carries
  // no utilisation and cannot fail here, but it is recorded and it prints, so
  // the scope of what was and was not designed is readable from the sheet
  // alone. Silence would let a reader assume the whole member was covered.
  OUT_OF_SCOPE: 'OUT OF SCOPE',
};

/**
 * A single verification: a demand against a capacity, or a limit satisfied.
 * `utilisation` is demand/capacity; > 1.0 fails.
 */
function check({
  id, title, code, clause, clauseTitle,
  demand = null, capacity = null, dimension = null,
  utilisation = null, limit = 1.0,
  status, failureMode = null, steps = [], note = null, verify = false,
}) {
  let u = utilisation;
  if (u === null && demand !== null && capacity !== null) {
    u = capacity === 0 ? Infinity : Math.abs(demand) / Math.abs(capacity);
  }
  let st = status;
  if (!st) st = u === null ? CHECK_STATUS.NOT_APPLICABLE : (u <= limit ? CHECK_STATUS.PASS : CHECK_STATUS.FAIL);
  return {
    id, title, code: code || null, clause: clause || null, clauseTitle: clauseTitle || null,
    demand, capacity, dimension, utilisation: u, limit,
    status: st, failureMode, steps, note, verify,
  };
}

const OVERALL = {
  SAFE: 'SAFE',
  UNSAFE: 'UNSAFE',
  INCOMPLETE: 'INCOMPLETE',
};

/**
 * Roll a list of checks into one verdict.
 * A design is SAFE only if every applicable check passed AND no required check
 * was left unverified. A missing check never reads as a pass.
 */
function summarise(checks) {
  // OUT OF SCOPE is excluded alongside N/A. It must not fail the item and must
  // not block it as if the platform had tried and been unable — nothing was
  // attempted, by decision, and the record says so in its own words.
  const applicable = checks.filter((c) =>
    c.status !== CHECK_STATUS.NOT_APPLICABLE && c.status !== CHECK_STATUS.OUT_OF_SCOPE);
  const failed = applicable.filter((c) => c.status === CHECK_STATUS.FAIL);
  const blocked = applicable.filter((c) =>
    c.status === CHECK_STATUS.NOT_COVERED || c.status === CHECK_STATUS.NOT_IMPLEMENTED);

  const rated = applicable.filter((c) => Number.isFinite(c.utilisation));
  const governing = rated.length
    ? rated.reduce((a, b) => (b.utilisation > a.utilisation ? b : a))
    : null;

  let overall;
  if (failed.length) overall = OVERALL.UNSAFE;
  else if (blocked.length) overall = OVERALL.INCOMPLETE;
  else if (rated.length) overall = OVERALL.SAFE;
  else overall = OVERALL.INCOMPLETE;

  return {
    overall,
    governing,
    maxUtilisation: governing ? governing.utilisation : null,
    counts: {
      total: checks.length,
      passed: applicable.filter((c) => c.status === CHECK_STATUS.PASS).length,
      failed: failed.length,
      blocked: blocked.length,
    },
    failed,
    blocked,
    needsVerification: checks.filter((c) => c.verify).map((c) => `${c.code} ${c.clause}`),
  };
}


/* ===== src/modules/cfst/section.js ===== */
// modules/cfst/section.js — geometry and material properties of a filled tube.
//
// Pure geometry. No code provisions here: anything a code decides (which
// coefficient, which limit) lives in the code module. Anything true of a shape
// regardless of jurisdiction lives here.
//
// All lengths mm, stresses MPa, forces N.

const SHAPE = { CHS: 'CHS', RHS: 'RHS', SHS: 'SHS' };

const SHAPE_LABELS = {
  CHS: 'Circular hollow section',
  RHS: 'Rectangular hollow section',
  SHS: 'Square hollow section',
};

/**
 * @param {object} g  { shape, d|b, h, t, rebar: { n, dia, cover }, }
 */
/**
 * A section can be described impossibly: a wall thicker than half the diameter,
 * a zero dimension, a negative length. Rather than let those propagate as NaN
 * into the engine and out onto a sheet, they are reported here.
 * Returns an array of messages; empty means the geometry is buildable.
 */
function validateGeometry(g) {
  const out = [];
  const t = Number(g.t);
  const circular = g.shape === SHAPE.CHS;
  const b = circular ? Number(g.d) : Number(g.b);
  const hh = circular ? Number(g.d) : (g.shape === SHAPE.SHS ? Number(g.b) : Number(g.h));

  if (!(t > 0)) out.push('The wall thickness must be greater than zero.');
  if (!(b > 0)) out.push(circular ? 'The outside diameter must be greater than zero.' : 'The width must be greater than zero.');
  if (!(hh > 0)) out.push('The depth must be greater than zero.');
  if (t > 0 && b > 0 && 2 * t >= b) {
    out.push(`The wall thickness (${t}) leaves no concrete core: twice the thickness must be less than ${circular ? 'the diameter' : 'the width'} (${b}).`);
  }
  if (t > 0 && hh > 0 && 2 * t >= hh) {
    out.push(`The wall thickness (${t}) leaves no concrete core: twice the thickness must be less than the depth (${hh}).`);
  }
  if (!(Number(g.length) > 0)) out.push('The column length must be greater than zero.');

  const r = g.rebar || {};
  if (Number(r.n) > 0) {
    const lever = (circular ? b - 2 * t : hh - 2 * t) - 2 * (Number(r.cover) || 0) - (Number(r.dia) || 0);
    if (!(lever > 0)) out.push('The bars, their cover and their diameter do not fit inside the concrete core.');
  }
  return out;
}

function sectionProperties(g) {
  const t = Number(g.t);
  const shape = g.shape;
  const p = { shape, t };

  if (shape === SHAPE.CHS) {
    const d = Number(g.d);
    const di = d - 2 * t;
    p.d = d; p.di = di;
    p.b = d; p.h = d;
    p.Aa = Math.PI / 4 * (d * d - di * di);
    p.AcGross = Math.PI / 4 * di * di;
    p.Ia = Math.PI / 64 * (d ** 4 - di ** 4);
    p.IcGross = Math.PI / 64 * di ** 4;
    p.IaZ = p.Ia; p.IcGrossZ = p.IcGross;
    // Plastic section moduli, standard closed forms used with EN 1994-1-1 §6.7.3.2
    p.Wpa = (d ** 3 - di ** 3) / 6;
    p.WpcGross = di ** 3 / 6;
    p.WpaZ = p.Wpa; p.WpcGrossZ = p.WpcGross;
    p.slendernessRatio = d / t;
    p.slendernessLabel = 'd/t';
    p.perimeterInner = Math.PI * di;
  } else {
    const b = Number(g.b);
    const h = shape === SHAPE.SHS ? b : Number(g.h);
    const bi = b - 2 * t;
    const hi = h - 2 * t;
    p.b = b; p.h = h; p.bi = bi; p.hi = hi;
    p.Aa = b * h - bi * hi;
    p.AcGross = bi * hi;
    // y-y is the strong axis: bending about the axis parallel to b, depth h
    p.Ia = (b * h ** 3 - bi * hi ** 3) / 12;
    p.IcGross = bi * hi ** 3 / 12;
    p.IaZ = (h * b ** 3 - hi * bi ** 3) / 12;
    p.IcGrossZ = hi * bi ** 3 / 12;
    p.Wpa = (b * h * h) / 4 - (bi * hi * hi) / 4;
    p.WpcGross = bi * hi * hi / 4;
    p.WpaZ = (h * b * b) / 4 - (hi * bi * bi) / 4;
    p.WpcGrossZ = hi * bi * bi / 4;
    // The governing plate slenderness for a filled RHS is the flat width over t
    p.slendernessRatio = Math.max(b, h) / t;
    p.slendernessLabel = shape === SHAPE.SHS ? 'b/t' : 'max(b,h)/t';
    p.perimeterInner = 2 * (bi + hi);
  }

  // Reinforcement, placed on a symmetric ring / rectangle at the given cover
  const r = g.rebar || {};
  const n = Math.max(0, Number(r.n) || 0);
  const dia = Number(r.dia) || 0;
  const cover = Number(r.cover) || 0;
  const Abar = Math.PI / 4 * dia * dia;
  p.As = n * Abar;
  p.rebarCount = n;
  p.rebarDia = dia;

  if (p.As > 0) {
    const lever = leverArm(p, cover, dia);
    p.rebarLever = lever;
    // Bars distributed symmetrically; second moment about the centroid taken as
    // the sum of A*z^2 for a uniform ring, which for n bars on a circle of
    // radius r gives n*A*r^2/2.
    p.Is = shape === SHAPE.CHS
      ? p.As * lever * lever / 2
      : p.As * lever * lever / 2;
    p.IsZ = p.Is;
    // Plastic modulus of the bars about the centroid: sum of |A*z|
    p.Wps = p.As * lever * (shape === SHAPE.CHS ? 2 / Math.PI : 0.5);
    p.WpsZ = p.Wps;
  } else {
    p.Is = 0; p.IsZ = 0; p.Wps = 0; p.WpsZ = 0; p.rebarLever = 0;
  }

  p.Ac = p.AcGross - p.As;
  p.Ic = Math.max(0, p.IcGross - p.Is);
  p.IcZ = Math.max(0, p.IcGrossZ - p.IsZ);
  p.Wpc = Math.max(0, p.WpcGross - p.Wps);
  p.WpcZ = Math.max(0, p.WpcGrossZ - p.WpsZ);
  p.Ag = p.Aa + p.AcGross;
  p.steelRatio = p.Aa / p.Ag;
  p.rebarRatio = p.AcGross > 0 ? p.As / p.AcGross : 0;

  return p;
}

function leverArm(p, cover, dia) {
  if (p.shape === SHAPE.CHS) {
    return Math.max(0, (p.di - 2 * cover - dia) / 2);
  }
  return Math.max(0, (p.hi - 2 * cover - dia) / 2);
}

/** Rough steel mass per metre, for schedules. Density 7850 kg/m^3. */
function steelMassPerMetre(p) {
  return p.Aa * 1e-6 * 7850;
}

function concreteVolumePerMetre(p) {
  return p.AcGross * 1e-6;
}

function describeSection(g) {
  const t = g.t;
  if (g.shape === SHAPE.CHS) return `CHS ${g.d} × ${t}`;
  if (g.shape === SHAPE.SHS) return `SHS ${g.b} × ${g.b} × ${t}`;
  return `RHS ${g.b} × ${g.h} × ${t}`;
}


/* ===== src/modules/baseplate/model.js ===== */
// modules/baseplate/model.js — base plate and anchor geometry.
//
// Pure geometry and defaults. No code provisions. Base units: mm, N, MPa.


const PLATE_SHAPE = { RECT: 'RECT', ROUND: 'ROUND' };

/**
 * A first-pass plate that is at least buildable.
 *
 * The old default was a flat 30 mm whatever the column. On a one-metre tube
 * that produced a 350 mm cantilever on a 30 mm plate, which fails §6.2.5 before
 * a single load is entered. The thickness is now derived from the cantilever it
 * has to span, using the same relationship the check itself uses:
 *
 *     t >= overhang * sqrt(3 f_jd gamma_M0 / f_y)
 *
 * with a representative f_jd, then rounded up to a plate size that is actually
 * rolled. It is a starting point, not a design; the check still governs.
 */
function suggestPlateThickness(overhang, fyPlate = 355) {
  const fjdTypical = 20; // MPa, representative of C30/37 to C40/50 with modest confinement
  const raw = overhang * Math.sqrt((3 * fjdTypical) / fyPlate);
  const stock = [12, 15, 20, 25, 30, 35, 40, 50, 60, 70, 80, 90, 100, 120];
  return stock.find((x) => x >= raw) || Math.ceil(raw / 10) * 10;
}

function defaultBasePlate(column) {
  const g = column.geometry;
  const round = g.shape === SHAPE.CHS;
  const outer = round ? Number(g.d) : Math.max(Number(g.b), Number(g.h));
  const over = Math.max(80, Math.round(outer * 0.35 / 10) * 10);
  return {
    enabled: true,
    code: 'EN 1993-1-8',
    shape: round ? PLATE_SHAPE.ROUND : PLATE_SHAPE.RECT,
    Dp: round ? outer + 2 * over : 0,
    B: round ? 0 : Number(g.b) + 2 * over,
    N: round ? 0 : Number(g.h) + 2 * over,
    tp: suggestPlateThickness(over),
    grout: 40,
    // Supporting pedestal, used for the confined bearing enhancement
    pedB: (round ? outer + 2 * over : Number(g.b) + 2 * over) + 300,
    pedN: (round ? outer + 2 * over : Number(g.h) + 2 * over) + 300,
    fyPlate: 355,
    anchors: {
      n: 4,
      dia: 30,
      AseRatio: 0.75,      // stress area as a fraction of the gross bar area
      fya: 400,
      futa: 500,
      hef: 400,
      headBearing: 0,      // A_brg; 0 means "derive from the bar diameter"
      // Kept above the thresholds of ACI 318-19 §17.6.2 so the breakout check
      // can actually run on the default geometry instead of refusing at once.
      edge: 620,           // smallest edge distance c_a,min, > 1.5 h_ef
      spacing: 1250,       // smallest anchor spacing, > 3 h_ef
    },
    actions: { NEd: 0, VEd: 200e3, MEd: 0, upliftEd: 0 },
  };
}

function plateProperties(bp, column) {
  const g = column.geometry;
  const round = bp.shape === PLATE_SHAPE.ROUND;
  const colOuterB = g.shape === SHAPE.CHS ? Number(g.d) : Number(g.b);
  const colOuterN = g.shape === SHAPE.CHS ? Number(g.d) : Number(g.h);

  const A1 = round ? Math.PI / 4 * bp.Dp * bp.Dp : bp.B * bp.N;
  const A2raw = bp.pedB * bp.pedN;
  // ACI 318 §17 and EN 1992-1-1 §6.7 both limit the supporting area to the
  // frustum that spreads at 1:2 from the loaded area.
  const spreadB = (round ? bp.Dp : bp.B) + 4 * bp.grout;
  const spreadN = (round ? bp.Dp : bp.N) + 4 * bp.grout;
  const A2 = Math.min(A2raw, Math.max(A1, spreadB * spreadN), 4 * A1);

  const overhangB = ((round ? bp.Dp : bp.B) - colOuterB) / 2;
  const overhangN = ((round ? bp.Dp : bp.N) - colOuterN) / 2;

  const a = bp.anchors;
  const Agross = Math.PI / 4 * a.dia * a.dia;
  const Ase = Agross * (Number(a.AseRatio) || 0.75);
  const Abrg = a.headBearing > 0 ? a.headBearing : (Math.PI / 4 * (Math.pow(1.8 * a.dia, 2) - a.dia * a.dia));

  return {
    round, A1, A2, A2raw,
    colOuterB, colOuterN,
    overhangB, overhangN,
    overhang: Math.min(overhangB, overhangN),
    perimeterCol: round ? Math.PI * colOuterB : 2 * (colOuterB + colOuterN),
    anchorCount: a.n,
    Agross, Ase, Abrg,
    AseTotal: Ase * a.n,
  };
}

function describePlate(bp) {
  return bp.shape === PLATE_SHAPE.ROUND
    ? `Ø${bp.Dp} × ${bp.tp} plate`
    : `${bp.B} × ${bp.N} × ${bp.tp} plate`;
}

function nextItemNumber(items, prefix = 'C') {
  const nums = items
    .map((i) => /^([A-Za-z-]*)(\d+)$/.exec(String(i.number || '')))
    .filter(Boolean)
    .map((m) => parseInt(m[2], 10));
  const n = nums.length ? Math.max(...nums) + 1 : 1;
  return `${prefix}-${String(n).padStart(2, '0')}`;
}

function reviseItem(item, note) {
  return {
    ...item,
    revision: nextRevision(item.revision),
    status: ITEM_STATUS.DRAFT,
    revisionNote: note || '',
    updatedAt: nowIso(),
  };
}

/**
 * A checked or approved item may not silently keep that status once its inputs
 * change. This is called after any edit that affects the result.
 */
function demoteOnChange(item) {
  if (item.status === ITEM_STATUS.CHECKED || item.status === ITEM_STATUS.APPROVED) {
    return { ...item, status: ITEM_STATUS.DRAFT, updatedAt: nowIso() };
  }
  return { ...item, updatedAt: nowIso() };
}

  return [item.number, item.name].filter(Boolean).join(' — ') || 'Untitled item';
}


/* ===== src/materials/grades.js ===== */
// materials/grades.js — material grades, from the office reference.
//
// Transcribed from Trust Group's Material Grades Reference and cross-checked
// against the relationships published beside the tables: f_ctm = 0.30 f_ck^(2/3),
// E_cm = 22 (f_cm/10)^0.3, E_c = 4400 √f_cu, E_c = 4700 √f'_c, and the ksi to
// MPa conversion on every American grade. Every row agrees to better than one
// per cent. Nothing here was written from memory.
//
// THICKNESS MATTERS
// The reference is explicit that the grade name alone is not enough on a
// calculation sheet, because the yield strength falls with product thickness.
// Each steel grade therefore carries bands rather than one number, and the
// strength is read for the plate actually being used.

/**
 * The one entry in every grade list that is not a grade.
 *
 * A named grade is a promise about where its numbers came from: S355 means
 * 355 MPa to 40 mm because EN 10025 says so, not because somebody typed it.
 * So a named grade locks its properties, and the only way to enter a strength
 * by hand is to stop claiming a name for it. Choosing Customize is therefore
 * an engineering statement, not a convenience: the sheet prints the values as
 * a stated assumption with the engineer's own justification, and cites no
 * product standard, because there is none to cite.
 */
const CUSTOM_GRADE = 'CUSTOM';

function isCustomGrade(grade) {
  return String(grade || '') === CUSTOM_GRADE;
}

/** Prepended to every grade list so the choice is always visible. */
function withCustomOption(groups) {
  return [
    ...groups,
    { group: 'Not a standard grade', options: [{ value: CUSTOM_GRADE, label: 'Customize — enter the properties by hand' }] },
  ];
}

const MATERIAL_STANDARD = {
  EN10025: 'EN 10025',
  ECP205: 'ECP 205',
  ASTM: 'ASTM',
  EC2: 'EN 1992-1-1',
  ECP203: 'ECP 203-2020',
  ACI318: 'ACI 318',
  BS4449: 'BS 4449',
};

/** Constants that do not depend on grade. */
const MATERIAL_CONSTANTS = {
  eurocode: { E: 210000, G: 80800, nu: 0.30, alpha: 12e-6, steelDensity: 7850, concreteDensity: 2500 },
  egyptian: { E: 210000, G: 80800, nu: 0.30, alpha: 12e-6, steelDensity: 7850, concreteDensity: 2500 },
  american: { E: 200000, G: 77000, nu: 0.30, alpha: 11.7e-6, steelDensity: 7850, concreteDensity: 2400 },
};

/* ---------------- structural steel ---------------- */

/** bands: [maxThickness mm, fy MPa, fu MPa]; the last band's max is Infinity. */
const STRUCTURAL_STEEL = [
  { grade: 'S235', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 235, 360], [80, 215, 360]] },
  { grade: 'S275', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 275, 390], [80, 245, 370]] },
  { grade: 'S355', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 355, 490], [80, 325, 470]] },
  { grade: 'S420', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 420, 510], [80, 390, 490]] },
  { grade: 'S460', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 460, 540], [80, 410, 510]] },
  { grade: 'S500', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 500, 580], [80, 450, 580]] },
  { grade: 'S550', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 550, 600], [80, 500, 600]] },
  { grade: 'S600', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 600, 650], [80, 550, 650]] },
  { grade: 'S620', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 620, 700], [80, 560, 660]] },
  { grade: 'S690', standard: MATERIAL_STANDARD.EN10025, family: 'EN 10025', bands: [[40, 690, 770], [80, 630, 710]] },

  { grade: 'St 37', standard: MATERIAL_STANDARD.ECP205, family: 'ECP 205', bands: [[40, 240, 360], [100, 215, 340]], near: 'S235' },
  { grade: 'St 44', standard: MATERIAL_STANDARD.ECP205, family: 'ECP 205', bands: [[40, 280, 440], [100, 255, 410]], near: 'S275' },
  { grade: 'St 52', standard: MATERIAL_STANDARD.ECP205, family: 'ECP 205', bands: [[40, 360, 520], [100, 335, 490]], near: 'S355' },

  { grade: 'A36', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 250, 400]], note: 'General carbon steel; f_u 400 to 550 MPa', product: 'Plates, bars, shapes' },
  { grade: 'A572 Gr 42', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 290, 415]], product: 'Shapes and plates' },
  { grade: 'A572 Gr 50', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 345, 450]], product: 'Shapes and plates' },
  { grade: 'A572 Gr 55', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 380, 485]], product: 'Shapes and plates' },
  { grade: 'A572 Gr 60', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 415, 520]], product: 'Shapes and plates' },
  { grade: 'A572 Gr 65', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 450, 550]], product: 'Shapes and plates' },
  { grade: 'A992', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 345, 450]], product: 'W shapes, building frames', note: 'f_y 345 to 450 MPa, yield to tensile ratio not above 0.85' },
  { grade: 'A500 Gr C (square or rectangular)', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 345, 427]], product: 'Cold-formed hollow sections' },
  { grade: 'A500 Gr C (round)', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 317, 427]], product: 'Cold-formed hollow sections' },
  { grade: 'A1085', standard: MATERIAL_STANDARD.ASTM, family: 'ASTM', bands: [[Infinity, 345, 450]], product: 'Hollow sections, tighter tolerances' },
];

/**
 * Strength of a grade at a given plate thickness.
 * The thickness is what decides it, so it is required rather than optional: a
 * sheet that named a grade without one would be leaving out the reason the
 * number is what it is.
 */
function steelStrength(gradeName, thicknessMm) {
  const g = STRUCTURAL_STEEL.find((x) => x.grade === gradeName);
  if (!g) return null;
  const t = Number(thicknessMm) || 0;
  for (const [maxT, fy, fu] of g.bands) {
    if (t <= maxT) return { fy, fu, band: maxT, grade: g.grade, standard: g.standard, thickness: t, note: g.note || null };
  }
  const last = g.bands[g.bands.length - 1];
  return {
    fy: last[1], fu: last[2], band: last[0], grade: g.grade, standard: g.standard, thickness: t,
    beyondTable: true,
    note: `${t} mm is beyond the thickness the table covers for ${g.grade}. The strength of the thickest band is shown; confirm it against the product standard.`,
  };
}

/* ---------------- concrete ---------------- */

const CONCRETE_EC2 = [

/* ---------------- pickers ---------------- */

function steelGradeOptions(standards) {
  const list = standards && standards.length
    ? STRUCTURAL_STEEL.filter((g) => standards.includes(g.standard))
    : STRUCTURAL_STEEL;
  const groups = new Map();
  for (const g of list) {
    if (!groups.has(g.family)) groups.set(g.family, []);
    const top = g.bands[0];
    groups.get(g.family).push({ value: g.grade, label: `${g.grade} — f_y ${top[1]}, f_u ${top[2]} MPa` });
  }
  return [...groups.entries()].map(([group, options]) => ({ group, options }));
}

function concreteOptions(standard) {
  if (standard === MATERIAL_STANDARD.EC2) {
    return [{ group: 'EN 1992-1-1', options: CONCRETE_EC2.map((c) => ({ value: c.grade, label: `${c.grade} — f_ck ${c.fck} MPa` })) }];
  }
  if (standard === MATERIAL_STANDARD.ACI318) {
    return [{ group: 'ACI 318', options: CONCRETE_ACI.map((c) => ({ value: c.grade, label: `${c.grade} — ${c.fc} MPa` })) }];
  }
  return [{ group: 'ECP 203-2020', options: CONCRETE_ECP.map((c) => ({ value: c.grade, label: `${c.grade} MPa — E_c ${(c.Ec / 1000).toFixed(1)} GPa` })) }];
}

function rebarOptions(standard) {
  const list = standard ? REBAR.filter((x) => x.standard === standard) : REBAR;
  const groups = new Map();
  for (const b of list) {
    if (!groups.has(b.standard)) groups.set(b.standard, []);
    groups.get(b.standard).push({ value: b.grade, label: `${b.grade} — f_yk ${b.fyk} MPa${b.weldable ? ', weldable' : ''}` });
  }
  return [...groups.entries()].map(([group, options]) => ({ group, options }));
}

function concreteByGrade(grade) {
  return CONCRETE_EC2.find((c) => c.grade === grade)
    || CONCRETE_ECP.find((c) => c.grade === grade)
    || CONCRETE_ACI.find((c) => c.grade === grade)
    || null;
}

function rebarByGrade(grade) {
  return REBAR.find((b) => b.grade === grade) || null;
}

/* ---------------- what a grade actually holds ---------------- */

/**
 * Every property a grade carries, with where each one came from.
 *
 * Written because the screens were showing one number — the yield strength —
 * and the engines were quietly using several more. A modulus, a density and a
 * coefficient of thermal expansion all reach the result, and none of them were
 * on screen for anybody to check. If a value is going into the calculation the
 * engineer is signing, it belongs in front of them.
 *
 * `source` is the document the value was transcribed from, not a design code
 * clause: these are product standards and an office reference, and calling
 * them clauses would be a false citation. Anything the reference does not pin
 * down is returned with `verify` set, and prints with the note that it must be
 * confirmed against the office controlled copy.
 *
 * @param {'steel'|'concrete'|'rebar'} kind
 * @param {string} grade
 * @param {object} [opts] thickness in mm for steel; family for the constants
 * @returns {{rows: Array, source: string|null, note: string|null}|null}
 */
function gradeProperties(kind, grade, opts = {}) {
  if (!grade || isCustomGrade(grade)) return null;
  const family = opts.family && MATERIAL_CONSTANTS[opts.family] ? opts.family : 'eurocode';
  const K = MATERIAL_CONSTANTS[family];
  // These do not vary with grade, so they are not quoted from the grade table.
  // Name the family they belong to the way an engineer would say it.
  const CONST_SOURCE = {
    eurocode: 'Eurocode constants',
    egyptian: 'Egyptian code constants',
    american: 'American code constants',
  }[family];
  const row = (symbol, description, value, dimension, source, extra = {}) =>
    ({ symbol, description, value, dimension, source, ...extra });

  if (kind === 'steel') {
    const s = steelStrength(grade, opts.thickness);
    if (!s) return null;
    const bandText = s.band === Infinity
      ? 'all thicknesses in the table'
      : `plate up to ${s.band} mm`;
    return {
      source: s.standard,
      note: s.beyondTable ? s.note : null,
      rows: [
        row('f_y', `Yield strength, ${bandText}`, s.fy, 'stress', s.standard, { verify: !!s.beyondTable }),
        row('f_u', `Ultimate tensile strength, ${bandText}`, s.fu, 'stress', s.standard, { verify: !!s.beyondTable }),
        row('t', 'Governing plate thickness read from the section', s.thickness, 'length', 'This section'),
        row('E', 'Modulus of elasticity', K.E, 'stress', CONST_SOURCE),
        row('G', 'Shear modulus', K.G, 'stress', CONST_SOURCE),
        row('ν', "Poisson's ratio", K.nu, null, CONST_SOURCE),
        row('α', 'Coefficient of thermal expansion, per °C', K.alpha, null, CONST_SOURCE),
        row('ρ', 'Density, kg/m³', K.steelDensity, null, CONST_SOURCE),
      ],
    };
  }

  if (kind === 'concrete') {
    const c = concreteByGrade(grade);
    if (!c) return null;
    const rows = [];
    if (c.fck !== undefined) {
      rows.push(row('f_ck', 'Characteristic cylinder strength at 28 days', c.fck, 'stress', c.standard));
      rows.push(row('f_ck,cube', 'Characteristic cube strength', c.fckCube, 'stress', c.standard));
      rows.push(row('f_cm', 'Mean cylinder strength', c.fcm, 'stress', c.standard));
      rows.push(row('f_ctm', 'Mean tensile strength', c.fctm, 'stress', c.standard));
      rows.push(row('E_cm', 'Secant modulus', c.Ecm, 'stress', c.standard));
    } else if (c.fcu !== undefined) {
      rows.push(row('f_cu', 'Characteristic cube strength at 28 days', c.fcu, 'stress', c.standard));
      rows.push(row('E_c', 'Modulus of elasticity', c.Ec, 'stress', c.standard));
      rows.push(row('f_ctr', 'Cracking stress', c.fctr, 'stress', c.standard));
      rows.push(row('0.8 f_cu', 'Equivalent cylinder strength', c.fcEquivalent, 'stress', c.standard));
    } else {
      rows.push(row("f'_c", 'Specified compressive strength at 28 days', c.fc, 'stress', c.standard));
      rows.push(row('E_c', 'Modulus of elasticity', c.Ec, 'stress', c.standard));
    }
    rows.push(row('ρ', 'Density, kg/m³', K.concreteDensity, null, CONST_SOURCE));
    return { source: c.standard, note: null, rows };
  }

  const b = rebarByGrade(grade);
  if (!b) return null;
  const rows = [row('f_yk', 'Characteristic yield strength', b.fyk, 'stress', b.standard)];
  if (b.fu) rows.push(row('f_u', 'Characteristic tensile strength', b.fu, 'stress', b.standard));
  if (b.surface) rows.push(row('Surface', 'Bar surface', null, null, b.standard, { text: b.surface }));
  if (b.ductility) rows.push(row('Class', 'Ductility class', null, null, b.standard, { text: b.ductility }));
  rows.push(row('Weldable', 'Suitable for welding', null, null, b.standard,
    { text: b.weldable ? 'Yes' : 'Not without a chemistry review' }));
  rows.push(row('ρ', 'Density, kg/m³', K.steelDensity, null, CONST_SOURCE));
  return { source: b.standard, note: b.note || null, rows };
}

const SECTION_FAMILIES = ['IPE', 'HEA', 'HEB'];

function sectionByName(name) {
  return EUROPEAN_SECTIONS.find((s) => s.name === name) || null;
}

function sectionsInFamily(family) {
  return EUROPEAN_SECTIONS.filter((s) => s.family === family);
}

/** Options for a picker, with unusable rows marked rather than hidden. */
function sectionOptions() {
  return SECTION_FAMILIES.map((family) => ({
    group: family,
    options: sectionsInFamily(family).map((s) => ({
      value: s.name,
      label: s.suspect ? `${s.name} — published data in doubt` : `${s.name} — ${s.massPerMetre} kg/m`,
    })),
  }));
}

/**
 * Find the catalogue section whose dimensions match, within a tolerance. Used
 * when a model arrives with dimensions but no standard name, so the sheet can
 * say IPE 400 rather than four numbers.
 */
function matchByDimensions(h, b, tw, tf, tol = 0.6) {
  const close = (a, x) => Math.abs(a - x) <= tol;
  return EUROPEAN_SECTIONS.find((s) => close(s.h, h) && close(s.b, b)
    && close(s.tw, tw) && close(s.tf, tf)) || null;
}

const PAIRING = {
  BACK_TO_BACK: 'BACK_TO_BACK',   // ][  webs together, flanges pointing out
  TOE_TO_TOE: 'TOE_TO_TOE',       // []  flanges facing, forming a closed box
};

const PAIRING_LABELS = {
  BACK_TO_BACK: 'Back to back  ][  webs together',
  TOE_TO_TOE: 'Toe to toe  []  flanges facing, a closed box',
};

const CONNECTION = {
  BATTENS: 'BATTENS',
  LACING: 'LACING',
};

const CONNECTION_LABELS = {
  BATTENS: 'Batten plates',
  LACING: 'Lacing bars',
};

/**
 * Properties of two channels acting together.
 *
 * About the x-axis the two simply add: both webs are the same distance from the
 * common centroid, so I_x doubles and nothing shifts.
 *
 * About the y-axis the parallel axis theorem does the work, and the distance
 * each channel's own centroid sits from the pair's centroid depends on how they
 * are turned round. That distance is where `e` is needed, and it is why the two
 * arrangements are not interchangeable: back to back with a gap puts the
 * material further out and is far stiffer about the weak axis.
 *
 * @param {object} ch  a channel from the catalogue
 * @param {string} pairing  PAIRING.BACK_TO_BACK or PAIRING.TOE_TO_TOE
 * @param {number} gap  clear distance between the two channels, mm
 */
function doubleChannelSection(ch, pairing, gap) {
  const g = Number(gap) || 0;
  const A = 2 * ch.A * 100;                 // mm2
  const Ix = 2 * ch.Ix * 1e4;               // mm4, unchanged by the arrangement
  const Wplx = 2 * ch.Wplx * 1e3;
  const Welx = 2 * ch.Welx * 1e3;

  // Distance from the pair's centroid to each channel's own centroid
  const backToBack = pairing === PAIRING.BACK_TO_BACK;
  const d = backToBack
    ? g / 2 + ch.e                          // webs inside, centroid lies outward
    : g / 2 + (ch.b - ch.e);                // toes inside, centroid lies outward

  const Iy = 2 * (ch.Iy * 1e4 + ch.A * 100 * d * d);
  const overallWidth = backToBack
    ? g + 2 * ch.b
    : g + 2 * ch.b;
  const Wely = overallWidth > 0 ? (2 * Iy) / overallWidth : 0;

  const It = 2 * ch.It * 1e4;
  const ry = A > 0 ? Math.sqrt(Iy / A) : 0;
  const rx = A > 0 ? Math.sqrt(Ix / A) : 0;

  return {
    A, Ix, Iy, Wplx, Welx, Wely, It, rx, ry,
    d, overallWidth,
    h: ch.h,
    massPerMetre: 2 * ch.massPerMetre,
    source: `2 × ${ch.name}`,
    pairing, gap: g,
    singleIy: ch.Iy * 1e4,
    singleA: ch.A * 100,
    singleRy: ch.iy * 10,
  };
}
