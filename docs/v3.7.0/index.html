  return item.name || '';
}

/**
 * Options for a grade field, and what choosing one sets.
 *
 * The office reference is explicit that a grade name alone is not enough on a
 * calculation sheet, because the yield strength falls with plate thickness. So
 * the strength is read for the thickness actually in the section, and the
 * number that lands in the field is the one that belongs to that plate.
 */
/**
 * Are there bars in the core?
 *
 * Written defensively because a `when` predicate is handed whatever the caller
 * has: the group screen passes a trial section that carries a shape and a wall
 * thickness and nothing else. Reaching straight into geometry.rebar.n threw
 * there, and a form that throws shows no fields at all.
 */
function hasBars(it) {
  const r = it && it.geometry ? it.geometry.rebar : null;
  return !!r && Number(r.n) > 0;
}

function gradeFieldOptions(kind, item) {
  return withCustomOption(standardGradeOptions(kind, item));
}

function standardGradeOptions(kind, item) {
  if (kind === 'steel') {
    const code = String(item.code || '');
    const standards = /ECP/.test(code) ? ['ECP 205', 'EN 10025']
      : /AISC/.test(code) ? ['ASTM', 'EN 10025']
        : ['EN 10025', 'ECP 205', 'ASTM'];
    return steelGradeOptions(standards);
  }
  if (kind === 'concrete') {
    const code = String(item.code || '');
    const std = /EN 199/.test(code) ? MATERIAL_STANDARD.EC2
      : /ACI/.test(code) ? MATERIAL_STANDARD.ACI318
        : MATERIAL_STANDARD.ECP203;
    return concreteOptions(std);
  }
  return rebarOptions();
}


/* ===== src/ui/gradeField.js ===== */
// ui/gradeField.js — choosing a grade, and what it sets.
//
// Kept apart from the screens because both the design screen and the group
// screen need it, and because the thickness rule belongs with the material
// rather than with either screen.


/** The plate whose thickness decides the strength of the grade. */
function governingThickness(g) {
  if (!g) return 0;
  const candidates = [g.tf, g.tfTop, g.tfBot, g.t, g.tw].map(Number).filter((x) => x > 0);
  // The thickest plate governs: the table gives the lower strength for it, and
  // a section is only as strong as the band its heaviest plate falls in.
  return candidates.length ? Math.max(...candidates) : 0;
}

/** Where each kind of grade is recorded, the same on every element. */
const GRADE_PATH = {
  steel: 'materials.grade',
  concrete: 'materials.concreteGrade',
  rebar: 'materials.rebarGrade',
};

/**
 * Is the strength for this kind of material fixed by a named grade?
 *
 * A named grade owns its numbers, so the fields it fills are read-only: a
 * sheet that printed "S355" over a yield strength somebody had edited to
 * something else would be stating a falsehood about a product standard, and it
 * would look exactly as authoritative as a true one. Customize is the way out,
 * and it removes the name along with the lock.
 */
function gradeLocks(item, kind) {
  const g = item && item.materials ? item.materials[GRADE_PATH[kind].split('.')[1]] : null;
  return !!g && !isCustomGrade(g);
}

function applyGrade(item, kind, path, value) {
  const next = { ...item, materials: { ...item.materials }, geometry: { ...item.geometry } };
  setPath(next, path, value);
  // Customize keeps whatever numbers are already in the fields and hands them
  // back to the engineer. Nothing is overwritten and nothing is cleared: the
  // values that were there are usually the right starting point, and wiping
  // them would make the escape hatch cost more than it saves.
  if (!value || isCustomGrade(value)) return next;

  if (kind === 'steel') {
    const t = governingThickness(next.geometry);
    const s = steelStrength(value, t);
    if (s) {
      next.materials.fy = s.fy;
      next.materials.fu = s.fu;
      next.materials.gradeThickness = t;
      next.materials.gradeStandard = s.standard;
    }
    return next;
  }

  if (kind === 'concrete') {
    const c = concreteByGrade(value);
    if (c) {
      if (c.fcu !== undefined) next.materials.fcu = c.fcu;
      if (c.fck !== undefined) { next.materials.fck = c.fck; next.materials.fcu = c.fckCube; }
      if (c.fc !== undefined) { next.materials.fc = c.fc; next.materials.fcu = Math.round(c.fc / 0.8); }
      next.materials.Ec = c.Ec || c.Ecm || null;
    }
    return next;
  }

  const b = rebarByGrade(value);
  if (b) {
    next.materials.fy = b.fyk;
    next.materials.fsk = b.fyk;
    if (b.fu) next.materials.fu = b.fu;
  }
  return next;
}

function gradeHint(kind, value, item, units) {
  if (!value) return 'Choose a grade. Its properties are then fixed by the standard it comes from.';
  if (isCustomGrade(value)) {
    return 'Properties are entered by hand and cite no product standard. They print on the sheet as a stated assumption, so record why these values were used.';
  }

  if (kind === 'steel') {
    const t = governingThickness(item.geometry);
    const s = steelStrength(value, t);
    if (!s) return null;
    if (s.beyondTable) return s.note;
    return `f_y ${formatStrength(s.fy, units)}, f_u ${formatStrength(s.fu, units)} for the ${t} mm plate, from ${s.standard}. `
      + 'The strength falls with thickness, so it is read for the plate in this section rather than from the grade name alone.';
  }

  if (kind === 'concrete') {
    const c = concreteByGrade(value);
    if (!c) return null;
    if (c.fcu !== undefined && c.fctr !== undefined) {
      return `f_cu ${formatStrength(c.fcu, units)} · E_c ${(c.Ec / 1000).toFixed(1)} GPa · cracking stress ${formatStrength(c.fctr, units)}`;
    }
    if (c.fck !== undefined) {
      return `f_ck ${formatStrength(c.fck, units)} cylinder, ${c.fckCube} MPa cube · f_ctm ${formatStrength(c.fctm, units)} · E_cm ${(c.Ecm / 1000).toFixed(1)} GPa`;
    }
    return `f'_c ${formatStrength(c.fc, units)} · E_c ${(c.Ec / 1000).toFixed(1)} GPa`;
  }

  const b = rebarByGrade(value);
  if (!b) return null;
  const bits = [`f_yk ${formatStrength(b.fyk, units)}`];
  if (b.fu) bits.push(`f_u ${formatStrength(b.fu, units)}`);
  if (b.surface) bits.push(b.surface.toLowerCase());
  if (b.weldable) bits.push('weldable');
  if (b.ductility) bits.push(`ductility class ${b.ductility}`);
  return bits.join(' · ');
}

/**
 * The properties panel shown under a grade field.
 *
 * Every value the grade puts into the calculation, not only the one the field
 * happens to display. An engineer asked for this after finding that choosing a
 * grade set a modulus and a density he never saw.
 */
function gradePropertyRows(kind, value, item, units) {
  const code = String((item && item.code) || '');
  const family = /ACI|AISC/.test(code) ? 'american' : /ECP/.test(code) ? 'egyptian' : 'eurocode';
  const t = kind === 'steel' ? governingThickness(item && item.geometry) : 0;
  const p = gradeProperties(kind, value, { thickness: t, family });
  if (!p) return null;
  return {
    source: p.source,
    note: p.note,
    rows: p.rows.map((r) => ({
      ...r,
      display: r.text !== undefined ? r.text
        : r.dimension === 'stress' ? formatStrength(r.value, units)
          : r.dimension ? formatWithUnit(r.value, r.dimension, units)
            : formatPlain(r.value),
    })),
  };
}

/** Small numbers such as 12e-6 must not print as 0.000. */
function formatPlain(v) {
  if (v === null || v === undefined) return '—';
  const n = Number(v);
  if (!Number.isFinite(n)) return String(v);
  if (n !== 0 && Math.abs(n) < 0.001) return n.toExponential(1);
  return String(Number(n.toFixed(4)));
}


/* ===== src/drawings/model.js ===== */
// drawings/model.js — a drawing described as geometry, not as a picture.
//
// Nothing here knows what SVG is. A view holds entities in millimetres, in a
// right-handed frame with y upward, which is how a draughtsman and a DXF file
// both read a drawing; the renderer flips y, because screens do not. Keeping
// the model neutral is the whole point: DWG export, when it comes, is another
// translation of this same structure rather than a second drawing engine
// written from scratch and drifting away from the first.
//
// The rule that governs the rest of the platform governs this file too, and
// harder. `dim()` refuses to build a dimension that cannot say where its value
// came from, exactly as `step()` in core/calc.js refuses a code provision with
// no clause. A wrong number in a calculation is reviewed before it is used. A
// wrong number on a drawing is cut to in a workshop.

/**
 * Layers, named for what they mean rather than for how they look.
 * The renderer decides weight and colour; a DXF export maps them to its own.
 */
const LAYER = {
  OUTLINE: 'OUTLINE',       // the thing itself
  HIDDEN: 'HIDDEN',         // edges behind the cut
  CENTRE: 'CENTRE',         // axes of symmetry
  SECTION: 'SECTION',       // material shown cut
  REBAR: 'REBAR',
  DIMENSION: 'DIMENSION',
  TEXT: 'TEXT',
  EXCLUDED: 'EXCLUDED',     // stated as not designed here
};

/** Where a drawn value came from. A dimension must carry one. */
const SOURCE_KIND = {
  VERIFIED: 'verified',     // a value the platform calculated and checked
  INPUT: 'input',           // entered by the engineer and recorded
  CATALOGUE: 'catalogue',   // read from a section table
};

function line(x1, y1, x2, y2, layer = LAYER.OUTLINE) {
  return { type: 'line', x1, y1, x2, y2, layer };
}

function rect(x, y, w, h, layer = LAYER.OUTLINE) {
  return { type: 'rect', x, y, w, h, layer };
}

function circle(cx, cy, r, layer = LAYER.OUTLINE) {
  return { type: 'circle', cx, cy, r, layer };
}

function text(x, y, value, opts = {}) {
  return {
    type: 'text', x, y, value,
    size: opts.size || 2.5, anchor: opts.anchor || 'start',
    rotate: opts.rotate || 0, layer: opts.layer || LAYER.TEXT,
  };
}

/**
 * A dimension. The one entity that states a number, so the one entity that has
 * to justify it.
 *
 * `source` names the field the value was taken from and `kind` says what sort
 * of value it is. There is no default: a dimension whose origin nobody can
 * name is the failure this guard exists to prevent, and defaulting would let
 * it through silently.
 */
function dim({ kind, x1, y1, x2, y2, offset = 10, value, label, source, origin }) {
  if (!source) throw new Error('drawings: a dimension must name where its value came from');
  if (!origin || !SOURCE_KIND[String(origin).toUpperCase()]) {
    throw new Error(`drawings: dimension "${source}" must say whether it is verified, input or catalogue`);
  }
  if (!Number.isFinite(value)) {
    throw new Error(`drawings: dimension "${source}" has no finite value`);
  }
  return {
    type: 'dim', kind, x1, y1, x2, y2, offset,
    value, label: label || null, source, origin,
    layer: LAYER.DIMENSION,
  };
}

/**
 * A note pointing at a place on the drawing.
 *
 * Used for what is deliberately absent. A revision cloud is the draughting
 * convention for "look here", and an exclusion is precisely something the
 * reader must look at rather than assume.
 */
function cloud({ x, y, w, h, title, body }) {
  return { type: 'cloud', x, y, w, h, title, body, layer: LAYER.EXCLUDED };
}

function leader({ x, y, tx, ty, value }) {
  return { type: 'leader', x, y, tx, ty, value, layer: LAYER.TEXT };
}

/** Diagonal hatching over a closed rectangle, for material shown cut. */
function hatch(x, y, w, h, spacing = 3) {
  return { type: 'hatch', x, y, w, h, spacing, layer: LAYER.SECTION };
}

/**
 * A view: one drawing at one scale, with its own origin.
 *
 * `scale` is a true ratio and is printed. A drawing scaled to fill the page is
 * a drawing nobody can measure, and somebody always measures.
 */
function view({ id, title, scale, entities = [], extent }) {
  return { id, title, scale, entities, extent: extent || boundsOf(entities) };
}

function drawingSet({ id, title, itemLabel, views = [], notes = [], excluded = [], materials = [], layout = 'row' }) {
  // 'row' puts the views side by side; 'stack' gives each the full width of
  // the sheet. A beam needs 'stack': at thirty to one, an elevation squeezed
  // into half a page is a line with dimensions written across it.
  return { id, title, itemLabel, views, notes, excluded, materials, layout };
}

/** The bounding box of a set of entities, in model millimetres. */
function boundsOf(entities) {
  let minX = Infinity; let minY = Infinity; let maxX = -Infinity; let maxY = -Infinity;
  const put = (x, y) => {
    if (!Number.isFinite(x) || !Number.isFinite(y)) return;
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  };
  for (const e of entities) {
    if (e.type === 'dim') {
      // The dimension line sits at its offset, and the figure sits beyond
      // that. Measuring only the two witness points reported a view narrower
      // than it actually drew, so the scale came out one ratio too large and
      // the view was cropped at the frame — the exact failure chooseScale
      // rounds down to avoid.
      put(e.x1, e.y1); put(e.x2, e.y2);
      if (e.kind === 'vertical') {
        put(e.x1 + e.offset * 1.25, e.y1); put(e.x2 + e.offset * 1.25, e.y2);
      } else {
        put(e.x1, e.y1 + e.offset * 1.25); put(e.x2, e.y2 + e.offset * 1.25);
      }
    } else if (e.type === 'line') { put(e.x1, e.y1); put(e.x2, e.y2); }
    else if (e.type === 'rect' || e.type === 'cloud' || e.type === 'hatch') { put(e.x, e.y); put(e.x + e.w, e.y + e.h); }
    else if (e.type === 'circle') { put(e.cx - e.r, e.cy - e.r); put(e.cx + e.r, e.cy + e.r); }
    else if (e.type === 'text') {
      // Text runs from its anchor. Counting only the anchor let a label run
      // off the edge of its own view.
      const w = e.value.length * e.size * 0.62;
      const from = e.anchor === 'end' ? e.x - w : e.anchor === 'middle' ? e.x - w / 2 : e.x;
      put(from, e.y - e.size); put(from + w, e.y + e.size);
    }
    else if (e.type === 'leader') { put(e.x, e.y); put(e.tx, e.ty); }
  }
  if (!Number.isFinite(minX)) return { minX: 0, minY: 0, maxX: 0, maxY: 0 };
  return { minX, minY, maxX, maxY };
}

/**
 * Every dimension on the set, so the sheet can list what each was taken from.
 * A reader should be able to audit a drawing without opening the platform.
 */
function dimensionRegister(set) {
  const out = [];
  for (const v of set.views) {
    for (const e of v.entities) {
      // The value is carried in millimetres and formatted by the caller, so
      // the register and the drawing cannot disagree about units.
      if (e.type === 'dim') out.push({ view: v.title, source: e.source, origin: e.origin, value: e.value, label: e.label });
    }
  }
  return out;
}


/* ===== src/drawings/svg.js ===== */
// drawings/svg.js — one translation of the neutral model. Vector, printable.
//
// This is the only file that knows what SVG is. It reads the model and emits
// geometry; it never decides what a drawing contains. A DWG or DXF export is
// another file beside this one reading the same model, which is why the model
// exists at all.
//
// Scale is chosen from a standard series and then printed. Fitting a drawing
// to the page produces a drawing that cannot be measured, and on a shop
// drawing somebody always measures — so the scale is picked to fit, rounded
// down to a real ratio, and stated on the view.


/**
 * A figured dimension, in the units the project is working in.
 *
 * The model holds millimetres because that is the neutral frame a DXF also
 * uses, but the drawing goes to a workshop that works in the project's own
 * units, and a drawing that silently changes units between the screen and the
 * paper is the worst kind of error: everything looks right.
 *
 * Small values get two fixed decimals rather than the shortest form. A 5 mm
 * wall is 0.5 cm, and "0.5" loses its point to a bad photocopy or a fax and
 * reads as 5. "0.50" does not.
 */
function dimFigure(valueMm, units) {
  const n = Number(valueMm);
  if (!Number.isFinite(n)) return '—';
  const v = fromBase(n, 'length', units);
  if (Number.isInteger(v)) return String(v);
  return v < 10 ? v.toFixed(2) : String(Number(v.toFixed(2)));
}

/** "MILLIMETRES", "CENTIMETRES" — spelled out, never abbreviated on a drawing. */
function unitWord(units) {
  const sym = symbolFor(units, 'length');
  return sym === 'mm' ? 'MILLIMETRES' : sym === 'cm' ? 'CENTIMETRES' : sym === 'm' ? 'METRES' : String(sym).toUpperCase();
}

/** Ratios a drawing office actually uses. */
const SCALES = [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500];

/**
 * The largest standard scale that fits the extent into the frame.
 * Rounded down, never up: a view that overruns its frame is a view that has
 * been cropped, and a cropped shop drawing hides exactly the detail at the
 * edge that somebody needed.
 */
function chooseScale(extent, frameW, frameH, pad = 5) {
  const w = Math.max(1, extent.maxX - extent.minX);
  const h = Math.max(1, extent.maxY - extent.minY);
  const need = Math.max(w / (frameW - 2 * pad), h / (frameH - 2 * pad));
  for (const s of SCALES) if (s >= need) return s;
  return SCALES[SCALES.length - 1];
}

const STROKE = {
  [LAYER.OUTLINE]: { w: 0.5, c: 'var(--tg-ink)', d: null },
  [LAYER.HIDDEN]: { w: 0.25, c: 'var(--tg-ink-60)', d: '2,1.5' },
  [LAYER.CENTRE]: { w: 0.18, c: 'var(--tg-ink-40)', d: '6,1.5,1,1.5' },
  [LAYER.SECTION]: { w: 0.15, c: 'var(--tg-ink-40)', d: null },
  [LAYER.REBAR]: { w: 0.45, c: 'var(--tg-ink)', d: null },
  [LAYER.DIMENSION]: { w: 0.18, c: 'var(--tg-ink-60)', d: null },
  [LAYER.TEXT]: { w: 0, c: 'var(--tg-ink)', d: null },
  [LAYER.EXCLUDED]: { w: 0.4, c: 'var(--tg-red-deep)', d: '3,2' },
};

const escSvg = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/**
 * Render one view into paper millimetres.
 *
 * Model y is up, paper y is down, so y is negated on the way out. Doing it
 * here, once, keeps every generator working in the frame an engineer expects.
 */
function renderView(v, { x, y, w, h }, units) {
  const scale = v.scale || chooseScale(v.extent, w, h);
  const k = 1 / scale;
  const cx = (v.extent.minX + v.extent.maxX) / 2;
  const cy = (v.extent.minY + v.extent.maxY) / 2;
  const ox = x + w / 2 - cx * k;
  const oy = y + h / 2 + cy * k;
  const px = (mx) => ox + mx * k;
  const py = (my) => oy - my * k;

  const out = [];
  const pen = (layer) => {
    const s = STROKE[layer] || STROKE[LAYER.OUTLINE];
    return `stroke="${s.c}" stroke-width="${s.w}" fill="none"${s.d ? ` stroke-dasharray="${s.d}"` : ''}`;
  };

  for (const e of v.entities) {
    if (e.type === 'line') {
      out.push(`<line x1="${px(e.x1)}" y1="${py(e.y1)}" x2="${px(e.x2)}" y2="${py(e.y2)}" ${pen(e.layer)}/>`);
    } else if (e.type === 'rect') {
      out.push(`<rect x="${px(e.x)}" y="${py(e.y + e.h)}" width="${e.w * k}" height="${e.h * k}" ${pen(e.layer)}/>`);
    } else if (e.type === 'circle') {
      out.push(`<circle cx="${px(e.cx)}" cy="${py(e.cy)}" r="${e.r * k}" ${pen(e.layer)}/>`);
    } else if (e.type === 'hatch') {
      out.push(renderHatch(e, px, py, k));
    } else if (e.type === 'text') {
      out.push(`<text x="${px(e.x)}" y="${py(e.y)}" font-size="${Math.max(1.6, e.size * k)}" text-anchor="${e.anchor === 'middle' ? 'middle' : e.anchor === 'end' ? 'end' : 'start'}" fill="var(--tg-ink)" font-family="var(--tg-font-ident)">${escSvg(e.value)}</text>`);
    } else if (e.type === 'dim') {
      out.push(renderDim(e, px, py, k, units));
    } else if (e.type === 'cloud') {
      out.push(renderCloud(e, px, py, k));
    }
  }
  return { svg: out.join(''), scale };
}

function renderHatch(e, px, py, k) {
  const parts = [];
  const step = e.spacing;
  for (let i = -e.h; i < e.w; i += step) {
    const x1 = e.x + i; const y1 = e.y;
    const x2 = e.x + i + e.h; const y2 = e.y + e.h;
    const cx1 = Math.max(e.x, Math.min(e.x + e.w, x1));
    const cx2 = Math.max(e.x, Math.min(e.x + e.w, x2));
    if (cx2 <= cx1) continue;
    const t1 = (cx1 - x1) / (x2 - x1 || 1);
    const t2 = (cx2 - x1) / (x2 - x1 || 1);
    parts.push(`<line x1="${px(cx1)}" y1="${py(y1 + (y2 - y1) * t1)}" x2="${px(cx2)}" y2="${py(y1 + (y2 - y1) * t2)}" stroke="var(--tg-ink-40)" stroke-width="0.12"/>`);
  }
  return parts.join('');
}

/** Extension lines, a dimension line with ticks, and the figure above it. */
function renderDim(e, px, py, k, units) {
  const vertical = e.kind === 'vertical';
  const off = e.offset * k;
  const a = { x: px(e.x1), y: py(e.y1) };
  const b = { x: px(e.x2), y: py(e.y2) };
  const la = vertical ? { x: a.x + off, y: a.y } : { x: a.x, y: a.y - off };
  const lb = vertical ? { x: b.x + off, y: b.y } : { x: b.x, y: b.y - off };
  const mid = { x: (la.x + lb.x) / 2, y: (la.y + lb.y) / 2 };
  const s = 'stroke="var(--tg-ink-60)" stroke-width="0.18" fill="none"';
  const tick = (p) => `<line x1="${p.x - 0.9}" y1="${p.y + 0.9}" x2="${p.x + 0.9}" y2="${p.y - 0.9}" ${s}/>`;
  // Not Math.round. A 12.5 mm wall printed as 13 is a fabrication error of
  // half a millimetre introduced by the drawing itself, and the figured
  // dimension is the one that gets worked to.
  const figure = e.label ? `${dimFigure(e.value, units)}  ${e.label}` : dimFigure(e.value, units);
  const rot = vertical ? ` transform="rotate(-90 ${mid.x} ${mid.y})"` : '';
  return [
    `<line x1="${a.x}" y1="${a.y}" x2="${la.x}" y2="${la.y}" ${s}/>`,
    `<line x1="${b.x}" y1="${b.y}" x2="${lb.x}" y2="${lb.y}" ${s}/>`,
    `<line x1="${la.x}" y1="${la.y}" x2="${lb.x}" y2="${lb.y}" ${s}/>`,
    tick(la), tick(lb),
    `<text x="${mid.x}" y="${mid.y - 1.2}" font-size="2.4" text-anchor="middle" fill="var(--tg-ink)" font-family="var(--tg-font-ident)"${rot}>${escSvg(figure)}</text>`,
  ].join('');
}

/** A revision cloud: the convention for "read this before you build". */
function renderCloud(e, px, py, k) {
  // The box is positioned from the model but sized from its own text. Sizing
  // it in model millimetres meant that at 1:50 the cloud came out 24 mm wide
  // holding a line that needed sixty, and the words ran out across the
  // drawing — over the very geometry the cloud was drawing attention to.
  const lines = wrapText(e.body, 46);
  const needW = Math.max(56, 1.45 * Math.max(e.title.length, ...lines.map((l) => l.length)));
  const needH = 9 + lines.length * 3.2;
  const cxp = (px(e.x) + px(e.x + e.w)) / 2;
  const w = Math.max(e.w * k, needW);
  const h = Math.max(e.h * k, needH);
  // Anchored by its top edge, not its centre. Centring meant that a cloud
  // which had to grow to hold its text grew upwards as well as down, back
  // across the base of the column it was drawing attention to.
  const x = cxp - w / 2; const y = py(e.y + e.h);
  const r = Math.max(1.6, Math.min(w, h) / 10);
  const arcs = [];
  const step = r * 1.6;
  const edge = (x1, y1, x2, y2) => {
    const len = Math.hypot(x2 - x1, y2 - y1);
    const n = Math.max(2, Math.round(len / step));
    for (let i = 0; i < n; i += 1) {
      const t1 = i / n; const t2 = (i + 1) / n;
      const p1x = x1 + (x2 - x1) * t1; const p1y = y1 + (y2 - y1) * t1;
      const p2x = x1 + (x2 - x1) * t2; const p2y = y1 + (y2 - y1) * t2;
      arcs.push(`M${p1x} ${p1y} A${r} ${r} 0 0 1 ${p2x} ${p2y}`);
    }
  };
  edge(x, y, x + w, y); edge(x + w, y, x + w, y + h);
  edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
  const out = [
    `<path d="${arcs.join(' ')}" stroke="var(--tg-red-deep)" stroke-width="0.35" fill="none"/>`,
    `<text x="${x + w / 2}" y="${y + 5}" font-size="2.6" font-weight="700" text-anchor="middle" fill="var(--tg-red-deep)" font-family="var(--tg-font-ident)">${escSvg(e.title)}</text>`,
  ];
  lines.forEach((l, i) => {
    out.push(`<text x="${x + w / 2}" y="${y + 8.6 + i * 3.2}" font-size="2.2" text-anchor="middle" fill="var(--tg-red-deep)" font-family="var(--tg-font-ident)">${escSvg(l)}</text>`);
  });
  return out.join('');
}

/** Break a note onto lines that fit the cloud, without splitting words. */
function wrapText(str, max) {
  const words = String(str).split(/\s+/);
  const lines = []; let cur = '';
  for (const w of words) {
    if (!cur.length) { cur = w; continue; }
    if ((cur + ' ' + w).length <= max) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}

/**
 * One A4 sheet, portrait, in millimetres, with the views laid side by side.
 * Returns an SVG string so the caller can put it on screen, print it, or write
 * it to a file without this module knowing which.
 */
function renderSheetSvg(set, { frameW = 194, frameH = 250, x0 = 8, y0 = 8, units = 'SI' } = {}) {
  const n = Math.max(1, set.views.length);
  void n;
  // The frame is sized to the drawing, in two passes: choose the scales
  // against the page, then bring the frame down to what those scales actually
  // occupy. A fixed frame left a column drawn at 1:50 sitting in the top half
  // of an empty box, which reads as an unfinished sheet rather than a finished
  // one and invites somebody to scale off the white space.
  // Cells in proportion to what each view holds. Equal cells gave a tall thin
  // elevation half a page of empty paper beside a small section, and the
  // standard scale series then had to step down a whole ratio to fit.
  const widths = set.views.map((v) => {
    const w = Math.max(1, v.extent.maxX - v.extent.minX);
    const hh = Math.max(1, v.extent.maxY - v.extent.minY);
    // Bounded far more tightly than before. A tall thin elevation beside a
    // square section was being squeezed into a quarter of the page while the
    // section took two thirds, and the elevation then had to drop a whole
    // ratio to fit its own cell.
    return Math.max(0.75, Math.min(1.5, w / hh)) + 0.55;
  });
  const wsum = widths.reduce((a, b) => a + b, 0);
  // Pass one picks the scale against the full page. The chosen scale is then
  // carried into the render, not recomputed: letting the second pass choose
  // again against the now-smaller frame made it step down a whole ratio, so
  // fitting the frame to the drawing shrank the drawing instead.
  // 'stack' gives each view the full width of the sheet, one above the other.
  // A beam at thirty to one squeezed into half a page is a line with its
  // dimensions written across it; given the full width it reads.
  const stacked = set.layout === 'stack';
  const bandH = stacked ? (frameH - 8) / Math.max(1, set.views.length) : frameH;
  const chosen = set.views.map((v, i) => {
    const cw = stacked ? frameW : (frameW * widths[i]) / wsum;
    return v.scale || chooseScale(v.extent, cw, bandH - 26);
  });
  let used = 0;
  set.views.forEach((v, i) => {
    const h2 = (v.extent.maxY - v.extent.minY) / chosen[i] + (stacked ? 14 : 26);
    used = stacked ? used + h2 : Math.max(used, h2);
  });
  // Enough room for the views plus their titles and scales, and no more.
  const fitH = Math.max(110, Math.min(frameH, used + 4));

  const parts = [];
  const scales = [];
  let cursor = x0;

  parts.push(`<rect x="${x0}" y="${y0}" width="${frameW}" height="${fitH}" stroke="var(--tg-ink)" stroke-width="0.4" fill="none"/>`);

  let vcursor = y0 + 6;
  set.views.forEach((v, i) => {
    const cellW = stacked ? frameW : (frameW * widths[i]) / wsum;
    // The drawing gets its own height; the title and scale get a strip under
    // it. Putting the title inside the band let a revision cloud at the foot
    // of an elevation print straight through it.
    // A cloud is sized from its own text at paper scale, so it can draw
    // taller than the model box the bounds were taken from. Reserve for it,
    // or the view title prints through it.
    const cloudy = v.entities.some((e2) => e2.type === 'cloud') ? 10 : 0;
    const drawH = stacked ? (v.extent.maxY - v.extent.minY) / chosen[i] + 4 + cloudy : fitH - 20;
    const box = stacked
      ? { x: x0, y: vcursor, w: cellW, h: drawH }
      : { x: cursor, y: y0 + 8, w: cellW, h: fitH - 20 };
    if (stacked) vcursor += drawH + 14; else cursor += cellW;
    const r = renderView({ ...v, scale: chosen[i] }, box, units);
    scales.push({ title: v.title, scale: r.scale });
    parts.push(r.svg);
    const ty = stacked ? box.y + box.h + 6 : y0 + fitH - 4;
    parts.push(`<text x="${box.x + box.w / 2}" y="${ty}" font-size="3" font-weight="700" text-anchor="middle" fill="var(--tg-ink)" font-family="var(--tg-font-ident)">${escSvg(v.title)}</text>`);
    parts.push(`<text x="${box.x + box.w / 2}" y="${ty + 3.5}" font-size="2.4" text-anchor="middle" fill="var(--tg-ink-60)" font-family="var(--tg-font-ident)">SCALE 1 : ${r.scale}</text>`);
    if (i > 0) {
      parts.push(stacked
        ? `<line x1="${x0}" y1="${box.y - 5}" x2="${x0 + frameW}" y2="${box.y - 5}" stroke="var(--tg-rule)" stroke-width="0.2"/>`
        : `<line x1="${box.x}" y1="${y0}" x2="${box.x}" y2="${y0 + fitH}" stroke="var(--tg-rule)" stroke-width="0.2"/>`);
    }
  });

  parts.push(`<text x="${x0 + frameW / 2}" y="${y0 - 2}" font-size="3" font-weight="700" text-anchor="middle" fill="var(--tg-ink)" font-family="var(--tg-font-ident)">ALL DIMENSIONS IN ${unitWord(units)}</text>`);

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 210 ${y0 + fitH + 14}" width="100%" preserveAspectRatio="xMidYMid meet">${parts.join('')}</svg>`;
  return { svg, scales };
}


/* ===== src/drawings/cfst.js ===== */
// drawings/cfst.js — shop drawing for a concrete-filled tubular column.
//
// What this draws is bounded by what the platform has actually verified. The
// tube geometry, the length and the reinforcement are all checked values, so
// they are drawn and dimensioned. The base, the anchorage, the embedment and
// every connection are not designed here, so they are not drawn at all — they
// are named, in a cloud on the drawing and in a list on the sheet.
//
// That restraint is the point rather than a limitation. A drawing that shows a
// base plate the platform never sized, at a thickness chosen because it looked
// reasonable, is more dangerous than a drawing with nothing there: it is to
// scale, it carries a dimension, and it will be fabricated. The column stops at
// the top of the foundation because that is where verified information stops.
//
// Length note: geometry.length is the system length — the length the buckling
// checks were carried out on. It is not a fabrication length, and it would not
// be one if the column is cast into the foundation. Drawing to the top of the
// foundation keeps the dimension on the drawing identical to the dimension the
// design used, with nothing to confuse the two.


/** Why a drawing cannot be produced, in the engineer's terms. */
function drawingBlockers(item) {
  const out = [];
  const res = item && item.result;
  if (!res) {
    out.push('The item has not been calculated. A drawing is produced from a completed design, not from the inputs.');
    return out;
  }
  if (res.summary.overall !== OVERALL.SAFE) {
    out.push(`The design reads ${res.summary.overall}. A shop drawing is an instruction to fabricate, so it is produced only from a design that is satisfactory on every check that applies.`);
  }
  const g = item.geometry || {};
  if (!Number.isFinite(Number(g.length)) || Number(g.length) <= 0) {
    out.push('The column has no length. It cannot be drawn in elevation.');
  }
  return out;
}

function canDraw(item) {
  return drawingBlockers(item).length === 0;
}

/**
 * The exclusions, written once and used in three places: the cloud on the
 * elevation, the notes block, and the list on the sheet. One source so they
 * cannot drift apart and leave the drawing claiming more than the sheet.
 */
const CFST_EXCLUSIONS = [
  {
    id: 'base',
    title: 'Foundation, embedment and base plate',
    body: 'Not designed in this item. The column is drawn to the top of the foundation. Any embedment length is governed by bond and anchorage and is not calculated here, and no base plate or holding-down assembly is designed or shown.',
  },
  {
    id: 'splice',
    title: 'Splices and connections',
    body: 'This drawing describes the column as one continuous length. No splice, end plate, welded connection or attachment is designed here, and no splice position is implied — the position depends on delivery length, storey height and handling, none of which the analysis model holds.',
  },
  {
    id: 'fire',
    title: 'Fire protection',
    body: 'No applied fire protection is designed or shown. Fire design of composite columns is EN 1994-1-2, which this platform does not calculate.',
  },
];

function tubeWidth(g) {
  return g.shape === SHAPE.CHS ? Number(g.d) : Number(g.b);
}

function tubeDepth(g) {
  if (g.shape === SHAPE.CHS) return Number(g.d);
  return g.shape === SHAPE.SHS ? Number(g.b) : Number(g.h);
}

/**
 * The elevation. Deliberately plain: an outline, a centre line, the two
 * dimensions that matter, and a statement of where the drawing stops.
 */
function elevationView(item) {
  const g = item.geometry;
  const b = tubeWidth(g);
  const L = Number(g.length);
  const e = [];

  // The tube, with its base sitting on y = 0 — the top of the foundation.
  e.push(rect(-b / 2, 0, b, L, LAYER.OUTLINE));
  e.push(line(0, -L * 0.03, 0, L * 1.03, LAYER.CENTRE));

  // The top of the foundation is a real, known level: the underside of the
  // verified length. It is drawn as a boundary rather than as a foundation,
  // because the foundation itself is not designed here.
  e.push(line(-b * 1.6, 0, b * 1.6, 0, LAYER.EXCLUDED));
  e.push(text(b * 1.7, b * 0.22, 'TOP OF FOUNDATION', { size: b * 0.42, anchor: 'start' }));

  e.push(dim({
    kind: 'vertical', x1: -b / 2, y1: 0, x2: -b / 2, y2: L,
    offset: -b * 0.9, value: L, label: 'SYSTEM LENGTH',
    source: 'geometry.length', origin: SOURCE_KIND.VERIFIED,
  }));
  e.push(dim({
    kind: 'horizontal', x1: -b / 2, y1: L, x2: b / 2, y2: L,
    offset: b * 0.55, value: b,
    source: g.shape === SHAPE.CHS ? 'geometry.d' : 'geometry.b',
    origin: SOURCE_KIND.VERIFIED,
  }));

  e.push(cloud({
    x: -b * 1.5, y: -L * 0.30, w: b * 3, h: L * 0.20,
    title: 'NOT IN THIS DRAWING',
    body: 'Foundation, embedment and base plate — separate design',
  }));

  return view({ id: 'elevation', title: 'Elevation', scale: null, entities: e });
}

/** The cut section, which is where the tube wall and the bars are readable. */
function sectionView(item) {
  const g = item.geometry;
  const t = Number(g.t);
  const e = [];
  const round = g.shape === SHAPE.CHS;
  const B = tubeWidth(g);
  const D = tubeDepth(g);

  if (round) {
    const R = B / 2;
    e.push(circle(0, 0, R, LAYER.OUTLINE));
    e.push(circle(0, 0, R - t, LAYER.OUTLINE));
  } else {
    e.push(rect(-B / 2, -D / 2, B, D, LAYER.OUTLINE));
    e.push(rect(-B / 2 + t, -D / 2 + t, B - 2 * t, D - 2 * t, LAYER.OUTLINE));
    e.push(hatch(-B / 2 + t, -D / 2 + t, B - 2 * t, D - 2 * t, Math.max(B / 26, 2)));
  }
  e.push(line(-B * 0.62, 0, B * 0.62, 0, LAYER.CENTRE));
  e.push(line(0, -D * 0.62, 0, D * 0.62, LAYER.CENTRE));

  // Bars, only where there are bars. The platform hides the diameter and the
  // cover on the input screen when the count is zero, and a drawing that then
  // showed bars would contradict the screen it came from.
  const n = Number((g.rebar || {}).n) || 0;
  if (n > 0) {
    const dia = Number(g.rebar.dia);
    const cover = Number(g.rebar.cover);
    const rBar = dia / 2;
    const positions = barPositions(g, n, cover, dia, round, B, D, t);
    for (const p of positions) e.push(circle(p.x, p.y, rBar, LAYER.REBAR));
    e.push(dim({
      kind: 'horizontal', x1: -B / 2, y1: -D / 2, x2: -B / 2 + t + cover, y2: -D / 2,
      offset: -D * 0.16, value: cover, label: 'COVER',
      source: 'geometry.rebar.cover', origin: SOURCE_KIND.VERIFIED,
    }));
    e.push(text(B * 0.72, D * 0.30, `${n} No. Ø${dia}`, { size: B * 0.07 }));
  }

  e.push(dim({
    kind: 'horizontal', x1: -B / 2, y1: D / 2, x2: B / 2, y2: D / 2,
    offset: D * 0.42, value: B,
    source: round ? 'geometry.d' : 'geometry.b', origin: SOURCE_KIND.VERIFIED,
  }));
  if (!round) {
    e.push(dim({
      kind: 'vertical', x1: B / 2, y1: -D / 2, x2: B / 2, y2: D / 2,
      offset: B * 0.42, value: D,
      source: g.shape === SHAPE.SHS ? 'geometry.b' : 'geometry.h', origin: SOURCE_KIND.VERIFIED,
    }));
  }
  e.push(dim({
    kind: 'horizontal', x1: -B / 2, y1: -D / 2, x2: -B / 2 + t, y2: -D / 2,
    offset: -D * 0.30, value: t, label: 'WALL',
    source: 'geometry.t', origin: SOURCE_KIND.VERIFIED,
  }));

  return view({ id: 'section', title: 'Section A–A', scale: null, entities: e });
}

/**
 * Where the bars sit.
 *
 * Spread evenly on the circle that the cover and the tube wall define. This is
 * an arrangement consistent with the cover that was checked; it is not a bar
 * schedule, and the drawing says as much, because spacing and laps are not
 * calculated by this platform.
 */
function barPositions(g, n, cover, dia, round, B, D, t) {
  const out = [];
  if (round) {
    const r = B / 2 - t - cover - dia / 2;
    for (let i = 0; i < n; i += 1) {
      const a = (2 * Math.PI * i) / n - Math.PI / 2;
      out.push({ x: r * Math.cos(a), y: r * Math.sin(a) });
    }
    return out;
  }
  const x = B / 2 - t - cover - dia / 2;
  const y = D / 2 - t - cover - dia / 2;
  const perSide = Math.max(2, Math.ceil(n / 4) + 1);
  const ring = [];
  for (let i = 0; i < perSide; i += 1) {
    const f = perSide === 1 ? 0.5 : i / (perSide - 1);
    ring.push({ x: -x + 2 * x * f, y });
  }
  for (let i = 1; i < perSide; i += 1) {
    const f = i / (perSide - 1);
    ring.push({ x, y: y - 2 * y * f });
  }
  for (let i = 1; i < perSide; i += 1) {
    const f = i / (perSide - 1);
    ring.push({ x: x - 2 * x * f, y: -y });
  }
  for (let i = 1; i < perSide - 1; i += 1) {
    const f = i / (perSide - 1);
    ring.push({ x: -x, y: -y + 2 * y * f });
  }
  return ring.slice(0, n);
}

/** The materials, named by grade and by the standard the grade comes from. */
function materialRows(item, gradeSource) {
  const m = item.materials || {};
  const rows = [];
  const add = (part, grade, kind) => {
    if (!grade) return;
    const p = gradeSource ? gradeSource(kind, grade, item) : null;
    rows.push({ part, grade, standard: p && p.source ? p.source : null });
  };
  add('Steel tube', m.grade, 'steel');
  add('Concrete infill', m.concreteGrade, 'concrete');
  if (Number((item.geometry.rebar || {}).n) > 0) add('Reinforcement', m.rebarGrade, 'rebar');
  return rows;
}

/**
 * Build the whole set.
 *
 * @param {object} item      a calculated design item
 * @param {function} [gradeSource] (kind, grade, item) -> { source } for the
 *        material table. Passed in rather than imported so this module stays
 *        free of the UI, which is where grade presentation lives.
 */
function cfstDrawings(item, gradeSource, units = 'SI') {
  const blockers = drawingBlockers(item);
  if (blockers.length) throw new Error(blockers[0]);

  return drawingSet({
    id: `dwg-${item.id}`,
    title: 'Composite column — general arrangement and section',
    itemLabel: itemLabel(item),
    views: [elevationView(item), sectionView(item)],
    materials: materialRows(item, gradeSource),
    excluded: CFST_EXCLUSIONS,
    notes: [
      `All dimensions in ${unitWord(units).toLowerCase()}. Do not scale from this drawing; work to the figured dimensions.`,
      'Every figured dimension on this drawing is a value verified by the calculation for this item. The register on the sheet names the source of each one.',
      'The length shown is the system length used in the design checks. It is not a fabrication length and makes no allowance for embedment, connection or cutting.',
      // Only where there are bars. A note about bar positions on a drawing
      // that shows no bars describes nothing and makes a reader look for
      // something that is not there.
      ...(Number((item.geometry.rebar || {}).n) > 0
        ? ['Bar positions shown are an arrangement consistent with the cover that was checked. Bar spacing, laps and anchorage are not calculated by this platform.']
        : []),
    ],
  });
}


/* ===== src/drawings/steelbeam.js ===== */
// drawings/steelbeam.js — shop drawing for a rolled steel beam.
//
// The same restraint as the composite column, applied to a different member.
// What the platform verified is drawn and dimensioned; what it did not design
// is named and left empty rather than sketched in plausibly.
//
// A beam refuses more than a column does, and the refusals matter more, because
// a beam drawing looks incomplete without its end connections and the temptation
// to draw something reasonable there is strong. The platform designs the member:
// flexure, shear and lateral torsional buckling. It does not design the end
// connections, the web stiffeners, the camber or the holes — and every one of
// those is a thing a fabricator would otherwise read off the drawing and make.
//
// Span note: geometry.span is the design span, and Lb is the unbraced length
// the buckling check used. Where they differ the bracing is doing work, so the
// unbraced length is shown on the elevation: a beam built without the restraint
// the check assumed is not the beam that was checked, and nothing else on the
// drawing would say so.


function beamDrawingBlockers(item) {
  const out = [];
  const res = item && item.result;
  if (!res) {
    out.push('The item has not been calculated. A drawing is produced from a completed design, not from the inputs.');
    return out;
  }
  if (res.summary.overall !== OVERALL.SAFE) {
    out.push(`The design reads ${res.summary.overall}. A shop drawing is an instruction to fabricate, so it is produced only from a design that is satisfactory on every check that applies.`);
  }
  const g = item.geometry || {};
  if (!Number.isFinite(Number(g.span)) || Number(g.span) <= 0) {
    out.push('The beam has no span. It cannot be drawn in elevation.');
  }
  if (!Number.isFinite(Number(g.d)) || Number(g.d) <= 0) {
    out.push('The section has no depth. It cannot be drawn in section.');
  }
  return out;
}

function canDrawBeam(item) {
  return beamDrawingBlockers(item).length === 0;
}

const BEAM_EXCLUSIONS = [
  {
    id: 'connections',
    title: 'End connections',
    body: 'Not designed in this item. The beam is drawn as a plain member between its support centrelines, with no cleat, end plate, fin, weld or bolt shown and no hole positions implied. The connection carries the reactions this design produced and is a separate design; nothing here may be used to fabricate it.',
  },
  {
    id: 'stiffeners',
    title: 'Web stiffeners and bearing',
    body: 'No stiffener is designed or shown, at the supports or under any point load. Bearing and web resistance at load points are not calculated by this platform. Where the connection designer requires stiffeners they are additional to this drawing.',
  },
  {
    id: 'restraint',
    title: 'Lateral restraint',
    body: 'The unbraced length shown is the one the lateral torsional buckling check was carried out on. The restraint that produces it — the decking, bracing or secondary members that provide it, and their fixings — is not designed or shown here. A beam built without that restraint is not the beam that was checked.',
  },
  {
    id: 'fabrication',
    title: 'Camber, holes and finish',
    body: 'No camber, service hole, notch, fire protection or surface treatment is designed or shown. Cutting lengths carry no fabrication allowance.',
  },
];

/**
 * The elevation: a plain member between support centrelines, with the span and
 * the unbraced length dimensioned.
 */
function beamElevation(item) {
  const g = item.geometry;
  const L = Number(g.span);
  const D = Number(g.d);
  const Lb = Number(g.Lb) || L;
  const e = [];

  e.push(rect(0, 0, L, D, LAYER.OUTLINE));
  e.push(line(-L * 0.04, D / 2, L * 1.04, D / 2, LAYER.CENTRE));

  // Support centrelines, drawn as the boundary of what was designed rather
  // than as supports: what sits under them is somebody else's design.
  for (const x of [0, L]) {
    e.push(line(x, -D * 0.9, x, D * 1.5, LAYER.EXCLUDED));
  }
  e.push(text(0, D * 1.75, 'SUPPORT CL', { size: D * 0.30, anchor: 'middle' }));
  e.push(text(L, D * 1.75, 'SUPPORT CL', { size: D * 0.30, anchor: 'middle' }));

  e.push(dim({
    kind: 'horizontal', x1: 0, y1: D, x2: L, y2: D,
    offset: D * 1.1, value: L, label: 'SPAN',
    source: 'geometry.span', origin: SOURCE_KIND.VERIFIED,
  }));
  e.push(dim({
    kind: 'vertical', x1: L, y1: 0, x2: L, y2: D,
    offset: L * 0.05, value: D,
    source: 'geometry.d', origin: SOURCE_KIND.VERIFIED,
  }));

  // Only when it differs from the span. Where they are equal the beam is
  // unrestrained over its whole length and a second identical dimension would
  // say nothing; where they differ, the restraint is doing work the drawing
  // must not hide.
  if (Math.abs(Lb - L) > 1) {
    e.push(dim({
      kind: 'horizontal', x1: 0, y1: 0, x2: Lb, y2: 0,
      offset: -D * 0.8, value: Lb, label: 'UNBRACED L_b',
      source: 'geometry.Lb', origin: SOURCE_KIND.VERIFIED,
    }));
  }

  e.push(cloud({
    x: L * 0.5 - L * 0.30, y: -D * 3.4, w: L * 0.60, h: D * 1.6,
    title: 'NOT IN THIS DRAWING',
    body: 'End connections, stiffeners and restraint — separate design',
  }));

  return view({ id: 'elevation', title: 'Elevation', scale: null, entities: e });
}

/** The cut section: an I profile from the catalogue dimensions. */
function beamSectionView(item) {
  const g = item.geometry;
  const d = Number(g.d);
  const bf = Number(g.bf);
  const tf = Number(g.tf);
  const tw = Number(g.tw);
  const e = [];

  const half = d / 2;
  // Drawn as an outline rather than three rectangles, so the profile reads as
  // one shape and a DXF export produces one closed polyline.
  const pts = [
    [-bf / 2, -half], [bf / 2, -half], [bf / 2, -half + tf], [tw / 2, -half + tf],
    [tw / 2, half - tf], [bf / 2, half - tf], [bf / 2, half], [-bf / 2, half],
    [-bf / 2, half - tf], [-tw / 2, half - tf], [-tw / 2, -half + tf], [-bf / 2, -half + tf],
  ];
  for (let i = 0; i < pts.length; i += 1) {
    const a = pts[i];
    const b = pts[(i + 1) % pts.length];
    e.push(line(a[0], a[1], b[0], b[1], LAYER.OUTLINE));
  }
  e.push(line(-bf * 0.62, 0, bf * 0.62, 0, LAYER.CENTRE));
  e.push(line(0, -d * 0.60, 0, d * 0.60, LAYER.CENTRE));

  e.push(dim({
    kind: 'horizontal', x1: -bf / 2, y1: half, x2: bf / 2, y2: half,
    offset: d * 0.20, value: bf, label: 'b_f',
    source: 'geometry.bf', origin: SOURCE_KIND.CATALOGUE,
  }));
  e.push(dim({
    kind: 'vertical', x1: bf / 2, y1: -half, x2: bf / 2, y2: half,
    offset: bf * 0.42, value: d, label: 'd',
    source: 'geometry.d', origin: SOURCE_KIND.CATALOGUE,
  }));
  e.push(dim({
    kind: 'horizontal', x1: -bf / 2, y1: -half, x2: -bf / 2, y2: -half + tf,
    offset: -d * 0.22, value: tf, label: 't_f',
    source: 'geometry.tf', origin: SOURCE_KIND.CATALOGUE,
  }));
  e.push(dim({
    kind: 'horizontal', x1: -tw / 2, y1: -half, x2: tw / 2, y2: -half,
    offset: -d * 0.40, value: tw, label: 't_w',
    source: 'geometry.tw', origin: SOURCE_KIND.CATALOGUE,
  }));

  if (g.catalogue) {
    e.push(text(0, d * 0.78, String(g.catalogue), { size: d * 0.13, anchor: 'middle' }));
  }

  return view({ id: 'section', title: 'Section A–A', scale: null, entities: e });
}

function beamMaterials(item, gradeSource) {
  const m = item.materials || {};
  if (!m.grade) return [];
  const p = gradeSource ? gradeSource('steel', m.grade, item) : null;
  return [{ part: 'Steel section', grade: m.grade, standard: p && p.source ? p.source : null }];
}

function steelBeamDrawings(item, gradeSource, units = 'SI') {
  const blockers = beamDrawingBlockers(item);
  if (blockers.length) throw new Error(blockers[0]);

  const g = item.geometry;
  const braced = Math.abs((Number(g.Lb) || Number(g.span)) - Number(g.span)) > 1;

  return drawingSet({
    id: `dwg-${item.id}`,
    title: 'Rolled steel beam — general arrangement and section',
    itemLabel: itemLabel(item),
    // Stacked, not side by side: see renderSheetSvg.
    layout: 'stack',
    views: [beamElevation(item), beamSectionView(item)],
    materials: beamMaterials(item, gradeSource),
    excluded: BEAM_EXCLUSIONS,
    notes: [
      `All dimensions in ${unitWord(units).toLowerCase()}. Do not scale from this drawing; work to the figured dimensions.`,
      'Every figured dimension on this drawing is a value verified by the calculation for this item, or read from the section catalogue. The register on the sheet names the source of each one.',
      'The span shown is between support centrelines and is the span used in the design checks. It is not a cutting length and makes no allowance for connections, clearances or fit.',
      braced
        ? 'The unbraced length shown is the one used in the lateral torsional buckling check. Restraint at that spacing must be provided for this design to hold.'
        : 'The beam was checked as unrestrained over its full span. Adding restraint is safe; the design does not rely on it.',
      'Section dimensions are nominal catalogue values. Rolling tolerances are not shown and are to the relevant product standard.',
    ],
  });
}


/* ===== src/drawings/index.js ===== */
// drawings/index.js — which generator draws which element.
//
// Screens ask this, not the generators directly. An element with no generator
// is not a gap to be filled with something generic: a drawing is specific to
// the member it describes, and a plausible generic one is worse than none.


const GENERATORS = {
  cfst: { build: cfstDrawings, blockers: drawingBlockers, can: canDraw },
  steelbeam: { build: steelBeamDrawings, blockers: beamDrawingBlockers, can: canDrawBeam },
};

/** Elements that can be drawn at all, whatever the state of a given item. */
function drawingSupported(item) {
  return !!GENERATORS[(item && item.kind) || 'cfst'];
}

function drawingsFor(item, gradeSource, units) {
  const gen = GENERATORS[(item && item.kind) || 'cfst'];
  if (!gen) throw new Error('drawings: no generator for this element');
  return gen.build(item, gradeSource, units);
}

function blockersFor(item) {
  const gen = GENERATORS[(item && item.kind) || 'cfst'];
  if (!gen) {
    return ['Shop drawings are not produced for this element yet. Nothing generic is drawn in their place, because a drawing is specific to the member it describes.'];
  }
  return gen.blockers(item);
}

function canDrawItem(item) {
  const gen = GENERATORS[(item && item.kind) || 'cfst'];
  return !!gen && gen.can(item);
}


/* ===== src/modules/report/calcSheet.js ===== */
// modules/report/calcSheet.js — the printable calculation sheet.
//
// Two responsibilities, kept apart:
//   1. sheetBlocks()      turns a design result into ordered content blocks
//   2. paginateBlocks()   measures those blocks and fills A4 pages
//
// Pagination is done here rather than left to the browser because a checker's
// copy must not split a table across a page without repeating its head, and
// because "Page 3 of 7" has to be right. Browsers cannot be relied on for
// either through CSS alone.


// A4 at 96 dpi, less the printed margins reserved in the stylesheet.
const A4 = {
  widthPx: 794,
  heightPx: 1123,
  headerPx: 96,
  footerPx: 74,
  padPx: 34,
};

function contentHeightPx() {
  return A4.heightPx - A4.headerPx - A4.footerPx - A4.padPx * 2;
}

function contentWidthPx() {
  return A4.widthPx - A4.padPx * 2;
}

/* ------------------------------------------------------------------ */
/* content                                                             */
/* ------------------------------------------------------------------ */

function sectionHeading(n, text) {
  return h('h3', { class: 'cs-h' }, h('span', { class: 'cs-h__n' }, n), text);
}

function dataTable(columns, rows, opts = {}) {
  const t = h('table', { class: `cs-table${opts.class ? ` ${opts.class}` : ''}` });
  t.appendChild(h('thead', null, h('tr', null,
    columns.map((c) => h('th', { style: c.width ? { width: c.width } : null }, c.label)))));
  t.appendChild(h('tbody', null, rows.map((r) => h('tr', null,
    columns.map((c) => h('td', { class: c.align === 'right' ? 'num' : (c.ident ? 'ident' : '') },
      c.render ? c.render(r) : r[c.key]))))));
  return t;
}

/** A block is either a single node, or a splittable table. */
function block(node) { return { node }; }

function splitTable(columns, rows, opts = {}) {
  return {
    split: {
      columns, rows, opts,
      build: (subset, continued) => h('div', null,
        continued ? h('p', { class: 'cs-cont' }, `${opts.caption || 'Table'} (continued)`) : null,
        opts.caption && !continued ? h('p', { class: 'cs-cap' }, opts.caption) : null,
        dataTable(columns, subset, opts)),
    },
  };
}

function sheetBlocks(app, item) {
  const p = app.store.state.project;
  const u = p.units;
  const res = item.result;
  const blocks = [];
  const fmt = (v, d) => (v === null || v === undefined ? '—' : (d ? formatWithUnit(v, d, u) : formatNumber(v, 3)));

  /* 1 — basis of design */
  blocks.push(block(sectionHeading('1', 'Basis of design')));
  const codeRec = app.registry.get(res ? res.runCodeId : item.code);
  blocks.push(block(dataTable(
    [{ label: 'Item', width: '32%' }, { label: 'Value' }],
    [
      ['Member', `${itemLabel(item)} — ${describeSection(item.geometry)}`],
      ['Category', item.category],
      ['Code selected', item.code],
      ['Code used for the calculation', res ? res.runCodeId : '—'],
      ['Edition', codeRec ? codeRec.edition : '—'],
      ['Design basis', codeRec ? codeRec.philosophy : '—'],
      ['Units', u],
      ['Item revision', item.revision],
      ['Status', item.status],
    ].map(([k, v]) => ({ k, v })),
    { },
  )));
  // rebuild with proper renderers
  blocks.pop();
  blocks.push(block(dataTable(
    [{ label: 'Item', width: '32%', render: (r) => r.k }, { label: 'Value', render: (r) => r.v }],
    [
      ['Member', `${itemLabel(item)} — ${describeSection(item.geometry)}`],
      ['Category', item.category],
      ['Code selected', item.code],
      ['Code used for the calculation', res ? res.runCodeId : '—'],
      ['Edition', codeRec ? codeRec.edition : '—'],
      ['Design basis', codeRec ? codeRec.philosophy : '—'],
      ['Units', u],
      ['Item revision', item.revision],
      ['Status', item.status],
    ].map(([k, v]) => ({ k, v })),
  )));

  if (p.quick) {
    blocks.push(block(h('div', { class: 'cs-note cs-note--fail' },
      h('b', null, 'For review only — not for issue'),
      h('p', null, 'This sheet was produced through quick design. It carries no client, job number, checker or approver, and has not been through independent checking. It records a calculation for review and must not be issued for construction.'))));
  }

  if (item.imported) {
    const drift = driftFromModel(item);
    blocks.push(block(h('div', { class: `cs-note${drift.drifted ? ' cs-note--fail' : ''}` },
      h('b', null, drift.drifted
        ? 'The section no longer matches the analysis model'
        : `Actions imported from ${item.imported.source}`),
      h('p', null, drift.drifted
        ? describeDrift(drift)
        : `${item.imported.program}. Combinations ${item.imported.cases.join(' + ')}, load factor ${item.imported.loadFactor} applied to the imported actions. ${item.imported.memberCount} member${item.imported.memberCount === 1 ? '' : 's'} carry this section; the governing values are tabulated below.`))));
  }

  if (res && res.substitution) {
    blocks.push(block(h('div', { class: 'cs-note cs-note--code' },
      h('b', null, 'Design code substitution'),
      h('p', null, res.substitution.note))));
  }
  if (codeRec && codeRec.verifyEdition) {
    blocks.push(block(h('div', { class: 'cs-note' },
      h('b', null, 'Edition to be confirmed'),
      h('p', null, `The edition string printed above is carried by the software for reference. Confirm ${codeRec.id} and any National Annex against the office controlled copy before this sheet is issued.`))));
  }

  /* 2 — geometry and materials */
  blocks.push(block(sectionHeading('2', 'Section, materials and actions')));
  const sec = res ? res.ctx.sec : null;
  const g = item.geometry;
  const m = item.materials;
  const a = item.actions;

  blocks.push(block(dataTable(
    [
      { label: 'Property', width: '40%', render: (r) => r.k },
      { label: 'Symbol', width: '16%', ident: true, render: (r) => r.s },
      { label: 'Value', align: 'right', render: (r) => r.v },
    ],
    [
      { k: 'Section', s: '—', v: describeSection(g) },
      { k: 'Column length', s: 'L', v: fmt(g.length, 'length') },
      { k: 'Buckling length', s: 'L_cr', v: res ? fmt(res.ctx.geometry.bucklingLength, 'length') : '—' },
      { k: 'Steel area', s: 'A_a', v: sec ? fmt(sec.Aa, 'area') : '—' },
      { k: 'Concrete area', s: 'A_c', v: sec ? fmt(sec.Ac, 'area') : '—' },
      { k: 'Reinforcement area', s: 'A_s', v: sec ? fmt(sec.As, 'area') : '—' },
      { k: 'Steel yield strength', s: 'f_y', v: fmt(m.fy, 'stress') },
      { k: 'Concrete cylinder strength', s: 'f_ck', v: fmt(m.fck, 'stress') },
      { k: 'Reinforcement yield strength', s: 'f_sk', v: fmt(m.fsk, 'stress') },
      { k: 'Design axial force', s: 'N_Ed', v: fmt(a.NEd, 'force') },
      { k: 'Permanent part of the axial force', s: 'N_G,Ed', v: fmt(a.NGEd, 'force') },
      { k: 'First-order moment about y', s: 'M_y,Ed,0', v: fmt(a.MyEd, 'moment') },
      { k: 'First-order moment about z', s: 'M_z,Ed,0', v: fmt(a.MzEd, 'moment') },
    ],
  )));

  /* 3 — assumptions */
  blocks.push(block(sectionHeading('3', 'Assumptions')));
  blocks.push(splitTable(
    [
      { label: 'Assumption', width: '34%', render: (r) => r.label },
      { label: 'Value', width: '14%', align: 'right', render: (r) => (r.dimension ? formatWithUnit(r.value, r.dimension, u) : String(r.value)) },
      { label: 'Source', width: '12%', render: (r) => (r.source === SOURCE.USER ? 'Engineer' : 'Generated') },
      { label: 'Basis and reason', render: (r) => (r.source === SOURCE.USER && r.reason ? `Changed: ${r.reason}` : r.basis) },
    ],
    item.assumptions || [],
    { caption: 'Every assumption below is an input to the result. Values marked "Engineer" were changed from the generated default and carry the reason given.' },
  ));

  /* 4 — working */
  blocks.push(block(sectionHeading('4', 'Calculations')));
  blocks.push(block(h('p', { class: 'cs-cap' },
    'Every line names the code and clause it comes from. Lines marked "derived" are arithmetic on the values above them and introduce no new code provision.')));
  blocks.push(splitTable(
    [
      { label: 'Symbol', width: '13%', ident: true, render: (s) => s.symbol },
      { label: 'Description and expression', render: (s) => h('div', null,
        h('div', null, s.description),
        s.expression ? h('div', { class: 'cs-expr' }, s.expression) : null,
        s.substitution ? h('div', { class: 'cs-sub' }, s.substitution) : null,
        s.note ? h('div', { class: 'cs-flag' }, s.note) : null) },
      { label: 'Value', width: '17%', align: 'right', render: (s) => (s.value === null ? '—' : fmt(s.value, s.dimension)) },
      { label: 'Reference', width: '22%', ident: true, render: (s) => (s.kind === STEP_KIND.DERIVED
        ? 'derived' : `${s.code} §${s.clause}`) },
    ],
    res ? res.steps : [],
    { caption: null },
  ));

  /* 5 — verification */
  blocks.push(block(sectionHeading('5', 'Verification summary')));
  blocks.push(splitTable(
    [
      { label: 'Check', render: (c) => c.title },
      { label: 'Clause', width: '19%', ident: true, render: (c) => (c.clause ? `${c.code} §${c.clause}` : (c.code || '—')) },
      { label: 'Required', width: '14%', align: 'right', render: (c) => (c.demand === null ? '—' : fmt(c.demand, c.dimension)) },
      { label: 'Available', width: '14%', align: 'right', render: (c) => (c.capacity === null ? '—' : fmt(c.capacity, c.dimension)) },
      { label: 'U', width: '9%', align: 'right', render: (c) => (Number.isFinite(c.utilisation) ? formatNumber(c.utilisation, 3) : '—') },
      { label: 'Result', width: '13%', render: (c) => c.status },
    ],
    res ? res.checks : [],
  ));

  const blocked = res ? res.checks.filter((c) => c.note && c.status !== CHECK_STATUS.PASS) : [];
  for (const c of blocked) {
    // A scope statement names no code and no clause — there is no provision to
    // cite for work that was not attempted. Build the heading from what the
    // record actually holds rather than printing "null" where a code belongs.
    const source = c.clause ? `${c.code} §${c.clause}` : (c.code || null);
    blocks.push(block(h('div', { class: `cs-note${c.status === CHECK_STATUS.FAIL ? ' cs-note--fail' : ' cs-note--code'}` },
      h('b', null, [c.title, source, c.status].filter(Boolean).join(' — ')),
      h('p', null, c.note))));
  }

  /* 6 — conclusion */
  blocks.push(block(sectionHeading('6', 'Conclusion')));
  const s = res ? res.summary : null;
  blocks.push(block(h('div', { class: 'cs-verdict' },
    h('div', { class: `cs-stamp cs-stamp--${verdictClass(s)}` }, s ? s.overall : 'NOT RUN'),
    h('div', { class: 'cs-verdict__body' },
      s && s.governing
        ? h('div', null,
          h('p', null, h('b', null, 'Governing check: '), s.governing.title,
            s.governing.clause ? ` (${s.governing.code} §${s.governing.clause})` : ''),
          s.governing.failureMode ? h('p', null, h('b', null, 'Failure mode: '), s.governing.failureMode) : null,
          h('p', null, h('b', null, 'Maximum utilisation: '),
            Number.isFinite(s.maxUtilisation) ? formatNumber(s.maxUtilisation, 3) : '—'),
          h('p', null, h('b', null, 'Required against available: '),
            s.governing.demand !== null ? `${fmt(s.governing.demand, s.governing.dimension)} against ${fmt(s.governing.capacity, s.governing.dimension)}` : '—'))
        : h('p', null, 'No governing check could be established.'),
      s && s.counts.blocked
        ? h('p', { class: 'cs-flag' }, `${s.counts.blocked} check${s.counts.blocked > 1 ? 's are' : ' is'} not covered or not calculated. The design cannot be read as satisfactory until they are resolved by other means.`)
        : null,
    ))));

  const review = sheetReviewBlock(p, item);
  if (review.printCommentList) {
    blocks.push(block(sectionHeading('7', 'Review comments')));
    blocks.push(block(dataTable(
      [
        { label: 'Raised by', width: '18%', render: (c) => `${c.by}${c.role ? ` (${c.role})` : ''}` },
        { label: 'Comment', render: (c) => c.text },
        { label: 'Answer', render: (c) => c.reply || '—' },
        { label: 'Status', width: '12%', render: (c) => c.status },
      ],
      review.comments,
    )));
    if (review.openCount) {
      blocks.push(block(h('div', { class: 'cs-note cs-note--fail' },
        h('b', null, `${review.openCount} comment${review.openCount === 1 ? ' is' : 's are'} still open`),
        h('p', null, 'This sheet is printed with review comments outstanding. It is not a checked design.'))));
    }
  }
  if (review.printCommentBox) {
    blocks.push(block(h('div', { class: 'cs-commentbox' },
      h('b', null, 'Reviewer comments'),
      h('div', { class: 'cs-commentbox__lines' },
        Array.from({ length: 6 }, () => h('div', { class: 'cs-commentbox__line' }))))));
  }
  blocks.push(block(h('p', { class: 'cs-cap' }, review.statement)));

  blocks.push(block(h('div', { class: 'cs-sign' },
    signBox('Designed', item.designer, item.revision),
    signBox('Checked', item.checker, item.revision),
    signBox('Approved', titleBlockAttribution(p).approved, item.revision),
  )));

  return blocks;
}

function signBox(role, name, rev) {
  return h('div', { class: 'cs-sign__box' },
    h('div', { class: 'cs-sign__role' }, role),
    h('div', { class: 'cs-sign__name' }, name || '—'),
    h('div', { class: 'cs-sign__rule' }),
    h('div', { class: 'cs-sign__meta' }, `Signature and date · Rev ${rev}`));
}

function verdictClass(s) {
  if (!s) return 'none';
  if (s.overall === OVERALL.SAFE) return 'safe';
  if (s.overall === OVERALL.UNSAFE) return 'unsafe';
  return 'incomplete';
}

/* ------------------------------------------------------------------ */
/* pagination                                                          */
/* ------------------------------------------------------------------ */

/**
 * Fill pages by measuring real rendered heights. Splittable tables are cut
 * between rows and their head is repeated with a "continued" caption.
 */
function paginateBlocks(blocks, maxHeight, width) {
  const probe = h('div', {
    class: 'cs-probe',
    style: { position: 'absolute', left: '-10000px', top: '0', width: `${width}px`, visibility: 'hidden' },
  });
  document.body.appendChild(probe);

  // Layout may be unavailable (headless rendering, print pre-pass). If the
  // browser reports no height for a known-sized element, fall back to an
  // estimator so the sheet still paginates instead of silently producing one
  // enormous page.
  const gauge = h('div', { style: { height: '100px' } });
  probe.appendChild(gauge);
  const canMeasure = (gauge.offsetHeight || gauge.getBoundingClientRect().height) >= 50;
  probe.replaceChildren();

  const measure = (node) => {
    if (!canMeasure) return estimateHeight(node);
    probe.replaceChildren(node);
    const hgt = node.offsetHeight || node.getBoundingClientRect().height || 0;
    probe.replaceChildren();
    return hgt || estimateHeight(node);
  };

  const pages = [];
  let current = [];
  let used = 0;

  const pushPage = () => { if (current.length) { pages.push(current); current = []; used = 0; } };

  for (const b of blocks) {
    if (b.node) {
      const hgt = measure(b.node) || 28;
      if (used + hgt > maxHeight && current.length) pushPage();
      current.push(b.node);
      used += hgt;
      continue;
    }

    // splittable table
    const { columns, rows, opts, build } = b.split;
    if (!rows.length) {
      const node = build([], false);
      const hgt = measure(node) || 28;
      if (used + hgt > maxHeight && current.length) pushPage();
      current.push(node);
      used += hgt;
      continue;
    }

    let index = 0;
    let continued = false;
    while (index < rows.length) {
      const available = maxHeight - used;
      // Binary-free greedy fit: grow the chunk until it no longer fits.
      let lo = 1;
      let best = 0;
      let bestNode = null;
      while (index + lo <= rows.length) {
        const node = build(rows.slice(index, index + lo), continued);
        const hgt = measure(node);
        if (hgt <= available) { best = lo; bestNode = node; lo += 1; } else break;
        if (lo > rows.length - index) break;
      }
      if (!best) {
        if (current.length) { pushPage(); continued = continued || false; continue; }
        // A single row taller than a whole page: place it anyway rather than loop.
        bestNode = build(rows.slice(index, index + 1), continued);
        best = 1;
      }
      current.push(bestNode);
      used += measure(bestNode);
      index += best;
      continued = true;
      if (index < rows.length) pushPage();
    }
  }

  pushPage();
  probe.remove();
  return pages.length ? pages : [[]];
}

/* ------------------------------------------------------------------ */
/* page furniture                                                      */
/* ------------------------------------------------------------------ */

/**
 * Rough height in pixels, used only when the environment cannot lay out.
 * Deliberately conservative: over-estimating costs a little white space,
 * under-estimating overflows the page and loses content.
 */
function estimateHeight(node) {
  if (!node || node.nodeType !== 1) return 16;
  const tag = node.tagName;
  if (tag === 'TABLE') {
    const head = node.querySelectorAll('thead tr').length * 20;
    let body = 0;
    for (const tr of node.querySelectorAll('tbody tr')) {
      const chars = (tr.textContent || '').length;
      body += Math.max(20, Math.ceil(chars / 95) * 15 + 8);
    }
    return head + body + 10;
  }
  if (tag === 'H3') return 34;
  if (tag === 'P') return Math.max(16, Math.ceil((node.textContent || '').length / 110) * 14 + 6);
  if (node.classList && node.classList.contains('cs-note')) {
    return 26 + Math.ceil((node.textContent || '').length / 110) * 14;
  }
  if (node.classList && node.classList.contains('cs-verdict')) return 120;
  if (node.classList && node.classList.contains('cs-sign')) return 96;
  let total = 0;
  for (const child of node.children) total += estimateHeight(child);
  return total || Math.max(18, Math.ceil((node.textContent || '').length / 110) * 15);
}

function buildPage(app, item, content, pageNo, pageCount) {
  const p = app.store.state.project;
  const res = item.result;
  const att = titleBlockAttribution(p);

  const header = h('header', { class: 'cs-header' },
    h('div', { class: 'cs-header__brand' }, logoImg('cs-logo')),
    h('div', { class: 'cs-header__mid' },
      h('div', { class: 'cs-header__proj' }, p.name || 'Untitled project'),
      h('div', { class: 'cs-header__sub' }, [p.client, p.location].filter(Boolean).join(' · ')),
      h('div', { class: 'cs-header__title' }, `Calculation sheet — ${itemLabel(item)}`),
      p.quick ? h('div', { class: 'cs-header__review' }, 'FOR REVIEW ONLY — NOT FOR ISSUE') : null),
    h('dl', { class: 'cs-header__meta' },
      metaCell('JOB No.', p.number || '—'),
      metaCell('ITEM', item.number || '—'),
      metaCell('REV', item.revision),
      metaCell('DATE', p.revisionDate || '—')),
  );

  const footer = h('footer', { class: 'cs-footer' },
    h('div', null,
      h('span', null, `Designed ${item.designer || '—'}`),
      h('span', null, `Checked ${item.checker || '—'}`),
      h('span', null, `Approved ${att.approved}`)),
    h('div', null,
      h('span', null, res ? res.runCodeId : item.code),
      h('span', null, `Project rev ${p.revision}`),
      h('span', null, `Platform v${(res && res.platformVersion) || PLATFORM_VERSION}`),
      h('span', { class: 'cs-footer__page' }, `Page ${pageNo} of ${pageCount}`)),
  );

  return h('article', { class: 'cs-page' }, header, h('div', { class: 'cs-body' }, content), footer);
}

function metaCell(label, value) {
  return h('div', { class: 'cs-meta' }, h('dt', null, label), h('dd', null, value));
}

function renderCalcSheet(app, item) {
  const blocks = sheetBlocks(app, item);
  const pagesContent = paginateBlocks(blocks, contentHeightPx(), contentWidthPx());
  const wrap = h('div', { class: 'cs-doc' });
  pagesContent.forEach((content, i) => {
    wrap.appendChild(buildPage(app, item, content, i + 1, pagesContent.length));
  });
  return wrap;
}
