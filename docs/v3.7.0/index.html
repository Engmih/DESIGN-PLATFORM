// modules/report/exports.js — spreadsheet and result exports.
//
// CSV is written with a UTF-8 byte order mark so Excel opens Arabic notes and
// the °, § and superscript characters correctly instead of mojibake. A sep=
// hint is included for the same reason.


const BOM = '\uFEFF';

function esc(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function row(...cells) { return cells.map(esc).join(','); }

function itemCsv(app, item) {
  const p = app.store.state.project;
  const u = p.units;
  const res = item.result;
  const fmt = (v, d) => (v === null || v === undefined ? '' : (d ? formatWithUnit(v, d, u) : formatNumber(v, 4)));
  const L = [];

  L.push('sep=,');
  L.push(row('TRUST GROUP DESIGN PLATFORM — CALCULATION EXPORT'));
  L.push('');
  L.push(row('Project', p.name), row('Job number', p.number), row('Client', p.client));
  L.push(row('Consultant', p.consultant), row('Project revision', p.revision), row('Issue date', p.revisionDate));
  L.push(row('Item', itemLabel(item)), row('Section', describeSection(item.geometry)));
  L.push(row('Item revision', item.revision), row('Status', item.status));
  L.push(row('Designer', item.designer), row('Checker', item.checker));
  L.push(row('Code selected', item.code));
  L.push(row('Code used', res ? res.runCodeId : ''));
  L.push(row('Units', u));
  if (res && res.substitution) L.push(row('Substitution', res.substitution.note));
  L.push('');

  L.push(row('ASSUMPTIONS'));
  L.push(row('Assumption', 'Value', 'Source', 'Basis or reason for change'));
  for (const a of item.assumptions || []) {
    L.push(row(a.label, a.dimension ? fmt(a.value, a.dimension) : a.value,
      a.source === SOURCE.USER ? 'Engineer' : 'Generated',
      a.source === SOURCE.USER && a.reason ? a.reason : a.basis));
  }
  L.push('');

  L.push(row('CALCULATIONS'));
  L.push(row('Symbol', 'Description', 'Expression', 'Substitution', 'Value', 'Code', 'Clause', 'Note'));
  for (const s of (res ? res.steps : [])) {
    L.push(row(s.symbol, s.description, s.expression, s.substitution,
      s.value === null ? '' : fmt(s.value, s.dimension),
      s.kind === STEP_KIND.DERIVED ? 'derived' : s.code,
      s.kind === STEP_KIND.DERIVED ? '' : s.clause,
      s.note));
  }
  L.push('');

  L.push(row('VERIFICATION'));
  L.push(row('Check', 'Code', 'Clause', 'Required', 'Available', 'Utilisation', 'Result', 'Failure mode', 'Note'));
  for (const c of (res ? res.checks : [])) {
    L.push(row(c.title, c.code, c.clause,
      c.demand === null ? '' : fmt(c.demand, c.dimension),
      c.capacity === null ? '' : fmt(c.capacity, c.dimension),
      Number.isFinite(c.utilisation) ? formatNumber(c.utilisation, 4) : '',
      c.status, c.failureMode, c.note));
  }
  L.push('');

  if (res) {
    L.push(row('CONCLUSION'));
    L.push(row('Verdict', res.summary.overall));
    L.push(row('Governing check', res.summary.governing ? res.summary.governing.title : ''));
    L.push(row('Governing clause', res.summary.governing
      ? `${res.summary.governing.code} ${res.summary.governing.clause || ''}`.trim() : ''));
    L.push(row('Maximum utilisation', Number.isFinite(res.summary.maxUtilisation)
      ? formatNumber(res.summary.maxUtilisation, 4) : ''));
    L.push(row('Checks passed', res.summary.counts.passed));
    L.push(row('Checks failed', res.summary.counts.failed));
    L.push(row('Checks not covered or not calculated', res.summary.counts.blocked));
  }

  return BOM + L.join('\r\n');
}

function exportItemCsv(app, item) {
  const p = app.store.state.project;
  const base = [p.number, item.number, item.name].filter(Boolean).join(' ') || 'calculation';
  downloadText(`${safe(base)}_${item.revision}.csv`, itemCsv(app, item), 'text/csv');
}

function exportItemJson(app, item) {
  const p = app.store.state.project;
  const payload = {
    application: 'Trust Group Design Platform',
    exportedAt: new Date().toISOString(),
    project: { name: p.name, number: p.number, client: p.client, revision: p.revision, units: p.units },
    item: {
      number: item.number, name: item.name, category: item.category, revision: item.revision,
      status: item.status, designer: item.designer, checker: item.checker,
      code: item.code, geometry: item.geometry, materials: item.materials, actions: item.actions,
      assumptions: item.assumptions,
    },
    result: item.result ? {
      runCodeId: item.result.runCodeId,
      substitution: item.result.substitution,
      summary: item.result.summary,
      checks: item.result.checks.map(stripSteps),
      steps: item.result.steps,
    } : null,
    note: 'All values are in base units: N, mm, MPa, N*mm.',
  };
  const base = [p.number, item.number].filter(Boolean).join(' ') || 'result';
  downloadText(`${safe(base)}_${item.revision}.result.json`, JSON.stringify(payload, null, 2));
}

function stripSteps(c) {
  const { steps, ...rest } = c;
  return rest;
}

function safe(s) {
  return String(s).replace(/[\\/:*?"<>|]+/g, '-').trim();
}


/* ===== src/ui/screens/projectForm.js ===== */
// ui/screens/projectForm.js — create a project, and edit it afterwards.
//
// The same screen serves both cases. A project is never "half created": the
// draft is a real project record from the first keystroke, validated live, and
// committed when it passes. Every committed field change is written to the
// audit log with its previous value.


function projectFormScreen(app, { mode = 'create' } = {}) {
  const editing = mode === 'edit';

  // Draft lives in the screen, not the store, so an abandoned form leaves no
  // trace. On commit the draft is diffed against the live project.
  const draft = editing ? clone(app.store.state.project) : createProject({ units: app.units });
  let errors = {};
  let touched = editing;

  const host = h('div');

  function set(pathKey, value) {
    draft[pathKey] = value;
    if (touched) errors = validateProject(draft);
    render();
  }

  /**
   * Changing the country refills the code set. Any field the engineer has
   * already changed by hand is left alone — the country is a starting point,
   * not an override.
   */
  function applyJurisdiction(id) {
    const j = jurisdiction(id);
    const previous = jurisdiction(draft.country || DEFAULT_JURISDICTION);
    const next = { ...draft.codes };
    for (const slot of CODE_SLOTS) {
      const current = next[slot.key] || '';
      const wasDefault = !current || current === (previous.codes[slot.key] || '');
      if (wasDefault) next[slot.key] = j.codes[slot.key] || '';
    }
    draft.country = id;
    draft.codes = next;
    if (touched) errors = validateProject(draft);
    render();
  }

  function codeOptionsFor(slot) {
    const groups = app.registry.options({ slot });
    return groups.map((g) => ({
      group: g.family,
      options: g.codes.map((c) => ({ value: c.id, label: `${c.id} — ${c.title}` })),
    }));
  }

  function addMember() {
    draft.team = [...draft.team, newTeamMember({ name: '', role: 'Designer' })];
    render();
  }

  function updateMember(id, key, value) {
    draft.team = draft.team.map((m) => {
      if (m.id !== id) return m;
      const next = { ...m, [key]: value };
      if (key === 'name') next.initials = initials(value);
      return next;
    });
    if (touched) errors = validateProject(draft);
    render();
  }

  function removeMember(id) {
    draft.team = draft.team.filter((m) => m.id !== id);
    if (touched) errors = validateProject(draft);
    render();
  }

  function commit() {
    touched = true;
    errors = validateProject(draft);
    if (Object.keys(errors).length) {
      render();
      const bad = host.querySelector('[data-invalid="true"] input, [data-invalid="true"] select');
      if (bad) bad.focus();
      toast('Some entries still need attention.', 'err');
      return;
    }

    if (!editing) {
      draft.platformVersion = PLATFORM_VERSION;
      app.store.update((s) => { s.project = draft; });
      app.audit.append({
        kind: AUDIT_KINDS.PROJECT_CREATED,
        entity: 'Project',
        entityId: draft.id,
        to: `${draft.number ? draft.number + ' ' : ''}${draft.name}`,
        actor: app.actorName(),
      });
      toast('Project created.', 'ok');
      app.navigate('overview');
      return;
    }

    const before = app.store.state.project;
    const changes = diffProject(before, draft);
    app.store.update((s) => { s.project = draft; });
    for (const c of changes) {
      app.audit.append({
        kind: c.field === 'team' ? AUDIT_KINDS.TEAM_CHANGED
          : c.field.startsWith('codes.') ? AUDIT_KINDS.CODE_CHANGED
            : AUDIT_KINDS.PROJECT_FIELD,
        entity: 'Project',
        entityId: draft.id,
        field: c.field,
        from: c.from,
        to: c.to,
        actor: app.actorName(),
      });
    }
    toast(changes.length ? `${changes.length} change${changes.length > 1 ? 's' : ''} recorded.` : 'No changes to record.', 'ok');
    app.navigate('overview');
  }

  function render() { preserveFocus(paint); }

  function paint() {
    const err = (k) => (touched ? errors[k] : undefined);
    const unitNote = UNIT_SYSTEMS[draft.units]?.note;

    const identity = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Identification'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Project name', id: 'f-name', required: true, error: err('name'), span: true,
          control: textInput({ id: 'f-name', value: draft.name, placeholder: 'Marina Tower — commercial podium', onInput: (v) => set('name', v) }),
        }),
        field({
          label: 'Project number', id: 'f-number', ident: true,
          hint: 'Prints in the title block of every calculation sheet.',
          control: textInput({ id: 'f-number', value: draft.number, placeholder: 'TG-2601', onInput: (v) => set('number', v) }),
        }),
        field({
          label: 'Stage', id: 'f-stage',
          control: select({ id: 'f-stage', value: draft.stage, options: PROJECT_STAGES.map((s) => ({ value: s, label: s })), onChange: (v) => set('stage', v) }),
        }),
        field({
          label: 'Country', id: 'f-country', required: true,
          hint: 'Sets the default design codes below. Every one of them can be changed afterwards.',
          control: select({
            id: 'f-country', value: draft.country || DEFAULT_JURISDICTION,
            options: jurisdictionOptions(),
            onChange: (v) => applyJurisdiction(v),
          }),
        }),
        field({
          label: 'Location', id: 'f-loc',
          control: textInput({ id: 'f-loc', value: draft.location, placeholder: 'New Cairo', onInput: (v) => set('location', v) }),
        }),
      ),
    );

    const parties = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Parties'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Client', id: 'f-client', required: true, error: err('client'),
          control: textInput({ id: 'f-client', value: draft.client, onInput: (v) => set('client', v) }),
        }),
        field({
          label: 'Consultant', id: 'f-consultant',
          control: textInput({ id: 'f-consultant', value: draft.consultant, onInput: (v) => set('consultant', v) }),
        }),
        field({
          label: 'Contractor', id: 'f-contractor',
          control: textInput({ id: 'f-contractor', value: draft.contractor, onInput: (v) => set('contractor', v) }),
        }),
      ),
    );

    const revision = h('fieldset', { class: 'tg-fieldset' },
      h('legend', { class: 'tg-fieldset__legend' }, 'Revision'),
      h('div', { class: 'tg-grid' },
        field({
          label: 'Revision', id: 'f-rev', required: true, ident: true, error: err('revision'),
          hint: 'P-series while preliminary, C-series for construction.',
          control: textInput({ id: 'f-rev', value: draft.revision, onInput: (v) => set('revision', v.toUpperCase()) }),
        }),
        field({
          label: 'Issue date', id: 'f-revdate', required: true, error: err('revisionDate'),
          control: textInput({ id: 'f-revdate', type: 'date', value: draft.revisionDate, onInput: (v) => set('revisionDate', v) }),
        }),
        field({
          label: 'Reason for this revision', id: 'f-revnote', span: true,

    host.replaceChildren(sheet({

        ? 'Changes are recorded in the change log with their previous value.'
        : 'Set up the record that every calculation sheet, drawing and export will carry.',

            : 'Required entries are marked with a red asterisk.'),

      ],

  }

  render();
  return host;
}

function primaryActor(p) {
  const lead = (p.team || []).find((m) => m.role === 'Project lead');
  const designer = (p.team || []).find((m) => m.role === 'Designer');
  return (lead || designer || {}).name || 'unattributed';
}

/** Field-level diff, flattened for the audit log. */
function diffProject(a, b) {
  const out = [];
  const scalarKeys = [
    'name', 'number', 'stage', 'location', 'client', 'consultant', 'contractor',
    'revision', 'revisionDate', 'revisionNote', 'units', 'startDate', 'dueDate', 'notes',
  ];
  for (const k of scalarKeys) {
    if ((a[k] ?? '') !== (b[k] ?? '')) out.push({ field: k, from: a[k], to: b[k] });
  }
  for (const slot of CODE_SLOTS) {
    const from = (a.codes || {})[slot.key] || '';
    const to = (b.codes || {})[slot.key] || '';
    if (from !== to) out.push({ field: `codes.${slot.key}`, from, to });
  }
  const teamA = JSON.stringify((a.team || []).map(({ name, role, initials, email }) => ({ name, role, initials, email })));
  const teamB = JSON.stringify((b.team || []).map(({ name, role, initials, email }) => ({ name, role, initials, email })));
  if (teamA !== teamB) {
    out.push({
      field: 'team',
      from: `${(a.team || []).length} member(s)`,
      to: `${(b.team || []).length} member(s)`,
    });
  }
  return out;
}

function jurisdictionNotice(draft) {
  const j = jurisdiction(draft.country || DEFAULT_JURISDICTION);
  if (!j.nationalCodeMissing) return null;
  return note({
    variant: 'code',
    title: `${j.nationalCodeMissing} is not installed in this build`,
    body: `The codes below are the documents the national code is derived from, not the national code itself. Confirm each one against ${j.nationalCodeMissing} before this project is issued.`,
  });
}

// ui/screens/items.js — the design items register.


const STATUS_KIND = {
  [ITEM_STATUS.DRAFT]: 'neutral',
  [ITEM_STATUS.FOR_CHECK]: 'caution',
  [ITEM_STATUS.CHECKED]: 'safe',
  [ITEM_STATUS.APPROVED]: 'safe',
  [ITEM_STATUS.SUPERSEDED]: 'notcov',
};

function itemsScreen(app) {
  const host = h('div');
  let selected = new Set();

  /**
   * Deleting is irreversible for the item itself, so it asks first and always
   * records what went and who removed it. The item is gone; the fact that it
   * existed is not.
   */
  function removeItems(ids) {
    const p = app.store.state.project;
    const going = p.items.filter((x) => ids.includes(x.id));
    if (!going.length) return;
    const names = going.map((x) => `${x.number} ${x.name}`).join(', ');
    const issued = going.filter((x) => x.status === 'Checked' || x.status === 'Approved');
    const warning = issued.length
      ? `\n\n${issued.length} of these has been checked or approved. Its calculation sheet may already have been issued.`
      : '';
    if (!window.confirm(`Delete ${going.length} design item${going.length === 1 ? '' : 's'}?\n\n${names}${warning}\n\nThis cannot be undone. The deletion is recorded in the change log.`)) return;

    app.store.update((s) => {
      s.project.items = s.project.items.filter((x) => !ids.includes(x.id));
    });
    for (const it of going) {
      app.audit.append({
        kind: AUDIT_KINDS.ITEM_FIELD,
        entity: `${it.number} ${it.name}`, entityId: it.id, field: 'deleted',
        from: `${it.category}, ${it.status}, ${it.code}`, to: null,
        reason: it.imported ? `Deleted. Had been imported from ${it.imported.source}.` : 'Deleted.',
        actor: app.actorName(),
      });
    }
    selected = new Set();
    toast(`${going.length} item${going.length === 1 ? '' : 's'} deleted and logged.`, 'ok');
    render();
  }

  function addItem() {
    const p = app.store.state.project;
    const fromRegister = (role) => (app.people.find((x) => x.active && x.role === role) || {}).name || '';
    const designer = (app.currentUser && app.currentUser.role === 'Designer' ? app.currentUser.name : '')
      || fromRegister('Designer')
      || (p.team.find((m) => m.role === 'Designer') || {}).name || '';
    const checker = fromRegister('Checker')
      || (p.team.find((m) => m.role === 'Checker') || {}).name || '';
    const item = createItem({
      number: nextItemNumber(p.items),
      name: 'Composite column',
      designer, checker,
      code: p.codes.composite || 'EN 1994-1-1',
    });
    item.assumptions = generateAssumptions(item, item.code);
    app.store.update((s) => { s.project.items = [...s.project.items, item]; });
    app.audit.append({
      kind: AUDIT_KINDS.ITEM_CREATED, entity: itemLabel(item), entityId: item.id,
      to: `${item.category} to ${item.code}`, actor: app.actorName(),
    });
    app.openItem(item.id);
  }

  function render() { preserveFocus(paint); }

  function paint() {
    const p = app.store.state.project;
    const items = p.items || [];

    const rows = items.map((it) => {
      let res = it.result;
      if (!res) {
        try { res = runDesign(app.registry, it); } catch { res = null; }
      }
      // An item that stands for a group is judged on its members, not on the
      // envelope its actions were seeded from.
      let group = null;
      try { group = groupVerdict(app.registry, it); } catch { group = null; }
      return { it, res, group };
    });

    host.replaceChildren(sheet({
      title: 'Design items',
      lede: 'Each item carries its own code, revision, designer and checker. Status falls back to draft whenever an input changes.',
      actions: [
        selected.size
          ? button(`Delete ${selected.size} selected`, { variant: 'danger', onClick: () => removeItems([...selected]) })
          : null,
        h('div', { class: 'tg-importbtn' },
          button('Import from SAP2000', { variant: 'ghost', onClick: () => app.navigate('import') }),
          h('span', null, 'model .s2k + results .csv')),
        button('Add design item', { onClick: addItem }),
      ],
      body: items.length
        ? h('div', null,
          table({
            caption: `${items.length} item${items.length === 1 ? '' : 's'}`,
            columns: [
              { label: '', width: '38px', render: ({ it }) => {
                const box = h('input', { type: 'checkbox', checked: selected.has(it.id) });
                box.addEventListener('change', () => {
                  if (box.checked) selected.add(it.id); else selected.delete(it.id);
                  render();
                });
                return box;
              } },
              { label: 'No.', ident: true, width: '80px', render: ({ it }) => it.number },
              { label: 'Name', render: ({ it }) => h('button', { class: 'tg-btn tg-btn--quiet tg-btn--sm', onClick: () => app.openItem(it.id) }, it.name || 'Untitled') },
              { label: 'Category', render: ({ it }) => it.category },
              { label: 'Code', ident: true, render: ({ it }) => it.code },
              { label: 'Rev', ident: true, width: '60px', render: ({ it }) => it.revision },
              { label: 'Status', width: '110px', render: ({ it }) => chip(it.status, STATUS_KIND[it.status] || 'neutral') },
              { label: 'Verdict', width: '130px', render: ({ res, group }) => (group ? groupChip(group) : verdictChip(res)) },
              { label: 'U max', align: 'right', width: '110px', render: ({ res, group }) => {
                if (group) {
                  if (!group.worst) return '—';
                  return h('div', null,
                    formatNumber(group.worst.u, 3),
                    h('div', { style: { fontSize: '10px', color: 'var(--tg-ink-40)' } }, `member ${group.worst.frame}`));
                }
                return res && Number.isFinite(res.summary.maxUtilisation) ? formatNumber(res.summary.maxUtilisation, 3) : '—';
              } },
              { label: 'Designer', render: ({ it }) => it.designer || '—' },
              { label: 'Checker', render: ({ it }) => it.checker || '—' },
              { label: '', width: '90px', render: ({ it }) => button('Sheet', { small: true, variant: 'quiet', onClick: () => app.openSheet(it.id) }) },
              { label: '', width: '80px', render: ({ it }) => button('Delete', { small: true, variant: 'quiet', onClick: () => removeItems([it.id]) }) },
            ],
            rows,
          }),
          note({
            title: 'How the verdict is reached',
            body: 'SAFE requires every applicable check to pass. If any check is not covered by the selected code, the item reads INCOMPLETE, never SAFE — a missing check is not a passed check.',
          }),
        )
        : emptyState({
          title: 'No design items yet',
          body: 'Add the first item to start a calculation. Only concrete-filled tubular columns are engineered in this build; other categories can be recorded but not calculated.',
          actions: [
        selected.size
          ? button(`Delete ${selected.size} selected`, { variant: 'danger', onClick: () => removeItems([...selected]) })
          : null,
        h('div', { class: 'tg-importbtn' },
          button('Import from SAP2000', { variant: 'ghost', onClick: () => app.navigate('import') }),
          h('span', null, 'model .s2k + results .csv')),
        button('Add design item', { onClick: addItem }),
      ],
        }),
    }));
  }

  render();
  return host;
}

function verdictChip(res) {
  if (!res) return chip('Not run', 'neutral');
  if (res.summary.overall === OVERALL.SAFE) return chip('SAFE', 'safe');
  if (res.summary.overall === OVERALL.UNSAFE) return chip('UNSAFE', 'unsafe');
  return chip('INCOMPLETE', 'caution');
}

function groupChip(v) {
  if (v.overall === 'UNASSIGNED') return chip('NOT ASSIGNED', 'caution');
  if (v.overall === OVERALL.UNSAFE) return chip('UNSAFE', 'unsafe');
  return chip('SAFE', 'safe');
}

// ui/screens/designer.js — the CFST design workspace.
//
// Every edit recalculates immediately. Assumption edits require a reason before
// they are accepted, and the reason is written to the audit log with the old and
// new values.


const CHECK_KIND = {
  [CHECK_STATUS.PASS]: 'safe',
  [CHECK_STATUS.FAIL]: 'unsafe',
  [CHECK_STATUS.NOT_COVERED]: 'notcov',
  [CHECK_STATUS.NOT_IMPLEMENTED]: 'caution',
  [CHECK_STATUS.NOT_APPLICABLE]: 'neutral',
};

function designerScreen(app, itemId) {
  const host = h('div');
  let showSteps = false;

  const project = () => app.store.state.project;
  const item = () => project().items.find((i) => i.id === itemId);
  const units = () => project().units;

  function mutate(fn, { audit } = {}) {
    app.store.update((s) => {
      const idx = s.project.items.findIndex((i) => i.id === itemId);
      const next = fn({ ...s.project.items[idx] });
      s.project.items[idx] = demoteOnChange(next);
    });
    if (audit) app.audit.append(audit);
    recalc();
    render();
  }

  function recalc() {
    app.store.update((s) => {
      const idx = s.project.items.findIndex((i) => i.id === itemId);
      const it = s.project.items[idx];
      try {
        s.project.items[idx] = { ...it, result: runDesign(app.registry, it) };
      } catch (err) {
        s.project.items[idx] = { ...it, result: null, resultError: err.message };
      }
    });
  }

  function setGeom(key, raw, dimension) {
    const v = dimension ? toBase(raw, dimension, units()) : Number(raw);
    mutate((it) => ({ ...it, geometry: { ...it.geometry, [key]: v } }));
  }

  function setAction(key, raw, dimension) {
    const v = toBase(raw, dimension, units());
    mutate((it) => ({ ...it, actions: { ...it.actions, [key]: v } }));
  }

  function editAssumption(a, raw) {
    const value = a.options ? raw : Number(raw);
    if (!a.options && !Number.isFinite(value)) { toast('Enter a number.', 'err'); return; }
    if (value === a.value) return;
    const reason = window.prompt(
      `Reason for changing "${a.label}"\nfrom ${a.value} to ${value}:`, '');
    if (reason === null) { render(); return; }
    if (!String(reason).trim()) {
      toast('An assumption cannot be changed without a reason.', 'err');
      render();
      return;
    }
    const it = item();
    mutate((x) => ({
      ...x,
      assumptions: applyAssumptionEdit(x.assumptions, a.key, value, reason, new Date().toISOString()),
    }), {
      audit: {
        kind: AUDIT_KINDS.ASSUMPTION_CHANGED,
        entity: itemLabel(it), entityId: it.id,
        field: `assumptions.${a.key}`,
        from: a.value, to: value, reason,
        actor: app.actorName(),
      },
    });
    toast('Assumption changed and logged.', 'ok');
  }

  function changeCode(codeId) {
    const it = item();
    mutate((x) => ({
      ...x, code: codeId,
      assumptions: reconcileAssumptions(x.assumptions, x, codeId),
    }), {
      audit: {
        kind: AUDIT_KINDS.CODE_CHANGED, entity: itemLabel(it), entityId: it.id,
        field: 'code', from: it.code, to: codeId, actor: app.actorName(),
      },
    });
  }

  function render() { preserveFocus(paint); }

  function paint() {
    const it = item();
    if (!it) { host.replaceChildren(h('p', null, 'This item no longer exists.')); return; }
    const res = it.result;
    const u = units();
    const g = it.geometry;
    const isCfst = !it.kind || it.kind === 'cfst';
    const spec = isCfst ? null : specFor(it);
    const circular = g.shape === SHAPE.CHS;

    /* ---------- verdict ---------- */
    const s = res ? res.summary : null;
    const verdictKind = !s ? 'neutral'
      : s.overall === OVERALL.SAFE ? 'safe'
        : s.overall === OVERALL.UNSAFE ? 'unsafe' : 'notcov';

    const verdict = sheet({
      title: itemLabel(it),
      lede: `${isCfst ? describeSection(g) : describeItem(it)} · ${it.code}`,
      actions: [
        chip(it.revision, 'neutral'),
        it.imported && it.imported.members && it.imported.members.length > 1
          ? button(`Design the group — ${it.imported.members.length} members`, { small: true, onClick: () => app.openGroup(itemId) })
          : null,
        button('Calculation sheet', { variant: 'ghost', small: true, onClick: () => app.openSheet(itemId) }),
        // Offered only once the design is satisfactory. A drawing is an
        // instruction to fabricate, and a button that produces one from a
        // failing design invites exactly the sequence nobody wants.
        canDrawItem(it) ? button('Shop drawings', { variant: 'ghost', small: true, onClick: () => app.openDrawings(itemId) }) : null,
        button('Back to register', { variant: 'quiet', small: true, onClick: () => app.navigate('items') }),
      ],
      body: h('div', null,
        (() => {
          const drift = driftFromModel(it);
          return drift.drifted
            ? note({ variant: 'danger', title: 'This section no longer matches the analysis model', body: describeDrift(drift) })
            : null;
        })(),
        project().quick ? h('div', { class: 'tg-quickbar' },
          h('div', { class: 'tg-quickbar__text' },
            h('b', null, 'Quick design — for review only'),
            'No client, job number or checker, so the sheet prints FOR REVIEW ONLY. Turn it into a project when it needs to be issued.'),
          button('Turn into a project', { small: true, onClick: () => convertQuickToProject(app) }),
          button('Export as JSON', { small: true, variant: 'ghost', onClick: () => { exportItemJson(app, item()); toast('Exported.', 'ok'); } }),
        ) : null,
        h('div', { class: 'tg-row', style: { gap: '22px', alignItems: 'center', marginBottom: '14px' } },
          s ? stamp(s.overall, verdictKind) : chip('Not run', 'neutral'),
          s && s.governing ? h('div', null,
            h('div', { style: { fontSize: '12px', color: 'var(--tg-ink-40)' } }, 'Governing check'),
            h('div', { style: { fontWeight: 700 } }, s.governing.title),
            h('div', { style: { fontSize: '12.5px', color: 'var(--tg-ink-60)' } }, s.governing.failureMode || ''),
          ) : null,
          s && Number.isFinite(s.maxUtilisation) ? h('div', null,
            h('div', { style: { fontSize: '12px', color: 'var(--tg-ink-40)' } }, 'Utilisation'),
            h('div', { class: 'tg-ident', style: { fontSize: '26px', fontWeight: 800, color: s.maxUtilisation > 1 ? 'var(--tg-unsafe)' : 'var(--tg-safe)' } },
              formatNumber(s.maxUtilisation, 3)),
          ) : null,
        ),
        s && s.governing && s.governing.clause
          ? clauseRef(app.registry.citation(s.governing.code, s.governing.clause))
          : null,
        s && s.blocked.length
          ? note({
            variant: 'code',
            title: `${s.blocked.length} check${s.blocked.length > 1 ? 's are' : ' is'} not available under ${it.code}`,
            body: 'The design cannot read as SAFE until these are resolved. Each is listed below with the exact wording of the limitation.',
            list: s.blocked.map((b) => `${b.title} — ${b.code}${b.clause ? ` §${b.clause}` : ''}`),
          })
          : null,
        it.resultError ? note({ variant: 'danger', title: 'The calculation stopped', body: it.resultError }) : null,
      ),
    });

    /* ---------- inputs ---------- */
    const L = (dim) => symbolFor(u, dim);
    const numField = (label, key, dimension, target = 'geometry') => field({
      label: `${label} (${L(dimension)})`, id: `in-${key}`, ident: true,
      control: numberInput({
        id: `in-${key}`,
        value: fromBase((target === 'geometry' ? g : it.actions)[key], dimension, u),
        onCommit: (v) => (target === 'geometry' ? setGeom(key, v, dimension) : setAction(key, v, dimension)),
      }),
    });

    const inputs = isCfst ? cfstInputs() : genericInputs();

    /**
     * Inputs built from the declared field spec. One renderer for every element
     * kind, so a new element cannot ship with an engine and no screen.
     */
    function genericInputs() {
      if (!spec) {
        return sheet({
          title: 'Inputs',
          body: note({
            variant: 'danger',
            title: 'No input form is declared for this element',
            body: `The engine for "${it.kind}" exists but ui/forms.js has no field specification for it, so there is nothing to edit. This is a gap in the platform, not in your data.`,
          }),
        });
      }
      return sheet({
        title: 'Inputs',
        body: h('div', { class: 'tg-form' },
          spec.groups.map((grp) => fold({
            key: grp.key, title: grp.title, body: h('div', { class: 'tg-grid' },
              grp.fields
                .filter((f) => !f.when || f.when(it))
                .map((f) => renderField(it, f, u, mutate))),
          })),
          fold({ key: 'generic.code', title: 'Design code and status', body: codeAndStatus() }),
        ),
      });
    }

    function codeAndStatus() {
      return h('div', { class: 'tg-grid' },
        field({
          label: 'Design code', id: 'in-code',
          control: select({
            id: 'in-code', value: it.code,
            options: app.registry.list()
              .filter((c) => c.plans && Object.keys(c.plans).length)
              .map((c) => ({ value: c.id, label: c.id })),
            onChange: changeCode,
          }),
        }),
        field({
          label: 'Status', id: 'in-status',
          hint: statusHint(app, it),
          control: select({
            id: 'in-status', value: it.status,
            options: STATUS_ORDER.filter((x) => allowedStatus(app, it, x)).map((x) => ({ value: x, label: x })),
            onChange: (v) => mutate((x) => ({ ...x, status: v })),
          }),
        }),
        field({
          label: 'Designer', id: 'in-designer',
          control: app.people.length
            ? select({ id: 'in-designer', value: it.designer, placeholder: 'Not assigned', options: peopleOptions(app.people), onChange: (v) => mutate((x) => ({ ...x, designer: v })) })
            : textInput({ id: 'in-designer', value: it.designer, onChange: (v) => mutate((x) => ({ ...x, designer: v })) }),
        }),
        field({
          label: 'Checker', id: 'in-checker',
          control: app.people.length
            ? select({ id: 'in-checker', value: it.checker, placeholder: 'Not assigned', options: peopleOptions(app.people).filter((o) => o.value !== it.designer), onChange: (v) => mutate((x) => ({ ...x, checker: v })) })
            : textInput({ id: 'in-checker', value: it.checker, onChange: (v) => mutate((x) => ({ ...x, checker: v })) }),
        }),
      );
    }

    function cfstInputs() {
      return sheet({
      title: 'Inputs',
      body: h('div', { class: 'tg-form' },
        fold({ key: 'cfst.section', title: 'Section', body:
          h('div', { class: 'tg-grid' },
            field({
              label: 'Shape', id: 'in-shape',
              control: select({
                id: 'in-shape', value: g.shape,
                options: Object.keys(SHAPE_LABELS).map((k) => ({ value: k, label: SHAPE_LABELS[k] })),
                onChange: (v) => setGeom('shape', v),
              }),
            }),
            circular ? numField('Outside diameter d', 'd', 'length') : numField('Width b', 'b', 'length'),
            circular ? null : (g.shape === SHAPE.SHS ? null : numField('Depth h', 'h', 'length')),
            numField('Wall thickness t', 't', 'length'),
            numField('Column length', 'length', 'length'),
          ) }),
        fold({ key: 'cfst.materials', title: 'Materials', body:
          h('div', { class: 'tg-grid' },
            // Three materials act together here, so it takes three grades.
            // This screen had none until v3.2.0, which is how a yield strength
            // of 3619.9926 kg/cm2 — a unit conversion carried in from an
            // analysis model, not a grade anybody chose — reached a design
            // sheet looking like an engineering decision.
            cfstGrade('steel', 'grade', 'Tube steel grade', it, u, mutate),
            cfstGrade('concrete', 'concreteGrade', 'Infill concrete grade', it, u, mutate),
            // A grade for reinforcement that is not there would put a material
            // on the sheet for steel nobody is buying.
            hasBars(it) ? cfstGrade('rebar', 'rebarGrade', 'Reinforcement grade', it, u, mutate) : null,
            matField(it, 'fy', 'Steel yield strength f_y', u, mutate, 'steel'),
            matField(it, 'fck', 'Concrete cylinder strength f_ck', u, mutate, 'concrete'),
            hasBars(it) ? matField(it, 'fsk', 'Reinforcement yield f_sk', u, mutate, 'rebar') : null,
            field({
              label: 'Bars', id: 'in-nbar', ident: true,
              control: numberInput({
                id: 'in-nbar', value: g.rebar.n, min: 0, max: 64,
                onCommit: (v) => mutate((x) => ({ ...x, geometry: { ...x.geometry, rebar: { ...x.geometry.rebar, n: Math.round(v) } } })),
              }),
            }),
            // A diameter for bars that are not there describes nothing, so it
            // goes when the count goes, along with the reinforcement grade.
            !hasBars(it) ? null : field({
              label: `Bar diameter (${L('length')})`, id: 'in-dbar', ident: true,
              control: numberInput({
                id: 'in-dbar', value: fromBase(g.rebar.dia, 'length', u), min: 0,
                onCommit: (v) => mutate((x) => ({ ...x, geometry: { ...x.geometry, rebar: { ...x.geometry.rebar, dia: toBase(v, 'length', u) } } })),
              }),
            }),
          ) }),
        fold({ key: 'cfst.actions', title: 'Design actions', body:
          h('div', { class: 'tg-grid' },
            numField('Axial force N_Ed', 'NEd', 'force', 'actions'),
            numField('Permanent part N_G,Ed', 'NGEd', 'force', 'actions'),
            numField('First-order moment M_y,Ed', 'MyEd', 'moment', 'actions'),
            numField('First-order moment M_z,Ed', 'MzEd', 'moment', 'actions'),
          ) }),
        // No base plate fields. The base is designed separately, so there is
        // nothing here for an engineer to fill in — and a form that collects
        // values no engine reads is worse than no form at all (handover
        // error 4: the input screen addressed field names the engine ignored,
        // so editing them changed nothing and nobody could tell).
        fold({ key: 'cfst.base', title: 'Base and anchorage — separate design', body:
          h('p', { class: 'tg-note' },
            'The base plate, its anchors and the bearing on the pedestal are not designed in this item and do not count towards its verdict. They are a separate design.') }),

        (() => {
          // Shown on the item screen as well, because this is the screen the
          // sheet and the drawing are produced from, and it is the one that
          // would state the wrong section without anything saying so.
          const u = unifiedSection(it.group);
          if (!u || itemMatchesSection(it, u)) return null;
          return note({
            variant: 'danger',
            title: `This item does not describe the section its group is on`,
            body: `The group has every member on ${u.name}, and this item describes something else. Anything printed from here — the calculation sheet, the shop drawing — will carry this section, not the one the schedule carries. Open the group and unify again.`,
          });
        })(),
        fold({ key: 'cfst.loadintro', title: 'Load introduction at the column head', body:
          h('div', null,
            checkRow({
              id: 'li-plate', checked: (it.loadIntroduction || {}).method === 'bearingPlate',
              label: 'Load is introduced through a bearing plate onto the concrete core',
              hint: (it.loadIntroduction || {}).method === 'bearingPlate'
                ? 'Transfer by interface shear under §6.7.4.2 no longer governs and no utilisation is reported. The bearing plate itself is not designed by this platform and must be designed separately.'
                : 'Load is taken as entering through the steel tube alone, and §6.7.4.2 checks whether friction at the interface can carry the concrete\'s share.',
              onChange: (v) => mutate((x) => ({ ...x, loadIntroduction: { ...(x.loadIntroduction || {}), method: v ? 'bearingPlate' : 'interface' } }), {
                audit: {
                  kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                  field: 'loadIntroduction.method', from: (it.loadIntroduction || {}).method, to: v ? 'bearingPlate' : 'interface',
                  reason: v ? 'Load introduction declared through a bearing plate.' : 'Load introduction returned to the steel interface.',
                  actor: app.actorName(),
                },
              }),
            }),
            (it.loadIntroduction || {}).method !== 'bearingPlate' ? null : field({
              label: 'Basis for the bearing plate', id: 'li-basis', span: true, required: true,
              error: String((it.loadIntroduction || {}).basis || '').trim() ? null : 'A written basis is required before this takes effect. Until then §6.7.4.2 still governs.',
              hint: 'Say how the plate bears on the core and who is designing it. This prints on the sheet as a recorded decision, with your name against it.',
              control: textArea({
                id: 'li-basis', value: (it.loadIntroduction || {}).basis || '', rows: 3,
                placeholder: 'For example: head plate bearing on the full core area, sized by the connection designer under EN 1992-1-1 §6.7 and EN 1993-1-8 §6.2.5.',
                onInput: (v) => { it.loadIntroduction.basis = v; },
              }),
            }),
            (it.loadIntroduction || {}).method !== 'bearingPlate' ? null : button('Record this decision', {
              small: true,
              onClick: () => {
                const basis = String(((item() || it).loadIntroduction || {}).basis || '').trim();
                if (!basis) { toast('State the basis first.', 'err'); return; }
                mutate((x) => ({ ...x, loadIntroduction: { ...(x.loadIntroduction || {}), basis } }), {
                  audit: {
                    kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                    field: 'loadIntroduction.basis', from: null, to: basis,
                    reason: basis, actor: app.actorName(),
                  },
                });
                toast('Decision recorded and logged.', 'ok');
              },
            }),
          ) }),
        fold({ key: 'cfst.fire', title: 'Fire', body:
          h('div', null,
            checkRow({
              id: 'fire-required', checked: it.fire.required,
              label: 'Fire design is required for this member',
              hint: it.fire.required
                ? 'Fire resistance is verified separately; the item stays incomplete until it is resolved.'
                : 'State below why fire design does not apply. Without a reason the item stays incomplete.',
              onChange: (v) => mutate((x) => ({ ...x, fire: { ...x.fire, required: v } }), {
                audit: {
                  kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                  field: 'fire.required', from: it.fire.required, to: v,
                  reason: v ? 'Fire design reinstated.' : 'Fire design declared not required.',
                  actor: app.actorName(),
                },
              }),
            }),
            it.fire.required ? null : field({
              label: 'Why fire design is not required', id: 'fire-reason', span: true, required: true,
              error: String(it.fire.reason || '').trim() ? null : 'A written basis is required before this item can read as satisfactory.',
              hint: 'This prints on the calculation sheet as a recorded engineering decision, with your name against it.',
              control: textArea({
                id: 'fire-reason', value: it.fire.reason, rows: 3,
                placeholder: 'For example: open basement, below the threshold for a fire rating under the project fire strategy.',
                onInput: (v) => { it.fire.reason = v; },
              }),
            }),
            it.fire.required ? null : button('Record this decision', {
              small: true,
              onClick: () => {
                const reason = String(item().fire.reason || '').trim();
                if (!reason) { toast('State the basis first.', 'err'); return; }
                mutate((x) => ({ ...x, fire: { ...x.fire, reason } }), {
                  audit: {
                    kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                    field: 'fire.reason', from: null, to: reason,
                    reason, actor: app.actorName(),
                  },
                });
                toast('Decision recorded and logged.', 'ok');
              },
            }),
          ) }),
        fold({ key: 'cfst.code', title: 'Design code and status', body:
          h('div', { class: 'tg-grid' },
            field({
              label: 'Design code', id: 'in-code',
              hint: 'Changing the code re-runs every check and keeps any assumption you have justified.',
              control: select({
                id: 'in-code', value: it.code,
                options: app.registry.options({ slot: 'composite' }).map((gr) => ({
                  group: gr.family, options: gr.codes.map((c) => ({ value: c.id, label: c.id })),
                })),
                onChange: changeCode,
              }),
            }),
            field({
              label: 'Status', id: 'in-status',
              hint: statusHint(app, it),
              control: select({
                id: 'in-status', value: it.status,
                options: STATUS_ORDER.filter((x) => allowedStatus(app, it, x)).map((x) => ({ value: x, label: x })),
                onChange: (v) => mutate((x) => ({ ...x, status: v }), {
                  audit: { kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id, field: 'status', from: it.status, to: v },
                }),
              }),
            }),
            field({
              label: 'Designer', id: 'in-designer',
              control: app.people.length
                ? select({ id: 'in-designer', value: it.designer, placeholder: 'Not assigned', options: peopleOptions(app.people), onChange: (v) => mutate((x) => ({ ...x, designer: v })) })
                : textInput({ id: 'in-designer', value: it.designer, onChange: (v) => mutate((x) => ({ ...x, designer: v })) }),
            }),
            field({
              label: 'Checker', id: 'in-checker',
              hint: it.designer && it.checker && it.designer === it.checker
                ? 'The checker and the designer are the same person. Independent checking is required before issue.'
                : null,
              control: app.people.length
                ? select({ id: 'in-checker', value: it.checker, placeholder: 'Not assigned', options: peopleOptions(app.people).filter((o) => o.value !== it.designer), onChange: (v) => mutate((x) => ({ ...x, checker: v })) })
                : textInput({ id: 'in-checker', value: it.checker, onChange: (v) => mutate((x) => ({ ...x, checker: v })) }),
            }),
          ) }),
      ),
      });
    }

    /* ---------- checks ---------- */
    const checksTable = table({
      caption: 'Verification summary',
      columns: [
        { label: 'Check', render: (c) => c.title },
        { label: 'Code and clause', ident: true, width: '190px', render: (c) => (c.clause ? `${c.code} §${c.clause}` : (c.code || '—')) },
        { label: 'Required', align: 'right', render: (c) => (c.demand === null ? '—' : fmt(c.demand, c.dimension, u)) },
        { label: 'Available', align: 'right', render: (c) => (c.capacity === null ? '—' : fmt(c.capacity, c.dimension, u)) },
        { label: 'U', align: 'right', width: '70px', render: (c) => (Number.isFinite(c.utilisation) ? formatNumber(c.utilisation, 3) : '—') },
        { label: 'Result', width: '120px', render: (c) => chip(c.status, CHECK_KIND[c.status] || 'neutral') },
      ],
      rows: res ? res.checks : [],
      empty: 'No checks have been run.',
    });

    const blockedNotes = res ? res.checks.filter((c) => c.note) : [];

    const checksSheet = sheet({
      title: 'Checks',
      lede: 'Required against available, with the clause each capacity came from.',
      actions: [button(showSteps ? 'Hide working' : 'Show working', { variant: 'ghost', small: true, onClick: () => { showSteps = !showSteps; render(); } })],
      body: h('div', null,
        checksTable,
        blockedNotes.length ? h('div', { style: { display: 'grid', gap: '8px', marginTop: '12px' } },
          blockedNotes.map((c) => note({
            variant: c.status === CHECK_STATUS.NOT_COVERED ? 'code' : c.status === CHECK_STATUS.FAIL ? 'danger' : 'caution',
            // A scope statement names no code and no clause, because there is
            // no provision to cite for work that was not attempted. Build the
            // heading from what the record holds. The printed sheet was fixed
            // for this in v3.1.0; this panel was not, and printed "null" where
            // a code belongs — on the one screen whose whole job is to say
            // where every number came from.
            title: [c.title, c.clause ? `${c.code} §${c.clause}` : (c.code || null)].filter(Boolean).join(' — '),
            body: c.note,
          }))) : null,
        showSteps && res ? stepsTable(res, u) : null,
      ),
    });

    /* ---------- assumptions ---------- */
    const assumptions = !isCfst ? null : sheet({
      title: 'Assumptions',
      lede: 'Generated automatically, editable, and recalculated the moment they change. A reason is required and is written to the change log.',
      body: table({
        columns: [
          { label: 'Assumption', render: (a) => h('div', null,
            h('div', { style: { fontWeight: 600 } }, a.label),
            h('div', { style: { fontSize: '11.5px', color: 'var(--tg-ink-40)' } }, a.basis)) },
          { label: 'Value', width: '170px', render: (a) => (a.options
            ? select({ id: `asm-${a.key}`, value: String(a.value), options: a.options.map((o) => ({ value: o, label: o })), onChange: (v) => editAssumption(a, v) })
            : numberInput({
              id: `asm-${a.key}`,
              value: a.dimension ? fromBase(a.value, a.dimension, u) : a.value,
              onCommit: (v) => editAssumption(a, a.dimension ? toBase(v, a.dimension, u) : v),
            })) },
          { label: 'Units', width: '70px', ident: true, render: (a) => (a.dimension ? symbolFor(u, a.dimension) : '—') },
          { label: 'Source', width: '90px', render: (a) => chip(a.source === SOURCE.USER ? 'Edited' : 'Auto', a.source === SOURCE.USER ? 'caution' : 'neutral') },
          { label: 'Reason for change', render: (a) => a.reason || '—' },
          { label: '', width: '80px', render: (a) => (a.source === SOURCE.USER
            ? button('Reset', { small: true, variant: 'quiet', onClick: () => {
              mutate((x) => ({ ...x, assumptions: resetAssumption(x.assumptions, a.key, x, x.code) }), {
                audit: { kind: AUDIT_KINDS.ASSUMPTION_CHANGED, entity: itemLabel(it), entityId: it.id, field: `assumptions.${a.key}`, from: a.value, to: 'default', reason: 'Reset to the generated default.', actor: it.designer || 'unattributed' },
              });
            } })
            : '') },
        ],
        rows: it.assumptions || [],
        empty: 'No assumptions generated.',
      }),
    });

    /* ---------- review comments ---------- */
    const me = app.currentUser;
    const draft = { text: '' };
    const comments = sheet({
      title: 'Review comments',
      lede: 'A comment is answered by the designer and closed by whoever raised it. Nothing reaches checked or approved while one is still open.',
      actions: [
        openComments(it).length ? chip(`${openComments(it).length} open`, 'caution') : chip('None open', 'safe'),
      ],
      body: h('div', null,
        h('div', { class: 'tg-grid', style: { marginBottom: '14px' } },
          field({
            label: 'Raise a comment', id: 'cmt-new', span: true,
            hint: me ? `It will be recorded against ${me.name}.` : 'No engineer is signed in, so it will be recorded as unattributed.',
            control: textArea({ id: 'cmt-new', value: '', rows: 3,
              placeholder: 'What needs to change, and why.',
              onInput: (v) => { draft.text = v; } }),
          }),
          h('div', { class: 'tg-row' }, button('Add comment', { onClick: () => {
            const text = String(draft.text || '').trim();
            if (!text) { toast('Write the comment first.', 'err'); return; }
            const c = newComment({ text, by: app.actorName(), role: me ? me.role : null });
            mutate((x) => ({ ...x, comments: [...(x.comments || []), c] }), {
              audit: { kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                field: 'comment', to: text.slice(0, 120), reason: 'Review comment raised.', actor: app.actorName() },
            });
            toast('Comment raised and logged.', 'ok');
          } })),
        ),
        (it.comments || []).length
          ? h('div', { class: 'tg-comments' }, [...(it.comments || [])].reverse().map((c) => h('div', {
            class: `tg-comment tg-comment--${c.status.toLowerCase()}`,
          },
            h('div', { class: 'tg-comment__head' },
              chip(c.status, c.status === COMMENT_STATUS.OPEN ? 'unsafe' : c.status === COMMENT_STATUS.ANSWERED ? 'caution' : 'safe'),
              h('b', null, c.by), h('span', null, c.role || ''),
              h('span', { class: 'tg-comment__when' }, c.at.replace('T', ' ').slice(0, 16))),
            h('p', null, c.text),
            c.reply
              ? h('div', { class: 'tg-comment__reply' },
                h('b', null, `${c.repliedBy} replied`), h('p', null, c.reply))
              : null,
            h('div', { class: 'tg-row' },
              c.status === COMMENT_STATUS.OPEN
                ? button('Answer', { small: true, variant: 'ghost', onClick: () => {
                  const text = window.prompt('Your answer to this comment:', '');
                  if (text === null || !text.trim()) return;
                  mutate((x) => ({ ...x, comments: replyTo(x, c.id, text, app.actorName()) }), {
                    audit: { kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                      field: 'comment.reply', from: c.text.slice(0, 60), to: text.slice(0, 120),
                      reason: 'Comment answered.', actor: app.actorName() },
                  });
                } })
                : null,
              c.status !== COMMENT_STATUS.CLOSED
                ? button('Close', { small: true, onClick: () => {
                  mutate((x) => ({ ...x, comments: closeComment(x, c.id, app.actorName()) }), {
                    audit: { kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                      field: 'comment.closed', from: c.text.slice(0, 60), to: 'closed',
                      reason: 'Comment closed by the reviewer.', actor: app.actorName() },
                  });
                } })
                : button('Reopen', { small: true, variant: 'quiet', onClick: () => {
                  mutate((x) => ({ ...x, comments: reopenComment(x, c.id) }), {
                    audit: { kind: AUDIT_KINDS.ITEM_FIELD, entity: itemLabel(it), entityId: it.id,
                      field: 'comment.reopened', to: c.text.slice(0, 120),
                      reason: 'Comment reopened.', actor: app.actorName() },
                  });
                } }),
            ),
          )))
          : h('p', { class: 'tg-muted', style: { fontSize: '13px' } }, 'No comments have been raised against this item.'),
      ),
    });

    host.replaceChildren(verdict, inputs, checksSheet, isCfst ? assumptions : null, comments);
  }

  if (!item().result) recalc();
  render();
  return host;
}

function matField(it, key, label, u, mutate, ownedBy) {
  const locked = !!ownedBy && gradeLocks(it, ownedBy);
  return field({
    // The unit comes out of the label when locked, because the value carries
    // its own units and both of them: the grade's MPa and the working unit.
    label: locked ? label : `${label} (${symbolFor(u, 'stress')})`,
    id: `mat-${key}`, ident: true,
    hint: locked ? 'Fixed by the grade above. Choose Customize to enter it by hand.' : null,
    control: numberInput({
      id: `mat-${key}`, value: fromBase(it.materials[key], 'stress', u), min: 0,
      locked, displayText: locked ? formatStrength(it.materials[key], u) : undefined,
      onCommit: (v) => mutate((x) => ({ ...x, materials: { ...x.materials, [key]: toBase(v, 'stress', u) } })),
    }),
  });
}

/** A grade dropdown on the hand-written composite column screen. */
function cfstGrade(kind, key, label, it, u, mutate) {
  const id = `mat-${key}`;
  return field({
    label, id, span: true,
    hint: gradeHint(kind, it.materials[key], it, u),
    control: h('div', null,
      select({
        id, value: it.materials[key] || '',
        placeholder: 'Choose a grade',
        options: gradeFieldOptions(kind, it),
        onChange: (v) => mutate((x) => applyGrade(x, kind, `materials.${key}`, v)),
      }),
      gradePropertyTable(kind, it.materials[key], it, u)),
  });
}

function fmt(v, dim, u) {
  if (v === null || v === undefined) return '—';
  if (!dim) return formatNumber(v, 3);
  return formatWithUnit(v, dim, u);
}

function stepsTable(res, u) {
  return h('div', { style: { marginTop: '16px' } },
    table({
      caption: 'Working — every line names its source',
      columns: [
        { label: 'Symbol', ident: true, width: '120px', render: (s) => s.symbol },
        { label: 'Description', render: (s) => h('div', null,
          h('div', null, s.description),
          s.expression ? h('div', { class: 'tg-ident', style: { fontSize: '11.5px', color: 'var(--tg-ink-60)' } }, s.expression) : null,
          s.substitution ? h('div', { class: 'tg-ident', style: { fontSize: '11.5px', color: 'var(--tg-ink-40)' } }, s.substitution) : null,
          s.note ? h('div', { style: { fontSize: '11.5px', color: 'var(--tg-caution)' } }, s.note) : null) },
        { label: 'Value', align: 'right', width: '150px', render: (s) => (s.value === null ? '—' : fmt(s.value, s.dimension, u)) },
        { label: 'Source', ident: true, width: '180px', render: (s) => (s.kind === STEP_KIND.DERIVED
          ? 'derived from the above'
          : s.kind === STEP_KIND.NOTICE ? `${s.code} §${s.clause}` : `${s.code} §${s.clause}`) },
      ],
      rows: res.steps,
      empty: 'No steps.',
    }),
  );
}

/**
 * Which statuses this person may set. A designer can move work forward to
 * "for check" but cannot sign it off, and nobody signs a check on their own
 * design. The control simply does not offer what the role may not do.
 */
function allowedStatus(app, item, status) {
  // An open comment outranks a role: it is the reviewer saying the design is
  // not yet right, and the status must not step past it.
  if (statusBlocked(item, status)) return false;
  if (!app.people.length || !app.currentUser) return true;
  if (status === ITEM_STATUS.DRAFT || status === ITEM_STATUS.FOR_CHECK) return true;
  if (status === ITEM_STATUS.SUPERSEDED) return app.can('editItems') || app.can('approve');
  if (status === ITEM_STATUS.CHECKED) return canCheckItem(app.currentUser, item).allowed;
  if (status === ITEM_STATUS.APPROVED) return app.can('approve');
  return true;
}

function statusHint(app, item) {
  const blocked = statusBlocked(item, 'Checked');
  if (blocked) return blocked;
  if (!app.people.length) return 'Add engineers to the register to attribute checks and approvals.';
  if (!app.currentUser) return 'No engineer is signed in, so every status is offered and changes are recorded as unattributed.';
  const verdict = canCheckItem(app.currentUser, item);
  if (!verdict.allowed) return verdict.reason;
  return `Signed in as ${app.currentUser.name} — ${app.currentUser.role}.`;
}

/** A labelled checkbox with the explanation sitting under it. */

/** One field renderer for every declared field, whatever the element. */
function renderField(it, f, u, mutate) {
  const id = `f-${f.path.replace(/\./g, '-')}`;
  const raw = getPath(it, f.path);

  // Choosing a catalogue section fills the dimensions. Typing a dimension
  // afterwards is allowed and switches the section to Custom, so the sheet
  // never claims a standard name for a section that is no longer standard.
  if (f.catalogue) {
    const chosen = sectionByName(raw);
    return field({
      label: f.label, id,
      hint: chosen
        ? (chosen.suspect
          ? chosen.suspect
          : `${chosen.h} × ${chosen.b} × ${chosen.tw}/${chosen.tf} · ${chosen.massPerMetre} kg/m · W_pl,y ${chosen.Wply} cm³`)
        : 'Dimensions entered directly. Choose a catalogue section to fill them in.',
      error: chosen && chosen.suspect ? 'This section cannot be used until its published data is confirmed.' : null,
      control: select({
        id, value: raw || '',
        placeholder: 'Custom — dimensions entered directly',
        options: sectionOptions(),
        onChange: (v) => mutate((x) => {
          const sec = sectionByName(v);
          const next = { ...x, geometry: { ...x.geometry, catalogue: v } };
          if (sec && !sec.suspect) {
            next.geometry.d = sec.h;
            next.geometry.bf = sec.b;
            next.geometry.tf = sec.tf;
            next.geometry.tw = sec.tw;
          }
          return next;
        }),
      }),
    });
  }

  if (f.grade) {
    return field({
      label: f.label, id, span: true,
      hint: gradeHint(f.grade, raw, it, u),
      control: h('div', null,
        select({
          id, value: raw || '',
          placeholder: 'Choose a grade',
          options: gradeFieldOptions(f.grade, it),
          onChange: (v) => mutate((x) => applyGrade(x, f.grade, f.path, v)),
        }),
        gradePropertyTable(f.grade, raw, it, u)),
    });
  }

  if (f.options) {
    return field({
      label: f.label, id,
      control: select({
        id, value: f.boolean ? String(!!raw) : String(raw ?? ''),
        options: f.options,
        onChange: (v) => mutate((x) => {
          const next = { ...x };
          setPath(next, f.path, f.boolean ? v === 'true' : v);
          return next;
        }),
      }),
    });
  }

  return field({
    label: f.dim ? `${f.label} (${symbolFor(u, f.dim)})` : f.label,
    id, ident: true,
    // A strength in kg/cm² is correct and unrecognisable. The grade it
    // corresponds to is named in MPa everywhere, so the MPa value is shown too.
    hint: f.dim === 'stress' && symbolFor(u, 'stress') !== 'MPa' && Number(raw) > 0
      ? formatStrength(Number(raw), u)
      : null,
    control: numberInput({
      id,
      value: f.dim ? fromBase(Number(raw) || 0, f.dim, u) : (Number(raw) || 0),
      min: f.min,
      // A value that a named grade owns is shown, not edited. Choosing
      // Customize on that grade is what hands it back.
      locked: !!f.derivedFrom && gradeLocks(it, f.derivedFrom),
      lockTitle: f.derivedFrom ? `Set by the ${f.derivedFrom} grade. Choose Customize on that grade to enter it by hand.` : null,
      onCommit: (v) => mutate((x) => {
        const next = { ...x };
        setPath(next, f.path, f.dim ? toBase(v, f.dim, u) : (f.integer ? Math.round(v) : v));
        // A hand-edited dimension means the section is no longer the catalogue one.
        if (next.geometry && next.geometry.catalogue && /^geometry\.(d|bf|tf|tw)$/.test(f.path)) {
          next.geometry = { ...next.geometry, catalogue: '' };
        }
        return next;
      }),
    }),
  });
}


/**
 * Everything the chosen grade puts into the calculation.
 *
 * Shown in full rather than as the one strength the field holds, because the
 * rest — the modulus, the density, the thermal coefficient — reach the result
 * just as surely and were previously invisible. Each row names where it came
 * from, and a row the reference does not pin down says so instead of printing
 * a number that looks as settled as the others.
 */
function gradePropertyTable(kind, value, it, u) {
  const p = gradePropertyRows(kind, value, it, u);
  if (!p) return null;
  return h('div', { class: 'tg-gradeprops' },
    h('table', { class: 'tg-gradeprops__table' },
      h('tbody', null, p.rows.map((r) => h('tr', null,
        h('th', null, r.symbol),
        h('td', null, r.description),
        h('td', { class: 'tg-gradeprops__val' }, r.display),
        h('td', { class: 'tg-gradeprops__src' }, r.verify ? `${r.source} — confirm` : r.source),
      )))),
    p.note ? h('p', { class: 'tg-gradeprops__note' }, p.note) : null);
}

function drawingsScreen(app, itemId) {

  if (!item) return h('p', null, 'This item no longer exists.');

  const toolbar = h('div', { class: 'cs-toolbar' },
    button('Back to design', { variant: 'quiet', small: true, onClick: () => app.openItem(itemId) }),

      'Print at A4 portrait, 100% scale. Do not select fit to page, or the stated scale will not hold.'),
  );

  // A drawing is an instruction to fabricate. It is produced from a design that
  // is satisfactory, or it is not produced. Showing a provisional drawing with
  // a warning on it would not work: drawings are shared, printed and passed on,
  // and the warning is the first thing to fall off.
  const blockers = blockersFor(item);
  if (blockers.length) {
    return h('div', null, toolbar, h('div', { style: { maxWidth: '210mm', margin: '0 auto' } },
      note({
        variant: 'danger',
        title: 'No drawing is produced for this item',
        body: 'A shop drawing states dimensions that will be cut to. It is issued from a completed, satisfactory design and from nothing else.',
        list: blockers,
      })));
  }

  const set = drawingsFor(item, (kind, grade, it) => gradePropertyRows(kind, grade, it, p.units), p.units);
  const { svg, scales } = renderSheetSvg(set, { units: p.units });
  const register = dimensionRegister(set);

  const page = h('article', { class: 'dwg-page' },
    h('header', { class: 'dwg-head' },
      h('div', { class: 'dwg-head__brand' }, logoImg('dwg-logo')),
      h('div', { class: 'dwg-head__mid' },
        h('div', { class: 'dwg-head__proj' }, p.name || 'Untitled project'),
        h('div', { class: 'dwg-head__sub' }, [p.client, p.consultant].filter(Boolean).join(' · '))),
      h('div', { class: 'dwg-head__right' },
        h('div', null, itemLabel(item)),
        h('div', { class: 'dwg-head__sub' }, `Rev ${p.revision || '0'}`))),

    h('div', { class: 'dwg-title' }, set.title),
    h('div', { class: 'dwg-canvas', html: svg }),

    h('div', { class: 'dwg-cols' },
      h('section', null,
        h('h4', null, 'Materials'),
        set.materials.length
          ? h('table', { class: 'dwg-table' }, h('tbody', null, set.materials.map((m) => h('tr', null,
            h('th', null, m.part), h('td', null, m.grade),
            h('td', { class: 'dwg-src' }, m.standard || '—')))))
          : h('p', { class: 'dwg-note' }, 'No grades recorded.')),

      h('section', null,
        h('h4', null, 'Where each dimension came from'),
        // A drawing should be auditable without opening the platform that made
        // it. Every figured dimension is listed with the field it was taken
        // from, so a checker can trace a number on paper back to a value that
        // was verified rather than take it on trust.
        h('table', { class: 'dwg-table dwg-table--ident' }, h('tbody', null, register.map((d) => h('tr', null,
          h('th', null, `${dimFigure(d.value, p.units)} ${symbolFor(p.units, 'length')}`),
          h('td', null, d.source),
          h('td', { class: 'dwg-src' }, d.origin))))))),

    h('section', { class: 'dwg-excl' },
      h('h4', null, 'Not covered by this drawing'),
      h('ul', null, set.excluded.map((x) => h('li', null,
        h('b', null, `${x.title}. `), x.body)))),

    h('section', { class: 'dwg-notes' },
      h('h4', null, 'Notes'),
      h('ol', null, set.notes.map((n) => h('li', null, n)))),

    h('footer', { class: 'dwg-foot' },
      h('span', null, scales.map((s) => `${s.title} 1:${s.scale}`).join('  ·  ')),
      // app.build is the version string, not an object. Asking it for
      // .version and .number printed "undefined build undefined" across the
      // foot of a drawing.
      h('span', null, `v${app.build} ${buildLabel()}`)),
  );

  return h('div', null, toolbar, page);
}

// ui/screens/compare.js — what changed when a project was recalculated.
//
// Recalculating on a newer platform version is never silent. This screen is
// shown immediately afterwards so the engineer sees which numbers moved before
// signing the new revision.


const VERDICT_KIND = {
  [OVERALL.SAFE]: 'safe',
  [OVERALL.UNSAFE]: 'unsafe',
  [OVERALL.INCOMPLETE]: 'caution',
};

function compareScreen(app) {
  const p = app.store.state.project;
  const diffs = app.lastComparison || [];

  if (!diffs.length) {
    return sheet({
      title: 'Version comparison',
      body: note({
        title: 'Nothing to compare',
        body: 'This project has not been recalculated on a different platform version.',
      }),
      foot: [button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') })],
    });
  }

  const anyChange = diffs.some((d) => d.diff.changed);
  const verdictChanges = diffs.filter((d) => d.diff.verdictChanged);

  const header = sheet({
    title: 'What changed in this recalculation',
    lede: `Every design item was recalculated from v${diffs[0].diff.beforeVersion || '—'} to v${diffs[0].diff.afterVersion}. The project was raised to revision ${p.revision}.`,
    actions: [
      button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') }),
      button('Open design items', { variant: 'ghost', small: true, onClick: () => app.navigate('items') }),
    ],
    body: h('div', null,
      anyChange
        ? note({
          variant: verdictChanges.length ? 'danger' : 'caution',
          title: verdictChanges.length
            ? `${verdictChanges.length} item${verdictChanges.length > 1 ? 's' : ''} changed verdict`
            : 'Numbers moved, but no verdict changed',
          body: verdictChanges.length
            ? 'Review these before signing the new revision. A sheet already issued under the previous revision remains valid as a record of what was checked at that time.'
            : 'The utilisation figures below moved. The overall verdict for every item is unchanged.',
          list: verdictChanges.map((d) => `${itemLabel(d.item)} — ${d.diff.beforeOverall} → ${d.diff.afterOverall}`),
        })
        : note({
          variant: 'code',
          title: 'No numbers changed',
          body: 'This platform version produces identical results for every check in this project. The new revision records the recalculation; the values are the same.',
        }),
    ),
  });

  const perItem = diffs.map(({ item, diff }) => sheet({
    title: itemLabel(item),
    lede: `${diff.beforeOverall} → ${diff.afterOverall}`,
    actions: [
      chip(`v${diff.beforeVersion || '—'}`, 'neutral'),
      chip(`v${diff.afterVersion}`, VERDICT_KIND[diff.afterOverall] || 'neutral'),
      button('Open', { variant: 'quiet', small: true, onClick: () => app.openItem(item.id) }),
    ],
    body: table({
      caption: diff.changed ? 'Rows that moved are marked' : 'No row changed',
      columns: [
        { label: 'Check', render: (r) => h('div', null,
          h('div', null, r.title),
          r.note ? h('div', { style: { fontSize: '11.5px', color: 'var(--tg-caution)' } }, r.note) : null) },
        { label: 'Clause', ident: true, width: '170px', render: (r) => (r.clause ? `${r.code} §${r.clause}` : (r.code || '—')) },
        { label: 'Was', align: 'right', width: '90px', render: (r) => fmtU(r.utilBefore) },
        { label: 'Now', align: 'right', width: '90px', render: (r) => fmtU(r.utilAfter) },
        { label: 'Capacity was', align: 'right', render: (r) => fmtCap(r.capacityBefore, r.dimension, p.units) },
        { label: 'Capacity now', align: 'right', render: (r) => fmtCap(r.capacityAfter, r.dimension, p.units) },
        { label: '', width: '96px', render: (r) => (r.moved ? chip('Changed', 'caution') : '') },
      ],
      rows: diff.rows,
    }),
  }));

  return h('div', null, header, ...perItem);
}

function fmtU(v) {
  return Number.isFinite(v) ? formatNumber(v, 3) : '—';
}

function fmtCap(v, dim, units) {
  if (v === null || v === undefined) return '—';
  return dim ? formatWithUnit(v, dim, units) : formatNumber(v, 3);
}

// ui/screens/people.js — the office register.


const ROLE_KIND = {
  [ROLE.LEAD]: 'caution',
  [ROLE.DESIGNER]: 'neutral',
  [ROLE.CHECKER]: 'safe',
  [ROLE.APPROVER]: 'safe',
  [ROLE.VIEWER]: 'neutral',
};

function peopleScreen(app) {
  const host = h('div');

  function people() { return app.people; }

  function add() {
    app.people = [...app.people, newPerson({ name: '', role: ROLE.DESIGNER })];
    render();
  }

  function update(id, key, value) {
    app.people = app.people.map((p) => {
      if (p.id !== id) return p;
      const next = { ...p, [key]: value };
      if (key === 'name') next.initials = initials(value);
      return next;
    });
    if (app.currentUser && app.currentUser.id === id) {
      app.currentUser = app.people.find((p) => p.id === id);
    }
    render();
  }

  function remove(id) {
    const person = app.people.find((p) => p.id === id);
    if (app.currentUser && app.currentUser.id === id) {
      toast('You cannot remove the person currently working.', 'err');
      return;
    }
    app.people = app.people.filter((p) => p.id !== id);
    app.audit.append({
      kind: AUDIT_KINDS.TEAM_CHANGED, entity: 'Office register',
      field: 'people', from: person ? person.name : null, to: null,
      actor: app.currentUser ? app.currentUser.name : 'unattributed',
    });
    render();
  }

  function signIn(id) {
    const person = app.people.find((p) => p.id === id) || null;
    const before = app.currentUser ? app.currentUser.name : null;
    app.currentUser = person;
    app.audit.append({
      kind: AUDIT_KINDS.TEAM_CHANGED, entity: 'Session', field: 'currentUser',
      from: before, to: person ? person.name : null,
      actor: person ? person.name : 'unattributed',
    });
    app.render();
  }

  function paint() {
    const list = people();
    const me = app.currentUser;

    const whoIsWorking = sheet({
      title: 'Who is working',
      lede: 'Your name is attached to every change you make and prints on every sheet you produce.',
      body: h('div', null,
        list.length
          ? h('div', { class: 'tg-grid', style: { maxWidth: '520px' } },
            field({
              label: 'Signed in as', id: 'who-am-i',
              hint: me ? `Role: ${me.role}` : 'Until you choose a name, changes are recorded as "unattributed".',
              control: select({
                id: 'who-am-i',
                value: me ? me.id : '',
                placeholder: 'Not signed in',
                options: list.filter((p) => p.active).map((p) => ({ value: p.id, label: `${p.name || '(unnamed)'} — ${p.role}` })),
                onChange: signIn,
              }),
            }),
          )
          : emptyState({
            title: 'The register is empty',
            body: 'Add the engineers in the office. Each one gets a role that decides which actions they are offered.',
            actions: [button('Add the first engineer', { onClick: add })],
          }),
        me ? permissionSummary(me) : null,
      ),
    });

    const register = sheet({
      title: 'Office register',
      lede: 'Held with the platform, not with the project, so names do not have to be retyped for every job.',
      actions: [button('Add engineer', { onClick: add })],
      body: h('div', null,
        table({
          columns: [
            { label: 'Name', render: (p) => textInput({ id: `per-${p.id}-name`, value: p.name, placeholder: 'Full name', onInput: (v) => update(p.id, 'name', v) }) },
            { label: 'Initials', width: '86px', render: (p) => textInput({ id: `per-${p.id}-ini`, value: p.initials, onInput: (v) => update(p.id, 'initials', v.toUpperCase()) }) },
            { label: 'Role', width: '175px', render: (p) => select({ id: `per-${p.id}-role`, value: p.role, options: ROLES.map((r) => ({ value: r, label: r })), onChange: (v) => update(p.id, 'role', v) }) },
            { label: 'Title', render: (p) => textInput({ id: `per-${p.id}-title`, value: p.title, placeholder: 'Structural engineer', onInput: (v) => update(p.id, 'title', v) }) },
            { label: 'Status', width: '110px', render: (p) => (app.currentUser && app.currentUser.id === p.id
              ? chip('Working now', 'safe')
              : chip(p.role, ROLE_KIND[p.role] || 'neutral')) },
            { label: '', width: '86px', render: (p) => button('Remove', { small: true, variant: 'quiet', onClick: () => remove(p.id) }) },
          ],
          rows: list,
          empty: 'No engineers in the register.',
        }),
        note({
          variant: 'code',
          title: 'This is accountability, not a lock',
          body: 'There is no password. A program that runs entirely in the browser cannot enforce one, and pretending otherwise would be worse than being clear about it. What this does give you is a name against every change, the right names printed on every sheet, and controls that are not offered to the wrong role.',
        }),
      ),
    });

    host.replaceChildren(whoIsWorking, register);
  }

  function render() { preserveFocus(paint); }
  render();
  return host;
}

function permissionSummary(person) {
  const p = PERMISSIONS[person.role] || {};
  const rows = [
    ['Edit project details', p.editProject],
    ['Edit design items', p.editItems],
    ['Sign a check', p.check],
    ['Approve for issue', p.approve],
    ['Manage the register', p.managePeople],
  ];
  return h('div', { style: { marginTop: '14px' } },
    table({
      caption: `What ${person.name || 'this role'} can do`,
      columns: [
        { label: 'Action', render: (r) => r[0] },
        { label: '', width: '110px', render: (r) => chip(r[1] ? 'Allowed' : 'Not offered', r[1] ? 'safe' : 'neutral') },
      ],
      rows,
    }),
    person.role === ROLE.CHECKER || person.role === ROLE.APPROVER
      ? note({ title: 'Independent checking', body: 'You will not be offered the check action on an item you designed yourself.' })
      : null,
  );
}
