    // have to test for the field's existence before finding nothing in it.
    baseChecks: [],
    baseSteps: [],
    baseCtx: null,
    baseRunCodeId: null,
    steps: member.steps,
    checks,
    notices: member.notices,
    summary: summarise(checks),
  };
}


/* ===== src/modules/group.js ===== */
// modules/group.js — designing a group of members that share a section.
//
// HOW THIS DIFFERS FROM DESIGNING THE WORST MEMBER
//
// Fifty beams carry the same section because the shop wants them to, not
// because they carry the same load. Designing the worst one and stopping there
// is safe and wasteful; designing each one separately is accurate and
// unbuildable. What an engineer actually does is size a small number of
// sections against the members that govern, then work out which member takes
// which section.
//
// So: the governing members give the starting sizes, the engineer names the
// sections, and every section is then run against every member. The result is a
// matrix, and the assignment is a choice made against it rather than a number
// taken on trust.


let counter = 0;

/**
 * The forms a trial section can take.
 *
 * A group of beams is not only a choice between one I-section and another: a
 * pair of channels is a real alternative that an office reaches for, and until
 * it could be put in the same comparison the choice was being made outside the
 * platform on memory alone. So a trial carries its own kind, and the engine
 * that runs it follows from that rather than from the item it belongs to.
 */
const TRIAL_KINDS = {
  steelbeam: { label: 'Rolled or welded I-section', make: createSteelBeamItem },
  plategirder: { label: 'Welded plate girder', make: createPlateGirderItem },
  doublechannel: { label: 'Double channel', make: createDoubleChannelItem },
  rcbeam: { label: 'Reinforced concrete beam', make: createBeamItem },
  rccolumn: { label: 'Reinforced concrete column', make: createColumnItem },
  cfst: { label: 'Filled tubular column', make: null },
};

/** Which forms make sense to compare against a given item. */
function trialKindsFor(item) {
  const k = item.kind || 'cfst';
  if (k === 'steelbeam' || k === 'plategirder' || k === 'doublechannel') {
    return ['steelbeam', 'plategirder', 'doublechannel'];
  }
  if (k === 'rcbeam') return ['rcbeam'];
  if (k === 'rccolumn' || k === 'cfst') return ['rccolumn', 'cfst'];
  return [k];
}

/** A section the engineer has decided to try. Not a result: a candidate. */
function newTrialSection(item, patch = {}) {
  counter += 1;
  const kind = patch.kind || item.kind || 'cfst';
  // A trial of a different kind starts from that kind's own defaults, because
  // a double channel has nothing to inherit from an I-section's dimensions.
  const base = kind === (item.kind || 'cfst')
    ? { geometry: item.geometry, materials: item.materials }
    : (TRIAL_KINDS[kind] && TRIAL_KINDS[kind].make ? TRIAL_KINDS[kind].make({}) : { geometry: {}, materials: {} });
  return {
    id: `sec_${counter}`,
    kind,
    name: patch.name || `Section ${counter}`,
    geometry: { ...base.geometry, ...(patch.geometry || {}) },
    materials: { ...base.materials, ...(patch.materials || {}) },
    note: patch.note || '',
  };
}

/**
 * The section to start from: the one the model already used.
 *
 * An earlier version created one trial per governing member and named each
 * after the member it came from, which implied a sizing that had not happened —
 * all three were copies of the same section. Promising work that was not done
 * is worse than doing none, so there is one starting section, plainly named,
 * and the engineer sizes the rest against the governing members shown above.
 */
function seedFromGoverning(item, governing) {
  return [newTrialSection(item, {
    name: 'As modelled',
    note: 'The section the analysis model used. Size the others against the governing members above, then compare.',
  })];
}

/** The actions on one member, shaped for whichever element this group is. */
function actionsForMember(item, member) {
  const k = typeof item === 'string' ? item : item.kind;
  if (k === 'steelbeam') return { Mu: Math.abs(member.M), Vu: Math.abs(member.V) };
  if (k === 'rcbeam') return { Mu: Math.abs(member.M), Qu: Math.abs(member.V), Tu: 0 };
  if (k === 'rccolumn') return { Nu: Math.abs(member.P), Mx: Math.abs(member.M), My: 0 };
  if (k === 'plategirder') return { MEd: Math.abs(member.M), VEd: Math.abs(member.V) };
  if (k === 'doublechannel') return { Pu: Math.abs(member.P), Mu: Math.abs(member.M) };
  // filled composite column
  return { ...item.actions, NEd: Math.abs(member.P), MyEd: Math.abs(member.M) };
}

/**
 * Every trial section against every member.
 *
 * Returns a matrix of verdicts. A member is only adequate under a section if
 * the whole design passes for it; INCOMPLETE stays INCOMPLETE, because a check
 * the code does not cover is not a check that passed.
 */
function evaluateGroup(registry, item, members, sections, loadFactor = 1) {
  const rows = [];
  for (const raw of members) {
    // Rows come from two places: the governing members, which use M, V and P,
    // and the stored member list, which keeps SAP's own M3 and V2. Reading only
    // one set left every action at zero and every member reading safe.
    const member = {
      frame: raw.frame,
      Cb: raw.Cb,
      M: raw.M !== undefined && raw.M !== null ? raw.M : (raw.M3 || 0),
      V: raw.V !== undefined && raw.V !== null ? raw.V : (raw.V2 || 0),
      P: raw.P || 0,
    };
    const cells = {};
    for (const sec of sections) {
      // The trial decides which engine runs, and therefore which actions it
      // needs. Reading the item's kind here would have sent a double channel's
      // moments into the I-section engine.
      const kind = sec.kind || item.kind || 'cfst';
      const maker = TRIAL_KINDS[kind] && TRIAL_KINDS[kind].make;
      const shell = kind === (item.kind || 'cfst') ? item : (maker ? maker({}) : item);
      const base = actionsForMember(kind, {
        M: member.M * loadFactor,
        V: member.V * loadFactor,
        P: member.P * loadFactor,
      });
      // Each member has its own moment diagram, so each has its own C_b.
      // Using one value across the group would hand the flattest member the
      // benefit earned by the most curved one.
      const cbOverride = (kind === 'steelbeam' && Number.isFinite(raw.Cb)) ? { Cb: raw.Cb } : {};
      const trial = {
        ...shell,
        kind,
        code: shell.code,
        geometry: { ...shell.geometry, ...sec.geometry, ...cbOverride },
        materials: { ...shell.materials, ...sec.materials },
        actions: { ...shell.actions, ...base },
      };
      let res;
      try {
        res = runDesign(registry, trial);
      } catch (err) {
        cells[sec.id] = { overall: 'ERROR', u: null, note: err.message };
        continue;
      }
      cells[sec.id] = {
        overall: res.summary.overall,
        u: res.summary.maxUtilisation,
        governing: res.summary.governing ? res.summary.governing.title : null,
      };
    }
    rows.push({ frame: member.frame, member, cells });
  }

  const summary = {};
  for (const sec of sections) {
    const safe = rows.filter((r) => r.cells[sec.id] && r.cells[sec.id].overall === OVERALL.SAFE).length;
    const worst = rows.reduce((a, r) => {
      const c = r.cells[sec.id];
      return c && Number.isFinite(c.u) && c.u > a ? c.u : a;
    }, 0);
    summary[sec.id] = { safe, total: rows.length, worst, coversAll: safe === rows.length };
  }
  return { rows, summary };
}

/**
 * Mass per metre of a trial section, which is what "lightest" has to mean.
 * Falls back to the section area where a mass cannot be worked out, and to
 * infinity where even that fails, so an unknown section is never chosen over
 * one whose weight is known.
 */
function trialMass(sec) {
  try {
    if (sec.kind === 'doublechannel') {
      const ch = channelByName(sec.geometry && sec.geometry.channel);
      return ch ? ch.massPerMetre * 2 : Infinity;
    }
    if (sec.kind === 'steelbeam' || sec.kind === 'plategirder') {
      const s = steelBeamSection(sec.geometry || {});
      return s.massPerMetre || Infinity;
    }
    const g = sec.geometry || {};
    // Concrete and composite members: compare gross area, which stands in for
    // cost well enough to order them.
    if (g.D) return Math.PI / 4 * g.D * g.D;
    if (g.b && g.t) return g.b * g.t;
    return Infinity;
  } catch {
    return Infinity;
  }
}

/**
 * Give every member the lightest section that works for it.
 *
 * The first version took the first section in the list that passed, while the
 * button said it assigned the lightest. With sections added heaviest first it
 * handed every member the heaviest one that worked — the opposite of what it
 * promised, and on fifty members that is tonnes of steel. Sections are now
 * ordered by what they actually weigh.
 */
function autoAssign(matrix, sections) {
  const byMass = [...sections].sort((a, b) => trialMass(a) - trialMass(b));
  const assignment = {};
  const unassigned = [];
  for (const row of matrix.rows) {
    const fit = byMass.find((s) => {
      const c = row.cells[s.id];
      return c && c.overall === OVERALL.SAFE;
    });
    if (fit) assignment[row.frame] = fit.id;
    else unassigned.push(row.frame);
  }
  return { assignment, unassigned, order: byMass.map((s) => s.id) };
}

/** Whether one section can be used for the whole group. */
function unifyOn(matrix, sectionId) {
  const failing = matrix.rows.filter((r) => {
    const c = r.cells[sectionId];
    return !c || c.overall !== OVERALL.SAFE;
  });
  return {
    possible: failing.length === 0,
    failing: failing.map((r) => r.frame),
    worst: matrix.summary[sectionId] ? matrix.summary[sectionId].worst : null,
  };
}

/** How many sections an assignment actually uses, and how many of each. */
function assignmentSummary(assignment, sections) {
  const counts = new Map();
  for (const id of Object.values(assignment)) counts.set(id, (counts.get(id) || 0) + 1);
  return sections
    .filter((s) => counts.has(s.id))
    .map((s) => ({ section: s, count: counts.get(s.id) }));
}


/**
 * The verdict for an item that stands for a group.
 *
 * The item's own actions are the envelope taken at import: the largest axial
 * force from one member and the largest moment from another, which is a state
 * of loading that exists on no member. It was never meant to be the answer,
 * only a starting size, and reporting it in the register made the item read far
 * worse than the design actually is.
 *
 * The honest verdict is the worst real member under the section it has been
 * given. Members with no section assigned are not counted as safe, because they
 * have not been designed.
 */
function groupVerdict(registry, item) {
  const g = item.group;
  const imp = item.imported;
  if (!g || !g.sections || !g.sections.length || !imp || !imp.members) return null;

  const members = imp.members.filter((m) => (m.M3 ?? m.M) !== undefined || m.P);
  if (!members.length) return null;

  const matrix = evaluateGroup(registry, item, members, g.sections, 1);
  const assignment = g.assignment || {};

  let worst = null;
  const unassigned = [];
  const failing = [];

  for (const row of matrix.rows) {
    const secId = assignment[row.frame];
    if (!secId) { unassigned.push(row.frame); continue; }
    const cell = row.cells[secId];
    if (!cell) continue;
    if (cell.overall !== OVERALL.SAFE) failing.push(row.frame);
    if (Number.isFinite(cell.u) && (!worst || cell.u > worst.u)) {
      worst = { u: cell.u, frame: row.frame, section: secId, governing: cell.governing, overall: cell.overall };
    }
  }

  const assignedCount = matrix.rows.length - unassigned.length;
  let overall;
  if (unassigned.length) overall = 'UNASSIGNED';
  else if (failing.length) overall = OVERALL.UNSAFE;
  else overall = OVERALL.SAFE;

  return {
    overall,
    worst,
    failing,
    unassigned,
    assignedCount,
    total: matrix.rows.length,
    sections: assignmentSummary(assignment, g.sections),
  };
}

function describeGroupVerdict(v) {
  if (!v) return null;
  if (v.overall === 'UNASSIGNED') {
    return `${v.unassigned.length} of ${v.total} members have no section assigned, so this group is not designed yet.`;
  }
  if (v.overall === OVERALL.UNSAFE) {
    return `${v.failing.length} of ${v.total} members fail under the section assigned to them, the worst being member ${v.worst ? v.worst.frame : '—'}.`;
  }
  return `All ${v.total} members satisfy the section assigned to them; the worst is member ${v.worst ? v.worst.frame : '—'} at ${v.worst ? v.worst.u.toFixed(3) : '—'}.`;
}

/**
 * Actions that are almost certainly missing rather than zero.
 *
 * The platform cannot tell the difference on its own: an action that was never
 * exported and an action that is genuinely nil both arrive as 0, and the
 * design then runs on the second reading without ever questioning it. A column
 * carrying moment and shear but no axial force at all is not a load case — it
 * is an export with the axial column left out, or a combination with no
 * gravity in it. Every member passes comfortably, the group reads green, and
 * the one action a column exists to carry was never checked.
 *
 * This looks for the pattern rather than guessing a value. Nothing is invented
 * and nothing is blocked; the engineer is told what the numbers look like and
 * decides.
 *
 * @returns {Array<{id: string, title: string, body: string}>}
 */
function suspectActions(item, members) {
  const out = [];
  const list = Array.isArray(members) ? members : [];
  if (!list.length) return out;

  const val = (m, a, b) => {
    const v = m[a] !== undefined && m[a] !== null ? m[a] : m[b];
    return Math.abs(Number(v) || 0);
  };
  const anyMoment = list.some((m) => val(m, 'M', 'M3') > 0);
  const anyShear = list.some((m) => val(m, 'V', 'V2') > 0);
  const anyAxial = list.some((m) => Math.abs(Number(m.P) || 0) > 0);
  const isColumn = (item.kind || 'cfst') === 'cfst' || (item.kind || '') === 'rccolumn';

  if (isColumn && !anyAxial && (anyMoment || anyShear)) {
    out.push({
      id: 'no-axial',
      title: `No axial force on any of these ${list.length} members`,
      body: 'Moments and shears came across but every axial force is zero. A column with no axial force is not a load case the platform can check meaningfully — every section will pass, and the action the column exists to carry will not have been examined. Either the analysis export left the axial column out, or the chosen combination carries no gravity load. Check the SAP export and the combinations, then import again.',
    });
  }
  if (!anyMoment && !anyShear && anyAxial) {
    out.push({
      id: 'no-bending',
      title: 'No moment or shear on any of these members',
      body: 'Every moment and shear is zero while axial forces came across. That is possible for a pinned, purely axially loaded member, but it is also what a partial export looks like. Confirm it against the model before sizing anything on it.',
    });
  }
  return out;
}

/**
 * The fields a trial section sets on the item it belongs to.
 *
 * Unifying a group used to write only `group.assignment`, which records what
 * each member is on but leaves the design item itself untouched. The item then
 * went on describing whatever section had last been typed into it — so the
 * register, the calculation sheet and the shop drawing all reported one
 * section while the schedule going to the workshop named another, under the
 * same item number and with nothing on either screen saying they disagreed.
 *
 * Only the geometry and the materials are copied. The item's own actions,
 * assumptions and recorded decisions are its own and are left alone.
 */
function sectionFieldsForItem(sec) {
  if (!sec) return null;
  const out = {};
  if (sec.geometry) out.geometry = { ...sec.geometry };
  if (sec.materials) out.materials = { ...sec.materials };
  return out;
}

/**
 * Does the item describe the section the group settled on?
 *
 * Compared on the values that change the answer, not on the object, because a
 * section carries a name and an id that the item does not.
 */
function itemMatchesSection(item, sec) {
  if (!item || !sec || !sec.geometry) return true;
  const keys = ['shape', 'd', 'b', 'h', 't', 'length', 'bf', 'tf', 'tw', 'span'];
  const g = item.geometry || {};
  const s = sec.geometry;
  for (const k of keys) {
    if (s[k] === undefined) continue;
    const a = typeof s[k] === 'number' ? Number(s[k].toFixed(6)) : s[k];
    const b = typeof g[k] === 'number' ? Number(g[k].toFixed(6)) : g[k];
    if (a !== b) return false;
  }
  return true;
}

/** The single section every member is on, or null if they differ. */
function unifiedSection(group) {
  if (!group || !group.assignment || !group.sections) return null;
  const ids = [...new Set(Object.values(group.assignment))];
  if (ids.length !== 1) return null;
  return group.sections.find((s) => s.id === ids[0]) || null;
}


/* ===== src/codes/ecp203-rc.js ===== */
// codes/ecp203-rc.js — ECP 203 reinforced concrete, ultimate limit state.
//
// WRITTEN FROM THE CODE, NOT CONVERTED FROM A SPREADSHEET.
//
// The office sheets were used only to confirm that the results agree. Their
// formulas were not copied: several were third-party work under copyright, and
// several were written as opaque constants that no checker could verify, for
// example the reinforcement area expressed as
//
//     As = ((fcu/115) - sqrt((fcu/115)^2 - 3.384372e-4 fcu^2 R / fy)) / (1.6921739e-4 fcu^2 / fy)
//
// That is a correct rearrangement of the ECP flexural equations, but it hides
// which clause it came from. Here the same result is produced from the stated
// equilibrium, so every line can be checked against the code.
//
// COEFFICIENTS FLAGGED FOR CONFIRMATION
// Values marked `verify: true` are the numbers this engine cannot derive and
// must read from the published tables. They print on the sheet with a note. Set
// them from the office controlled copy before issuing anything.


const ECP = 'ECP 203-2020';

/**
 * Table data, held separately so it can be corrected in one place.
 * Each entry names the clause it belongs to and whether it needs confirming.
 */
const ECP203_DATA = {
  gammaC: { value: 1.5, clause: '2.4', desc: 'Partial factor for concrete', verify: false },
  gammaS: { value: 1.15, clause: '2.4', desc: 'Partial factor for reinforcement', verify: false },

  // Rectangular stress block: depth a = beta1 * c, intensity alpha1 * fcu/gammaC
  alpha1: { value: 0.67, clause: '4.2', desc: 'Intensity of the equivalent rectangular stress block', verify: true },
  beta1: { value: 0.80, clause: '4.2', desc: 'Ratio of the stress block depth to the neutral axis depth', verify: true },

  // Maximum neutral axis depth, to keep the section under-reinforced
  cMaxOverD: {
    clause: '4.2',
    desc: 'Maximum neutral axis depth ratio (c/d)max',
    byGrade: { 240: 0.50, 280: 0.48, 360: 0.44, 400: 0.42, 450: 0.40, 500: 0.38 },
    verify: true,
  },

  // Shear
  qcuFactor: { value: 0.24, clause: '4.2.2', desc: 'Concrete shear strength coefficient in q_cu = 0.24 sqrt(f_cu/gamma_c)', verify: false },
  qumaxFactor: { value: 0.70, clause: '4.2.2', desc: 'Upper limit coefficient in q_umax = 0.70 sqrt(f_cu/gamma_c)', verify: true },
  qumaxCap: { value: 4.0, clause: '4.2.2', desc: 'Absolute cap on q_umax in N/mm2', verify: true },

  // Minimum reinforcement
  asMinFactor: { value: 0.225, clause: '4-2-1', desc: 'Coefficient in the first term of As,min', verify: false },
  // The office review found the second term to be 1.1/f_y, not a flat 0.15% of
  // the gross section. The two differ most on shallow sections and on high
  // strength steel, which is exactly where a minimum matters.
  asMinSecond: { value: 1.1, clause: '4-2-1', desc: 'Coefficient in the second term of As,min, taken as (1.1/f_y) b d', verify: false },
  asMaxPct: { value: 4.0, clause: '4.2', desc: 'Maximum tension reinforcement as a percentage of b d', verify: true },

  // Deflection control by span to depth
  spanDepth: {
    clause: '4.3',
    desc: 'Span to effective depth limits for beams, for deflection without calculation',
    simple: 16, continuousOne: 18, continuousTwo: 21, cantilever: 8,
    // The office review covered the slab values, not the beam values. These
    // therefore remain unconfirmed and are still flagged.
    verify: true,
  },
};

function dataStep(key, extra = {}) {
  const d = ECP203_DATA[key];
  return step({
    code: ECP, clause: d.clause,
    symbol: extra.symbol || key,
    description: d.desc,
    value: d.value,
    verify: d.verify,
    note: d.verify ? 'Read from a published table. Confirm against the controlled copy before issue.' : null,
    ...extra,
  });
}

function strengths(ctx) {
  const { mat } = ctx;
  return {
    fcd: mat.fcu / ECP203_DATA.gammaC.value,
    fyd: mat.fy / ECP203_DATA.gammaS.value,
  };
}

function cMaxRatio(fy) {
  const table = ECP203_DATA.cMaxOverD.byGrade;
  const grades = Object.keys(table).map(Number).sort((a, b) => a - b);
  const exact = table[fy];
  if (exact) return exact;
  // Between listed grades, take the lower (more restrictive) value rather than
  // interpolating a number the code does not publish.
  const below = grades.filter((g) => g <= fy).pop();
  return below ? table[below] : table[grades[grades.length - 1]];
}

/* ------------------------------------------------------------------ */
/* flexure                                                             */
/* ------------------------------------------------------------------ */

function ecp_flexure(ctx) {
  const { sec, mat, actions } = ctx;
  const { fcd, fyd } = strengths(ctx);
  const a1 = ECP203_DATA.alpha1.value;
  const b1 = ECP203_DATA.beta1.value;
  const b = sec.b;
  const d = sec.d;
  const Mu = Math.abs(Number(actions.Mu) || 0);

  // Equilibrium of the rectangular stress block:
  //   C = alpha1 (fcu/gammaC) b a          T = As fyd
  //   Mu = C (d - a/2)   ->  quadratic in a
  const k = a1 * fcd * b;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const cDepth = aDepth / b1;
  const cOverD = cDepth / d;
  const cMax = cMaxRatio(mat.fy);

  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;

  // The useful comparison is against the largest moment this section can carry
  // while staying under-reinforced. Comparing M_u with the moment produced by
  // its own solved stress block would be circular and would always read 1.000.
  const aMax = b1 * cMax * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const asMinA = (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * b * d;
  const asMinB = (ECP203_DATA.asMinSecond.value / mat.fy) * b * d;
  const asMin = Math.max(asMinA, asMinB);
  const asMax = (ECP203_DATA.asMaxPct.value / 100) * b * d;
  const AsProvided = Math.max(As, asMin);

  const steps = [
    step({
      code: ECP, clause: '2.4', symbol: 'f_cd', description: 'Design compressive strength of concrete',
      expression: 'f_cd = f_cu / γ_c', substitution: `${mat.fcu} / ${ECP203_DATA.gammaC.value}`,
      value: fcd, dimension: 'stress',
    }),
    step({
      code: ECP, clause: '2.4', symbol: 'f_yd', description: 'Design yield strength of reinforcement',
      expression: 'f_yd = f_y / γ_s', substitution: `${mat.fy} / ${ECP203_DATA.gammaS.value}`,
      value: fyd, dimension: 'stress',
    }),
    dataStep('alpha1', { symbol: 'α₁' }),
    dataStep('beta1', { symbol: 'β₁' }),
    step({
      code: ECP, clause: '4.2', symbol: 'a', description: 'Depth of the equivalent rectangular stress block, from moment equilibrium',
      expression: 'M_u = α₁ f_cd b a (d − a/2)  solved for a',
      value: aDepth, dimension: 'length',
      note: Number.isFinite(aDepth) ? null : 'The section cannot carry this moment as singly reinforced. Compression steel or a deeper section is required; doubly reinforced design is not implemented.',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'c/d', description: 'Neutral axis depth ratio',
      expression: 'c = a / β₁',
      value: cOverD,
    }),
    step({
      code: ECP, clause: '4.2', symbol: '(c/d)max', description: `Maximum neutral axis depth ratio for f_y = ${mat.fy}`,
      value: cMax, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'A_s', description: 'Tension reinforcement from force equilibrium',
      expression: 'A_s = α₁ f_cd b a / f_yd',
      value: As, dimension: 'area',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'A_s,min', description: 'Minimum tension reinforcement',
      expression: 'A_s,min = max[ (0.225 √f_cu / f_y) b d , (1.1 / f_y) b d ]',
      substitution: `max(${asMinA.toFixed(0)}, ${asMinB.toFixed(0)})`,
      value: asMin, dimension: 'area',
      note: 'The second term is 1.1/f_y, not a flat percentage of the gross section. Confirmed in the office review of ECP 203-2020.',
    }),
    derived({
      symbol: 'A_s,req', description: 'Reinforcement adopted, being the larger of the calculated and the minimum',
      value: AsProvided, dimension: 'area',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'M_u,max',
      description: 'Largest moment this section can carry while remaining under-reinforced',
      expression: 'M_u,max = α₁ f_cd b a_max (d − a_max/2), a_max = β₁ (c/d)max d',
      value: MuMax, dimension: 'moment', verify: true,
    }),
  ];

  const checks = [
    check({
      id: 'flexure',
      title: 'Flexural reinforcement',
      code: ECP, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu,
      capacity: MuMax,
      dimension: 'moment',
      failureMode: 'The moment exceeds what the section can carry as singly reinforced, so compression steel or a deeper section is required',
      steps,
      note: Number.isFinite(aDepth) ? null : 'No singly reinforced solution exists for this moment. Increase the depth or design as doubly reinforced, which this engine does not do.',
    }),
    check({
      id: 'ductility',
      title: 'Section is under-reinforced',
      code: ECP, clause: '4.2', clauseTitle: 'Limit on the neutral axis depth',
      demand: cOverD, capacity: cMax, dimension: null,
      failureMode: 'Over-reinforced section: the concrete crushes before the steel yields, giving a brittle failure',
      verify: true,
      steps: [],
    }),
    check({
      id: 'asmax',
      title: 'Reinforcement within the maximum',
      code: ECP, clause: '4.2', clauseTitle: 'Maximum tension reinforcement',
      demand: AsProvided, capacity: asMax, dimension: 'area',
      failureMode: 'Congested section; the code limit on tension steel is exceeded',
      verify: true,
      steps: [],
      // The office review was explicit that four per cent is not the only
      // flexural limit, and that the neutral axis depth limit above usually
      // bites first. Passing this check alone does not make a section adequate.
      note: 'Four per cent is not the only flexural limit. The neutral axis depth limit above governs ductility and often governs first; both must be satisfied.',
    }),
  ];

  return { steps, checks, scratch: { fcd, fyd, As, asMin, asMax, AsProvided, aDepth, cOverD, cMax } };
}

/* ------------------------------------------------------------------ */
/* shear                                                               */
/* ------------------------------------------------------------------ */

function ecp_shear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const fyStirrup = Number(ctx.mat.fyStirrup) || mat.fy;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const b = sec.b;
  const d = sec.d;
  const Qu = Math.abs(Number(actions.Qu) || 0);

  const qu = Qu / (b * d);
  const qcu = ECP203_DATA.qcuFactor.value * Math.sqrt(mat.fcu / gC);
  const qumax = Math.min(
    ECP203_DATA.qumaxFactor.value * Math.sqrt(mat.fcu / gC),
    ECP203_DATA.qumaxCap.value,
  );

  let regime;
  let qsu = 0;
  if (qu <= qcu / 2) { regime = 'No shear reinforcement required; minimum stirrups govern.'; qsu = 0; }
  else if (qu <= qcu) { regime = 'Minimum shear reinforcement governs.'; qsu = 0; }
  else { regime = 'Shear reinforcement designed for the excess above half the concrete strength.'; qsu = qu - qcu / 2; }

  // Ast/s for the designed stirrups
  const astOverS = qsu > 0 ? (qsu * b) / (fyStirrup / gS) : 0;

  const steps = [
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_u', description: 'Applied shear stress',
      expression: 'q_u = Q_u / (b d)', value: qu, dimension: 'stress',
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_cu', description: 'Shear stress carried by the concrete',
      expression: 'q_cu = 0.24 √(f_cu / γ_c)',
      substitution: `0.24 × √(${mat.fcu} / ${gC})`,
      value: qcu, dimension: 'stress',
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_umax', description: 'Upper limit on the shear stress, to prevent web crushing',
      expression: 'q_umax = 0.70 √(f_cu / γ_c) ≤ 4.0 N/mm²',
      value: qumax, dimension: 'stress', verify: true,
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_su', description: 'Shear stress to be carried by the stirrups',
      expression: 'q_su = q_u − q_cu / 2 where q_u > q_cu',
      value: qsu, dimension: 'stress', note: regime,
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'A_st / s', description: 'Stirrup area per unit length',
      expression: 'A_st / s = q_su b / (f_yst / γ_s)',
      value: astOverS,
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'shear',
        title: 'Shear stress within the web crushing limit',
        code: ECP, clause: '4.2.2', clauseTitle: 'Shear',
        demand: qu, capacity: qumax, dimension: 'stress',
        failureMode: 'Crushing of the concrete web under diagonal compression. Stirrups cannot help; the section must be enlarged.',
        steps, verify: true,
      }),
    ],
    scratch: { qu, qcu, qumax, qsu, astOverS, shearRegime: regime },
  };
}

/* ------------------------------------------------------------------ */
/* deflection by span to depth                                         */
/* ------------------------------------------------------------------ */

function ecp_deflection(ctx) {
  const { sec, geometry } = ctx;
  const t = ECP203_DATA.spanDepth;
  const condition = geometry.condition || 'simple';
  const limit = t[condition] || t.simple;
  const ratio = geometry.span / sec.d;

  const steps = [
    step({
      code: ECP, clause: '4.3', symbol: 'L/d', description: 'Span to effective depth ratio',
      value: ratio,
    }),
    step({
      code: ECP, clause: '4.3', symbol: '(L/d)max',
      description: `Limit for a ${condition} member, below which deflection need not be calculated`,
      value: limit, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy, including any modification for the reinforcement ratio.',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'deflection',
      title: 'Deflection controlled by span to depth',
      code: ECP, clause: '4.3', clauseTitle: 'Control of deflection',
      demand: ratio, capacity: limit, dimension: null,
      failureMode: 'Excessive deflection. Beyond this ratio the code requires deflection to be calculated rather than deemed to satisfy.',
      steps, verify: true,
      note: 'This is the deemed-to-satisfy route. Exceeding it does not mean the member fails, only that deflection must be calculated explicitly, which this engine does not do.',
    })],
    scratch: { spanDepthRatio: ratio, spanDepthLimit: limit },
  };
}

/* ------------------------------------------------------------------ */
/* torsion — declared, not implemented                                 */
/* ------------------------------------------------------------------ */

function ecp_torsion(ctx) {
  const Tu = Math.abs(Number(ctx.actions.Tu) || 0);
  if (!Tu) {
    return {
      steps: [notice({
        code: ECP, clause: '4.2.3', symbol: 'T_u', description: 'Torsion',
        note: 'No torsional moment is applied, so the torsion provisions do not apply.',
      })],
      checks: [check({
        id: 'torsion', title: 'Torsion', code: ECP, clause: '4.2.3',
        clauseTitle: 'Design for torsion', status: CHECK_STATUS.NOT_APPLICABLE,
      })],
      scratch: {},
    };
  }
  return {
    steps: [notice({
      code: ECP, clause: '4.2.3', symbol: 'T_u', description: 'Torsion',
      note: 'Not calculated. The torsion provisions require the shear flow around the closed section together with combined shear and torsion interaction, which this engine does not implement.',
    })],
    checks: [check({
      id: 'torsion', title: 'Torsion', code: ECP, clause: '4.2.3',
      clauseTitle: 'Design for torsion',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Torsional cracking and failure of the section',
      note: 'A torsional moment is applied. Complete this check by hand against ECP 203 §4.2.3.',
    })],
    scratch: {},
  };
}

const ECP203_RC_HANDLERS = {
  flexure: ecp_flexure,
  shear: ecp_shear,
  deflection: ecp_deflection,
  torsion: ecp_torsion,
};


/* ===== src/codes/ecp203-col.js ===== */
// codes/ecp203-col.js — ECP 203 reinforced concrete columns.
//
// Written from the code. The office had this across four sheets: rectangular
// columns, circular columns, sections under M and N, and biaxial bending. They
// are one member: a column has a slenderness, an axial load, and moments about
// one or both axes, and the answer depends on all of them together.
//
// Values marked verify: true are read from published tables and must be
// confirmed against the office controlled copy.


const ECPC = 'ECP 203-2020';

const ECP203_COL_DATA = {
  // Short column capacity, braced, ultimate limit state
  tiedConcrete: { value: 0.35, clause: '6.4', desc: 'Concrete coefficient for a tied column', verify: false },
  tiedSteel: { value: 0.67, clause: '6.4', desc: 'Steel coefficient for a tied column', verify: false },
  spiralConcrete: { value: 0.40, clause: '6.4', desc: 'Concrete coefficient for a spirally reinforced column, gross section expression', verify: false },
  spiralSteel: { value: 0.76, clause: '6.4', desc: 'Steel coefficient for a spirally reinforced column, gross section expression', verify: false },
  // The office review was explicit that the gross-section expression is not a
  // complete rule on its own: the confinement expression must also be evaluated
  // and the lower of the two governs.
  spiralConfinedConcrete: { value: 0.35, clause: '6.4', desc: 'Concrete coefficient in the confinement expression, on the core area A_k', verify: false },
  spiralConfinedSteel: { value: 0.67, clause: '6.4', desc: 'Steel coefficient in the confinement expression', verify: false },
  spiralHelix: { value: 1.38, clause: '6.4', desc: 'Coefficient on the volumetric contribution of the spiral, 1.38 f_yp V_sp', verify: false },

  // Reinforcement limits
  rhoMin: { value: 0.008, clause: '6.4', desc: 'Minimum longitudinal reinforcement ratio for a tied column', verify: false },
  rhoMinSpiralGross: { value: 0.010, clause: '6.4', desc: 'Minimum longitudinal reinforcement for a spiral column, on the gross area', verify: false },
  rhoMinSpiralCore: { value: 0.012, clause: '6.4', desc: 'Minimum longitudinal reinforcement for a spiral column, on the core area', verify: false },
  rhoMax: { value: 0.040, clause: '6.4', desc: 'Maximum longitudinal reinforcement ratio', verify: true },

  // Slenderness
  slendernessBraced: { value: 15, clause: '6.4', desc: 'Slenderness ratio below which a braced column is short', verify: false },
  slendernessUnbraced: { value: 10, clause: '6.4', desc: 'Slenderness ratio below which an unbraced column is short', verify: false },
  // Corrected by the office review: the upper limit for the simplified method
  // is 23 for an unbraced column, not the 30 that applies to a braced one.
  slendernessMax: { value: 30, clause: '6.4', desc: 'Upper slenderness for the simplified method, braced column', verify: false },
  slendernessMaxUnbraced: { value: 23, clause: '6.4', desc: 'Upper slenderness for the simplified method, unbraced column', verify: false },

  // Biaxial bending: beta against the axial load level R_b
  betaTable: {
    clause: '6.4',
    desc: 'Coefficient β for the magnified moment method, against R_b = N_u / (f_cu b t)',
    rows: [[0.2, 0.80], [0.3, 0.75], [0.4, 0.70], [0.5, 0.65], [1.0, 0.60]],
    verify: true,
  },
};

function colD(key) { return ECP203_COL_DATA[key].value; }

function colDataStep(key, symbol) {
  const e = ECP203_COL_DATA[key];
  return step({
    code: ECPC, clause: e.clause, symbol: symbol || key,
    description: e.desc, value: e.value, verify: e.verify,
    note: e.verify ? 'Read from a published table. Confirm against the controlled copy before issue.' : null,
  });
}

/* ------------------------------------------------------------------ */
/* slenderness                                                         */
/* ------------------------------------------------------------------ */

function ecpc_slenderness(ctx) {
  const { sec, geometry } = ctx;
  const braced = geometry.braced !== false;
  const k = Number(geometry.effectiveLengthFactor) || 1;
  const He = k * (Number(geometry.height) || 0);
  const leastDim = sec.circular ? sec.D : Math.min(sec.b, sec.t);
  const lambda = leastDim > 0 ? He / leastDim : Infinity;
  const shortLimit = braced ? colD('slendernessBraced') : colD('slendernessUnbraced');
  const isShort = lambda <= shortLimit;

  // Additional eccentricity for a slender column
  const delta = isShort ? 0 : (lambda * lambda * leastDim) / 2000;

  const steps = [
    step({
      code: ECPC, clause: '6.4', symbol: 'H_e', description: 'Effective height',
      expression: 'H_e = k H', substitution: `${k} × ${geometry.height}`,
      value: He, dimension: 'length',
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'λ', description: 'Slenderness ratio on the least dimension',
      expression: 'λ = H_e / b_min', value: lambda,
    }),
    colDataStep(braced ? 'slendernessBraced' : 'slendernessUnbraced', 'λ_short'),
    colDataStep(braced ? 'slendernessMax' : 'slendernessMaxUnbraced', 'λ_max'),
    step({
      code: ECPC, clause: '6.4', symbol: 'δ', description: 'Additional eccentricity for a slender column',
      expression: 'δ = λ² b / 2000, taken as zero for a short column',
      value: delta, dimension: 'length', verify: true,
      note: isShort ? 'The column is short, so no additional eccentricity applies.' : null,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'slenderness',
      title: isShort ? 'Column is short' : 'Column is slender',
      code: ECPC, clause: '6.4', clauseTitle: 'Slenderness of columns',
      demand: lambda,
      capacity: braced ? colD('slendernessMax') : colD('slendernessMaxUnbraced'),
      dimension: null,
      failureMode: 'Buckling of a slender column. Beyond the tabulated limit the simplified method may not be used at all.',
      steps,
      note: isShort ? null : `The column is slender (λ = ${lambda.toFixed(1)}). An additional eccentricity of ${delta.toFixed(0)} mm has been applied to the moments.`,
    })],
    scratch: { lambda, He, isShort, delta, leastDim, braced },
  };
}

/* ------------------------------------------------------------------ */
/* axial capacity                                                      */
/* ------------------------------------------------------------------ */

function ecpc_axial(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const spiral = !!ctx.geometry.spiral;
  const kc = spiral ? colD('spiralConcrete') : colD('tiedConcrete');
  const ks = spiral ? colD('spiralSteel') : colD('tiedSteel');

  const Asc = sec.Asc;
  const Ac = sec.gross - Asc;
  const PuGross = kc * mat.fcu * Ac + ks * mat.fy * Asc;
  const Nu = Math.abs(Number(actions.Nu) || 0);

  // For a spiral column the gross-section expression is not the whole rule.
  // The confinement expression uses the core area inside the spiral and adds
  // the spiral's own contribution, and the lower of the two governs.
  const coverToSpiral = Number(ctx.geometry.cover) || 0;
  const Dk = Math.max(0, (sec.circular ? sec.D : Math.min(sec.b, sec.t)) - 2 * coverToSpiral);
  const Ak = sec.circular ? Math.PI / 4 * Dk * Dk : Dk * Dk;
  const fyp = Number(mat.fyp) || mat.fy;
  const Vsp = Number(ctx.geometry.Vsp) || 0;
  const PuConfined = spiral
    ? colD('spiralConfinedConcrete') * mat.fcu * Math.max(0, Ak - Asc)
      + colD('spiralConfinedSteel') * mat.fy * Asc
      + colD('spiralHelix') * fyp * Vsp
    : null;

  const Pu = spiral && PuConfined !== null ? Math.min(PuGross, PuConfined) : PuGross;

  const rho = sec.gross > 0 ? Asc / sec.gross : 0;
  const ascMin = spiral
    ? Math.max(colD('rhoMinSpiralGross') * sec.gross, colD('rhoMinSpiralCore') * Ak)
    : colD('rhoMin') * sec.gross;
  const ascMax = colD('rhoMax') * sec.gross;

  const steps = [
    colDataStep(spiral ? 'spiralConcrete' : 'tiedConcrete', spiral ? '0.40' : '0.35'),
    colDataStep(spiral ? 'spiralSteel' : 'tiedSteel', spiral ? '0.76' : '0.67'),
    step({
      code: ECPC, clause: '6.4', symbol: 'A_c', description: 'Net concrete area',
      expression: 'A_c = A_g − A_sc', value: Ac, dimension: 'area',
    }),
    step({
      code: ECPC, clause: '6.4', symbol: spiral ? 'P_u,gross' : 'P_u',
      description: `Ultimate axial capacity of a ${spiral ? 'spirally reinforced column, gross section expression' : 'tied column'}`,
      expression: spiral ? 'P_u = 0.40 f_cu (A_c − A_sc) + 0.76 f_y A_sc' : 'P_u = 0.35 f_cu (A_c − A_sc) + 0.67 f_y A_sc',
      substitution: `${kc} × ${mat.fcu} × ${Ac.toFixed(0)} + ${ks} × ${mat.fy} × ${Asc.toFixed(0)}`,
      value: PuGross, dimension: 'force',
    }),
    ...(spiral ? [
      step({
        code: ECPC, clause: '6.4', symbol: 'A_k', description: 'Area of the concrete core inside the spiral',
        value: Ak, dimension: 'area',
      }),
      step({
        code: ECPC, clause: '6.4', symbol: 'P_u,confined',
        description: 'Ultimate axial capacity from the confinement expression',
        expression: 'P_u = 0.35 f_cu (A_k − A_sc) + 0.67 f_y A_sc + 1.38 f_yp V_sp',
        value: PuConfined, dimension: 'force',
        note: Vsp > 0 ? null : 'The volume of spiral per unit length V_sp has not been entered, so the spiral contributes nothing to this expression. Enter it, or the confined capacity is understated.',
      }),
      derived({
        symbol: 'P_u', description: 'Governing capacity, the lower of the two expressions',
        value: Pu, dimension: 'force',
      }),
    ] : []),
    step({
      code: ECPC, clause: '6.4', symbol: 'μ', description: 'Longitudinal reinforcement ratio',
      value: rho,
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'axial', title: 'Axial capacity',
        code: ECPC, clause: '6.4', clauseTitle: 'Design of columns subject to axial load',
        demand: Nu, capacity: Pu, dimension: 'force',
        failureMode: 'Crushing of the column under axial compression',
        steps,
        note: spiral ? 'Both the gross-section and the confinement expressions have been evaluated and the lower governs.' : null,
      }),
      check({
        id: 'rhoMin',
        title: spiral ? 'Minimum longitudinal reinforcement, spiral column' : 'Minimum longitudinal reinforcement',
        code: ECPC, clause: '6.4', clauseTitle: 'Reinforcement limits for columns',
        demand: ascMin, capacity: Asc, dimension: 'area',
        failureMode: 'Insufficient longitudinal steel for a column',
        steps: [],
        note: spiral
          ? 'A spiral column takes the greater of one per cent of the gross area and 1.2 per cent of the core, not the 0.8 per cent that applies to a tied column.'
          : null,
      }),
      check({
        id: 'rhoMax', title: 'Maximum longitudinal reinforcement',
        code: ECPC, clause: '6.4', clauseTitle: 'Reinforcement limits for columns',
        demand: Asc, capacity: ascMax, dimension: 'area',
        failureMode: 'Congested section; the code limit on longitudinal steel is exceeded',
        verify: true, steps: [],
      }),
    ],
    scratch: { Pu, PuGross, PuConfined, Ak, Ac, Asc, rho, ascMin, ascMax, spiral },
  };
}

/* ------------------------------------------------------------------ */
/* biaxial bending, magnified moment method                            */
/* ------------------------------------------------------------------ */

function betaFor(Rb) {
  for (const [limit, beta] of ECP203_COL_DATA.betaTable.rows) {
    if (Rb <= limit) return beta;
  }
  return ECP203_COL_DATA.betaTable.rows[ECP203_COL_DATA.betaTable.rows.length - 1][1];
}

function ecpc_biaxial(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const Nu = Math.abs(Number(actions.Nu) || 0);
  const Mx = Math.abs(Number(actions.Mx) || 0) + Nu * (sc.delta || 0);
  const My = Math.abs(Number(actions.My) || 0) + Nu * (sc.delta || 0);

  if (!(Mx > 0 && My > 0)) {
    return {
      steps: [notice({
        code: ECPC, clause: '6.4', symbol: 'M_D',
        description: 'Combined axial load and biaxial bending',
        note: 'Moments are applied about one axis at most, so the magnified moment method does not apply.',
      })],
      checks: [check({
        id: 'biaxial', title: 'Combined axial load and biaxial bending',
        code: ECPC, clause: '6.4', clauseTitle: 'Sections subject to axial load and biaxial bending',
        status: CHECK_STATUS.NOT_APPLICABLE,
      })],
      scratch: {},
    };
  }

  if (sec.circular) {
    return {
      steps: [notice({
        code: ECPC, clause: '6.4', symbol: 'M_D',
        description: 'Biaxial bending of a circular column',
        note: 'A circular section has no distinct axes, so the two moments are combined as a resultant rather than by the magnified moment method.',
      })],
      checks: [check({
        id: 'biaxial', title: 'Combined axial load and biaxial bending',
        code: ECPC, clause: '6.4', clauseTitle: 'Sections subject to axial load and biaxial bending',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Combined axial load and bending about a resultant axis',
        note: 'Not implemented for circular sections. Combine the moments as a resultant and design for uniaxial bending, or complete this by hand.',
      })],
      scratch: {},
    };
  }

  // Reduced dimensions to the centroid of the outer bars
  const cover = sec.cover + sec.tieDia + sec.barDia / 2;
  const aPrime = sec.b - 2 * cover;
  const bPrime = sec.t - 2 * cover;

  const Rb = (mat.fcu * sec.b * sec.t) > 0 ? Nu / (mat.fcu * sec.b * sec.t) : Infinity;
  const beta = betaFor(Rb);

  // The larger relative moment governs which axis is magnified
  const ratioX = Mx / bPrime;
  const ratioY = My / aPrime;
  const magnifyAboutX = ratioX >= ratioY;
  const MD = magnifyAboutX
    ? Mx + beta * (bPrime / aPrime) * My
    : My + beta * (aPrime / bPrime) * Mx;

  const steps = [
    step({
      code: ECPC, clause: '6.4', symbol: 'R_b', description: 'Axial load level',
      expression: 'R_b = N_u / (f_cu b t)',
      substitution: `${(Nu / 1e3).toFixed(1)} kN / (${mat.fcu} × ${sec.b} × ${sec.t})`,
      value: Rb,
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'β', description: 'Coefficient for the magnified moment method, from R_b',
      value: beta, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'M_D', description: 'Design moment about the governing axis',
      expression: magnifyAboutX
        ? 'M_D = M_x + β (b′/a′) M_y'
        : 'M_D = M_y + β (a′/b′) M_x',
      value: MD, dimension: 'moment', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'biaxial',
      title: `Combined axial load and biaxial bending, magnified about the ${magnifyAboutX ? 'x' : 'y'}-axis`,
      code: ECPC, clause: '6.4', clauseTitle: 'Sections subject to axial load and biaxial bending',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined axial load and bending about both axes',
      steps, verify: true,
      note: `The design moment M_D = ${(MD / 1e6).toFixed(1)} kN·m has been established, but the interaction diagram that would verify the section against N_u and M_D together is not implemented. Read M_D and N_u against the published design chart, or complete this by hand.`,
    })],
    scratch: { Rb, beta, MD, magnifyAboutX, aPrime, bPrime, MxTotal: Mx, MyTotal: My },
  };
}

const ECP203_COL_HANDLERS = {
  slenderness: ecpc_slenderness,
  axial: ecpc_axial,
  biaxial: ecpc_biaxial,
};


/* ===== src/codes/ecp203-fdn.js ===== */
// codes/ecp203-fdn.js — ECP 203 isolated footings.
//
// The office had this as one sheet duplicated sixteen times, F(1) to F(16), one
// tab per footing. A register of items replaces that: the same engine, sixteen
// records, and a change to the method reaches all of them at once.
//
// Values marked verify: true are read from published tables.


const ECPF = 'ECP 203-2020';

const ECP203_FDN_DATA = {
  // The office review found this to be office practice rather than a value the
  // code prescribes, so it is declared as an assumption and not as a clause.
  ownWeight: { value: 1.10, clause: null, practice: true, desc: 'Allowance for the footing self weight and overburden, as a factor on the column working load', verify: false },
  qcuSlab: { value: 0.16, clause: '4-2-2', desc: 'One-way shear strength without designed stirrups, q_cu = 0.16 sqrt(f_cu/gamma_c)', verify: false },
  // Punching is governed by the least of three expressions, not by the first
  // one alone. The earlier version used only the basic value, which overstates
  // the resistance on an elongated column and on one near an edge.
  qcupBase: { value: 0.316, clause: '4-2-4', desc: 'Basic punching value, 0.316 sqrt(f_cu/gamma_c)', verify: false },
  qcupAspect: { value: 0.316, clause: '4-2-4', desc: 'Aspect-ratio expression, 0.316 (0.5 + a/b) sqrt(f_cu/gamma_c)', verify: false },
  qcupPerimeter: { value: 0.8, clause: '4-2-4', desc: 'Perimeter expression, 0.8 (α d/b_0 + 0.2) sqrt(f_cu/gamma_c)', verify: false },
  qcupCap: { value: 1.70, clause: '4-2-4', desc: 'Absolute cap on punching resistance without shear reinforcement, N/mm2', verify: false },
  alphaInterior: { value: 4.0, clause: '4-2-4', desc: 'α for an interior column in the perimeter expression', verify: true },
  tensionShift: { value: 0, clause: '4.2', desc: 'Critical section for bending taken at the column face', verify: false },
};

function fD(k) { return ECP203_FDN_DATA[k].value; }

function fDataStep(k, symbol) {
  const e = ECP203_FDN_DATA[k];
  return step({
    code: ECPF, clause: e.clause, symbol: symbol || k,
    description: e.desc, value: e.value, verify: e.verify,
    note: e.verify ? 'Read from a published table. Confirm against the controlled copy before issue.' : null,
  });
}

/* ---------------- bearing pressure ---------------- */

function ecpf_bearing(ctx) {
  const { sec, actions, soil } = ctx;
  const Nw = Math.abs(Number(actions.Nw) || 0);
  const Mw = Math.abs(Number(actions.Mw) || 0);
  const factor = fD('ownWeight');
  const Ntotal = Nw * factor;

  const A = sec.L * sec.B;
  const Z = (sec.B * sec.L * sec.L) / 6;
  const ecc = Ntotal > 0 ? Mw / Ntotal : 0;
  const kern = sec.L / 6;

  const fMax = A > 0 ? (Ntotal / A) + (Z > 0 ? Mw / Z : 0) : Infinity;
  const fMin = A > 0 ? (Ntotal / A) - (Z > 0 ? Mw / Z : 0) : -Infinity;

  const steps = [
    input({
      symbol: 'k_ow', value: ECP203_FDN_DATA.ownWeight.value,
      description: 'Allowance for the footing self weight and overburden',
      note: 'Office practice, not a coefficient ECP 203 prescribes. Confirmed as such in the office review, and printed here as a stated assumption rather than as a code value.',
    }),
    derived({
      symbol: 'N_total', description: 'Working load including the allowance for the footing weight',
      expression: 'N_total = k_ow N_w', value: Ntotal, dimension: 'force',
    }),
    step({
      code: ECPF, clause: '7.1', symbol: 'e', description: 'Eccentricity of the resultant',
      expression: 'e = M_w / N_total', value: ecc, dimension: 'length',
      note: ecc > kern ? `The resultant falls outside the middle third (L/6 = ${kern.toFixed(0)} mm), so part of the base lifts and the linear pressure distribution below does not apply.` : null,
    }),
    step({
      code: ECPF, clause: '7.1', symbol: 'f_max', description: 'Maximum bearing pressure under the footing',
      expression: 'f = N_total/A + M_w/Z', value: fMax, dimension: 'stress',
    }),
    step({
      code: ECPF, clause: '7.1', symbol: 'f_min', description: 'Minimum bearing pressure under the footing',
      expression: 'f = N_total/A − M_w/Z', value: fMin, dimension: 'stress',
    }),
  ];

  const checks = [
    check({
      id: 'bearing', title: 'Bearing pressure on the soil',
      code: ECPF, clause: '7.1', clauseTitle: 'Bearing pressure under isolated footings',
      demand: fMax, capacity: soil.qall, dimension: 'stress',
      failureMode: 'Bearing failure of the soil beneath the footing',
      steps, verify: true,
    }),
    check({
      id: 'uplift', title: 'Resultant within the middle third',
      code: ECPF, clause: '7.1', clauseTitle: 'Eccentric loading of footings',
      demand: ecc, capacity: kern, dimension: 'length',
      failureMode: 'Part of the base lifts off the soil, so the assumed linear pressure distribution is invalid',
      steps: [],
      note: ecc > kern ? 'The pressures above were computed on a linear distribution that no longer applies. Redesign the footing so the resultant stays within the middle third, or analyse the partial bearing case by hand.' : null,
    }),
  ];

  return { steps, checks, scratch: { Ntotal, A, fMax, fMin, ecc, kern } };
}

/* ---------------- punching shear ---------------- */

function ecpf_punching(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const d = sec.d;
  const Nu = Math.abs(Number(actions.Nu) || 0);

  const a = sec.colB + d;
  const b = sec.colL + d;
  const b0 = 2 * (a + b);
  const punchedArea = a * b;
  const qup = sec.L * sec.B > 0
    ? (Nu * (1 - punchedArea / (sec.L * sec.B))) / (b0 * d)
    : Infinity;

  const root = Math.sqrt(mat.fcu / gC);
  const longSide = Math.max(sec.colL, sec.colB);
  const shortSide = Math.min(sec.colL, sec.colB);
  const ratio = longSide > 0 ? shortSide / longSide : 1;
  const alpha = fD('alphaInterior');

  // The least of the three expressions governs, capped in absolute terms.
  const qBasic = fD('qcupBase') * root;
  const qAspect = fD('qcupAspect') * (0.5 + ratio) * root;
  const qPerim = fD('qcupPerimeter') * ((alpha * d) / b0 + 0.2) * root;
  const candidates = [
    { name: 'basic value', q: qBasic, expression: 'q_cup = 0.316 √(f_cu/γ_c)' },
    { name: 'column aspect ratio', q: qAspect, expression: 'q_cup = 0.316 (0.5 + a/b) √(f_cu/γ_c)' },
    { name: 'critical perimeter', q: qPerim, expression: 'q_cup = 0.80 (α d/b₀ + 0.2) √(f_cu/γ_c)' },
  ];
  const governing = candidates.reduce((x, y) => (y.q < x.q ? y : x));
  const cap = fD('qcupCap');
  const qcup = Math.min(governing.q, cap);
  const cappedByAbsolute = governing.q > cap;

  const steps = [
    step({
      code: ECPF, clause: '4-2-4', symbol: 'b_0', description: 'Critical punching perimeter, taken at d/2 from the column face',
      expression: 'b₀ = 2[(c₁ + d) + (c₂ + d)]',
      substitution: `2[(${sec.colB} + ${d.toFixed(0)}) + (${sec.colL} + ${d.toFixed(0)})]`,
      value: b0, dimension: 'length',
    }),
    step({
      code: ECPF, clause: '4-2-4', symbol: 'q_up', description: 'Applied punching shear stress',
      expression: 'q_up = N_u (1 − A_punched / A_footing) / (b₀ d)',
      value: qup, dimension: 'stress',
    }),
    ...candidates.map((c) => step({
      code: ECPF, clause: '4-2-4', symbol: 'q_cup',
      description: `Punching resistance from the ${c.name}`,
      expression: c.expression,
      value: c.q, dimension: 'stress',
    })),
    step({
      code: ECPF, clause: '4-2-4', symbol: 'q_cup,max',
      description: 'Absolute cap on the punching resistance without shear reinforcement',
      value: cap, dimension: 'stress',
    }),
    derived({
      symbol: 'q_cup,gov',
      description: `Governing punching resistance, from the ${governing.name}${cappedByAbsolute ? ', reduced to the absolute cap' : ''}`,
      value: qcup, dimension: 'stress',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'punching', title: `Punching shear, governed by the ${governing.name}`,
      code: ECPF, clause: '4-2-4', clauseTitle: 'Punching shear',
      demand: qup, capacity: qcup, dimension: 'stress',
      failureMode: 'The column punches through the footing on a cone around its perimeter',
      steps,
      note: 'Three expressions are evaluated and the least governs; α is taken for an interior column. Only the concentric case is calculated: where a moment is transferred to the footing, the unbalanced moment must be added to the punching stress, which this engine does not do.',
    })],
    scratch: { b0, qup, qcup, punchingGoverning: governing.name },
  };
}

/* ---------------- one-way shear ---------------- */

function ecpf_oneWayShear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const d = sec.d;
  const Nu = Math.abs(Number(actions.Nu) || 0);
  const qnet = (sec.L * sec.B) > 0 ? Nu / (sec.L * sec.B) : 0;

  // Critical section at d from the column face
  const cantilever = Math.max(0, (sec.L - sec.colL) / 2 - d);
  const Vu = qnet * cantilever * sec.B;
  const qu = (sec.B * d) > 0 ? Vu / (sec.B * d) : Infinity;
  const qcu = fD('qcuSlab') * Math.sqrt(mat.fcu / gC);

  const steps = [
    step({
      code: ECPF, clause: '4.2.2', symbol: 'q_net', description: 'Net upward pressure from the ultimate load',
      expression: 'q_net = N_u / (L B)', value: qnet, dimension: 'stress',
    }),
    step({
      code: ECPF, clause: '4.2.2', symbol: 'x', description: 'Distance from the critical section to the edge, taken at d from the column face',
      value: cantilever, dimension: 'length',
    }),
    step({
      code: ECPF, clause: '4.2.2', symbol: 'q_u', description: 'Applied one-way shear stress',
      expression: 'q_u = q_net x B / (B d)', value: qu, dimension: 'stress',
    }),
    fDataStep('qcuSlab', 'q_cu coefficient'),
    step({
      code: ECPF, clause: '4.2.2', symbol: 'q_cu', description: 'One-way shear strength of a slab without stirrups',
      expression: 'q_cu = 0.16 √(f_cu / γ_c)', value: qcu, dimension: 'stress',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'oneWayShear', title: 'One-way shear across the footing',
      code: ECPF, clause: '4.2.2', clauseTitle: 'Shear in slabs and footings',
      demand: qu, capacity: qcu, dimension: 'stress',
      failureMode: 'Diagonal shear failure across the full width of the footing',
      steps, verify: true,
    })],
    scratch: { qnet, qu, qcu, cantilever },
  };
}

/* ---------------- bending ---------------- */

function ecpf_bending(ctx, sc) {
  const { sec, mat } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;
  const a1 = ECP203_DATA.alpha1.value;

  const qnet = sc.qnet || 0;
  const d = sec.d;
  const arm = Math.max(0, (sec.L - sec.colL) / 2);
  // Moment per metre width at the column face
  const Mu = qnet * arm * arm / 2 * 1000;

  const k = a1 * fcd * 1000;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = Math.max(
    (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * 1000 * d,
    (ECP203_DATA.asMinSecond.value / mat.fy) * 1000 * d,
  );
  const AsProvided = Math.max(As, asMin);

  const steps = [
    step({
      code: ECPF, clause: '4.2', symbol: 'x_c', description: 'Cantilever from the column face to the footing edge',
      value: arm, dimension: 'length',
    }),
    step({
      code: ECPF, clause: '4.2', symbol: 'M_u', description: 'Ultimate moment per metre width at the column face',
      expression: 'M_u = q_net x_c² / 2 per metre', value: Mu, dimension: 'moment',
    }),
    step({
      code: ECPF, clause: '4.2', symbol: 'A_s', description: 'Flexural reinforcement per metre width',
      expression: 'A_s = α₁ f_cd b a / f_yd with b = 1000 mm',
      value: As, dimension: 'area',
    }),
    step({
      code: ECPF, clause: '4.2', symbol: 'A_s,min', description: 'Minimum reinforcement per metre width',
      value: asMin, dimension: 'area', verify: true,
    }),
    derived({
      symbol: 'A_s,req', description: 'Reinforcement adopted per metre width',
      value: AsProvided, dimension: 'area',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'footingFlexure', title: 'Flexural reinforcement of the footing',
      code: ECPF, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      status: Number.isFinite(As) ? CHECK_STATUS.PASS : CHECK_STATUS.FAIL,
      utilisation: Number.isFinite(As) ? As / AsProvided : Infinity,
      failureMode: 'Flexural failure of the footing cantilever at the column face',
      steps,
      note: Number.isFinite(As) ? null : 'No singly reinforced solution exists at this depth. Increase the footing thickness.',
    })],
    scratch: { footingMu: Mu, footingAs: AsProvided },
  };
}

const ECP203_FDN_HANDLERS = {
  bearing: ecpf_bearing,
  punching: ecpf_punching,
  oneWayShear: ecpf_oneWayShear,
  bending: ecpf_bending,
};


/* ===== src/codes/ecp203-slab.js ===== */
// codes/ecp203-slab.js — ECP 203 solid slabs.
//
// One-way slabs are calculated. Two-way slabs are declared and refused: the
// moment coefficients depend on a published table of alpha values against the
// aspect ratio and the edge conditions, and that table is not reproduced here.
// The office sheet carried a line reading 0.5*(L/B) - 0.15 with no source; a
// coefficient that cannot be traced to a clause is not something to build on.


const ECPS = 'ECP 203-2020';

const ECP203_SLAB_DATA = {
  // The office review found separate values for one-way and two-way slabs and
  // was explicit that they must not be merged. The earlier single set applied
  // the one-way values to both, which is unconservative on a two-way slab.
  thicknessOneWay: {
    clause: '6.1',
    desc: 'Span to thickness limits for a one-way solid slab',
    simple: 30, continuousOne: 35, continuousTwo: 40, cantilever: 10,
    verify: false,
  },
  thicknessTwoWay: {
    clause: '6.1',
    desc: 'Span to thickness limits for a two-way solid slab',
    simple: 35, continuousOne: 40, continuousTwo: 45, cantilever: 10,
    verify: false,
  },
  qcuSlab: { value: 0.16, clause: '4.2.2', desc: 'Shear strength of a slab without stirrups, q_cu = 0.16 sqrt(f_cu/gamma_c)', verify: true },
  asMinPct: { value: 0.15, clause: '6.1', desc: 'Minimum main reinforcement as a percentage of the gross section', verify: true },
  secondaryPct: { value: 20, clause: '6.1', desc: 'Secondary reinforcement as a percentage of the main steel', verify: true },
  momentCoeff: {
    clause: '6.1',
    desc: 'Bending moment coefficient w L^2 / k',
    simple: 8, continuousOne: 10, continuousTwo: 12, cantilever: 2,
    verify: true,
  },
};

function sD(k) { return ECP203_SLAB_DATA[k]; }

/* ---------------- thickness and span ---------------- */

function ecps_thickness(ctx, sc) {
  const { sec, geometry } = ctx;
  // Direction runs first, so by the time this does the slab knows which it is.
  const twoWay = sc && sc.oneWay === false;
  const table = sD(twoWay ? 'thicknessTwoWay' : 'thicknessOneWay');
  const condition = geometry.condition || 'simple';
  const k = table[condition] || table.simple;
  const tMin = geometry.span / k;

  const steps = [
    step({
      code: ECPS, clause: '6.1', symbol: 'L/k',
      description: `Minimum thickness for a ${condition} ${twoWay ? 'two-way' : 'one-way'} slab, deemed to satisfy deflection`,
      expression: `t ≥ L / ${k}`,
      substitution: `${geometry.span} / ${k}`,
      value: tMin, dimension: 'length',
      note: `Confirmed in the office review of ECP 203-2020. The one-way and two-way values differ and are not interchangeable; this slab is ${twoWay ? 'two-way' : 'one-way'}.`,
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'd', description: 'Effective depth',
      expression: 'd = t − cover − φ/2', value: sec.d, dimension: 'length',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'thickness', title: 'Slab thickness for deflection',
      code: ECPS, clause: '6.1', clauseTitle: 'Solid slabs — thickness',
      demand: tMin, capacity: sec.t, dimension: 'length',
      failureMode: 'Excessive deflection. Below this thickness the code requires deflection to be calculated explicitly.',
      steps,
      note: 'This is the deemed-to-satisfy route. A thinner slab is not necessarily inadequate, but its deflection must then be calculated, which this engine does not do.',
    })],
    scratch: { tMin, spanCondition: condition },
  };
}

/* ---------------- one-way or two-way ---------------- */

function ecps_direction(ctx) {
  const { geometry } = ctx;
  const long = Math.max(geometry.span, geometry.spanShort || geometry.span);
  const short = Math.min(geometry.span, geometry.spanShort || geometry.span);
  const ratio = short > 0 ? long / short : Infinity;
  const oneWay = ratio > 2 || !geometry.spanShort;

  const steps = [
    step({
      code: ECPS, clause: '6.1', symbol: 'r', description: 'Ratio of the long span to the short span',
      expression: 'r = L_long / L_short', value: ratio,
      note: oneWay
        ? 'The slab spans one way: the load is carried on the short span.'
        : 'The slab spans two ways.',
    }),
  ];

  if (oneWay) return { steps, checks: [], scratch: { oneWay: true, ratio } };

  return {
    steps: [...steps, notice({
      code: ECPS, clause: '6.1', symbol: 'α',
      description: 'Two-way slab moment coefficients',
      note: 'Not calculated. The moments in a two-way slab come from a table of coefficients against the aspect ratio and the edge conditions. That table is not reproduced in this build, and a coefficient without a clause behind it is not used.',
    })],
    checks: [check({
      id: 'twoWay', title: 'Two-way slab action',
      code: ECPS, clause: '6.1', clauseTitle: 'Solid slabs — two-way action',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Bending in both directions',
      note: `The slab spans two ways (r = ${ratio.toFixed(2)} ≤ 2). Take the moment coefficients from ECP 203 §6.1 and enter the resulting moment directly, or design this slab by hand.`,
    })],
    scratch: { oneWay: false, ratio },
  };
}

/* ---------------- bending ---------------- */

function ecps_bending(ctx, sc) {
  const { sec, mat, geometry, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;
  const a1 = ECP203_DATA.alpha1.value;

  const coeffTable = sD('momentCoeff');
  const kM = coeffTable[sc.spanCondition] || coeffTable.simple;
  const wu = Number(actions.wu) || 0;           // kN/m2 stored in base as N/mm2
  const span = geometry.span;

  // Per metre width: w in N/mm2 times 1000 mm gives N/mm
  const wLine = wu * 1000;
  const Mu = Number(actions.Mu) > 0 ? Number(actions.Mu) : (wLine * span * span) / kM;

  const b = 1000;
  const k = a1 * fcd * b;
  const d = sec.d;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = (sD('asMinPct').value / 100) * b * sec.t;
  const AsProvided = Math.max(As, asMin);
  const secondary = (sD('secondaryPct').value / 100) * AsProvided;

  const aMax = ECP203_DATA.beta1.value * 0.44 * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const steps = [
    step({
      code: ECPS, clause: '6.1', symbol: 'k_M', description: `Moment coefficient for a ${sc.spanCondition} span`,
      expression: `M_u = w_u L² / ${kM}`, value: kM, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'M_u', description: 'Ultimate moment per metre width',
      value: Mu, dimension: 'moment',
      note: Number(actions.Mu) > 0 ? 'Taken from the moment entered directly rather than from the coefficient.' : null,
    }),
    step({
      code: ECPS, clause: '4.2', symbol: 'A_s', description: 'Main reinforcement per metre width',
      expression: 'A_s = α₁ f_cd b a / f_yd with b = 1000 mm',
      value: As, dimension: 'area',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'A_s,min', description: 'Minimum main reinforcement per metre width',
      expression: 'A_s,min = 0.15% b t', value: asMin, dimension: 'area', verify: true,
    }),
    derived({
      symbol: 'A_s,req', description: 'Main reinforcement adopted per metre width',
      value: AsProvided, dimension: 'area',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'A_s,sec', description: 'Secondary reinforcement per metre width',
      expression: '20% of the main steel', value: secondary, dimension: 'area', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'slabFlexure', title: 'Flexural reinforcement of the slab',
      code: ECPS, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu, capacity: MuMax, dimension: 'moment',
      failureMode: 'Flexural failure of the slab, or a section too shallow to remain under-reinforced',
      steps, verify: true,
    })],
    scratch: { slabMu: Mu, slabAs: AsProvided, slabSecondary: secondary, wLine },
  };
}

/* ---------------- shear ---------------- */

function ecps_shear(ctx, sc) {
  const { sec, mat, geometry } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const wLine = sc.wLine || 0;
  const Vu = (wLine * geometry.span) / 2;
  const qu = (1000 * sec.d) > 0 ? Vu / (1000 * sec.d) : Infinity;
  const qcu = sD('qcuSlab').value * Math.sqrt(mat.fcu / gC);

  const steps = [
    step({
      code: ECPS, clause: '4.2.2', symbol: 'V_u', description: 'Ultimate shear per metre width at the support',
      expression: 'V_u = w_u L / 2', value: Vu, dimension: 'force',
    }),
    step({
      code: ECPS, clause: '4.2.2', symbol: 'q_u', description: 'Applied shear stress',
      expression: 'q_u = V_u / (b d) with b = 1000 mm', value: qu, dimension: 'stress',
    }),
    step({
      code: ECPS, clause: '4.2.2', symbol: 'q_cu', description: 'Shear strength of a slab without stirrups',
      expression: 'q_cu = 0.16 √(f_cu / γ_c)', value: qcu, dimension: 'stress', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'slabShear', title: 'Shear in the slab',
      code: ECPS, clause: '4.2.2', clauseTitle: 'Shear in slabs',
      demand: qu, capacity: qcu, dimension: 'stress',
      failureMode: 'Diagonal shear failure. A solid slab is not normally given stirrups, so the section must carry the shear alone.',
      steps, verify: true,
    })],
    scratch: { slabVu: Vu, slabQu: qu },
  };
}

const ECP203_SLAB_HANDLERS = {
  thickness: ecps_thickness,
  direction: ecps_direction,
  bending: ecps_bending,
  shear: ecps_shear,
};


/* ===== src/codes/ecp203-comb.js ===== */
// codes/ecp203-comb.js — ECP 203 combined footing under two columns.
//
// A combined footing is a beam spanning between two columns, carried on soil.
// The office sheet treated the pressure and the bending separately; they are
// the same problem, because where the resultant falls decides the pressure
// diagram, which decides every moment that follows.


const ECPB = 'ECP 203-2020';

/* ---------------- geometry of the resultant ---------------- */

function ecpb_resultant(ctx) {
  const { sec, actions } = ctx;
  const N1 = Math.abs(Number(actions.N1w) || 0);
  const N2 = Math.abs(Number(actions.N2w) || 0);
  const S = sec.spacing;
  const factor = ECP203_FDN_DATA.ownWeight.value;
  const Ntotal = (N1 + N2) * factor;

  // Distance of the resultant from the first column
  const xbar = (N1 + N2) > 0 ? (N2 * S) / (N1 + N2) : 0;
  // Distance of the resultant from the left edge
  const fromEdge = sec.leftProjection + xbar;
  const centre = sec.L / 2;
  const ecc = Math.abs(fromEdge - centre);
  const kern = sec.L / 6;

  const A = sec.L * sec.B;
  const Z = (sec.B * sec.L * sec.L) / 6;
  const M = Ntotal * (fromEdge - centre);
  const fMax = A > 0 ? Ntotal / A + Math.abs(M) / Z : Infinity;
  const fMin = A > 0 ? Ntotal / A - Math.abs(M) / Z : -Infinity;

  // Length that would place the resultant at mid-length
  const idealL = 2 * fromEdge;

  const steps = [
    derived({
      symbol: 'N_total', description: 'Working load of both columns including the self-weight allowance',
      expression: 'N_total = (N₁ + N₂) k_ow', value: Ntotal, dimension: 'force',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'x̄', description: 'Distance of the resultant from the first column',
      expression: 'x̄ = N₂ S / (N₁ + N₂)',
      substitution: `${(N2 / 1e3).toFixed(0)} × ${S} / ${((N1 + N2) / 1e3).toFixed(0)}`,
      value: xbar, dimension: 'length',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'e', description: 'Eccentricity of the resultant from the centre of the footing',
      value: ecc, dimension: 'length',
      note: ecc < 1 ? 'The resultant falls at the centre, so the pressure is uniform.' : null,
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'L_ideal', description: 'Footing length that would place the resultant at mid-length and give uniform pressure',
      expression: 'L = 2 × (distance of the resultant from the left edge)',
      value: idealL, dimension: 'length',
    }),
    step({
      code: ECPB, clause: '7.1', symbol: 'f_max', description: 'Maximum bearing pressure',
      value: fMax, dimension: 'stress',
    }),
    step({
      code: ECPB, clause: '7.1', symbol: 'f_min', description: 'Minimum bearing pressure',
      value: fMin, dimension: 'stress',
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'bearing', title: 'Bearing pressure on the soil',
        code: ECPB, clause: '7.1', clauseTitle: 'Bearing pressure under footings',
        demand: fMax, capacity: ctx.soil.qall, dimension: 'stress',
        failureMode: 'Bearing failure of the soil beneath the footing',
        steps, verify: true,
      }),
      check({
        id: 'uplift', title: 'Resultant within the middle third',
        code: ECPB, clause: '7.2', clauseTitle: 'Combined footings',
        demand: ecc, capacity: kern, dimension: 'length',
        failureMode: 'Part of the base lifts off the soil, so the linear pressure diagram is invalid',
        steps: [],
        note: ecc > kern
          ? `Lengthen the footing to about ${idealL.toFixed(0)} mm, or move it, so the resultant returns to the middle third.`
          : null,
      }),
    ],
    scratch: { Ntotal, xbar, ecc, fromEdge, idealL, fMax, fMin, N1, N2, S },
  };
}

/* ---------------- longitudinal bending ---------------- */

function ecpb_longitudinal(ctx, sc) {
  const { sec, actions } = ctx;
  const Nu1 = Math.abs(Number(actions.N1u) || 0);
  const Nu2 = Math.abs(Number(actions.N2u) || 0);
  const L = sec.L;
  const w = L > 0 ? (Nu1 + Nu2) / L : 0;   // upward line load, N/mm

  const a = sec.leftProjection;
  const b = L - sec.leftProjection - sc.S;

  // Cantilever moments at the column faces, and the hogging moment between them
  const Mleft = w * a * a / 2;
  const Mright = w * b * b / 2;
  // Shear is zero where the upward load has balanced the first column load
  const x0 = w > 0 ? Nu1 / w : 0;
  const Mspan = x0 > a
    ? Math.abs(w * x0 * x0 / 2 - Nu1 * (x0 - a))
    : 0;
  const Mmax = Math.max(Mleft, Mright, Mspan);

  const steps = [
    step({
      code: ECPB, clause: '7.2', symbol: 'w', description: 'Upward line load from the ultimate column loads',
      expression: 'w = (N_u1 + N_u2) / L', value: w,
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'M_left', description: 'Cantilever moment at the outer face of the first column',
      expression: 'M = w a² / 2', value: Mleft, dimension: 'moment',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'M_right', description: 'Cantilever moment at the outer face of the second column',
      expression: 'M = w b² / 2', value: Mright, dimension: 'moment',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'x₀', description: 'Distance from the left edge to the point of zero shear',
      expression: 'x₀ = N_u1 / w', value: x0, dimension: 'length',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'M_span', description: 'Hogging moment between the columns, at the point of zero shear',
      value: Mspan, dimension: 'moment',
    }),
    derived({
      symbol: 'M_max', description: 'Governing longitudinal moment',
      value: Mmax, dimension: 'moment',
    }),
  ];

  return { steps, checks: [], scratch: { w, Mleft, Mright, Mspan, Mmax, x0 } };
}

/* ---------------- longitudinal reinforcement ---------------- */

function ecpb_flexure(ctx, sc) {
  const { sec, mat } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;
  const a1 = ECP203_DATA.alpha1.value;
  const d = sec.d;
  const k = a1 * fcd * sec.B;

  const Mu = sc.Mmax || 0;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = Math.max(
    (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * sec.B * d,
    (ECP203_DATA.asMinSecond.value / mat.fy) * sec.B * d,
  );
  const AsProvided = Math.max(As, asMin);
  const aMax = ECP203_DATA.beta1.value * 0.44 * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const steps = [
    step({
      code: ECPB, clause: '4.2', symbol: 'A_s', description: 'Longitudinal reinforcement over the full width',
      expression: 'A_s = α₁ f_cd B a / f_yd', value: As, dimension: 'area',
    }),
    step({
      code: ECPB, clause: '4.2', symbol: 'A_s,min', description: 'Minimum longitudinal reinforcement',
      value: asMin, dimension: 'area', verify: true,
    }),
    derived({ symbol: 'A_s,req', description: 'Longitudinal reinforcement adopted', value: AsProvided, dimension: 'area' }),
  ];

  return {
    steps,
    checks: [check({
      id: 'combFlexure', title: 'Longitudinal reinforcement',
      code: ECPB, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu, capacity: MuMax, dimension: 'moment',
      failureMode: 'Flexural failure along the length of the combined footing',
      steps, verify: true,
      note: 'Transverse reinforcement under each column, on the band width the code prescribes, is not calculated here.',
    })],
    scratch: { combAs: AsProvided },
  };
}

/* ---------------- shear ---------------- */

function ecpb_shear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const w = sc.w || 0;
  const d = sec.d;
  const a = sec.leftProjection;
