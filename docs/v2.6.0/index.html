// ui/screens/quick.js — the quick design gateway.
//
// A way into a calculation without first creating a project, naming a client
// and filling a register. It exists for reviewing an element, not for issuing
// work: what it produces is stamped FOR REVIEW ONLY and can be turned into a
// real project in one step if it turns out to matter.


function quickScreen(app) {
  const host = h('div');
  let query = '';
  let selectedId = app.quickElement || 'cfst-column';
  let country = app.quickCountry || DEFAULT_JURISDICTION;

  function start(element) {
    if (!element.available) {
      toast(`${element.short} is not built yet.`, 'err');
      return;
    }
    const j = jurisdiction(country);
    const project = createProject({
      name: `Quick design — ${element.short}`,
      client: '—',
      country,
      units: app.units,
      codes: { ...j.codes },
      quick: true,
      stage: 'Concept',
      revisionNote: 'Quick design for review',
    });
    const resolved = codeForElement(element, j);
    const common = {
      number: nextItemNumber([], 'Q'),
      name: element.short,
      code: resolved.code,
      designer: app.currentUser ? app.currentUser.name : '',
    };
    const item = element.kind === 'rcbeam' ? createBeamItem(common)
      : element.kind === 'rccolumn' ? createColumnItem(common)
        : element.kind === 'footing' ? createFootingItem(common)
          : element.kind === 'slab' ? createSlabItem(common)
            : element.kind === 'combined' ? createCombinedItem(common)
              : element.kind === 'plategirder' ? createPlateGirderItem(common)
                : element.kind === 'retaining' ? createWallItem(common)
                  : element.kind === 'steelbeam' ? createSteelBeamItem(common)
                    : element.kind === 'doublechannel' ? createDoubleChannelItem(common)
        : createItem({ ...common, category: element.category });
    if (element.kind === 'cfst') item.assumptions = generateAssumptions(item, item.code);
    if (resolved.note) item.codeNote = resolved.note;
    project.items = [item];

    app.quickCountry = country;
    app.quickElement = element.id;
    app.store.replace({ project });
    app.audit.append({
      kind: AUDIT_KINDS.ITEM_CREATED,
      entity: `Quick design — ${element.short}`,
      entityId: item.id,
      to: `${element.short} to ${item.code} (${j.label})`,
      actor: app.actorName(),
    });
    app.openItem(item.id);
  }

  function paint() {
    const results = searchElements(query);
    const j = jurisdiction(country);

    const controls = h('div', { class: 'tg-grid tg-grid--2', style: { maxWidth: '760px' } },
      field({
        label: 'Search for an element', id: 'quick-search',
        hint: 'Type in English or Arabic: column, composite, footing, عمود, قاعدة.',
        control: textInput({
          id: 'quick-search', value: query, placeholder: 'composite column',
          onInput: (v) => { query = v; render(); },
        }),
      }),
      field({
        label: 'Country', id: 'quick-country',
        hint: 'Sets the design codes for this calculation. Nothing else is needed.',
        control: select({
          id: 'quick-country', value: country,
          options: jurisdictionOptions(),
          onChange: (v) => { country = v; render(); },
        }),
      }),
    );

    // One dropdown, filtered by what is typed, plus a single detail card for
    // whatever is selected. A grid of cards does not survive fifty elements:
    // it becomes a wall of disabled buttons that has to be scrolled past.
    // If the search has filtered out whatever was selected, follow the search
    // rather than keeping a card the person can no longer see in the list.
    const stillVisible = results.some((e) => e.id === selectedId);
    const chosen = stillVisible ? findElement(selectedId) : (results[0] || null);
    if (chosen && chosen.id !== selectedId) selectedId = chosen.id;

    const picker = field({
      label: 'Element', id: 'quick-element',
      hint: results.length === ELEMENTS.length
        ? `${ELEMENTS.filter((e) => e.available).length} of ${ELEMENTS.length} elements are built. The rest are listed so the coverage is visible.`
        : `${results.length} match${results.length === 1 ? '' : 'es'}`,
      control: select({
        id: 'quick-element',
        value: selectedId || '',
        placeholder: results.length ? undefined : 'Nothing matches that search',
        options: byCategory(results, j),
        onChange: (v) => { selectedId = v; render(); },
      }),
    });

    const detail = chosen
      ? (() => {
        const resolved = codeForElement(chosen, j);
        return h('div', { class: `tg-card${chosen.available ? '' : ' tg-card--soon'}`, style: { maxWidth: '760px' } },
          h('div', { class: 'tg-card__head' },
            h('h3', null, chosen.name),
            chosen.available ? chip('Ready', 'safe') : chip('Not built yet', 'neutral')),
          h('p', { class: 'tg-card__body' }, chosen.summary),
          h('div', { class: 'tg-card__codes' },
            `Designed to ${resolved.code}`,
            resolved.slot ? ` · from the ${resolved.slot} code for ${j.label}` : ''),
          resolved.note ? note({ variant: 'code', body: resolved.note }) : null,
          h('div', { class: 'tg-card__foot' },
            chosen.available
              ? button(`Design to ${resolved.code}`, { onClick: () => start(chosen) })
              : h('span', { class: 'tg-muted', style: { fontSize: '12.5px' } },
                'This element is in the catalogue but has no engine yet, so it cannot be calculated.')),
        );
      })()
      : emptyState({
        title: 'Nothing matches that',
        body: 'Try a shorter word, or clear the search to see everything the platform covers.',
        actions: [button('Show everything', { variant: 'ghost', onClick: () => { query = ''; render(); } })],
      });

    host.replaceChildren(sheet({
      title: 'Quick design',
      lede: 'Go straight to a calculation. No project, no client, no register — pick the element and the country and start.',
      actions: [
        h('div', { style: { minWidth: '210px' } }, field({
          label: 'Units', id: 'quick-units',
          control: select({
            id: 'quick-units', value: app.units,
            options: systemList().map((s) => ({ value: s.id, label: s.label })),
            onChange: (v) => { app.setUnits(v); render(); },
          }),
        })),
      ],
      body: h('div', null,
        controls,
        picker,
        h('hr', { class: 'tg-hr' }),
        detail,
        note({
          variant: 'code',
          title: 'For review, not for issue',
          body: 'A quick design carries no client, job number or checker, so its calculation sheet prints FOR REVIEW ONLY. If the work needs to be issued, turn it into a project from the button on the design screen; nothing is lost when you do.',
        }),
      ),
    }));
  }

  function render() { preserveFocus(paint); }
  render();
  return host;
}

/**
 * Group the options by category so a long catalogue can be browsed as well as
 * searched. Built elements are labelled plainly; the rest carry a marker so the
 * dropdown does not promise something that cannot be run.
 */
function byCategory(list, j) {
  const groups = new Map();
  for (const e of list) {
    if (!groups.has(e.category)) groups.set(e.category, []);
    groups.get(e.category).push(e);
  }
  return [...groups.entries()].map(([category, items]) => ({
    group: category,
    options: items.map((e) => ({
      value: e.id,
      label: e.available
        ? `${e.name} — ${codeForElement(e, j).code}`
        : `${e.name} (not built yet)`,
    })),
  }));
}

/**
 * Promote a quick design to a real project, keeping the element exactly as it
 * is. Nothing is recalculated; only the record around it changes.
 */
function convertQuickToProject(app) {
  const p = app.store.state.project;
  if (!p || !p.quick) return;
  app.store.update((s) => {
    s.project.quick = false;
    s.project.name = '';
    s.project.client = '';
    s.project.revisionNote = 'First issue';
    s.project.stage = 'Detailed design';
    s.project.items = s.project.items.map((it, i) => ({ ...it, number: `C-${String(i + 1).padStart(2, '0')}` }));
  });
  app.audit.append({
    kind: AUDIT_KINDS.PROJECT_FIELD, entity: 'Project', entityId: p.id,
    field: 'quick', from: true, to: false,
    reason: 'Quick design promoted to a project.', actor: app.actorName(),
  });
  toast('Now a project. Fill in the client and revision before issuing.', 'ok');
  app.navigate('project');
}


/* ===== src/ui/screens/import.js ===== */
// ui/screens/import.js — bringing a SAP2000 model into the platform.
//
// Four steps, in the order the decisions actually have to be made: the files,
// then the combinations to design for, then the load factor, then which
// sections to bring across. Nothing is created until the last step, so backing
// out costs nothing.


function importScreen(app) {
  const host = h('div');
  const st = app.importState || (app.importState = {
    modelText: null, modelName: null, model: null,
    forcesText: null, forcesName: null, forces: null,
    reactionsText: null, reactionsName: null, reactions: null,
    chosenCases: [], loadFactor: 1.5, chosenSections: [], chosenBands: [],
  });

  function readFile(accept, onDone) {
    const input = h('input', { type: 'file', accept });
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => { onDone(String(r.result), f.name); render(); };
      r.onerror = () => toast('That file could not be read.', 'err');
      r.readAsText(f);
    });
    input.click();
  }

  function loadModel(text, name) {
    try {
      const tables = parseS2K(text);
      st.model = summariseModel(tables);
      st.modelText = null;  // 32 MB of text is not worth holding on to
      st.modelName = name;
      st.chosenCases = st.model.combos.slice(-1);

      // If ANALYSIS RESULTS were included in the export, take them from here
      // rather than asking for a second file.
      const inline = resultsFromS2K(tables, st.model.units);
      if (inline.forces) { st.forces = inline.forces; st.forcesName = `${name} (inline)`; }
      if (inline.reactions) { st.reactions = inline.reactions; st.reactionsName = `${name} (inline)`; }

      const extra = inline.forces
        ? ` Results included: ${inline.forces.rows.length} force rows.`
        : ' No analysis results in this export.';
      toast(`Model read: ${st.model.counts.frames} frames.${extra}`, 'ok');
    } catch (err) {
      st.model = null;
      toast(`That does not look like a SAP text export: ${err.message}`, 'err');
    }
  }

  function loadResults(text, name) {
    const parsed = parseResultsTable(text);
    const title = (parsed.title || '').toLowerCase();
    if (title.includes('reaction')) {
      st.reactions = parsed; st.reactionsText = text; st.reactionsName = name;
      toast(`Reactions read: ${parsed.rows.length} rows.`, 'ok');
    } else if (parsed.header.includes('M3') || title.includes('element forces')) {
      st.forces = parsed; st.forcesText = text; st.forcesName = name;
      toast(`Forces read: ${parsed.rows.length} rows.`, 'ok');
    } else {
      toast('That table is neither Element Forces - Frames nor Joint Reactions.', 'err');
    }
  }

  function createItems() {
    const p = app.store.state.project;
    if (!st.model || !st.forces) { toast('Load the model and the forces first.', 'err'); return; }
    if (!st.chosenSections.length) { toast('Choose at least one section.', 'err'); return; }

    const env = envelopeForces(st.forces, st.chosenCases);
    const candidates = buildCandidates(st.model, env, null)
      .filter((c) => st.chosenSections.includes(c.section));

    const created = [];
    const updated = [];
    app.store.update((s) => {
      for (const c of candidates) {
        const props = c.properties || {};
        const isI = /wide flange|i\b/i.test(props.shape || '');
        // SAP model lengths are in metres; the parser leaves section dimensions
        // in model units, so convert here where the unit is known.
        const L = st.model.units.length === 'm' ? 1000 : st.model.units.length === 'cm' ? 10 : 1;

        const worst = c.members.reduce((a, m) => {
          if (!m.forces) return a;
          return {
            M: Math.max(a.M, m.forces.M3.abs),
            V: Math.max(a.V, m.forces.V2.abs),
            P: Math.max(a.P, m.forces.P.abs),
            src: m.forces.M3.abs > a.M ? m.forces.M3 : a.src,
          };
        }, { M: 0, V: 0, P: 0, src: null });

        const item = isI
          ? createSteelBeamItem({
            number: nextItemNumber(s.project.items, 'S'),
            name: c.section,
            designer: app.currentUser ? app.currentUser.name : '',
          })
          : createItem({
            number: nextItemNumber(s.project.items, 'X'),
            name: c.section,
          });

        if (isI) {
          const dims = { d: props.t3 * L, bf: props.t2 * L, tf: props.tf * L, tw: props.tw * L };
          // If the model's dimensions match a catalogue section, say so on the
          // sheet rather than printing four numbers.
          const matched = matchByDimensions(dims.d, dims.bf, dims.tw, dims.tf);
          item.geometry = { ...item.geometry, ...dims, catalogue: matched ? matched.name : '' };
          if (matched) item.name = `${c.section} — ${matched.name}`;
          item.actions = { Mu: worst.M * st.loadFactor, Vu: worst.V * st.loadFactor };
        }

        // Provenance: every imported number carries where it came from.
        item.imported = {
          source: st.modelName,
          program: `${st.model.program} ${st.model.version}`,
          section: c.section,
          cases: [...st.chosenCases],
          loadFactor: st.loadFactor,
          memberCount: c.members.length,
          // What the model said, kept so that a later edit here can be seen
          // for what it is rather than quietly diverging.
          snapshot: isI
            ? { 'geometry.d': item.geometry.d, 'geometry.bf': item.geometry.bf,
              'geometry.tf': item.geometry.tf, 'geometry.tw': item.geometry.tw }
            : {},
          members: c.members.map((m) => ({
            frame: m.frame,
            M3: m.forces ? m.forces.M3.value : null,
            M3Case: m.forces ? m.forces.M3.outputCase : null,
            M3Station: m.forces ? m.forces.M3.station : null,
            V2: m.forces ? m.forces.V2.value : null,
            V2Station: m.forces ? m.forces.V2.station : null,
          })),
          worstP: worst.P,
        };

        const existing = s.project.items.find((x) => x.imported && x.imported.section === c.section);
        if (existing) {
          // Replace the actions on the item that is already there rather than
          // creating a second one for the same section.
          Object.assign(existing, {
            actions: item.actions,
            geometry: { ...existing.geometry, ...(isI ? { d: item.geometry.d, bf: item.geometry.bf, tf: item.geometry.tf, tw: item.geometry.tw, catalogue: item.geometry.catalogue } : {}) },
            imported: item.imported,
            status: 'Draft',
          });
          updated.push(existing);
        } else {
          s.project.items.push(item);
          created.push(item);
        }
      }
    });

    for (const it of created) {
      app.audit.append({
        kind: AUDIT_KINDS.ITEM_CREATED,
        entity: `${it.number} ${it.name}`, entityId: it.id,
        to: `Imported from ${st.modelName}, ${it.imported.memberCount} members, cases ${st.chosenCases.join('+')}, load factor ${st.loadFactor}`,
        actor: app.actorName(),
      });
    }
    for (const it of updated) {
      app.audit.append({
        kind: AUDIT_KINDS.ITEM_FIELD,
        entity: `${it.number} ${it.name}`, entityId: it.id, field: 'actions',
        from: 'previous import', to: `re-imported from ${st.modelName}`,
        reason: `Re-imported from ${st.modelName}; actions replaced and the item returned to draft.`,
        actor: app.actorName(),
      });
    }
    if (updated.length) {
      app.store.update((s) => {
        const r = issueRevision(s.project, { note: `Actions re-imported from ${st.modelName}` });
        app.audit.append({
          kind: AUDIT_KINDS.REVISION_ISSUED, entity: 'Project', entityId: s.project.id,
          field: 'revision', from: r.from, to: r.to,
          reason: `${updated.length} item${updated.length === 1 ? '' : 's'} re-imported from ${st.modelName}.`,
          actor: app.actorName(),
        });
      });
    }
    const parts = [];
    if (created.length) parts.push(`${created.length} created`);
    if (updated.length) parts.push(`${updated.length} updated, revision ${app.store.state.project.revision}`);
    toast(parts.join(' · ') || 'Nothing to do.', 'ok');
    app.navigate('items');
  }

  function paint() {
    const ready = !!st.model && !!st.forces;
    const m = st.model;

    const files = sheet({
      title: 'Import from SAP2000',
      lede: 'One text export, if ANALYSIS RESULTS was ticked alongside MODEL DEFINITION. The .sdb file is a closed binary format and cannot be read; the text export is one extra click and carries everything.',
      actions: [button('Back to items', { variant: 'quiet', small: true, onClick: () => app.navigate('items') })],
      body: h('div', null,
        h('div', { class: st.forces && st.forces.fromModelFile ? 'tg-grid' : 'tg-grid tg-grid--2' },
          h('div', { class: 'tg-uploadbox' },
            h('b', null, 'Model'),
            h('p', null, 'In SAP: File → Export → SAP2000 .s2k Text File. Tick MODEL DEFINITION and ANALYSIS RESULTS, and the results come across in the same file.'),
            h('code', null, '.s2k · .$2k · .txt'),
            button(st.modelName || 'Choose the model file', {
              variant: st.modelName ? 'ghost' : '', small: true,
              onClick: () => readFile('.s2k,.txt,.$2k,._2k', loadModel),
            }),
            m ? chip(`${m.counts.frames} frames · ${m.counts.sections} sections`, 'safe') : null),
          st.forces && st.forces.fromModelFile ? null : h('div', { class: 'tg-uploadbox' },
            h('b', null, 'Results'),
            h('p', null, 'Only needed if the export above left ANALYSIS RESULTS unticked. Export Element Forces and Joint Reactions separately and save each as CSV.'),
            h('code', null, '.csv · .txt'),
            button('Add a results table', { variant: 'ghost', small: true, onClick: () => readFile('.csv,.txt', loadResults) }),
            st.forces ? chip(`Forces: ${st.forces.rows.length} rows${st.forces.fromModelFile ? ' — from the model file' : ''}`, 'safe') : null,
            st.reactions ? chip(`Reactions: ${st.reactions.rows.length} rows${st.reactions.fromModelFile ? ' — from the model file' : ''}`, 'safe') : null),
        ),
        m ? note({
          title: `${m.program} ${m.version}`,
          body: `Units ${m.units.force}, ${m.units.length}. Steel code ${m.steelCode || '—'}, concrete code ${m.concreteCode || '—'}. ${m.counts.restraints} restrained joints.`,
        }) : null,
        !st.forces && m ? note({
          variant: 'caution',
          title: 'The results are missing',
          body: 'The model file carries the geometry, sections and loads, but not a single moment or shear. Those come from the analysis results table, which is exported separately.',
        }) : null,
      ),
    });

    if (!ready) { host.replaceChildren(files); return; }

    const allCases = [...new Set(st.forces.rows.map((r) => r.OutputCase))];
    const choose = sheet({
      title: 'What to design for',
      body: h('div', { class: 'tg-form' },
        fold({
          key: 'imp.cases', title: `Load combinations — ${st.chosenCases.length} chosen`, body: h('div', null,
            h('p', { class: 'tg-field__hint' },
              'Individual load cases are components, not design situations. Choose the combinations you design against.'),
            h('div', { class: 'tg-grid' }, allCases.map((c) => {
              const on = st.chosenCases.includes(c);
              const inModel = m.combos.includes(c);
              const box = h('input', { id: `case-${c}`, type: 'checkbox', checked: on });
              box.addEventListener('change', () => {
                st.chosenCases = box.checked
                  ? [...st.chosenCases, c]
                  : st.chosenCases.filter((x) => x !== c);
                render();
              });
              return h('div', { class: 'tg-check' },
                h('label', { class: 'tg-check__line', for: `case-${c}` }, box, h('span', null, c)),
                h('div', { class: 'tg-check__hint' }, inModel ? 'Combination' : 'Load case — a component, not a design situation'));
            })),
          ),
        }),
        fold({
          key: 'imp.factor', title: `Load factor — ${st.loadFactor}`, body: h('div', null,
            h('div', { class: st.forces && st.forces.fromModelFile ? 'tg-grid' : 'tg-grid tg-grid--2' },
              field({
                label: 'Load factor applied to the imported actions', id: 'imp-factor', ident: true,
                hint: 'Entered by you. The platform does not read the combination, so it cannot derive this. It prints on every sheet as a stated assumption.',
                control: numberInput({
                  id: 'imp-factor', value: st.loadFactor, min: 0.1, max: 5,
                  onCommit: (v) => { st.loadFactor = v; render(); },
                }),
              })),
            st.loadFactor === 1
              ? note({ variant: 'danger', title: 'Factor of 1.0', body: 'The actions will be taken as they come from the analysis. If those combinations are unfactored, the design will be carried out on service loads and will read as satisfactory when it is not.' })
              : null,
          ),
        }),
      ),
    });

    const env = envelopeForces(st.forces, st.chosenCases);
    const candidates = buildCandidates(m, env, null);

    // If anything was imported before, compare rather than silently duplicate.
    const already = (app.store.state.project.items || []).filter((x) => x.imported);
    const cmp = already.length ? compareImport(already, candidates, st.chosenCases, st.loadFactor) : null;

    const comparison = !cmp ? null : sheet({
      title: 'What this export changes',
      lede: `${already.length} item${already.length === 1 ? ' was' : 's were'} imported before. Nothing is overwritten until you choose it.`,
      body: h('div', null,
        table({
          columns: [
            { label: 'Section', ident: true, render: (x) => x.section },
            { label: '', width: '110px', render: (x) => chip(
              x.status === 'new' ? 'New' : x.status === 'changed' ? 'Changed' : x.status === 'removed' ? 'Gone from the model' : 'Unchanged',
              x.status === 'changed' ? 'caution' : x.status === 'removed' ? 'unsafe' : x.status === 'new' ? 'safe' : 'neutral',
            ) },
            { label: 'Members', align: 'right', render: (x) => (x.status === 'changed' && x.memberChange ? `${x.wasMembers} → ${x.members}` : String(x.members)) },
            { label: 'Worst M₃', align: 'right', render: (x) => (x.now ? cmpCell(x.was && x.was.M, x.now.M, 'moment', app) : '—') },
            { label: 'Worst V₂', align: 'right', render: (x) => (x.now ? cmpCell(x.was && x.was.V, x.now.V, 'force', app) : '—') },
            { label: 'Worst P', align: 'right', render: (x) => (x.now ? cmpCell(x.was && x.was.P, x.now.P, 'force', app) : '—') },
            { label: 'Also changed', render: (x) => [
              x.caseChange ? 'combinations' : null,
              x.factorChange ? 'load factor' : null,
            ].filter(Boolean).join(', ') },
          ],
          rows: cmp.rows,
        }),
        note({
          variant: cmp.anyChange ? 'caution' : 'code',
          title: cmp.anyChange
            ? `${cmp.counts.changed} changed · ${cmp.counts.new} new · ${cmp.counts.removed} gone · ${cmp.counts.unchanged} unchanged`
            : 'Nothing has moved',
          body: cmp.anyChange
            ? 'Sheets already issued were produced from the earlier figures. Creating the items again replaces the actions on the matching sections and raises a project revision, so the earlier issue stays readable.'
            : 'Every section already imported produces the same governing actions from this export.',
        }),
      ),
    });

    const sectionsSheet = sheet({
      title: 'Sections to bring across',
      lede: 'One design item per section, carrying every member that uses it. The section is common; the actions are not, so each member keeps its own row.',
      actions: [
        button(`Create ${st.chosenSections.length} design item${st.chosenSections.length === 1 ? '' : 's'}`, {
          onClick: createItems, disabled: !st.chosenSections.length,
        }),
      ],
      body: h('div', null,
        table({
          columns: [
            { label: '', width: '40px', render: (c) => {
              const box = h('input', { type: 'checkbox', id: `sec-${c.section}`, checked: st.chosenSections.includes(c.section) });
              box.addEventListener('change', () => {
                st.chosenSections = box.checked
                  ? [...st.chosenSections, c.section]
                  : st.chosenSections.filter((x) => x !== c.section);
                render();
              });
              return box;
            } },
            { label: 'Section', ident: true, render: (c) => c.section },
            { label: 'Shape', render: (c) => (c.properties ? c.properties.shape : '—') },
            { label: 'Material', render: (c) => (c.properties ? c.properties.material : '—') },
            { label: 'Members', align: 'right', render: (c) => String(c.members.length) },
            { label: 'Worst P', align: 'right', render: (c) => fmtWorst(c, 'P', 'force', app) },
            { label: 'Worst M₃', align: 'right', render: (c) => fmtWorst(c, 'M3', 'moment', app) },
            { label: 'Worst V₂', align: 'right', render: (c) => fmtWorst(c, 'V2', 'force', app) },
            { label: 'Maps to', render: (c) => mapsTo(c) },
          ],
          rows: candidates,
          empty: 'No sections found.',
        }),
        note({
          variant: 'code',
          title: 'Where each number comes from',
          body: 'The worst action across the chosen combinations is shown, and each item records the member, the combination and the station it came from. The governing station differs between actions — shear peaks at a support, moment near midspan — and that is correct rather than an inconsistency.',
        }),
      ),
    });

    const bands = st.reactions ? groupRestraints(m, envelopeReactions(st.reactions, st.chosenCases)) : [];
    const footings = !bands.length ? null : sheet({
      title: 'Foundations',
      lede: 'Restrained joints grouped by the size of their vertical reaction. Footings are not in the analysis model; only the reactions are.',
      body: h('div', null,
        table({
          columns: [
            { label: 'Band', render: (b) => `Band ${b.index}` },
            { label: 'Joints', align: 'right', render: (b) => String(b.members.length) },
            { label: 'Reaction range', align: 'right', render: (b) => `${(b.min / 1e3).toFixed(0)} – ${(b.max / 1e3).toFixed(0)} kN` },
            { label: 'Worst', align: 'right', render: (b) => `${(b.worst / 1e3).toFixed(1)} kN` },
          ],
          rows: bands,
        }),
        note({
          variant: 'caution',
          title: 'Allowable bearing pressure is not in the model',
          body: 'A footing cannot be designed without it, and SAP does not hold it. Enter it on each footing before it will calculate.',
        }),
      ),
    });

    host.replaceChildren(files, choose, comparison, sectionsSheet, footings);
  }

  function render() { preserveFocus(paint); }
  render();
  return host;
}

function fmtWorst(c, key, dim, app) {
  let worst = 0;
  for (const m of c.members) {
    if (m.forces && m.forces[key].abs > worst) worst = m.forces[key].abs;
  }
  return worst ? formatWithUnit(worst, dim, app.units) : '—';
}

function mapsTo(c) {
  const shape = (c.properties && c.properties.shape) || '';
  if (/wide flange|^i/i.test(shape)) return chip('Rolled steel beam', 'safe');
  if (/box|tube|pipe/i.test(shape)) return chip('Filled tubular column', 'caution');
  return chip('No element yet', 'neutral');
}

function cmpCell(was, now, dim, app) {
  const shown = formatWithUnit(now, dim, app.units);
  if (was === null || was === undefined) return shown;
  const base = Math.max(Math.abs(was), Math.abs(now), 1);
  if (Math.abs(now - was) / base <= 0.005) return shown;
  const pct = was ? ((now - was) / Math.abs(was)) * 100 : 100;
  return h('span', null, shown, h('span', {
    style: { display: 'block', fontSize: '10.5px', color: pct > 0 ? 'var(--tg-unsafe)' : 'var(--tg-safe)' },
  }, `${pct > 0 ? '+' : ''}${pct.toFixed(1)}%`));
}


/* ===== src/ui/screens/overview.js ===== */
// ui/screens/overview.js — the project record as a drawing title block.


function overviewScreen(app) {
  const p = app.store.state.project;
  const att = titleBlockAttribution(p);
  const advisories = projectAdvisories(p);

  const tb = titleBlock({
    heading: 'PROJECT TITLE BLOCK',
    right: [chip(p.stage, 'neutral')],
    cells: [
      { label: 'PROJECT', value: p.name, wide: true },
      { label: 'JOB No.', value: p.number, ident: true },
      { label: 'REV', value: p.revision, ident: true },
      { label: 'CLIENT', value: p.client, wide: true },
      { label: 'CONSULTANT', value: p.consultant, wide: true },
      { label: 'CONTRACTOR', value: p.contractor },
      { label: 'LOCATION', value: p.location },
      { label: 'ISSUE DATE', value: p.revisionDate, ident: true },
      { label: 'UNITS', value: UNIT_SYSTEMS[p.units]?.label || p.units },
      { label: 'DESIGNED', value: att.designed, ident: true },
      { label: 'CHECKED', value: att.checked, ident: true },
      { label: 'APPROVED', value: att.approved, ident: true },
      { label: 'REASON FOR ISSUE', value: p.revisionNote },
      { label: 'PLATFORM', value: `v${p.platformVersion || PLATFORM_VERSION}`, ident: true },
    ],
  });

  const codeRows = CODE_SLOTS.map((slot) => {
    const id = (p.codes || {})[slot.key];
    const code = id ? app.registry.get(id) : null;
    return { slot, id, code };
  });

  const codeTable = table({
    caption: 'Design basis',
    columns: [
      { label: 'Discipline', render: (r) => r.slot.label },
      { label: 'Code', ident: true, render: (r) => (r.id || '—') },
      { label: 'Edition', render: (r) => (r.code ? r.code.edition : '') },
      { label: 'Basis', render: (r) => (r.code ? chip(r.code.philosophy || '—', 'neutral') : '') },
    ],
    rows: codeRows,
    empty: 'No design codes set.',
  });

  const unverified = codeRows.filter((r) => r.code && r.code.verifyEdition).map((r) => r.id);

  const recent = app.audit.list().slice(0, 8);
  const logTable = table({
    caption: 'Recent changes',
    columns: [
      { label: 'When', ident: true, render: (e) => e.ts.replace('T', ' ').slice(0, 16) },
      { label: 'What', render: (e) => (e.field ? e.field : e.kind) },
      { label: 'From', render: (e) => valueText(e.from) },
      { label: 'To', render: (e) => valueText(e.to) },
      { label: 'By', render: (e) => e.actor },
    ],
    rows: recent,
    empty: 'No changes recorded yet.',
  });

  /**
   * Recalculate every item on the current platform version.
   * This is deliberately an explicit act: it raises a new project revision,
   * stamps the new version, and hands back a line-by-line comparison. The
   * previously issued revision and its sheets are untouched.
   */
  function onRecalculateOnCurrentVersion() {
    const from = p.platformVersion || '(unrecorded)';
    const ok = window.confirm(
      `Recalculate every design item on platform v${PLATFORM_VERSION}?\n\n`
      + `This project was last calculated on v${from}.\n\n`
      + 'A new project revision will be raised and you will be shown exactly which numbers moved. '
      + 'Sheets already issued under the current revision are not altered.',
    );
    if (!ok) return;

    const comparison = [];
    app.store.update((s) => {
      s.project.items = s.project.items.map((it) => {
        const before = snapshotResult(it.result, it.result ? (it.result.platformVersion || from) : from);
        const after = runDesign(app.registry, it);
        comparison.push({ item: it, diff: diffResults(before, after) });
        return {
          ...reviseItem(it, `Recalculated on platform v${PLATFORM_VERSION}`),
          previousResult: before,
          result: after,
        };
      });
      const r = issueRevision(s.project, { note: `Recalculated on platform v${PLATFORM_VERSION}` });
      s.project.platformVersion = PLATFORM_VERSION;
      app.audit.append({
        kind: AUDIT_KINDS.REVISION_ISSUED,
        entity: 'Project', entityId: s.project.id, field: 'platformVersion',
        from, to: PLATFORM_VERSION,
        reason: `Recalculated on platform v${PLATFORM_VERSION}; revision ${r.from} superseded by ${r.to}.`,
      });
    });

    for (const { item, diff } of comparison) {
      app.audit.append({
        kind: AUDIT_KINDS.CALC_RUN,
        entity: itemLabel(item), entityId: item.id, field: 'result',
        from: `${diff.beforeOverall} (v${diff.beforeVersion || from})`,
        to: `${diff.afterOverall} (v${PLATFORM_VERSION})`,
        reason: diff.changed ? 'Values changed on the new platform version.' : 'No values changed.',
      });
    }

    app.lastComparison = comparison;
    app.navigate('compare');
  }

  function onIssueRevision() {
    const reason = window.prompt('Reason for the new revision:', '');
    if (reason === null) return;
    let from; let to;
    app.store.update((s) => {
      const r = issueRevision(s.project, { note: reason });
      from = r.from; to = r.to;
    });
    app.audit.append({
      kind: AUDIT_KINDS.REVISION_ISSUED,
      entity: 'Project', entityId: p.id, field: 'revision',
      from, to, reason: reason || null,
    });
    app.render();
  }

  const revHistory = (p.revisionHistory || []).length
    ? table({
      caption: 'Revision history',
      columns: [
        { label: 'Rev', ident: true, render: (r) => r.revision },
        { label: 'Date', ident: true, render: (r) => r.date },
        { label: 'Reason for issue', render: (r) => r.note || '—' },
      ],
      rows: [...p.revisionHistory].reverse(),
    })
    : null;

  return h('div', null,
    sheet({
      title: p.name || 'Untitled project',
      lede: 'Everything printed by this platform inherits these details.',
      actions: [
        button('Edit details', { variant: 'ghost', onClick: () => app.navigate('project') }),
        button('Issue new revision', { onClick: onIssueRevision }),
      ],
      body: h('div', null,
        tb,
        versionBanner(app, p, onRecalculateOnCurrentVersion),
        advisories.length
          ? note({ variant: 'caution', title: 'Before issue', list: advisories })
          : null,
        h('hr', { class: 'tg-hr' }),
        codeTable,
        unverified.length
          ? note({
            variant: 'code',
            title: 'Code editions must be confirmed',
            body: 'This build ships edition strings for reference. Confirm them against the office controlled copies, including any National Annex, before the calculations are issued.',
            list: unverified,
          })
          : null,
        p.notes ? h('div', null,
          h('hr', { class: 'tg-hr' }),
          h('h3', { style: { fontSize: '13px', marginBottom: '6px' } }, 'Project notes'),
          h('p', { class: 'tg-muted', style: { whiteSpace: 'pre-wrap' } }, p.notes)) : null,
      ),
      foot: [clauseRef('Every calculated value in this platform prints its code and clause. Values without a clause are not produced.')],
    }),
    revHistory ? sheet({ title: 'Revisions', body: revHistory }) : null,
    sheet({
      title: 'Change log',
      lede: 'Append-only. Entries are never edited or deleted.',
      actions: [button('Open full log', { variant: 'quiet', small: true, onClick: () => app.navigate('log') })],
      body: logTable,
    }),
  );
}

function valueText(v) {
  if (v === null || v === undefined || v === '') return '(empty)';
  return String(v);
}

/**
 * Shown when the open project was calculated on an older platform version.
 * The project is NOT recalculated automatically: doing so would change numbers
 * under a revision that may already have been issued and signed.
 */
function versionBanner(app, p, onRecalculate) {
  const stored = p.platformVersion;
  if (!stored) return null;
  if (!isOlderThanCurrent(stored)) return null;
  return h('div', null,
    note({
      variant: 'caution',
      title: `This project was calculated on platform v${stored}. This build is v${PLATFORM_VERSION}.`,
      body: 'The results shown are the ones produced by the older version and have been left exactly as they were, so any sheet already issued still reproduces. Recalculating raises a new revision and shows you every number that moved.',
    }),
    h('div', { class: 'tg-row', style: { margin: '8px 0 4px' } },
      button(`Recalculate on v${PLATFORM_VERSION} and raise a new revision`, { onClick: onRecalculate }),
      app.lastComparison && app.lastComparison.length
        ? button('View the last comparison', { variant: 'quiet', small: true, onClick: () => app.navigate('compare') })
        : null),
  );
}

// ui/screens/codes.js — the installed code library and its coverage.
//
// This screen exists so the coverage question is answered before design starts,
// not discovered halfway through a calculation. It reads entirely from the
// registry; adding a code file makes it appear here with no change to this file.


const COVERAGE_CHIP = {
  [COVERAGE.COVERED]: ['Engine installed', 'safe'],
  [COVERAGE.DECLARED]: ['Clause declared', 'caution'],
  [COVERAGE.NOT_COVERED]: ['Not covered', 'notcov'],
  [COVERAGE.UNKNOWN]: ['Silent', 'neutral'],
};

function codesScreen(app, state = {}) {
  let selectedId = state.selected || app.store.state.project?.codes?.composite || 'EN 1994-1-1';
  const host = h('div');

  function render() { preserveFocus(paint); }

  function paint() {
    const families = app.registry.families();
    const all = app.registry.list();

    const library = table({
      caption: `${all.length} codes installed`,
      columns: [
        { label: 'Code', ident: true, render: (c) => c.id },
        { label: 'Title', render: (c) => c.title },
        { label: 'Edition', render: (c) => c.edition },
        { label: 'Basis', render: (c) => c.philosophy || '—' },
        { label: 'CFST', render: (c) => cfstVerdict(app, c.id) },
      ],
      rows: families.flatMap((f) => f.codes),
    });

    const chosen = app.registry.get(selectedId);
    const matrixRows = CFST_CHECK_SEQUENCE.map((cap) => {
      const r = app.registry.resolve(cap, selectedId);
      return { cap, r };
    });

    const matrix = table({
      caption: chosen ? `Coverage of ${chosen.id} for concrete-filled tubular columns` : 'Select a code',
      columns: [
        { label: 'Design check', render: ({ cap }) => capLabel(cap) },
        { label: 'Status', width: '150px', render: ({ r }) => {
          const [label, kind] = COVERAGE_CHIP[r.status] || COVERAGE_CHIP[COVERAGE.UNKNOWN];
          return chip(label, kind);
        } },
        { label: 'Clause', ident: true, width: '130px', render: ({ r }) => r.clause || '—' },
        { label: 'Note', render: ({ r }) => (r.note ? h('span', { class: 'tg-muted' }, r.note) : (r.clauseTitle || '')) },
      ],
      rows: matrixRows,
    });

    const notCoveredCount = matrixRows.filter(({ r }) => r.status !== COVERAGE.COVERED && r.status !== COVERAGE.DECLARED).length;

    host.replaceChildren(
      sheet({
        title: 'Design codes',
        lede: 'Codes are plug-in modules. Adding one is a new file and one line in codes/index.js — the calculation engine is not touched.',
        body: h('div', null,
          library,
          note({
            variant: 'code',
            title: 'How coverage is decided',
            body: 'A code either publishes a provision for a check or it does not. Where it does not, this platform states so and produces no number. No formula is carried across from another code, and no default is assumed.',
          }),
        ),
      }),
      sheet({
        title: 'Coverage matrix',
        lede: 'What a chosen code can and cannot verify for a filled composite column.',
        actions: [
          h('div', { style: { minWidth: '260px' } }, field({
            label: 'Code', id: 'cov-code',
            control: select({
              id: 'cov-code',
              value: selectedId,
              options: app.registry.families().map((f) => ({
                group: f.family,
                options: f.codes.map((c) => ({ value: c.id, label: c.id })),
              })),
              onChange: (v) => { selectedId = v; render(); },
            }),
          })),
        ],
        body: h('div', null,
          matrix,
          notCoveredCount
            ? note({
              variant: 'caution',
              title: `${notCoveredCount} of ${matrixRows.length} checks are not available under ${selectedId}`,
              body: 'A design item using this code will stop at those checks and print a formal notice in place of a result. Where another installed code covers the check, it is offered as an alternative on the item itself.',
            })
            : null,
        ),
        foot: [button('Back to project', { variant: 'quiet', small: true, onClick: () => app.navigate('overview') })],
      }),
    );
  }

  render();
  return host;
}

function cfstVerdict(app, codeId) {
  const covered = CFST_CHECK_SEQUENCE.filter((c) => {
    const s = app.registry.coverage(codeId, c);
    return s === COVERAGE.COVERED || s === COVERAGE.DECLARED;
  }).length;
  if (covered === 0) return chip('No provisions', 'notcov');
  if (covered >= CFST_CHECK_SEQUENCE.length - 3) return chip(`${covered}/${CFST_CHECK_SEQUENCE.length}`, 'safe');
  return chip(`${covered}/${CFST_CHECK_SEQUENCE.length}`, 'caution');
}

/* ===== src/ui/shell.js ===== */
// ui/shell.js — frame, navigation and file actions.


const ROUTES = [
  { id: 'overview', label: 'Project', group: 'PROJECT', needsProject: true },
  { id: 'project', label: 'Details', group: 'PROJECT', needsProject: false },
  { id: 'items', label: 'Design items', group: 'DESIGN', needsProject: true, count: (s) => (s.project?.items || []).length },
  { id: 'codes', label: 'Design codes', group: 'DESIGN', needsProject: false },
  { id: 'log', label: 'Change log', group: 'RECORDS', needsProject: true },
  { id: 'people', label: 'Engineers', group: 'RECORDS', needsProject: false, count: (s, a) => a.people.length },
];

/**
 * Screens that stand on their own, with no project open.
 *
 * Derived from the rail, plus the screens reached from the top bar rather than
 * the rail. Quick design exists precisely so that a calculation can be started
 * without a project, so it must be here — leaving it out made the button
 * silently do nothing.
 */
const TOPBAR_ROUTES = ['quick', 'import'];
const PROJECT_FREE_ROUTES = [
  ...ROUTES.filter((r) => !r.needsProject).map((r) => r.id),
  ...TOPBAR_ROUTES,
];

function createShell(app) {
  injectStyle('tg-styles', stylesheet());

  const board = h('main', { class: 'tg-board', id: 'tg-board', tabindex: '-1' });
  const rail = h('nav', { class: 'tg-rail', 'aria-label': 'Sections' });
  const topbarMeta = h('div', { class: 'tg-topbar__meta' });

  // The badge sits next to the mark so the exact build in front of you is never
  // in doubt while the platform is being changed often.
  const badge = h('button', {
    class: 'tg-topbar__badge', type: 'button',
    title: 'Click for build details',
    onClick: () => toggleBuildPanel(),
  },
    h('b', null, `v${PLATFORM_VERSION}`),
    h('span', null, buildLabel()),
  );

  let buildPanel = null;

  function toggleBuildPanel() {
    if (buildPanel) { buildPanel.remove(); buildPanel = null; return; }
    const current = VERSION_HISTORY.find((v) => v.version === PLATFORM_VERSION);
    buildPanel = h('div', { class: 'tg-buildpanel' },
      h('h4', null, `Version ${PLATFORM_VERSION}`),
      current ? h('p', null, current.notes) : null,
      h('dl', { class: 'tg-buildpanel__facts' },
        h('div', null, h('dt', null, 'Build'), h('dd', null, IS_BUNDLED ? String(BUILD_NUMBER) : 'running from source')),
        h('div', null, h('dt', null, 'Built'), h('dd', null, buildLabel())),
        h('div', null, h('dt', null, 'Codes installed'), h('dd', null, String(app.registry.list().length))),
      ),
      h('h5', null, 'Earlier versions'),
      h('ul', null, VERSION_HISTORY.map((v) => h('li', null,
        h('b', null, `v${v.version}`), ` — ${v.date}`,
        h('div', { class: 'tg-buildpanel__note' }, v.notes)))),
      h('p', { class: 'tg-buildpanel__note' },
        'A sheet prints the version it was calculated on. Open the matching pinned address to reproduce it exactly.'),
      button('Close', { variant: 'quiet', small: true, onClick: () => toggleBuildPanel() }),
    );
    root.appendChild(buildPanel);
  }

  // Language switch and the hover translator sit together: same dictionary.
  const langBtn = h('button', {
    class: 'tg-topbar__tool', type: 'button', title: 'Switch interface language',
    onClick: () => {
      setLang(lang() === LANGS.EN ? LANGS.AR : LANGS.EN);
      langBtn.textContent = lang() === LANGS.EN ? 'ع' : 'EN';
      app.render();
    },
  }, 'ع');

  const trBtn = h('button', {
    class: 'tg-topbar__tool', type: 'button',
    title: 'Translation helper: point at anything to see it in Arabic',
    onClick: () => {
      setTranslateMode(!isTranslateMode());
      trBtn.classList.toggle('tg-topbar__tool--on', isTranslateMode());
      document.body.classList.toggle('tg-translating', isTranslateMode());
      if (!isTranslateMode()) hideTip();
    },
  }, '\u2637');

  const tip = h('div', { class: 'tg-tip', hidden: true });
  document.body.appendChild(tip);

  function hideTip() { tip.hidden = true; }

  document.addEventListener('mouseover', (e) => {
    if (!isTranslateMode()) return;
    const el = e.target.closest('button, a, label, th, td, dt, dd, h1, h2, h3, h4, legend, p, span, li, option');
    if (!el || el.closest('.tg-tip')) return;
    const info = explain(el.textContent);
    if (!info) { hideTip(); return; }
    // Build the parts first and drop the empty ones. Passing a null straight
    // into replaceChildren turns it into the literal text "null" on screen.
    const parts = [h('div', { class: 'tg-tip__src' }, info.source.slice(0, 160))];
    if (info.whole) parts.push(h('div', { class: 'tg-tip__ar' }, info.whole));
    if (info.terms.length) {
      parts.push(h('dl', { class: 'tg-tip__terms' }, info.terms.map((x) => h('div', null,
        h('dt', null, x.term), h('dd', null, x.ar)))));
    }
    tip.replaceChildren(...parts);
    tip.hidden = false;
    const r = el.getBoundingClientRect();
    const top = r.bottom + 8 + tip.offsetHeight > window.innerHeight ? r.top - tip.offsetHeight - 8 : r.bottom + 8;
    tip.style.top = `${Math.max(8, top)}px`;
    tip.style.left = `${Math.min(Math.max(8, r.left), window.innerWidth - tip.offsetWidth - 8)}px`;
  });
  document.addEventListener('mouseout', (e) => { if (isTranslateMode() && !e.relatedTarget) hideTip(); });

  const quickBtn = h('button', {
    class: 'tg-topbar__quick', type: 'button',
    title: 'Go straight to an element calculation without setting up a project',
    onClick: () => app.navigate('quick'),
  }, h('b', null, 'QUICK DESIGN'), h('span', null, 'straight to an element'));

  const clock = h('div', { class: 'tg-topbar__clock' });
  // Slot reserved for the signed-in engineer. Adding users later drops a node
  // in here; nothing else in the bar has to move.
  const userSlot = h('div', { class: 'tg-topbar__slot' });

  const topbar = h('header', { class: 'tg-topbar' },
    logoImg('tg-topbar__logo'),
    h('div', null,
      h('div', { class: 'tg-topbar__name' }, ORG.name.toUpperCase()),
      h('div', { class: 'tg-topbar__sub' }, ORG.platform.toUpperCase())),
    badge,
    clock,
    h('div', { class: 'tg-topbar__spacer' }),
    quickBtn,
    langBtn,
    trBtn,
    userSlot,
    topbarMeta,
  );

  function paintClock() {
    const now = new Date();
    const day = now.toLocaleDateString('en-GB', { weekday: 'long' });
    const date = now.toLocaleDateString('en-GB');
    const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    clock.replaceChildren(h('b', null, `${date} — ${time}`), h('span', null, day));
  }
  paintClock();
  setInterval(paintClock, 1000);

  const root = h('div', { class: 'tg-app' },
    topbar,
    h('div', { class: 'tg-body' }, rail, board),
  );

  /** Units are chosen here, for the whole platform, not just displayed. */
  function unitsControl() {
    const sel = select({
      id: 'topbar-units', value: app.units,
      options: systemList().map((x) => ({ value: x.id, label: x.label })),
      onChange: (v) => app.setUnits(v),
    });
    sel.className = 'tg-topbar__units';
    return h('div', { class: 'tg-topbar__field' }, sel, h('span', null, 'UNITS'));
  }

  function metaField(label, value, word) {
    return h('div', { class: `tg-topbar__field${word ? ' tg-topbar__field--word' : ''}` },
      h('b', null, value || '—'),
      h('span', null, label));
  }

  function saveProject() {
    const p = app.store.state.project;
    if (!p) return;
    const payload = serialise(p, app.audit, { build: app.build, people: app.people, currentUser: app.currentUser });
    downloadText(suggestedFileName(p), JSON.stringify(payload, null, 2));
    toast('Project file saved.', 'ok');
  }

  async function openProject() {
    try {
      const { name, text } = await pickTextFile();
      const { project, audit, people, currentUserId } = deserialise(text);
      app.load(project, audit, people, currentUserId);
      app.audit.append({ kind: AUDIT_KINDS.IMPORTED, entity: 'Project', entityId: project.id, to: name });
      toast(`Opened ${project.name || name}.`, 'ok');
      app.navigate('overview');
    } catch (err) {
      toast(err.message, 'err');
    }
  }

  function renderTopbar() {
    const p = app.store.state.project;
    const me = app.currentUser;
    userSlot.replaceChildren(h('button', {
      class: `tg-topbar__user${me ? '' : ' tg-topbar__user--none'}`,
      type: 'button',
      title: me ? `Signed in as ${me.name} — ${me.role}` : 'No engineer signed in. Changes will be recorded as unattributed.',
      onClick: () => app.navigate('people'),
    },
      h('b', null, me ? (me.name || '(unnamed)') : 'Not signed in'),
      h('span', null, me ? me.role : 'changes recorded as unattributed'),
    ));
    topbarMeta.replaceChildren();
    if (p) {
      topbarMeta.append(
        metaField('JOB No.', p.number),
        metaField('REV', p.revision),
      );
    }
    // Units are a platform setting, so the control is present even before a
    // project exists — quick design needs somewhere to read them from.
    topbarMeta.append(unitsControl());
    if (p) topbarMeta.append(button('Save', { variant: 'ghost', small: true, onClick: saveProject }));
    topbarMeta.append(button('Open', { variant: 'quiet', small: true, onClick: openProject }));
  }

  function renderRail() {
    const p = app.store.state.project;
    rail.replaceChildren();
    let lastGroup = null;
    for (const r of ROUTES) {
      if (r.group !== lastGroup) {
        rail.appendChild(h('div', { class: 'tg-rail__group' }, r.group));
        lastGroup = r.group;
      }
      const disabled = r.needsProject && !p;
      rail.appendChild(h('button', {
        class: 'tg-rail__item',
        'aria-current': String(app.route === r.id),
        disabled,
        title: disabled ? 'Create a project first' : '',
        onClick: () => app.navigate(r.id),
      },
        h('span', null, r.label),
        r.count && (p || !r.needsProject) ? h('span', { class: 'tg-rail__count' }, String(r.count(app.store.state, app))) : null,
      ));
    }
    rail.appendChild(h('div', { class: 'tg-rail__foot' },
      h('div', null, `${app.registry.list().length} design codes installed`),
      h('div', null, `${app.audit.length} log entries`),
    ));
  }

  /**
   * When served from a web address, ask the site which version is live. If the
   * page was loaded from a pinned folder or from a local file, this simply
   * finds nothing and stays quiet.
   */
  async function checkForUpdate() {
    if (!/^https?:/.test(window.location.protocol)) return;
    try {
      const res = await fetch('../version.json', { cache: 'no-store' })
        .catch(() => fetch('version.json', { cache: 'no-store' }));
      if (!res || !res.ok) return;
      const data = await res.json();
      if (!data || !data.version) return;
      const newerVersion = compareVersions(PLATFORM_VERSION, data.version) < 0;
      const newerBuild = data.version === PLATFORM_VERSION
        && Number(data.build) > BUILD_NUMBER;
      if (!newerVersion && !newerBuild) return;
      badge.classList.add('tg-topbar__badge--stale');
      badge.title = `A newer build is available (v${data.version} build ${data.build}). You may be seeing a cached page.`;
      showUpdateBar(newerVersion ? data.version : `${data.version} build ${data.build}`);
    } catch { /* offline, or no version file: nothing to report */ }
  }

  function showUpdateBar(latest) {
    const bar = h('div', { class: 'tg-updatebar' },
      h('span', null, `You are on platform v${PLATFORM_VERSION}. Version v${latest} is available.`),
      h('span', { class: 'tg-updatebar__note' },
        'Your open project keeps its current results until you choose to recalculate.'),
      button('Reload the latest', {
        small: true,
        onClick: () => {
          const base = window.location.href.replace(/\/v[\d.]+\/?$/, '/').split('?')[0];
          window.location.href = `${base}?b=${Date.now()}`;
        },
      }),
      button('Stay here', { variant: 'quiet', small: true, onClick: () => bar.remove() }),
    );
    root.insertBefore(bar, root.firstChild);
  }

  return {
    root,
    board,
    checkForUpdate,
    refreshChrome() { renderTopbar(); renderRail(); translateTree(topbar); translateTree(rail); },
    setContent(node) { mount(board, node); translateTree(root); board.scrollTop = 0; },
  };
}


/* ===== src/main.js ===== */
// main.js — composition root.
//
// This is the only file that knows about all three layers at once. Core does
// not import UI; UI does not import code modules directly; code modules import
// nothing but the capability vocabulary.



const BUILD = PLATFORM_VERSION;

function boot(mountEl) {
  installCodes();

  const app = {
    build: BUILD,
    registry,
    store: new Store({ project: null }),
    audit: new AuditLog(),
    route: 'welcome',
    openItemId: null,
    lastComparison: null,
    people: defaultRegister(),
    quickCountry: null,
    // Units belong to the platform and are inherited by a new project, so a
    // quick design has somewhere to read them from before a project exists.
    units: DEFAULT_SYSTEM,
    setUnits(u) {
      app.units = u;
      const p = app.store.state.project;
      if (p && p.units !== u) {
        app.audit.append({
          kind: AUDIT_KINDS.PROJECT_FIELD, entity: 'Project', entityId: p.id,
          field: 'units', from: p.units, to: u, actor: app.actorName(),
        });
        app.store.update((s) => { s.project.units = u; });
      }
      app.render();
    },
    currentUser: null,
    actorName() { return app.currentUser ? app.currentUser.name : 'unattributed'; },
    can(action) { return can(app.currentUser, action); },
    openItem(id) { app.openItemId = id; app.route = 'designer'; app.render(); },
    openSheet(id) { app.openItemId = id; app.route = 'sheet'; app.render(); },
    navigate(route) { app.route = route; app.render(); },
    load(project, audit, people, currentUserId) {
      app.store.replace({ project });
      app.audit = audit instanceof AuditLog ? audit : new AuditLog();
      if (Array.isArray(people) && people.length) app.people = people;
      if (project && project.units) app.units = project.units;
      app.currentUser = currentUserId ? (app.people.find((x) => x.id === currentUserId) || null) : null;
    },
    render() {},
  };

  const shell = createShell(app);
  mountEl.replaceChildren(shell.root);

  app.render = () => {
    const hasProject = !!app.store.state.project;
    let route = app.route;
    // A screen that does not need a project must not be bounced to the welcome
    // screen. The rail already decides what is reachable; the router should
    // agree with it rather than keep a second, drifting list.
    if (!hasProject && !PROJECT_FREE_ROUTES.includes(route)) route = 'welcome';
    if (hasProject && route === 'welcome') route = 'overview';
    app.route = route;

    shell.refreshChrome();
    shell.setContent(screenFor(app, route));
  };

  // Any state change re-renders. Phase 2 attaches recalculation to this channel.
  app.store.subscribe(() => shell.refreshChrome());

  app.render();
  shell.checkForUpdate();
  return app;
}

function screenFor(app, route) {
  switch (route) {
    case 'project':
      return projectFormScreen(app, { mode: app.store.state.project ? 'edit' : 'create' });
    case 'overview': return overviewScreen(app);
    case 'items': return itemsScreen(app);
    case 'designer': return app.openItemId ? designerScreen(app, app.openItemId) : itemsScreen(app);
    case 'sheet': return app.openItemId ? sheetScreen(app, app.openItemId) : itemsScreen(app);
    case 'compare': return compareScreen(app);
    case 'people': return peopleScreen(app);
    case 'quick': return quickScreen(app);
    case 'import': return importScreen(app);
    case 'codes': return codesScreen(app);
    case 'log': return logScreen(app);
    default: return welcomeScreen(app);
  }
}

/**
 * Public API, deliberately exposed on window.TGP.
 * It gives an engineer a console into the running platform and gives the test
 * harness a way in without reaching through the UI. Keep it small and stable.
 */
function publicApi(app) {
  return {
    version: PLATFORM_VERSION,
    PLATFORM_VERSION, isOlderThanCurrent, diffResults, snapshotResult,
    jurisdiction, jurisdictionOptions,
    newPerson, ROLES, ROLE, can, canCheckItem, peopleOptions,
    ELEMENTS, searchElements, findElement, convertQuickToProject,
    FORM_SPECS, specFor, describeItem,
    EUROPEAN_SECTIONS, sectionByName, sectionsInFamily, sectionOptions, matchByDimensions,
    parseS2K, parseResultsTable, resultsFromS2K, driftFromModel, describeDrift, compareImport, summariseModel, envelopeForces, envelopeReactions, buildCandidates, groupRestraints, toBaseFromSap,
    BUILD_NUMBER, buildLabel,
    lang, setLang, t, explainTerm: explain, LANGS, sheetLanguage, setSheetLanguage, UI, GLOSSARY,
    app,
    registry,
    // core services
    createProject, validateProject, issueRevision,
    createItem, createBeamItem, createColumnItem, runCfst, runBeam, runColumn, runDesign, sectionProperties, generateAssumptions,
    columnSection, footingSection, slabSection, combinedSection, createFootingItem, createSlabItem, createCombinedItem, runFooting, runSlab, runCombined, runPlateGirder, plateSection, createPlateGirderItem, runRetainingWall, wallGeometry, createWallItem, runSteelBeam, steelBeamSection, createSteelBeamItem, runDoubleChannel, createDoubleChannelItem,
    CHANNEL_SECTIONS, channelByName, channelOptions, doubleChannelSection, PAIRING, codeForElement, ECP203_COL_DATA,
    beamSection, barSchedule, BEAM_SUPPORT_LABELS, ECP203_DATA,
    defaultBasePlate, plateProperties,
    sheetBlocks, paginateBlocks, itemCsv,
    serialise, deserialise, suggestedFileName,
    AuditLog,
    // units
    toBase, fromBase, format, formatWithUnit, UNIT_SYSTEMS,
    nextRevision,
    // vocabulary
    CAP, CFST_CHECK_SEQUENCE, COVERAGE,
  };
}

if (typeof document !== 'undefined') {
  const el = document.getElementById('app');
  if (el) {
    const app = boot(el);
    if (typeof window !== 'undefined') window.TGP = publicApi(app);
  }
}

})();
