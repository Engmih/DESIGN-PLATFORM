      steps: [],
      note: ecc > kern ? 'The pressures above were computed on a linear distribution that no longer applies. Redesign the footing so the resultant stays within the middle third, or analyse the partial bearing case by hand.' : null,
    }),
  ];

  return { steps, checks, scratch: { Ntotal, A, fMax, fMin, ecc, kern } };
}

/* ---------------- punching shear ---------------- */

function ecpf_punching(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const d = sec.d;
  const Nu = Math.abs(Number(actions.Nu) || 0);

  // Critical perimeter at d/2 from the column face
  const a = sec.colB + d;
  const b = sec.colL + d;
  const b0 = 2 * (a + b);
  const punchedArea = a * b;
  const qup = sec.L * sec.B > 0
    ? (Nu * (1 - punchedArea / (sec.L * sec.B))) / (b0 * d)
    : Infinity;

  const qcup = Math.min(
    fD('qcupBase') * Math.sqrt(mat.fcu / gC),
    fD('qcupCap') * Math.sqrt(mat.fcu / gC),
  );

  const steps = [
    step({
      code: ECPF, clause: '4.2.4', symbol: 'b_0', description: 'Critical punching perimeter, taken at d/2 from the column face',
      expression: 'b₀ = 2[(c₁ + d) + (c₂ + d)]',
      substitution: `2[(${sec.colB} + ${d.toFixed(0)}) + (${sec.colL} + ${d.toFixed(0)})]`,
      value: b0, dimension: 'length',
    }),
    step({
      code: ECPF, clause: '4.2.4', symbol: 'q_up', description: 'Applied punching shear stress',
      expression: 'q_up = N_u (1 − A_punched / A_footing) / (b₀ d)',
      value: qup, dimension: 'stress',
    }),
    fDataStep('qcupBase', 'q_cup coefficient'),
    step({
      code: ECPF, clause: '4.2.4', symbol: 'q_cup', description: 'Punching shear strength of the concrete',
      expression: 'q_cup = 0.316 √(f_cu / γ_c), not exceeding 1.60 √(f_cu / γ_c)',
      value: qcup, dimension: 'stress', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'punching', title: 'Punching shear around the column',
      code: ECPF, clause: '4.2.4', clauseTitle: 'Punching shear',
      demand: qup, capacity: qcup, dimension: 'stress',
      failureMode: 'The column punches through the footing on a cone around its perimeter',
      steps, verify: true,
      note: 'Only the concentric case is calculated. Where a moment is transferred to the footing, ECP 203 requires the unbalanced moment to be added to the punching stress, which this engine does not do.',
    })],
    scratch: { b0, qup, qcup },
  };
}

/* ---------------- one-way shear ---------------- */

function ecpf_oneWayShear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const d = sec.d;
  const Nu = Math.abs(Number(actions.Nu) || 0);
  const qnet = (sec.L * sec.B) > 0 ? Nu / (sec.L * sec.B) : 0;

  // Critical section at d from the column face
  const cantilever = Math.max(0, (sec.L - sec.colL) / 2 - d);
  const Vu = qnet * cantilever * sec.B;
  const qu = (sec.B * d) > 0 ? Vu / (sec.B * d) : Infinity;
  const qcu = fD('qcuSlab') * Math.sqrt(mat.fcu / gC);

  const steps = [
    step({
      code: ECPF, clause: '4.2.2', symbol: 'q_net', description: 'Net upward pressure from the ultimate load',
      expression: 'q_net = N_u / (L B)', value: qnet, dimension: 'stress',
    }),
    step({
      code: ECPF, clause: '4.2.2', symbol: 'x', description: 'Distance from the critical section to the edge, taken at d from the column face',
      value: cantilever, dimension: 'length',
    }),
    step({
      code: ECPF, clause: '4.2.2', symbol: 'q_u', description: 'Applied one-way shear stress',
      expression: 'q_u = q_net x B / (B d)', value: qu, dimension: 'stress',
    }),
    fDataStep('qcuSlab', 'q_cu coefficient'),
    step({
      code: ECPF, clause: '4.2.2', symbol: 'q_cu', description: 'One-way shear strength of a slab without stirrups',
      expression: 'q_cu = 0.16 √(f_cu / γ_c)', value: qcu, dimension: 'stress', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'oneWayShear', title: 'One-way shear across the footing',
      code: ECPF, clause: '4.2.2', clauseTitle: 'Shear in slabs and footings',
      demand: qu, capacity: qcu, dimension: 'stress',
      failureMode: 'Diagonal shear failure across the full width of the footing',
      steps, verify: true,
    })],
    scratch: { qnet, qu, qcu, cantilever },
  };
}

/* ---------------- bending ---------------- */

function ecpf_bending(ctx, sc) {
  const { sec, mat } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;
  const a1 = ECP203_DATA.alpha1.value;

  const qnet = sc.qnet || 0;
  const d = sec.d;
  const arm = Math.max(0, (sec.L - sec.colL) / 2);
  // Moment per metre width at the column face
  const Mu = qnet * arm * arm / 2 * 1000;

  const k = a1 * fcd * 1000;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = Math.max(
    (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * 1000 * d,
    (ECP203_DATA.asMinFloorPct.value / 100) * 1000 * d,
  );
  const AsProvided = Math.max(As, asMin);

  const steps = [
    step({
      code: ECPF, clause: '4.2', symbol: 'x_c', description: 'Cantilever from the column face to the footing edge',
      value: arm, dimension: 'length',
    }),
    step({
      code: ECPF, clause: '4.2', symbol: 'M_u', description: 'Ultimate moment per metre width at the column face',
      expression: 'M_u = q_net x_c² / 2 per metre', value: Mu, dimension: 'moment',
    }),
    step({
      code: ECPF, clause: '4.2', symbol: 'A_s', description: 'Flexural reinforcement per metre width',
      expression: 'A_s = α₁ f_cd b a / f_yd with b = 1000 mm',
      value: As, dimension: 'area',
    }),
    step({
      code: ECPF, clause: '4.2', symbol: 'A_s,min', description: 'Minimum reinforcement per metre width',
      value: asMin, dimension: 'area', verify: true,
    }),
    derived({
      symbol: 'A_s,req', description: 'Reinforcement adopted per metre width',
      value: AsProvided, dimension: 'area',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'footingFlexure', title: 'Flexural reinforcement of the footing',
      code: ECPF, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      status: Number.isFinite(As) ? CHECK_STATUS.PASS : CHECK_STATUS.FAIL,
      utilisation: Number.isFinite(As) ? As / AsProvided : Infinity,
      failureMode: 'Flexural failure of the footing cantilever at the column face',
      steps,
      note: Number.isFinite(As) ? null : 'No singly reinforced solution exists at this depth. Increase the footing thickness.',
    })],
    scratch: { footingMu: Mu, footingAs: AsProvided },
  };
}

const ECP203_FDN_HANDLERS = {
  bearing: ecpf_bearing,
  punching: ecpf_punching,
  oneWayShear: ecpf_oneWayShear,
  bending: ecpf_bending,
};


/* ===== src/codes/ecp203-slab.js ===== */
// codes/ecp203-slab.js — ECP 203 solid slabs.
//
// One-way slabs are calculated. Two-way slabs are declared and refused: the
// moment coefficients depend on a published table of alpha values against the
// aspect ratio and the edge conditions, and that table is not reproduced here.
// The office sheet carried a line reading 0.5*(L/B) - 0.15 with no source; a
// coefficient that cannot be traced to a clause is not something to build on.


const ECPS = 'ECP 203-2020';

const ECP203_SLAB_DATA = {
  thicknessOneWay: {
    clause: '6.1',
    desc: 'Span to thickness limits for a one-way solid slab, below which deflection need not be calculated',
    simple: 30, continuousOne: 35, continuousTwo: 40, cantilever: 10,
    verify: true,
  },
  qcuSlab: { value: 0.16, clause: '4.2.2', desc: 'Shear strength of a slab without stirrups, q_cu = 0.16 sqrt(f_cu/gamma_c)', verify: true },
  asMinPct: { value: 0.15, clause: '6.1', desc: 'Minimum main reinforcement as a percentage of the gross section', verify: true },
  secondaryPct: { value: 20, clause: '6.1', desc: 'Secondary reinforcement as a percentage of the main steel', verify: true },
  momentCoeff: {
    clause: '6.1',
    desc: 'Bending moment coefficient w L^2 / k',
    simple: 8, continuousOne: 10, continuousTwo: 12, cantilever: 2,
    verify: true,
  },
};

function sD(k) { return ECP203_SLAB_DATA[k]; }

/* ---------------- thickness and span ---------------- */

function ecps_thickness(ctx) {
  const { sec, geometry } = ctx;
  const table = sD('thicknessOneWay');
  const condition = geometry.condition || 'simple';
  const k = table[condition] || table.simple;
  const tMin = geometry.span / k;

  const steps = [
    step({
      code: ECPS, clause: '6.1', symbol: 'L/k',
      description: `Minimum thickness for a ${condition} one-way slab, deemed to satisfy deflection`,
      expression: `t ≥ L / ${k}`,
      substitution: `${geometry.span} / ${k}`,
      value: tMin, dimension: 'length', verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'd', description: 'Effective depth',
      expression: 'd = t − cover − φ/2', value: sec.d, dimension: 'length',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'thickness', title: 'Slab thickness for deflection',
      code: ECPS, clause: '6.1', clauseTitle: 'Solid slabs — thickness',
      demand: tMin, capacity: sec.t, dimension: 'length',
      failureMode: 'Excessive deflection. Below this thickness the code requires deflection to be calculated explicitly.',
      steps, verify: true,
      note: 'This is the deemed-to-satisfy route. A thinner slab is not necessarily inadequate, but its deflection must then be calculated, which this engine does not do.',
    })],
    scratch: { tMin, spanCondition: condition },
  };
}

/* ---------------- one-way or two-way ---------------- */

function ecps_direction(ctx) {
  const { geometry } = ctx;
  const long = Math.max(geometry.span, geometry.spanShort || geometry.span);
  const short = Math.min(geometry.span, geometry.spanShort || geometry.span);
  const ratio = short > 0 ? long / short : Infinity;
  const oneWay = ratio > 2 || !geometry.spanShort;

  const steps = [
    step({
      code: ECPS, clause: '6.1', symbol: 'r', description: 'Ratio of the long span to the short span',
      expression: 'r = L_long / L_short', value: ratio,
      note: oneWay
        ? 'The slab spans one way: the load is carried on the short span.'
        : 'The slab spans two ways.',
    }),
  ];

  if (oneWay) return { steps, checks: [], scratch: { oneWay: true, ratio } };

  return {
    steps: [...steps, notice({
      code: ECPS, clause: '6.1', symbol: 'α',
      description: 'Two-way slab moment coefficients',
      note: 'Not calculated. The moments in a two-way slab come from a table of coefficients against the aspect ratio and the edge conditions. That table is not reproduced in this build, and a coefficient without a clause behind it is not used.',
    })],
    checks: [check({
      id: 'twoWay', title: 'Two-way slab action',
      code: ECPS, clause: '6.1', clauseTitle: 'Solid slabs — two-way action',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Bending in both directions',
      note: `The slab spans two ways (r = ${ratio.toFixed(2)} ≤ 2). Take the moment coefficients from ECP 203 §6.1 and enter the resulting moment directly, or design this slab by hand.`,
    })],
    scratch: { oneWay: false, ratio },
  };
}

/* ---------------- bending ---------------- */

function ecps_bending(ctx, sc) {
  const { sec, mat, geometry, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;
  const a1 = ECP203_DATA.alpha1.value;

  const coeffTable = sD('momentCoeff');
  const kM = coeffTable[sc.spanCondition] || coeffTable.simple;
  const wu = Number(actions.wu) || 0;           // kN/m2 stored in base as N/mm2
  const span = geometry.span;

  // Per metre width: w in N/mm2 times 1000 mm gives N/mm
  const wLine = wu * 1000;
  const Mu = Number(actions.Mu) > 0 ? Number(actions.Mu) : (wLine * span * span) / kM;

  const b = 1000;
  const k = a1 * fcd * b;
  const d = sec.d;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = (sD('asMinPct').value / 100) * b * sec.t;
  const AsProvided = Math.max(As, asMin);
  const secondary = (sD('secondaryPct').value / 100) * AsProvided;

  const aMax = ECP203_DATA.beta1.value * 0.44 * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const steps = [
    step({
      code: ECPS, clause: '6.1', symbol: 'k_M', description: `Moment coefficient for a ${sc.spanCondition} span`,
      expression: `M_u = w_u L² / ${kM}`, value: kM, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'M_u', description: 'Ultimate moment per metre width',
      value: Mu, dimension: 'moment',
      note: Number(actions.Mu) > 0 ? 'Taken from the moment entered directly rather than from the coefficient.' : null,
    }),
    step({
      code: ECPS, clause: '4.2', symbol: 'A_s', description: 'Main reinforcement per metre width',
      expression: 'A_s = α₁ f_cd b a / f_yd with b = 1000 mm',
      value: As, dimension: 'area',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'A_s,min', description: 'Minimum main reinforcement per metre width',
      expression: 'A_s,min = 0.15% b t', value: asMin, dimension: 'area', verify: true,
    }),
    derived({
      symbol: 'A_s,req', description: 'Main reinforcement adopted per metre width',
      value: AsProvided, dimension: 'area',
    }),
    step({
      code: ECPS, clause: '6.1', symbol: 'A_s,sec', description: 'Secondary reinforcement per metre width',
      expression: '20% of the main steel', value: secondary, dimension: 'area', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'slabFlexure', title: 'Flexural reinforcement of the slab',
      code: ECPS, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu, capacity: MuMax, dimension: 'moment',
      failureMode: 'Flexural failure of the slab, or a section too shallow to remain under-reinforced',
      steps, verify: true,
    })],
    scratch: { slabMu: Mu, slabAs: AsProvided, slabSecondary: secondary, wLine },
  };
}

/* ---------------- shear ---------------- */

function ecps_shear(ctx, sc) {
  const { sec, mat, geometry } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const wLine = sc.wLine || 0;
  const Vu = (wLine * geometry.span) / 2;
  const qu = (1000 * sec.d) > 0 ? Vu / (1000 * sec.d) : Infinity;
  const qcu = sD('qcuSlab').value * Math.sqrt(mat.fcu / gC);

  const steps = [
    step({
      code: ECPS, clause: '4.2.2', symbol: 'V_u', description: 'Ultimate shear per metre width at the support',
      expression: 'V_u = w_u L / 2', value: Vu, dimension: 'force',
    }),
    step({
      code: ECPS, clause: '4.2.2', symbol: 'q_u', description: 'Applied shear stress',
      expression: 'q_u = V_u / (b d) with b = 1000 mm', value: qu, dimension: 'stress',
    }),
    step({
      code: ECPS, clause: '4.2.2', symbol: 'q_cu', description: 'Shear strength of a slab without stirrups',
      expression: 'q_cu = 0.16 √(f_cu / γ_c)', value: qcu, dimension: 'stress', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'slabShear', title: 'Shear in the slab',
      code: ECPS, clause: '4.2.2', clauseTitle: 'Shear in slabs',
      demand: qu, capacity: qcu, dimension: 'stress',
      failureMode: 'Diagonal shear failure. A solid slab is not normally given stirrups, so the section must carry the shear alone.',
      steps, verify: true,
    })],
    scratch: { slabVu: Vu, slabQu: qu },
  };
}

const ECP203_SLAB_HANDLERS = {
  thickness: ecps_thickness,
  direction: ecps_direction,
  bending: ecps_bending,
  shear: ecps_shear,
};


/* ===== src/codes/ecp203-comb.js ===== */
// codes/ecp203-comb.js — ECP 203 combined footing under two columns.
//
// A combined footing is a beam spanning between two columns, carried on soil.
// The office sheet treated the pressure and the bending separately; they are
// the same problem, because where the resultant falls decides the pressure
// diagram, which decides every moment that follows.


const ECPB = 'ECP 203-2020';

/* ---------------- geometry of the resultant ---------------- */

function ecpb_resultant(ctx) {
  const { sec, actions } = ctx;
  const N1 = Math.abs(Number(actions.N1w) || 0);
  const N2 = Math.abs(Number(actions.N2w) || 0);
  const S = sec.spacing;
  const factor = ECP203_FDN_DATA.ownWeight.value;
  const Ntotal = (N1 + N2) * factor;

  // Distance of the resultant from the first column
  const xbar = (N1 + N2) > 0 ? (N2 * S) / (N1 + N2) : 0;
  // Distance of the resultant from the left edge
  const fromEdge = sec.leftProjection + xbar;
  const centre = sec.L / 2;
  const ecc = Math.abs(fromEdge - centre);
  const kern = sec.L / 6;

  const A = sec.L * sec.B;
  const Z = (sec.B * sec.L * sec.L) / 6;
  const M = Ntotal * (fromEdge - centre);
  const fMax = A > 0 ? Ntotal / A + Math.abs(M) / Z : Infinity;
  const fMin = A > 0 ? Ntotal / A - Math.abs(M) / Z : -Infinity;

  // Length that would place the resultant at mid-length
  const idealL = 2 * fromEdge;

  const steps = [
    derived({
      symbol: 'N_total', description: 'Working load of both columns including the self-weight allowance',
      expression: 'N_total = (N₁ + N₂) k_ow', value: Ntotal, dimension: 'force',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'x̄', description: 'Distance of the resultant from the first column',
      expression: 'x̄ = N₂ S / (N₁ + N₂)',
      substitution: `${(N2 / 1e3).toFixed(0)} × ${S} / ${((N1 + N2) / 1e3).toFixed(0)}`,
      value: xbar, dimension: 'length',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'e', description: 'Eccentricity of the resultant from the centre of the footing',
      value: ecc, dimension: 'length',
      note: ecc < 1 ? 'The resultant falls at the centre, so the pressure is uniform.' : null,
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'L_ideal', description: 'Footing length that would place the resultant at mid-length and give uniform pressure',
      expression: 'L = 2 × (distance of the resultant from the left edge)',
      value: idealL, dimension: 'length',
    }),
    step({
      code: ECPB, clause: '7.1', symbol: 'f_max', description: 'Maximum bearing pressure',
      value: fMax, dimension: 'stress',
    }),
    step({
      code: ECPB, clause: '7.1', symbol: 'f_min', description: 'Minimum bearing pressure',
      value: fMin, dimension: 'stress',
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'bearing', title: 'Bearing pressure on the soil',
        code: ECPB, clause: '7.1', clauseTitle: 'Bearing pressure under footings',
        demand: fMax, capacity: ctx.soil.qall, dimension: 'stress',
        failureMode: 'Bearing failure of the soil beneath the footing',
        steps, verify: true,
      }),
      check({
        id: 'uplift', title: 'Resultant within the middle third',
        code: ECPB, clause: '7.2', clauseTitle: 'Combined footings',
        demand: ecc, capacity: kern, dimension: 'length',
        failureMode: 'Part of the base lifts off the soil, so the linear pressure diagram is invalid',
        steps: [],
        note: ecc > kern
          ? `Lengthen the footing to about ${idealL.toFixed(0)} mm, or move it, so the resultant returns to the middle third.`
          : null,
      }),
    ],
    scratch: { Ntotal, xbar, ecc, fromEdge, idealL, fMax, fMin, N1, N2, S },
  };
}

/* ---------------- longitudinal bending ---------------- */

function ecpb_longitudinal(ctx, sc) {
  const { sec, actions } = ctx;
  const Nu1 = Math.abs(Number(actions.N1u) || 0);
  const Nu2 = Math.abs(Number(actions.N2u) || 0);
  const L = sec.L;
  const w = L > 0 ? (Nu1 + Nu2) / L : 0;   // upward line load, N/mm

  const a = sec.leftProjection;
  const b = L - sec.leftProjection - sc.S;

  // Cantilever moments at the column faces, and the hogging moment between them
  const Mleft = w * a * a / 2;
  const Mright = w * b * b / 2;
  // Shear is zero where the upward load has balanced the first column load
  const x0 = w > 0 ? Nu1 / w : 0;
  const Mspan = x0 > a
    ? Math.abs(w * x0 * x0 / 2 - Nu1 * (x0 - a))
    : 0;
  const Mmax = Math.max(Mleft, Mright, Mspan);

  const steps = [
    step({
      code: ECPB, clause: '7.2', symbol: 'w', description: 'Upward line load from the ultimate column loads',
      expression: 'w = (N_u1 + N_u2) / L', value: w,
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'M_left', description: 'Cantilever moment at the outer face of the first column',
      expression: 'M = w a² / 2', value: Mleft, dimension: 'moment',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'M_right', description: 'Cantilever moment at the outer face of the second column',
      expression: 'M = w b² / 2', value: Mright, dimension: 'moment',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'x₀', description: 'Distance from the left edge to the point of zero shear',
      expression: 'x₀ = N_u1 / w', value: x0, dimension: 'length',
    }),
    step({
      code: ECPB, clause: '7.2', symbol: 'M_span', description: 'Hogging moment between the columns, at the point of zero shear',
      value: Mspan, dimension: 'moment',
    }),
    derived({
      symbol: 'M_max', description: 'Governing longitudinal moment',
      value: Mmax, dimension: 'moment',
    }),
  ];

  return { steps, checks: [], scratch: { w, Mleft, Mright, Mspan, Mmax, x0 } };
}

/* ---------------- longitudinal reinforcement ---------------- */

function ecpb_flexure(ctx, sc) {
  const { sec, mat } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;
  const a1 = ECP203_DATA.alpha1.value;
  const d = sec.d;
  const k = a1 * fcd * sec.B;

  const Mu = sc.Mmax || 0;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = Math.max(
    (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * sec.B * d,
    (ECP203_DATA.asMinFloorPct.value / 100) * sec.B * d,
  );
  const AsProvided = Math.max(As, asMin);
  const aMax = ECP203_DATA.beta1.value * 0.44 * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const steps = [
    step({
      code: ECPB, clause: '4.2', symbol: 'A_s', description: 'Longitudinal reinforcement over the full width',
      expression: 'A_s = α₁ f_cd B a / f_yd', value: As, dimension: 'area',
    }),
    step({
      code: ECPB, clause: '4.2', symbol: 'A_s,min', description: 'Minimum longitudinal reinforcement',
      value: asMin, dimension: 'area', verify: true,
    }),
    derived({ symbol: 'A_s,req', description: 'Longitudinal reinforcement adopted', value: AsProvided, dimension: 'area' }),
  ];

  return {
    steps,
    checks: [check({
      id: 'combFlexure', title: 'Longitudinal reinforcement',
      code: ECPB, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu, capacity: MuMax, dimension: 'moment',
      failureMode: 'Flexural failure along the length of the combined footing',
      steps, verify: true,
      note: 'Transverse reinforcement under each column, on the band width the code prescribes, is not calculated here.',
    })],
    scratch: { combAs: AsProvided },
  };
}

/* ---------------- shear ---------------- */

function ecpb_shear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const w = sc.w || 0;
  const d = sec.d;
  const a = sec.leftProjection;
  const b = sec.L - sec.leftProjection - sec.spacing;
  const Nu1 = Math.abs(Number(actions.N1u) || 0);
  const Nu2 = Math.abs(Number(actions.N2u) || 0);

  // Three candidate sections, each at d from a column face. The outer
  // cantilevers are often shorter than d, in which case that section does not
  // exist; the governing shear is then inside the span, which is exactly where
  // a combined footing is worst. Reporting zero shear because one section fell
  // off the end would have read as a pass on a check that examined nothing.
  const candidates = [];
  if (a > d) candidates.push({ where: 'outer face of the first column', V: w * (a - d) });
  if (b > d) candidates.push({ where: 'outer face of the second column', V: w * (b - d) });

  const xInner1 = a + sec.col1L / 2 + d;
  if (xInner1 < sec.L) candidates.push({ where: 'inner face of the first column', V: Math.abs(w * xInner1 - Nu1) });
  const xInner2 = b + sec.col2L / 2 + d;
  if (xInner2 < sec.L) candidates.push({ where: 'inner face of the second column', V: Math.abs(w * xInner2 - Nu2) });

  if (!candidates.length) {
    return {
      steps: [notice({
        code: ECPB, clause: '4.2.2', symbol: 'V_u', description: 'One-way shear',
        note: 'No critical section at d from a column face falls within the footing, so one-way shear has not been evaluated.',
      })],
      checks: [check({
        id: 'combShear', title: 'One-way shear',
        code: ECPB, clause: '4.2.2', clauseTitle: 'Shear in slabs and footings',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Diagonal shear failure across the footing',
        note: 'The footing is short relative to its depth, so the usual critical sections do not apply. Check shear by hand.',
      })],
      scratch: {},
    };
  }

  const governing = candidates.reduce((x, y) => (y.V > x.V ? y : x));
  const qu = (sec.B * d) > 0 ? governing.V / (sec.B * d) : Infinity;
  const qcu = ECP203_FDN_DATA.qcuSlab.value * Math.sqrt(mat.fcu / gC);

  const steps = [
    ...candidates.map((c) => step({
      code: ECPB, clause: '4.2.2', symbol: 'V_u',
      description: `Shear at d from the ${c.where}`,
      value: c.V, dimension: 'force',
    })),
    derived({
      symbol: 'V_u,max', description: `Governing shear, at the ${governing.where}`,
      value: governing.V, dimension: 'force',
    }),
    step({
      code: ECPB, clause: '4.2.2', symbol: 'q_u', description: 'Applied shear stress at the governing section',
      expression: 'q_u = V_u / (B d)', value: qu, dimension: 'stress',
    }),
    step({
      code: ECPB, clause: '4.2.2', symbol: 'q_cu', description: 'Shear strength without stirrups',
      expression: 'q_cu = 0.16 √(f_cu / γ_c)', value: qcu, dimension: 'stress', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'combShear', title: `One-way shear at the ${governing.where}`,
      code: ECPB, clause: '4.2.2', clauseTitle: 'Shear in slabs and footings',
      demand: qu, capacity: qcu, dimension: 'stress',
      failureMode: 'Diagonal shear failure across the footing',
      steps, verify: true,
    })],
    scratch: { combQu: qu, combShearAt: governing.where },
  };
}

const ECP203_COMB_HANDLERS = {
  resultant: ecpb_resultant,
  longitudinal: ecpb_longitudinal,
  flexure: ecpb_flexure,
  shear: ecpb_shear,
};


/* ===== src/codes/ecp202-earth.js ===== */
// codes/ecp202-earth.js — lateral earth pressure and wall stability.
//
// A retaining wall is two problems joined together. The first is geotechnical:
// does the wall stay where it is put — sliding, overturning, and the pressure it
// puts on the soil. The second is structural: can the stem, heel and toe carry
// the moments the first problem produces. Neither answer means anything on its
// own, so they are one element here.
//
// The earth pressure is Rankine's, stated in full. The factors of safety are
// the values in common practice and are flagged: confirm them against ECP 202
// and against the project geotechnical report, which may require more.


const ECP202 = 'ECP 202-2001';

const ECP202_DATA = {
  fsOverturning: { value: 2.0, clause: '4', desc: 'Minimum factor of safety against overturning', verify: true },
  fsSliding: { value: 1.5, clause: '4', desc: 'Minimum factor of safety against sliding', verify: true },
  passiveUsed: { value: 0.5, clause: '4', desc: 'Fraction of the available passive resistance relied upon in front of the wall', verify: true },
};

function e202(k) { return ECP202_DATA[k].value; }

/* ---------------- earth pressure ---------------- */

function ecp202_pressure(ctx) {
  const { wall, soil } = ctx;
  const phi = (soil.phi * Math.PI) / 180;
  const Ka = Math.pow(Math.tan(Math.PI / 4 - phi / 2), 2);
  const Kp = Math.pow(Math.tan(Math.PI / 4 + phi / 2), 2);

  const H = wall.H;
  // Per metre run. gammaSoil is stored as N/mm3.
  const Pa = 0.5 * Ka * soil.gamma * H * H;
  const Pq = Ka * soil.surcharge * H;
  const Pp = 0.5 * Kp * soil.gamma * wall.Df * wall.Df * e202('passiveUsed');

  const yA = H / 3;
  const yQ = H / 2;
  const Ptotal = Pa + Pq;
  const Moverturn = Pa * yA + Pq * yQ;

  const steps = [
    step({
      code: ECP202, clause: '4', symbol: 'K_a', description: 'Rankine coefficient of active earth pressure',
      expression: 'K_a = tan²(45° − φ/2)',
      substitution: `tan²(45° − ${soil.phi}/2)`,
      value: Ka,
    }),
    step({
      code: ECP202, clause: '4', symbol: 'K_p', description: 'Rankine coefficient of passive earth pressure',
      expression: 'K_p = tan²(45° + φ/2)', value: Kp,
    }),
    step({
      code: ECP202, clause: '4', symbol: 'P_a', description: 'Active thrust from the retained soil, per metre run',
      expression: 'P_a = ½ K_a γ H²', value: Pa, dimension: 'force',
    }),
    step({
      code: ECP202, clause: '4', symbol: 'P_q', description: 'Thrust from the surcharge, per metre run',
      expression: 'P_q = K_a q H', value: Pq, dimension: 'force',
    }),
    step({
      code: ECP202, clause: '4', symbol: 'P_p', description: 'Passive resistance in front of the wall, reduced by the fraction relied upon',
      expression: 'P_p = ½ K_p γ D_f² × fraction', value: Pp, dimension: 'force', verify: true,
      note: 'Passive resistance depends on the soil in front staying in place. Where it may be excavated during the life of the wall, set the fraction to zero.',
    }),
    derived({
      symbol: 'M_overturn', description: 'Overturning moment about the toe',
      expression: 'M = P_a H/3 + P_q H/2', value: Moverturn, dimension: 'moment',
    }),
  ];

  return { steps, checks: [], scratch: { Ka, Kp, Pa, Pq, Pp, Ptotal, Moverturn, yA, yQ } };
}

/* ---------------- weights and resisting moment ---------------- */

function ecp202_weights(ctx, sc) {
  const { wall, soil } = ctx;
  const gConc = 24e-6; // N/mm3, 24 kN/m3
  const stem = wall.stemThickness * (wall.H - wall.baseThickness) * gConc;
  const base = wall.baseLength * wall.baseThickness * gConc;
  const heelSoil = wall.heel * (wall.H - wall.baseThickness) * soil.gamma;
  const surchargeOnHeel = wall.heel * soil.surcharge;

  const xStem = wall.toe + wall.stemThickness / 2;
  const xBase = wall.baseLength / 2;
  const xHeel = wall.toe + wall.stemThickness + wall.heel / 2;

  const W = stem + base + heelSoil + surchargeOnHeel;
  const Mresist = stem * xStem + base * xBase + (heelSoil + surchargeOnHeel) * xHeel;

  const steps = [
    step({ code: ECP202, clause: '4', symbol: 'W_stem', description: 'Weight of the stem, per metre run', value: stem, dimension: 'force' }),
    step({ code: ECP202, clause: '4', symbol: 'W_base', description: 'Weight of the base, per metre run', value: base, dimension: 'force' }),
    step({ code: ECP202, clause: '4', symbol: 'W_soil', description: 'Weight of soil carried on the heel, including surcharge', value: heelSoil + surchargeOnHeel, dimension: 'force' }),
    derived({ symbol: 'ΣW', description: 'Total vertical load, per metre run', value: W, dimension: 'force' }),
    derived({ symbol: 'M_resist', description: 'Resisting moment about the toe', value: Mresist, dimension: 'moment' }),
  ];

  return { steps, checks: [], scratch: { W, Mresist, stem, base, heelSoil, surchargeOnHeel } };
}

/* ---------------- stability ---------------- */

function ecp202_stability(ctx, sc) {
  const { wall, soil } = ctx;
  const fsOT = sc.Moverturn > 0 ? sc.Mresist / sc.Moverturn : Infinity;
  const friction = Math.tan((soil.deltaBase * Math.PI) / 180);
  const resisting = friction * sc.W + sc.Pp;
  const fsSL = sc.Ptotal > 0 ? resisting / sc.Ptotal : Infinity;

  const xbar = sc.W > 0 ? (sc.Mresist - sc.Moverturn) / sc.W : 0;
  const ecc = Math.abs(wall.baseLength / 2 - xbar);
  const kern = wall.baseLength / 6;
  const A = wall.baseLength;
  const fMax = A > 0 ? (sc.W / A) * (1 + (6 * ecc) / wall.baseLength) : Infinity;
  const fMin = A > 0 ? (sc.W / A) * (1 - (6 * ecc) / wall.baseLength) : -Infinity;

  const steps = [
    step({
      code: ECP202, clause: '4', symbol: 'FS_overturning',
      description: 'Factor of safety against overturning about the toe',
      expression: 'FS = M_resist / M_overturn', value: fsOT,
    }),
    step({
      code: ECP202, clause: '4', symbol: 'FS_sliding',
      description: 'Factor of safety against sliding on the base',
      expression: 'FS = (tan δ ΣW + P_p) / (P_a + P_q)',
      substitution: `(tan ${soil.deltaBase}° × ΣW + P_p) / ΣP`,
      value: fsSL,
    }),
    step({
      code: ECP202, clause: '4', symbol: 'x̄', description: 'Position of the resultant from the toe',
      expression: 'x̄ = (M_resist − M_overturn) / ΣW', value: xbar, dimension: 'length',
    }),
    step({
      code: ECP202, clause: '4', symbol: 'f_max', description: 'Maximum pressure under the base',
      expression: 'f = ΣW/A (1 + 6e/L)', value: fMax, dimension: 'stress',
    }),
    step({
      code: ECP202, clause: '4', symbol: 'f_min', description: 'Minimum pressure under the base',
      value: fMin, dimension: 'stress',
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'overturning', title: 'Stability against overturning',
        code: ECP202, clause: '4', clauseTitle: 'Stability of retaining walls',
        demand: e202('fsOverturning'), capacity: fsOT, dimension: null,
        failureMode: 'The wall rotates about its toe',
        steps, verify: true,
      }),
      check({
        id: 'sliding', title: 'Stability against sliding',
        code: ECP202, clause: '4', clauseTitle: 'Stability of retaining walls',
        demand: e202('fsSliding'), capacity: fsSL, dimension: null,
        failureMode: 'The wall slides forward on its base',
        steps: [], verify: true,
      }),
      check({
        id: 'wallBearing', title: 'Bearing pressure under the base',
        code: ECP202, clause: '4', clauseTitle: 'Bearing pressure',
        demand: fMax, capacity: soil.qall, dimension: 'stress',
        failureMode: 'Bearing failure of the soil beneath the base',
        steps: [], verify: true,
      }),
      check({
        id: 'wallUplift', title: 'Resultant within the middle third',
        code: ECP202, clause: '4', clauseTitle: 'Eccentricity of the resultant',
        demand: ecc, capacity: kern, dimension: 'length',
        failureMode: 'The heel lifts off the soil, so the assumed pressure diagram is invalid',
        steps: [],
      }),
    ],
    scratch: { fsOT, fsSL, xbar, ecc, fMax, fMin },
  };
}

/* ---------------- structural design of the stem ---------------- */

function ecp202_stem(ctx, sc) {
  const { wall, mat } = ctx;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const a1 = ECP203_DATA.alpha1.value;
  const fcd = mat.fcu / gC;
  const fyd = mat.fy / gS;

  const hStem = wall.H - wall.baseThickness;
  const ratio = wall.H > 0 ? hStem / wall.H : 0;
  // Thrust on the stem alone, measured from its base
  const PaStem = sc.Ka * ctx.soil.gamma * hStem * hStem * 0.5;
  const PqStem = sc.Ka * ctx.soil.surcharge * hStem;
  const Mservice = PaStem * (hStem / 3) + PqStem * (hStem / 2);
  const Mu = Mservice * 1.5;

  const d = Math.max(0, wall.stemThickness - wall.cover - wall.barDia / 2);
  const b = 1000;
  const k = a1 * fcd * b;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;
  const asMin = Math.max(
    (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * b * d,
    (ECP203_DATA.asMinFloorPct.value / 100) * b * d,
  );
  const AsProvided = Math.max(As, asMin);
  const aMax = ECP203_DATA.beta1.value * 0.44 * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const steps = [
    step({
      code: ECP202, clause: '4', symbol: 'M_stem', description: 'Service moment at the base of the stem, per metre run',
      expression: 'M = P_a h/3 + P_q h/2 on the stem height alone',
      value: Mservice, dimension: 'moment',
    }),
    // Declared as an input rather than a code step: the load factor on earth
    // pressure depends on the combination being considered, and this engine
    // does not read the combination. An unattributable code step would have
    // been rejected by calc.js, which is how this was caught.
    input({
      symbol: 'γ_f', description: 'Load factor applied to the earth pressure',
      value: 1.5,
      note: 'Assumed. Confirm against ECP 201-2012 for the combination being considered, and change it here if the project adopts a different value.',
    }),
    derived({
      symbol: 'M_u', description: 'Ultimate moment at the base of the stem',
      expression: 'M_u = γ_f M_stem',
      value: Mu, dimension: 'moment',
    }),
    step({
      code: 'ECP 203-2020', clause: '4.2', symbol: 'A_s',
      description: 'Vertical reinforcement at the back of the stem, per metre run',
      value: As, dimension: 'area',
    }),
    step({
      code: 'ECP 203-2020', clause: '4.2', symbol: 'A_s,min',
      description: 'Minimum reinforcement per metre run', value: asMin, dimension: 'area', verify: true,
    }),
    derived({ symbol: 'A_s,req', description: 'Reinforcement adopted at the base of the stem', value: AsProvided, dimension: 'area' }),
  ];

  return {
    steps,
    checks: [check({
      id: 'stem', title: 'Stem reinforcement at the base',
      code: 'ECP 203-2020', clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu, capacity: MuMax, dimension: 'moment',
      failureMode: 'Flexural failure of the stem where it meets the base',
      steps, verify: true,
      note: 'Only the base of the stem is designed. Curtailment up the height, and the heel and toe reinforcement, are not calculated here.',
    })],
    scratch: { Mstem: Mu, stemAs: AsProvided },
  };
}

const ECP202_HANDLERS = {
  pressure: ecp202_pressure,
  weights: ecp202_weights,
  stability: ecp202_stability,
  stem: ecp202_stem,
};


/* ===== src/codes/en1994-cfst.js ===== */
// codes/en1994-cfst.js — the EN 1994-1-1 §6.7.3 simplified method.
//
// Every function here returns steps that name EN 1994-1-1 and a clause. The
// engine has no knowledge of what is inside; it calls what the registry hands
// it and prints what comes back.
//
// Base units throughout: N, mm, MPa, N*mm.


const C = 'EN 1994-1-1';

/* ------------------------------------------------------------------ */
/* material design values                                              */
/* ------------------------------------------------------------------ */

function designStrengths(ctx) {
  const { mat, partial } = ctx;
  return {
    fyd: mat.fy / partial.gammaM0,
    // §6.7.3.2(1): for concrete filled sections the 0.85 coefficient may be
    // replaced by 1.0, because the core is protected from spalling and drying.
    fcd: mat.fck / partial.gammaC,
    fsd: mat.fsk / partial.gammaS,
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.1(9) — maximum wall slenderness                                 */
/* ------------------------------------------------------------------ */

function en_classification(ctx) {
  const { sec, mat } = ctx;
  const eps = Math.sqrt(235 / mat.fy);
  const isCircular = sec.shape === SHAPE.CHS;
  const limit = isCircular ? 90 * eps * eps : 52 * eps;
  const actual = isCircular ? sec.d / sec.t : Math.max(sec.b, sec.h) / sec.t;

  const steps = [
    step({
      code: C, clause: '6.7.1',
      symbol: 'ε', description: 'Material factor',
      expression: 'ε = √(235 / f_y)',
      substitution: `√(235 / ${mat.fy})`,
      value: eps,
    }),
    step({
      code: C, clause: '6.7.1',
      symbol: isCircular ? '(d/t)_max' : '(h/t)_max',
      description: 'Maximum wall slenderness to prevent local buckling before the section yields',
      expression: isCircular ? 'd/t ≤ 90 ε²' : 'h/t ≤ 52 ε',
      substitution: isCircular ? `90 × ${eps.toFixed(4)}²` : `52 × ${eps.toFixed(4)}`,
      value: limit,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'classification',
      title: 'Wall slenderness of the steel tube',
      code: C, clause: '6.7.1',
      clauseTitle: 'Composite columns — General; limits on wall slenderness',
      demand: actual, capacity: limit, dimension: null,
      failureMode: 'Local buckling of the tube wall before the section reaches its plastic resistance',
      steps,
      note: actual > limit
        ? 'The tube wall is too slender for the simplified method of §6.7.3. Increase the wall thickness or use the general method of §6.7.2.'
        : null,
    }),
    scratch: { eps, wallLimit: limit, wallActual: actual },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.2 — plastic resistance of the cross-section                   */
/* ------------------------------------------------------------------ */

function en_plasticResistance(ctx) {
  const { sec, mat, partial } = ctx;
  const d = designStrengths(ctx);

  const Na = sec.Aa * d.fyd;
  const Nc = sec.Ac * d.fcd;
  const Ns = sec.As * d.fsd;
  const NplRd = Na + Nc + Ns;
  const NplRk = sec.Aa * mat.fy + sec.Ac * mat.fck + sec.As * mat.fsk;

  const steps = [
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'f_cd', description: 'Design compressive strength of the core',
      expression: 'f_cd = f_ck / γ_C, with the 0.85 coefficient replaced by 1.0 for filled sections',
      substitution: `${mat.fck} / ${partial.gammaC}`,
      value: d.fcd, dimension: 'stress',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'N_pl,Rd', description: 'Plastic resistance of the cross-section to compression',
      expression: 'N_pl,Rd = A_a·f_yd + A_c·f_cd + A_s·f_sd',
      substitution: `${sec.Aa.toFixed(0)}×${d.fyd.toFixed(1)} + ${sec.Ac.toFixed(0)}×${d.fcd.toFixed(1)} + ${sec.As.toFixed(0)}×${d.fsd.toFixed(1)}`,
      value: NplRd, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'N_pl,Rk', description: 'Characteristic plastic resistance, used for the relative slenderness',
      expression: 'N_pl,Rk = A_a·f_y + A_c·f_ck + A_s·f_sk',
      value: NplRk, dimension: 'force',
    }),
  ];

  return { steps, check: null, scratch: { ...d, Na, Nc, Ns, NplRd, NplRk, NpmRd: Nc } };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.2(6) — confinement in circular sections                       */
/* ------------------------------------------------------------------ */

function en_confinement(ctx, sc) {
  const { sec, mat } = ctx;
  const lam = sc.lambdaBar;
  const e = sc.eccentricity ?? 0;
  const d = sec.shape === SHAPE.CHS ? sec.d : null;

  if (sec.shape !== SHAPE.CHS) {
    return {
      steps: [notice({
        code: C, clause: '6.7.3.2',
        symbol: 'η', description: 'Confinement',
        note: 'The confinement enhancement of §6.7.3.2(6) applies to circular sections only. No enhancement is taken for a rectangular section.',
      })],
      check: null, scratch: { confined: false },
    };
  }
  if (!(lam <= 0.5) || !(e / d < 0.1)) {
    return {
      steps: [notice({
        code: C, clause: '6.7.3.2',
        symbol: 'η', description: 'Confinement',
        note: `§6.7.3.2(6) permits the confinement enhancement only where λ̄ ≤ 0.5 and e/d < 0.1. Here λ̄ = ${lam.toFixed(3)} and e/d = ${(e / d).toFixed(3)}, so no enhancement is taken.`,
      })],
      check: null, scratch: { confined: false },
    };
  }

  const eta_a0 = Math.min(1.0, 0.25 * (3 + 2 * lam));
  const eta_c0 = Math.max(0, 4.9 - 18.5 * lam + 17 * lam * lam);
  const ratio = e / d;
  const eta_a = eta_a0 + (1 - eta_a0) * (10 * ratio);
  const eta_c = eta_c0 * (1 - 10 * ratio);

  const NplRdConf = eta_a * sec.Aa * sc.fyd
    + sec.Ac * sc.fcd * (1 + eta_c * (sec.t / d) * (mat.fy / mat.fck))
    + sec.As * sc.fsd;

  const steps = [
    step({ code: C, clause: '6.7.3.2', symbol: 'η_a0', description: 'Confinement coefficient for the steel at zero eccentricity', expression: 'η_a0 = 0.25 (3 + 2 λ̄) ≤ 1.0', value: eta_a0 }),
    step({ code: C, clause: '6.7.3.2', symbol: 'η_c0', description: 'Confinement coefficient for the concrete at zero eccentricity', expression: 'η_c0 = 4.9 − 18.5 λ̄ + 17 λ̄² ≥ 0', value: eta_c0 }),
    step({ code: C, clause: '6.7.3.2', symbol: 'η_a', description: 'Confinement coefficient for the steel', expression: 'η_a = η_a0 + (1 − η_a0)(10 e/d)', value: eta_a }),
    step({ code: C, clause: '6.7.3.2', symbol: 'η_c', description: 'Confinement coefficient for the concrete', expression: 'η_c = η_c0 (1 − 10 e/d)', value: eta_c }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'N_pl,Rd', description: 'Plastic resistance including confinement',
      expression: 'N_pl,Rd = η_a·A_a·f_yd + A_c·f_cd [1 + η_c (t/d)(f_y/f_ck)] + A_s·f_sd',
      value: NplRdConf, dimension: 'force',
    }),
  ];

  return { steps, check: null, scratch: { confined: true, NplRd: NplRdConf, NpmRd: sc.NpmRd } };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.3 — stiffness and slenderness                                 */
/* ------------------------------------------------------------------ */

function en_stiffness(ctx) {
  const { sec, mat, actions, assumptions } = ctx;
  const Ke = 0.6;
  const phi = Number(assumptions.creepCoefficient) || 0;
  const NGEd = Number(actions.NGEd) || 0;
  const NEd = Number(actions.NEd) || 0;
  const ratioG = NEd > 0 ? Math.min(1, NGEd / NEd) : 0;
  const EcEff = mat.Ecm / (1 + ratioG * phi);

  const axis = ctx.axis === 'z' ? 'Z' : '';
  const Ia = axis ? sec.IaZ : sec.Ia;
  const Ic = axis ? sec.IcZ : sec.Ic;
  const Is = axis ? sec.IsZ : sec.Is;

  const EIeff = mat.Ea * Ia + mat.Es * Is + Ke * EcEff * Ic;

  const steps = [
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'E_c,eff', description: 'Effective modulus of the concrete allowing for creep',
      expression: 'E_c,eff = E_cm / (1 + (N_G,Ed/N_Ed) φ_t)',
      substitution: `${mat.Ecm.toFixed(0)} / (1 + ${ratioG.toFixed(3)} × ${phi})`,
      value: EcEff, dimension: 'stress',
    }),
    step({
      code: C, clause: '6.7.3.3',
      symbol: '(EI)_eff', description: 'Effective flexural stiffness for the elastic critical load',
      expression: '(EI)_eff = E_a I_a + E_s I_s + K_e E_cm I_c, with K_e = 0.6',
      value: EIeff, dimension: null,
    }),
  ];

  return { steps, check: null, scratch: { EIeff, EcEff, Ke, creepRatio: ratioG } };
}

function en_slenderness(ctx, sc) {
  const { geometry } = ctx;
  const L = Number(geometry.bucklingLength);
  const Ncr = Math.PI ** 2 * sc.EIeff / (L * L);
  const lambdaBar = Math.sqrt(sc.NplRk / Ncr);

  const steps = [
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'N_cr', description: 'Elastic critical normal force for the relevant buckling mode',
      expression: 'N_cr = π² (EI)_eff / L²',
      substitution: `π² × (EI)_eff / ${L}²`,
      value: Ncr, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'λ̄', description: 'Relative slenderness',
      expression: 'λ̄ = √(N_pl,Rk / N_cr)',
      value: lambdaBar,
    }),
  ];

  return { steps, check: null, scratch: { Ncr, lambdaBar, L } };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.1 — limits of applicability of the simplified method          */
/* ------------------------------------------------------------------ */

function en_limits(ctx, sc) {
  const { sec } = ctx;
  if (!Number.isFinite(sc.lambdaBar) || !Number.isFinite(sc.NplRd)) {
    throw new Error('the limits of §6.7.3.1 require the plastic resistance and the relative slenderness, which have not been established');
  }
  const delta = (sec.Aa * sc.fyd) / sc.NplRd;
  const rho = sec.rebarRatio;
  const aspect = sec.shape === SHAPE.CHS ? 1 : sec.h / sec.b;

  const tests = [
    { label: 'Steel contribution ratio δ', clause: '6.7.3.1', value: delta, lo: 0.2, hi: 0.9, fmt: (v) => v.toFixed(3) },
    { label: 'Relative slenderness λ̄', clause: '6.7.3.1', value: sc.lambdaBar, lo: 0, hi: 2.0, fmt: (v) => v.toFixed(3) },
    { label: 'Reinforcement ratio ρ_s', clause: '6.7.3.1', value: rho, lo: 0, hi: 0.06, fmt: (v) => `${(v * 100).toFixed(2)}%` },
    { label: 'Depth to width ratio h/b', clause: '6.7.3.1', value: aspect, lo: 0.2, hi: 5.0, fmt: (v) => v.toFixed(2) },
  ];

  const breaches = tests.filter((t) => t.value < t.lo || t.value > t.hi);

  const steps = [
    step({
      code: C, clause: '6.7.3.3',
      symbol: 'δ', description: 'Steel contribution ratio',
      expression: 'δ = A_a f_yd / N_pl,Rd',
      value: delta,
    }),
    ...tests.map((t) => step({
      code: C, clause: t.clause,
      symbol: t.label, description: `Limit of applicability: ${t.lo} ≤ value ≤ ${t.hi}`,
      expression: `${t.lo} ≤ ${t.label} ≤ ${t.hi}`,
      substitution: t.fmt(t.value),
      value: t.value,
      note: (t.value < t.lo || t.value > t.hi) ? 'Outside the range permitted for the simplified method.' : null,
    })),
  ];

  return {
    steps,
    check: check({
      id: 'limits',
      title: 'Limits of applicability of the simplified method',
      code: C, clause: '6.7.3.1',
      clauseTitle: 'Simplified method of design — scope',
      status: breaches.length ? CHECK_STATUS.FAIL : CHECK_STATUS.PASS,
      utilisation: breaches.length ? Infinity : 0,
      failureMode: breaches.length
        ? `Outside the scope of §6.7.3: ${breaches.map((b) => b.label).join(', ')}`
        : null,
      steps,
      note: breaches.length
        ? 'The simplified method may not be used for this member. Either revise the section, or design by the general method of §6.7.2, which this platform does not implement.'
        : null,
    }),
    scratch: { delta, outOfScope: breaches.length > 0 },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.5 — resistance in axial compression                           */
/* ------------------------------------------------------------------ */

function en_axialBuckling(ctx, sc) {
  const { sec, actions } = ctx;
  // Table 6.5: filled sections, ρ_s ≤ 3% use curve a; 3% < ρ_s ≤ 6% use curve b.
  const useCurveB = sec.rebarRatio > 0.03;
  const alpha = useCurveB ? 0.34 : 0.21;
  const curve = useCurveB ? 'b' : 'a';
  const lam = sc.lambdaBar;

  const phi = 0.5 * (1 + alpha * (lam - 0.2) + lam * lam);
  const chi = Math.min(1.0, 1 / (phi + Math.sqrt(Math.max(0, phi * phi - lam * lam))));
  const NbRd = chi * sc.NplRd;
  const NEd = Number(actions.NEd) || 0;

  const steps = [
    step({
      code: C, clause: '6.7.3.5',
      symbol: 'buckling curve', description: 'Buckling curve for a concrete filled section',
      expression: 'Table 6.5: curve a for ρ_s ≤ 3%, curve b for 3% < ρ_s ≤ 6%',
      substitution: `ρ_s = ${(sec.rebarRatio * 100).toFixed(2)}% → curve ${curve}, α = ${alpha}`,
    }),
    step({
      code: 'EN 1993-1-1', clause: '6.3.1.2',
      symbol: 'Φ', description: 'Buckling reduction parameter, taken from EN 1993-1-1 as directed by EN 1994-1-1 §6.7.3.5',
      expression: 'Φ = 0.5 [1 + α (λ̄ − 0.2) + λ̄²]',
      value: phi,
    }),
    step({
      code: 'EN 1993-1-1', clause: '6.3.1.2',
      symbol: 'χ', description: 'Reduction factor for flexural buckling',
      expression: 'χ = 1 / (Φ + √(Φ² − λ̄²)) ≤ 1.0',
      value: chi,
    }),
    step({
      code: C, clause: '6.7.3.5',
      symbol: 'N_b,Rd', description: 'Design buckling resistance',
      expression: 'N_b,Rd = χ N_pl,Rd',
      substitution: `${chi.toFixed(4)} × N_pl,Rd`,
      value: NbRd, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'axial',
      title: 'Member resistance in axial compression',
      code: C, clause: '6.7.3.5',
      clauseTitle: 'Resistance of members in axial compression',
      demand: NEd, capacity: NbRd, dimension: 'force',
      failureMode: 'Flexural buckling of the composite member',
      steps,
    }),
    scratch: { chi, alpha, curve, NbRd, phiBuck: phi },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.4 — second-order effects and imperfections                    */
/* ------------------------------------------------------------------ */

function en_secondOrder(ctx, sc) {
  const { sec, mat, actions, geometry } = ctx;
  const K0 = 0.9;
  const KeII = 0.5;
  const axisZ = ctx.axis === 'z';
  const Ia = axisZ ? sec.IaZ : sec.Ia;
  const Ic = axisZ ? sec.IcZ : sec.Ic;
  const Is = axisZ ? sec.IsZ : sec.Is;

  const EIeffII = K0 * (mat.Ea * Ia + mat.Es * Is + KeII * sc.EcEff * Ic);
  const L = sc.L;
  const NcrEff = Math.PI ** 2 * EIeffII / (L * L);

  // Table 6.5: member imperfection L/300 for curve a, L/200 for curve b.
  const e0 = L / (sc.curve === 'b' ? 200 : 300);
  const NEd = Number(actions.NEd) || 0;
  const r = Number(actions.momentRatio ?? 1);

  const beta = Math.max(0.44, 0.66 + 0.44 * r);
  const denom = 1 - NEd / NcrEff;
  const safeDenom = denom > 0 ? denom : null;

  const kMoment = safeDenom ? Math.max(1.0, beta / safeDenom) : Infinity;
  const kImp = safeDenom ? Math.max(1.0, 1.0 / safeDenom) : Infinity;

  const MimpY = NEd * e0;
  const M0y = Number(actions.MyEd) || 0;
  const M0z = Number(actions.MzEd) || 0;
  const MyEd = Number.isFinite(kMoment) ? kMoment * M0y + kImp * MimpY : Infinity;
  const MzEd = Number.isFinite(kMoment) ? kMoment * M0z : Infinity;

  const steps = [
    step({
      code: C, clause: '6.7.3.4',
      symbol: '(EI)_eff,II', description: 'Effective flexural stiffness for second-order analysis',
      expression: '(EI)_eff,II = K_0 (E_a I_a + E_s I_s + K_e,II E_cm I_c), K_0 = 0.9, K_e,II = 0.5',
      value: EIeffII,
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'N_cr,eff', description: 'Critical load using the second-order stiffness',
      expression: 'N_cr,eff = π² (EI)_eff,II / L²',
      value: NcrEff, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'e_0', description: 'Member imperfection',
      expression: 'Table 6.5: L/300 for buckling curve a, L/200 for curve b',
      substitution: `L / ${sc.curve === 'b' ? 200 : 300}`,
      value: e0, dimension: 'length',
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'β', description: 'Equivalent moment factor for the end moments',
      expression: 'β = 0.66 + 0.44 r ≥ 0.44',
      substitution: `0.66 + 0.44 × ${r}`,
      value: beta,
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'k', description: 'Amplification factor applied to the first-order moment',
      expression: 'k = β / (1 − N_Ed/N_cr,eff) ≥ 1.0',
      value: kMoment,
      note: Number.isFinite(kMoment) ? null : 'N_Ed reaches or exceeds N_cr,eff; the member is unstable and no amplified moment exists.',
    }),
    step({
      code: C, clause: '6.7.3.4',
      symbol: 'M_y,Ed', description: 'Design moment including second-order effects and the member imperfection',
      expression: 'M_y,Ed = k·M_y,Ed,0 + k_imp·N_Ed·e_0',
      value: MyEd, dimension: 'moment',
    }),
  ];

  const stable = Number.isFinite(kMoment);
  return {
    steps,
    check: check({
      id: 'stability',
      title: 'Second-order stability of the member',
      code: C, clause: '6.7.3.4',
      clauseTitle: 'Methods of analysis and member imperfections',
      demand: NEd, capacity: NcrEff, dimension: 'force',
      status: stable ? undefined : CHECK_STATUS.FAIL,
      failureMode: 'Loss of stability — the axial force approaches the critical load and the moment amplifier diverges',
      steps,
      note: stable ? null : 'N_Ed ≥ N_cr,eff. The member has no stable second-order solution.',
    }),
    scratch: { EIeffII, NcrEff, e0, beta, kMoment, MyEd, MzEd, M0y, M0z },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.3.2(5) — interaction polygon                                    */
/* ------------------------------------------------------------------ */

function interactionPolygon(ctx, sc, axis) {
  const { sec, mat } = ctx;
  const z = axis === 'z';
  const Wpa = z ? sec.WpaZ : sec.Wpa;
  const Wpc = z ? sec.WpcZ : sec.Wpc;
  const Wps = z ? sec.WpsZ : sec.Wps;
  const width = sec.shape === SHAPE.CHS ? sec.d : (z ? sec.h : sec.b);
  const inner = sec.shape === SHAPE.CHS ? sec.di : (z ? sec.hi : sec.bi);

  const { fyd, fcd, fsd } = sc;

  // Neutral axis offset for the maximum-moment point.
  // Reinforcement lying within the region 2 h_n is not deducted; see note.
  const hn = (sec.Ac * fcd) / (2 * width * fcd + 4 * sec.t * (2 * fyd - fcd));

  const Wpcn = inner * hn * hn;
  const Wpan = width * hn * hn - Wpcn;

  const MmaxRd = Wpa * fyd + Wps * fsd + 0.5 * Wpc * fcd;
  const MnRd = Wpan * fyd + 0.5 * Wpcn * fcd;
  const MplRd = MmaxRd - MnRd;
  const NpmRd = sec.Ac * fcd;

  return { hn, Wpa, Wpc, Wps, Wpan, Wpcn, MmaxRd, MnRd, MplRd, NpmRd, width, inner, mat };
}

/** μ_d from the four-point polygon of Figure 6.19. */
function muFactor(poly, NEd, NplRd) {
  const { NpmRd, MplRd, MmaxRd } = poly;
  let M;
  if (NEd >= NpmRd) {
    M = NplRd > NpmRd ? MplRd * (NplRd - NEd) / (NplRd - NpmRd) : 0;
  } else if (NEd >= NpmRd / 2) {
    M = MmaxRd + (MplRd - MmaxRd) * (NEd - NpmRd / 2) / (NpmRd / 2);
  } else {
    M = MplRd + (MmaxRd - MplRd) * (NEd / (NpmRd / 2));
  }
  M = Math.max(0, M);
  return { M, mu: MplRd > 0 ? M / MplRd : 0 };
}

function alphaM(fy) {
  // §6.7.3.6(1): 0.9 for S235 to S355, 0.8 for S420 and S460.
  return fy <= 355 ? 0.9 : 0.8;
}

function en_uniaxial(ctx, sc) {
  const { mat, actions } = ctx;
  const axis = ctx.axis === 'z' ? 'z' : 'y';
  const poly = interactionPolygon(ctx, sc, axis);
  const NEd = Number(actions.NEd) || 0;
  const { M, mu } = muFactor(poly, NEd, sc.NplRd);
  const aM = alphaM(mat.fy);
  const capacity = aM * M;
  const MEd = axis === 'z' ? sc.MzEd : sc.MyEd;

  const steps = [
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'h_n', description: 'Neutral axis offset defining the maximum-moment point of the interaction curve',
      expression: 'h_n = A_c f_cd / (2 b f_cd + 4 t (2 f_yd − f_cd))',
      value: poly.hn, dimension: 'length',
      note: 'Reinforcement falling within the depth 2 h_n is not deducted. Verify this for heavily reinforced cores.',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'M_max,Rd', description: 'Maximum moment resistance, at point D of the interaction curve',
      expression: 'M_max,Rd = W_pa f_yd + W_ps f_sd + 0.5 W_pc f_cd',
      value: poly.MmaxRd, dimension: 'moment',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'M_pl,Rd', description: 'Plastic moment resistance, at points B and C of the interaction curve',
      expression: 'M_pl,Rd = M_max,Rd − M_n,Rd',
      value: poly.MplRd, dimension: 'moment',
    }),
    step({
      code: C, clause: '6.7.3.2',
      symbol: 'N_pm,Rd', description: 'Axial force at point C, equal to the resistance of the concrete alone',
      expression: 'N_pm,Rd = A_c f_cd',
      value: poly.NpmRd, dimension: 'force',
    }),
    step({
      code: C, clause: '6.7.3.6',
      symbol: 'μ_d', description: 'Moment resistance ratio read from the interaction curve at N_Ed',
      expression: 'Figure 6.19: linear interpolation between points A, C, D and B',
      value: mu,
    }),
    step({
      code: C, clause: '6.7.3.6',
      symbol: 'α_M', description: 'Coefficient allowing for the difference between the plastic and the actual resistance',
      expression: '0.9 for S235 to S355; 0.8 for S420 and S460',
      substitution: `f_y = ${mat.fy} MPa`,
      value: aM,
    }),
    step({
      code: C, clause: '6.7.3.6',
      symbol: 'M_Rd', description: 'Moment resistance available at the design axial force',
      expression: 'M_Rd = α_M μ_d M_pl,Rd',
      value: capacity, dimension: 'moment',
    }),
  ];

  return {
    steps,
    check: check({
      id: `uniaxial_${axis}`,
      title: `Compression with bending about the ${axis}-axis`,
      code: C, clause: '6.7.3.6',
      clauseTitle: 'Resistance of members in combined compression and uniaxial bending',
      demand: MEd, capacity, dimension: 'moment',
      failureMode: `Formation of a plastic hinge under combined axial force and ${axis}-axis bending`,
      steps,
    }),
    scratch: axis === 'z'
      ? { polyZ: poly, muZ: mu, MRdZ: capacity, alphaM: aM }
      : { polyY: poly, muY: mu, MRdY: capacity, alphaM: aM },
  };
}

function en_biaxial(ctx, sc) {
  const { actions } = ctx;
  const MyEd = sc.MyEd || 0;
  const MzEd = sc.MzEd || 0;

  if (!(Math.abs(Number(actions.MyEd) || 0) > 0 && Math.abs(Number(actions.MzEd) || 0) > 0)) {
    return {
      steps: [notice({
        code: C, clause: '6.7.3.7', symbol: 'biaxial',
        description: 'Combined compression and biaxial bending',
        note: 'Only one bending axis is loaded, so the biaxial interaction of §6.7.3.7 does not apply.',
      })],
      check: check({
        id: 'biaxial', title: 'Compression with biaxial bending',
        code: C, clause: '6.7.3.7', clauseTitle: 'Combined compression and biaxial bending',
        status: CHECK_STATUS.NOT_APPLICABLE,
      }),
      scratch: {},
    };
  }

  const polyY = sc.polyY;
  const polyZ = sc.polyZ;
  const uy = polyY && sc.muY > 0 ? MyEd / (sc.muY * polyY.MplRd) : Infinity;
  const uz = polyZ && sc.muZ > 0 ? MzEd / (sc.muZ * polyZ.MplRd) : Infinity;
  const combined = uy + uz;

  const steps = [
    step({
      code: C, clause: '6.7.3.7',
      symbol: 'M_y,Ed / (μ_dy M_pl,y,Rd)', description: 'Utilisation about the y-axis, without α_M',
      expression: 'M_y,Ed ≤ α_M,y μ_dy M_pl,y,Rd', value: uy,
    }),
    step({
      code: C, clause: '6.7.3.7',
      symbol: 'M_z,Ed / (μ_dz M_pl,z,Rd)', description: 'Utilisation about the z-axis, without α_M',
      expression: 'M_z,Ed ≤ α_M,z μ_dz M_pl,z,Rd', value: uz,
    }),
    step({
      code: C, clause: '6.7.3.7',
      symbol: 'Σ', description: 'Linear interaction of the two bending axes',
      expression: 'M_y,Ed/(μ_dy M_pl,y,Rd) + M_z,Ed/(μ_dz M_pl,z,Rd) ≤ 1.0',
      value: combined,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'biaxial',
      title: 'Compression with biaxial bending',
      code: C, clause: '6.7.3.7', clauseTitle: 'Combined compression and biaxial bending',
      utilisation: combined, limit: 1.0,
      failureMode: 'Combined axial force with bending about both principal axes',
      steps,
    }),
    scratch: { biaxialUy: uy, biaxialUz: uz },
  };
}

/* ------------------------------------------------------------------ */
/* 6.7.4.2 — load introduction                                         */
/* ------------------------------------------------------------------ */

function en_loadTransfer(ctx, sc) {
  const { sec, assumptions, actions } = ctx;
  // §6.7.4.2(4): design shear strength at the interface, filled sections.
  const tauRd = sec.shape === SHAPE.CHS ? 0.55 : 0.40;
  const Lintro = Number(assumptions.introductionLength) || Math.min(2 * (sec.b || sec.d), sec.h ? sec.h * 2 : 2 * (sec.d || sec.b));
  const area = sec.perimeterInner * Lintro;
  const capacity = area * tauRd;
  const NcShare = (sc.Nc + sc.Ns) / sc.NplRd * (Number(actions.NEd) || 0);

  const steps = [
    step({
      code: C, clause: '6.7.4.2',
      symbol: 'τ_Rd', description: 'Design shear strength at the steel–concrete interface',
      expression: 'Table 6.6: 0.55 MPa for circular filled sections, 0.40 MPa for rectangular filled sections',
      value: tauRd, dimension: 'stress',
      verify: true,
    }),
    step({
      code: C, clause: '6.7.4.2',
      symbol: 'V_Rd', description: 'Resistance available over the introduction length',
      expression: 'V_Rd = perimeter × L_intro × τ_Rd',
      value: capacity, dimension: 'force',
    }),
    derived({
      symbol: 'V_Ed', description: 'Force that must be transferred into the concrete core',
      expression: 'V_Ed = N_Ed (A_c f_cd + A_s f_sd) / N_pl,Rd',
      value: NcShare, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'loadTransfer',
      title: 'Load introduction into the concrete core',
      code: C, clause: '6.7.4.2', clauseTitle: 'Load introduction',
      demand: NcShare, capacity, dimension: 'force',
      failureMode: 'Slip at the steel–concrete interface within the introduction length',
      steps, verify: true,
      note: 'The interface shear strengths of Table 6.6 must be confirmed against your controlled copy. Where the check fails, shear connectors or bearing plates are required.',
    }),
    scratch: { tauRd, Lintro },
  };
}

/* ------------------------------------------------------------------ */
/* fire — deliberately not implemented                                 */
/* ------------------------------------------------------------------ */

function en_fire() {
  return {
    steps: [notice({
      code: 'EN 1994-1-2', clause: '4.3.5.1',
      symbol: 'fire', description: 'Fire resistance of the filled composite column',
      note: 'Not calculated. The clause that governs is identified, but the tabulated temperature-dependent reduction factors it depends on are not reproduced in this build, and this platform will not substitute approximations for published tables.',
    })],
    check: check({
      id: 'fire',
      title: 'Fire resistance',
      code: 'EN 1994-1-2', clause: '4.3.5.1',
      clauseTitle: 'Composite columns — simple calculation models',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Loss of resistance at elevated temperature',
      note: 'EN 1994-1-2 §4.3.5.1 with Annex H governs filled hollow sections. Carry out this check separately against the controlled copy, or by testing, before issuing the design.',
      verify: true,
    }),
    scratch: {},
  };
}

const EN1994_CFST_HANDLERS = {
  classification: en_classification,
  plastic: en_plasticResistance,
  confinement: en_confinement,
  stiffness: en_stiffness,
  slenderness: en_slenderness,
  limits: en_limits,
  buckling: en_axialBuckling,
  secondOrder: en_secondOrder,
  uniaxial: en_uniaxial,
  biaxial: en_biaxial,
  loadTransfer: en_loadTransfer,
  fire: en_fire,
};


/* ===== src/codes/aisc360-cfst.js ===== */
// codes/aisc360-cfst.js — AISC 360-22 Chapter I, filled composite members.
//
// Scope of this implementation: axial compression (I2.2) and the local buckling
// classification (I1.4). Flexure and combined loading are NOT implemented and
// return a formal notice rather than a number. See the note in each handler.
//
// Base units are N, mm, MPa. The published equations are dimensionally
// consistent, so no unit conversion is required; the classification limits that
// contain numeric coefficients are expressed in the √(E/F_y) form, which is
// also unit-independent.


const A = 'AISC 360-22';

/**
 * Local buckling limits, held as DATA so they can be corrected in one place
 * without touching the engine. Flagged for office verification because the
 * coefficients come from Table I1.1a and must match the controlled copy.
 */
const AISC_I11A = {
  rectangular: { compact: 2.26, noncompact: 3.00, maximum: 5.00, form: 'sqrt' },
  round: { compact: 0.15, noncompact: 0.19, maximum: 0.31, form: 'linear' },
  source: 'Table I1.1a — axial compression',
  verify: true,
};

function aisc_classification(ctx) {
  const { sec, mat } = ctx;
  const round = sec.shape === SHAPE.CHS;
  const set = round ? AISC_I11A.round : AISC_I11A.rectangular;
  const base = round ? (mat.Ea / mat.fy) : Math.sqrt(mat.Ea / mat.fy);
  const lp = set.compact * base;
  const lr = set.noncompact * base;
  const lmax = set.maximum * base;
  const lam = sec.slendernessRatio;

  const klass = lam <= lp ? 'Compact' : lam <= lr ? 'Noncompact' : 'Slender';

  const steps = [
    step({
      code: A, clause: 'I1.4',
      symbol: 'λ', description: `Wall slenderness, ${sec.slendernessLabel}`,
      value: lam,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_p', description: 'Limit for a compact filled section in axial compression',
      expression: round ? 'λ_p = 0.15 E/F_y' : 'λ_p = 2.26 √(E/F_y)',
      value: lp, verify: true,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_r', description: 'Limit for a noncompact filled section in axial compression',
      expression: round ? 'λ_r = 0.19 E/F_y' : 'λ_r = 3.00 √(E/F_y)',
      value: lr, verify: true,
    }),
    step({
      code: A, clause: 'Table I1.1a',
      symbol: 'λ_max', description: 'Maximum permitted wall slenderness',
      value: lmax, verify: true,
    }),
  ];

  return {
    steps,
    check: check({
      id: 'classification',
      title: `Local buckling classification — section is ${klass.toLowerCase()}`,
      code: A, clause: 'I1.4',
      clauseTitle: 'Classification of filled composite sections for local buckling',
      demand: lam, capacity: lmax, dimension: null,
      failureMode: 'Local buckling of the tube wall',
      steps, verify: true,
      note: klass === 'Compact'
        ? null
        : `The section is ${klass.toLowerCase()}. AISC 360 §I2.2b gives reduced nominal strength equations for noncompact and slender filled sections, which are not implemented in this build. Use a compact section, or carry out this case by hand.`,
    }),
    scratch: { klass, lambdaWall: lam, lp, lr, lmax, compact: klass === 'Compact' },
  };
}

function aisc_axial(ctx, sc) {
  const { sec, mat, geometry, actions, partial } = ctx;
  const round = sec.shape === SHAPE.CHS;
  const C2 = round ? 0.95 : 0.85;

  // I2.2b requires the compact equations; anything else is out of scope here.
  if (!sc.compact) {
    return {
      steps: [notice({
        code: A, clause: 'I2.2',
        symbol: 'P_n', description: 'Compressive strength',
        note: 'Only the compact-section equations of §I2.2b are implemented. No number is produced for a noncompact or slender filled section.',
      })],
      check: check({
        id: 'axial', title: 'Axial compressive strength',
        code: A, clause: 'I2.2', clauseTitle: 'Filled composite members — compressive strength',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Flexural buckling of the composite member',
        note: 'Section is not compact. Complete this check by hand against §I2.2b.',
      }),
      scratch: {},
    };
  }

  const Es = mat.Ea;
  const Ec = mat.Ec;
  const Pno = mat.fy * sec.Aa + C2 * mat.fcPrime * (sec.Ac + sec.As * (Es / Ec));
  const C3 = Math.min(0.9, 0.45 + 3 * ((sec.Aa + sec.As) / sec.Ag));
  const axisZ = ctx.axis === 'z';
  const Ia = axisZ ? sec.IaZ : sec.Ia;
  const Ic = axisZ ? sec.IcZ : sec.Ic;
  const Is = axisZ ? sec.IsZ : sec.Is;
  const EIeff = Es * Ia + Es * Is + C3 * Ec * Ic;
  const Lc = Number(geometry.bucklingLength);
  const Pe = Math.PI ** 2 * EIeff / (Lc * Lc);

  const ratio = Pno / Pe;
  const Pn = ratio <= 2.25 ? Pno * Math.pow(0.658, ratio) : 0.877 * Pe;
  const phi = partial.phiC ?? 0.75;
  const design = phi * Pn;
  const NEd = Number(actions.NEd) || 0;

  const steps = [
    step({
      code: A, clause: 'I2.2',
      symbol: 'C_2', description: 'Coefficient on the concrete contribution',
      expression: '0.85 for rectangular filled sections, 0.95 for round filled sections',
      value: C2,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_no', description: 'Nominal axial compressive strength without slenderness effects',
      expression: 'P_no = F_y A_s + C_2 f′_c (A_c + A_sr E_s/E_c)',
      value: Pno, dimension: 'force',
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'C_3', description: 'Coefficient for the effective rigidity',
      expression: 'C_3 = 0.45 + 3 (A_s + A_sr)/A_g ≤ 0.9',
      value: C3,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'EI_eff', description: 'Effective stiffness of the composite section',
      expression: 'EI_eff = E_s I_s + E_s I_sr + C_3 E_c I_c',
      value: EIeff,
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_e', description: 'Elastic critical buckling load',
      expression: 'P_e = π² (EI_eff) / L_c²',
      value: Pe, dimension: 'force',
    }),
    step({
      code: A, clause: 'I2.2',
      symbol: 'P_n', description: 'Nominal compressive strength',
      expression: ratio <= 2.25 ? 'P_n = P_no [0.658^(P_no/P_e)]' : 'P_n = 0.877 P_e',
      substitution: `P_no/P_e = ${ratio.toFixed(3)} ${ratio <= 2.25 ? '≤' : '>'} 2.25`,
      value: Pn, dimension: 'force',
    }),
    step({
      code: A, clause: 'I1.2',
      symbol: 'φ_c P_n', description: 'Design compressive strength',
      expression: 'φ_c = 0.75 (LRFD)',
      value: design, dimension: 'force',
    }),
  ];

  return {
    steps,
    check: check({
      id: 'axial',
      title: 'Axial compressive strength',
      code: A, clause: 'I2.2',
      clauseTitle: 'Filled composite members — compressive strength',
      demand: NEd, capacity: design, dimension: 'force',
      failureMode: 'Flexural buckling of the composite member',
      steps,
    }),
    scratch: { Pno, Pe, Pn, EIeff, C2, C3, design },
  };
}

function aisc_flexure() {
  return {
    steps: [notice({
      code: A, clause: 'I3.4',
      symbol: 'M_n', description: 'Flexural strength of a filled composite member',
      note: 'Not implemented. §I3.4 defines the plastic stress distribution for filled sections, but this build does not compute it. No moment resistance is produced under AISC 360.',
    })],
    check: check({
      id: 'uniaxial_y', title: 'Compression with uniaxial bending',
      code: A, clause: 'I5', clauseTitle: 'Combined flexure and axial force',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined axial force and bending',
      note: 'Use EN 1994-1-1 §6.7.3.6 for a computed interaction, or complete §I5 by hand.',
    }),
    scratch: {},
  };
}

const AISC360_CFST_HANDLERS = {
  classification: aisc_classification,
  axial: aisc_axial,
  flexure: aisc_flexure,
};


/* ===== src/codes/aisc360-flexure.js ===== */
// codes/aisc360-flexure.js — rolled I-shape in flexure and shear, AISC 360-16.
//
// Written for the sections that come out of a SAP model: doubly symmetric
// I-shapes, bent about the major axis. That is Chapter F Section F2, with the
// compactness limits of Table B4.1b and the shear provisions of G2.1.
//
// Lateral torsional buckling is computed, not waved away, because on a steel
// beam it usually governs and leaving it out would be the difference between a
// safe answer and a wrong one.


const AISCF = 'AISC 360-16';

const AISC_FLEX_DATA = {
  phiB: { value: 0.90, clause: 'F1', desc: 'Resistance factor for flexure, LRFD', verify: true },
  phiV: { value: 1.00, clause: 'G1', desc: 'Resistance factor for shear of rolled I-shaped members meeting G2.1(a)', verify: true },
  E: { value: 200000, clause: 'B3', desc: 'Modulus of elasticity of steel, N/mm2', verify: false },
};

function aD(k) { return AISC_FLEX_DATA[k].value; }

/* ---------------- compactness ---------------- */

function aiscb_compactness(ctx) {
  const { sec, mat } = ctx;
  const E = aD('E');
  const root = Math.sqrt(E / mat.fy);

  const flangeRatio = sec.bf / (2 * sec.tf);
  const lpFlange = 0.38 * root;
  const lrFlange = 1.0 * root;

  const webRatio = sec.h / sec.tw;
  const lpWeb = 3.76 * root;
  const lrWeb = 5.70 * root;

  const flangeCompact = flangeRatio <= lpFlange;
  const webCompact = webRatio <= lpWeb;
  const compact = flangeCompact && webCompact;

  const steps = [
    step({
      code: AISCF, clause: 'Table B4.1b', symbol: 'b_f/2t_f',
      description: 'Flange slenderness against the compact limit',
      expression: 'λ_p = 0.38 √(E/F_y)',
      substitution: `${flangeRatio.toFixed(2)} against ${lpFlange.toFixed(2)}`,
      value: flangeRatio, verify: true,
    }),
    step({
      code: AISCF, clause: 'Table B4.1b', symbol: 'h/t_w',
      description: 'Web slenderness against the compact limit',
      expression: 'λ_p = 3.76 √(E/F_y)',
      substitution: `${webRatio.toFixed(2)} against ${lpWeb.toFixed(2)}`,
      value: webRatio, verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'compactness',
      title: compact ? 'Section is compact' : (flangeCompact ? 'Web is noncompact' : 'Flange is noncompact'),
      code: AISCF, clause: 'Table B4.1b', clauseTitle: 'Width-to-thickness ratios for members subject to flexure',
      demand: compact ? 0 : 1, capacity: 1, dimension: null,
      status: compact ? CHECK_STATUS.PASS : CHECK_STATUS.FAIL,
      failureMode: 'Local buckling of the flange or web before the section reaches its plastic moment',
      steps, verify: true,
      note: compact ? null : 'Sections F3 and F4 give reduced strengths for noncompact flanges and webs. They are not implemented here, so no moment resistance is produced for a noncompact section.',
    })],
    scratch: { compact, flangeRatio, webRatio, lpFlange, lpWeb, lrFlange, lrWeb, root, E },
  };
}

/* ---------------- flexure, F2 ---------------- */

function aiscb_flexure(ctx, sc) {
  const { sec, mat, geometry, actions } = ctx;
  const phi = aD('phiB');
  const MuReq = Math.abs(Number(actions.Mu) || 0);

  if (!sc.compact) {
    return {
      steps: [notice({
        code: AISCF, clause: 'F3', symbol: 'M_n',
        description: 'Flexural strength of a noncompact section',
        note: 'Not calculated. Sections F3 and F4 cover noncompact flanges and webs; only the compact case of F2 is implemented.',
      })],
      checks: [check({
        id: 'flexure', title: 'Flexural strength',
        code: AISCF, clause: 'F3', clauseTitle: 'Doubly symmetric I-shaped members with compact webs and noncompact flanges',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Local buckling under flexure',
      })],
      scratch: {},
    };
  }

  const E = sc.E;
  const Mp = mat.fy * sec.Zx;
  const Lb = Number(geometry.Lb) || 0;
  const Cb = Number(geometry.Cb) || 1.0;

  // F2.2: limiting lengths
  const Lp = 1.76 * sec.ry * Math.sqrt(E / mat.fy);
  const c = 1.0; // doubly symmetric I-shape
  const term = (sec.J * c) / (sec.Sx * sec.ho);
  const inner = term + Math.sqrt(term * term + 6.76 * Math.pow((0.7 * mat.fy) / E, 2));
  const Lr = 1.95 * sec.rts * (E / (0.7 * mat.fy)) * Math.sqrt(inner);

  let Mn;
  let regime;
  if (Lb <= Lp) {
    Mn = Mp;
    regime = 'Yielding governs: the compression flange is braced within L_p.';
  } else if (Lb <= Lr) {
    Mn = Math.min(Mp, Cb * (Mp - (Mp - 0.7 * mat.fy * sec.Sx) * ((Lb - Lp) / (Lr - Lp))));
    regime = 'Inelastic lateral torsional buckling governs.';
  } else {
    const ratio = Lb / sec.rts;
    const Fcr = ((Cb * Math.PI * Math.PI * E) / (ratio * ratio))
      * Math.sqrt(1 + 0.078 * ((sec.J * c) / (sec.Sx * sec.ho)) * ratio * ratio);
