/**
 * The design code for an element comes from the discipline slot it belongs to,
 * read from the chosen country. Reading a single slot for every element meant a
 * concrete beam was offered the composite code, which is the wrong document.
 */
function codeForElement(element, jur) {
  const slot = element.slot || 'concrete';
  const fromCountry = (jur && jur.codes && jur.codes[slot]) || '';
  if (fromCountry && element.codes.includes(fromCountry)) {
    return { code: fromCountry, source: 'country', slot };
  }
  if (fromCountry) {
    return {
      code: element.codes[0], source: 'fallback', slot, countryCode: fromCountry,
      note: `${jur.label} uses ${fromCountry} for ${slot}, which this element is not built against. ${element.codes[0]} is used instead.`,
    };
  }
  return {
    code: element.codes[0], source: 'default', slot,
    note: `No ${slot} code is set for ${jur ? jur.label : 'this country'}. ${element.codes[0]} is used.`,
  };
}

function findElement(id) {
  return ELEMENTS.find((e) => e.id === id) || null;
}

/**
 * Free-text search over name, summary and keywords, in either language.
 * An empty query returns everything, available entries first.
 */
function searchElements(query) {
  const q = String(query || '').trim().toLowerCase();
  const scored = ELEMENTS.map((e) => {
    if (!q) return { e, score: e.available ? 2 : 1 };
    const name = e.name.toLowerCase();
    const short = e.short.toLowerCase();
    let score = 0;
    if (name.startsWith(q) || short.toLowerCase().startsWith(q)) score = 100;
    else if (name.includes(q) || short.includes(q)) score = 70;
    else if (e.keywords.some((k) => k.toLowerCase().startsWith(q))) score = 50;
    else if (e.keywords.some((k) => k.toLowerCase().includes(q))) score = 30;
    else if (e.summary.toLowerCase().includes(q)) score = 10;
    return { e, score };
  });
  // Elements that are built rank above ones that are not, whatever the text
  // match. Putting an unusable result first because its name happened to match
  // more literally would waste the engineer's time.
  return scored
    .filter((x) => x.score > 0)
    .sort((a, b) => (b.e.available ? 1 : 0) - (a.e.available ? 1 : 0)
      || b.score - a.score
      || a.e.name.localeCompare(b.e.name))
    .map((x) => x.e);
}


/* ===== src/core/sapImport.js ===== */
// core/sapImport.js — reading a SAP2000 model and its results.
//
// TWO FILES, BOTH TEXT
//   .$2k   the model: connectivity, sections, groups, combinations, restraints
//   .csv   the results: Element Forces - Frames, and Joint Reactions
//
// The .sdb file is not read and cannot be: it is a closed binary format with no
// published specification, and the only supported way in is a Windows library
// that needs SAP installed. Exporting the text file is one extra click and it
// is fully readable, so that is what this reads.
//
// Results are read from CSV or tab-delimited text rather than .xlsx, because
// reading a workbook would mean carrying a zip and XML reader inside a file
// that is meant to open from a USB stick with nothing installed.

/* ------------------------------------------------------------------ */
/* .$2k model file                                                     */
/* ------------------------------------------------------------------ */

/**
 * The format is: TABLE: "NAME" followed by rows of key=value pairs. A row
 * ending in " _" continues on the next line. Values may be quoted.
 */
function parseS2K(text) {
  const lines = String(text).replace(/\r/g, '').split('\n');
  const tables = new Map();
  let current = null;
  let pending = '';

  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) continue;

    const t = /^TABLE:\s+"(.+)"$/.exec(line.trim());
    if (t) {
      if (pending && current) { tables.get(current).push(parseRow(pending)); pending = ''; }
      current = t[1];
      if (!tables.has(current)) tables.set(current, []);
      continue;
    }
    if (!current) continue;

    if (line.endsWith(' _')) { pending += `${line.slice(0, -2)} `; continue; }
    const row = parseRow(pending + line);
    pending = '';
    if (Object.keys(row).length) tables.get(current).push(row);
  }
  if (pending && current) tables.get(current).push(parseRow(pending));
  return tables;
}

function parseRow(line) {
  const out = {};
  // key=value, value optionally quoted, pairs separated by whitespace
  const re = /([A-Za-z][\w.]*)=("([^"]*)"|[^\s]*)/g;
  let m;
  while ((m = re.exec(line))) {
    out[m[1]] = m[3] !== undefined ? m[3] : m[2];
  }
  return out;
}

/* ------------------------------------------------------------------ */
/* results file                                                        */
/* ------------------------------------------------------------------ */

/**
 * SAP writes three header rows: the table name, the column names, then the
 * units. The units row is kept, because a number without its unit is useless.
 */
function parseResultsTable(text) {
  const rows = splitDelimited(String(text).replace(/\r/g, ''));
  let start = 0;
  let title = null;
  if (rows[0] && /^TABLE:/.test(String(rows[0][0] || ''))) {
    title = String(rows[0][0]).replace(/^TABLE:\s*/, '').trim();
    start = 1;
  }
  const header = (rows[start] || []).map((h) => String(h).trim());
  const units = (rows[start + 1] || []).map((u) => String(u).trim());
  const unitOf = {};
  header.forEach((h, i) => { unitOf[h] = units[i] || ''; });

  const data = [];
  for (let i = start + 2; i < rows.length; i += 1) {
    const r = rows[i];
    if (!r || !r.length || r.every((c) => String(c).trim() === '')) continue;
    const rec = {};
    header.forEach((h, j) => { rec[h] = r[j] === undefined ? '' : String(r[j]).trim(); });
    data.push(rec);
  }
  return { title, header, unitOf, rows: data };
}

function splitDelimited(text) {
  const lines = text.split('\n').filter((l) => l.length);
  const tabbed = lines[1] && lines[1].includes('\t');
  return lines.map((l) => (tabbed ? l.split('\t') : splitCsvLine(l)));
}

function splitCsvLine(line) {
  const out = [];
  let cur = '';
  let q = false;
  for (let i = 0; i < line.length; i += 1) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i += 1; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

/**
 * When the export includes ANALYSIS RESULTS, the forces and reactions arrive
 * inside the same .s2k file as key=value rows rather than as a separate CSV.
 * That is the better route — one export, one file, no spreadsheet in between —
 * so it is read directly.
 *
 * The units come from the model's own unit string rather than from a units row,
 * because a key=value table does not carry one.
 */
function resultsFromS2K(tables, units) {
  const F = units.force || 'Tonf';
  const L = units.length || 'm';
  const moment = `${F}-${L}`;

  const forcesRows = tables.get('ELEMENT FORCES - FRAMES') || [];
  const reactionRows = tables.get('JOINT REACTIONS') || [];

  const forces = forcesRows.length ? {
    title: 'Element Forces - Frames',
    header: ['Frame', 'Station', 'OutputCase', 'P', 'V2', 'V3', 'T', 'M2', 'M3'],
    unitOf: { Station: L, P: F, V2: F, V3: F, T: moment, M2: moment, M3: moment },
    rows: forcesRows,
    fromModelFile: true,
  } : null;

  const reactions = reactionRows.length ? {
    title: 'Joint Reactions',
    header: ['Joint', 'OutputCase', 'F1', 'F2', 'F3', 'M1', 'M2', 'M3'],
    unitOf: { F1: F, F2: F, F3: F, M1: moment, M2: moment, M3: moment },
    rows: reactionRows,
    fromModelFile: true,
  } : null;

  return { forces, reactions };
}

/* ------------------------------------------------------------------ */
/* units                                                               */
/* ------------------------------------------------------------------ */

/** SAP unit strings to the platform's base units: N, mm, MPa, N*mm. */
const SAP_UNIT_FACTORS = {
  // force
  Tonf: 9806.65, Kgf: 9.80665, N: 1, KN: 1000, Kip: 4448.2216, Lb: 4.4482216,
  // length
  m: 1000, cm: 10, mm: 1, ft: 304.8, in: 25.4,
};

function parseUnitString(u) {
  // "Tonf, m, C" -> { force: 'Tonf', length: 'm' }
  const parts = String(u || '').split(',').map((x) => x.trim());
  return { force: parts[0] || 'Tonf', length: parts[1] || 'm', temp: parts[2] || 'C' };
}

/** Converts a value whose SAP unit label is given, e.g. "Tonf-m" or "Tonf". */
function toBaseFromSap(value, unitLabel) {
  const v = Number(value);
  if (!Number.isFinite(v)) return NaN;
  const label = String(unitLabel || '').trim();
  if (!label) return v;
  const parts = label.split('-');
  let factor = 1;
  for (const p of parts) {
    const f = SAP_UNIT_FACTORS[p];
    if (f === undefined) return v; // unrecognised: leave the number alone
    factor *= f;
  }
  return v * factor;
}

/* ------------------------------------------------------------------ */
/* model summary                                                       */
/* ------------------------------------------------------------------ */

function summariseModel(tables) {
  const get = (name) => tables.get(name) || [];

  const frames = new Map();
  for (const r of get('CONNECTIVITY - FRAME')) {
    frames.set(r.Frame, { frame: r.Frame, jointI: r.JointI, jointJ: r.JointJ, section: null });
  }
  for (const r of get('FRAME SECTION ASSIGNMENTS')) {
    const f = frames.get(r.Frame);
    if (f) f.section = r.AnalSect || r.DesignSect || null;
  }

  const sections = new Map();
  for (const r of get('FRAME SECTION PROPERTIES 01 - GENERAL')) {
    if (!r.SectionName) continue;
    if (sections.has(r.SectionName)) continue;
    sections.set(r.SectionName, {
      name: r.SectionName,
      material: r.Material || '',
      shape: r.Shape || '',
      t3: num(r.t3), t2: num(r.t2), tf: num(r.tf), tw: num(r.tw),
    });
  }

  const joints = new Map();
  for (const r of get('JOINT COORDINATES')) {
    joints.set(r.Joint, { joint: r.Joint, x: num(r.XorR), y: num(r.Y), z: num(r.Z), restrained: false });
  }
  for (const r of get('JOINT RESTRAINT ASSIGNMENTS')) {
    const j = joints.get(r.Joint);
    if (j) j.restrained = true;
  }

  const groups = new Map();
  for (const r of get('GROUPS 2 - ASSIGNMENTS')) {
    const name = r.GroupName || r.Group;
    if (!name) continue;
    if (!groups.has(name)) groups.set(name, { name, frames: [], joints: [] });
    const label = r.ObjectLabel || r.Object;
    if (!label) continue;
    if ((r.ObjectType || '').toLowerCase().includes('joint')) groups.get(name).joints.push(label);
    else groups.get(name).frames.push(label);
  }

  const combos = [...new Set(get('COMBINATION DEFINITIONS').map((r) => r.ComboName).filter(Boolean))];
  const cases = [...new Set(get('LOAD PATTERN DEFINITIONS').map((r) => r.LoadPat).filter(Boolean))];

  const control = get('PROGRAM CONTROL')[0] || {};
  const units = parseUnitString(control.CurrUnits);

  return {
    frames, sections, joints, groups, combos, cases, units,
    program: control.ProgramName || 'SAP2000',
    version: control.Version || '',
    steelCode: control.SteelCode || '',
    concreteCode: control.ConcCode || '',
    counts: {
      frames: frames.size, joints: joints.size, sections: sections.size,
      restraints: [...joints.values()].filter((j) => j.restrained).length,
      groups: groups.size, combos: combos.length,
    },
  };
}

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

/* ------------------------------------------------------------------ */
/* joining results to the model                                        */
/* ------------------------------------------------------------------ */

/**
 * For each frame, the worst value of each action across the chosen output
 * cases, together with the case and station it came from. The governing
 * station differs between actions — shear peaks at a support and moment at
 * midspan — and that is correct, not a mistake to be smoothed over.
 */
function envelopeForces(forcesTable, chosenCases) {
  const wanted = new Set(chosenCases);
  const u = forcesTable.unitOf;
  const out = new Map();

  for (const r of forcesTable.rows) {
    if (wanted.size && !wanted.has(r.OutputCase)) continue;
    const frame = r.Frame;
    if (!frame) continue;
    if (!out.has(frame)) {
      out.set(frame, {
        frame,
        P: peak(), V2: peak(), V3: peak(), T: peak(), M2: peak(), M3: peak(),
      });
    }
    const rec = out.get(frame);
    for (const key of ['P', 'V2', 'V3', 'T', 'M2', 'M3']) {
      const val = toBaseFromSap(r[key], u[key]);
      if (!Number.isFinite(val)) continue;
      if (Math.abs(val) > Math.abs(rec[key].value)) {
        rec[key] = { value: val, abs: Math.abs(val), outputCase: r.OutputCase, station: toBaseFromSap(r.Station, u.Station) };
      }
    }
  }
  return out;
}

function peak() { return { value: 0, abs: 0, outputCase: null, station: null }; }

/** Worst reaction at each restrained joint, across the chosen cases. */
function envelopeReactions(reactionsTable, chosenCases) {
  const wanted = new Set(chosenCases);
  const u = reactionsTable.unitOf;
  const out = new Map();

  for (const r of reactionsTable.rows) {
    if (wanted.size && !wanted.has(r.OutputCase)) continue;
    const j = r.Joint;
    if (!j) continue;
    if (!out.has(j)) out.set(j, { joint: j, F1: peak(), F2: peak(), F3: peak(), M1: peak(), M2: peak() });
    const rec = out.get(j);
    for (const key of ['F1', 'F2', 'F3', 'M1', 'M2']) {
      const val = toBaseFromSap(r[key], u[key]);
      if (!Number.isFinite(val)) continue;
      if (Math.abs(val) > Math.abs(rec[key].value)) {
        rec[key] = { value: val, abs: Math.abs(val), outputCase: r.OutputCase };
      }
    }
  }
  return out;
}

/**
 * Candidate design items: one per section, carrying every frame that uses it.
 * The section is common; the actions are not, which is why each member keeps
 * its own row rather than being reduced to a single worst case.
 */
function buildCandidates(model, envelope, restrictToGroups) {
  const allow = restrictToGroups && restrictToGroups.length
    ? new Set(restrictToGroups.flatMap((g) => (model.groups.get(g) || { frames: [] }).frames))
    : null;

  const bySection = new Map();
  for (const f of model.frames.values()) {
    if (allow && !allow.has(f.frame)) continue;
    const sec = f.section || '(unassigned)';
    if (!bySection.has(sec)) {
      bySection.set(sec, { section: sec, properties: model.sections.get(sec) || null, members: [] });
    }
    const env = envelope.get(f.frame);
    bySection.get(sec).members.push({
      frame: f.frame,
      jointI: f.jointI,
      jointJ: f.jointJ,
      forces: env || null,
    });
  }
  return [...bySection.values()].sort((a, b) => a.section.localeCompare(b.section));
}

/**
 * Group the restrained joints by how close their reactions actually are.
 *
 * Dividing the range into equal bands looked tidy and grouped badly: one outlier
 * stretched the range and left middle bands holding a single joint. This walks
 * the sorted list instead and starts a new group where the step up is large
 * relative to the spread, which is what an engineer does by eye.
 */
function groupRestraints(model, reactions, maxBands = 6) {
  const list = [...model.joints.values()]
    .filter((j) => j.restrained)
    .map((j) => {
      const r = reactions.get(j.joint);
      return { joint: j.joint, x: j.x, y: j.y, z: j.z, N: r ? Math.abs(r.F3.value) : 0, source: r ? r.F3.outputCase : null };
    })
    .filter((j) => j.N > 0)
    .sort((a, b) => a.N - b.N);

  if (!list.length) return [];
  if (list.length === 1) {
    return [{ index: 1, min: list[0].N, max: list[0].N, members: list, worst: list[0].N }];
  }

  const span = list[list.length - 1].N - list[0].N;
  // A gap counts as a break when it is a meaningful fraction of the whole
  // spread. With everything close together there are no breaks and one group
  // comes out, which is the right answer for a regular grid.
  const threshold = span * 0.12;

  const groups = [[list[0]]];
  for (let i = 1; i < list.length; i += 1) {
    const gap = list[i].N - list[i - 1].N;
    if (gap > threshold && groups.length < maxBands) groups.push([list[i]]);
    else groups[groups.length - 1].push(list[i]);
  }

  return groups.map((members, i) => ({
    index: i + 1,
    min: members[0].N,
    max: members[members.length - 1].N,
    members,
    worst: members[members.length - 1].N,
  }));
}


/* ------------------------------------------------------------------ */
/* keeping the model and the design in step                            */
/* ------------------------------------------------------------------ */

/**
 * Which of an item's inputs no longer match the analysis model it came from.
 *
 * Changing a section inside the platform is allowed and is how a design is
 * driven. What is not allowed is forgetting: the stiffness that produced the
 * moments came from the model, and once the section here differs from the
 * section there, the actions are strictly no longer the right ones. The
 * platform cannot re-run the analysis, so it does the next best thing and says
 * plainly, on the screen and on the sheet, that the two have parted company.
 */
function driftFromModel(item) {
  const imp = item.imported;
  if (!imp || !imp.snapshot) return { drifted: false, rows: [] };

  const rows = [];
  for (const [path, was] of Object.entries(imp.snapshot)) {
    const now = path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), item);
    if (now === undefined || was === undefined) continue;
    const bothNumbers = typeof now === 'number' && typeof was === 'number';
    const changed = bothNumbers ? Math.abs(now - was) > 1e-6 : now !== was;
    if (changed) rows.push({ path, was, now });
  }
  return { drifted: rows.length > 0, rows, source: imp.source };
}

function describeDrift(drift) {
  if (!drift.drifted) return null;
  const list = drift.rows
    .map((r) => `${r.path.replace(/^geometry\./, '')} ${fmtDrift(r.was)} to ${fmtDrift(r.now)}`)
    .join(', ');
  return `The section has been changed since it was imported from ${drift.source}: ${list}. `
    + 'The analysis was run on the original, so the moments and shears above belong to a different member. '
    + 'Update the model and re-import before this is issued.';
}

function fmtDrift(v) {
  return typeof v === 'number' ? String(Number(v.toFixed(3))) : String(v);
}


/**
 * What a fresh export changes about the items already imported from it.
 *
 * The model is re-exported often, and most of the time little has moved. The
 * point of comparing rather than overwriting is that a sheet may already have
 * been issued against the old numbers: the engineer has to see what shifted
 * before deciding to accept it, and accepting it raises a revision.
 */
function compareImport(existingItems, candidates, chosenCases, loadFactor) {
  const byName = new Map();
  for (const it of existingItems) {
    if (it.imported && it.imported.section) byName.set(it.imported.section, it);
  }

  const rows = [];
  const seen = new Set();

  for (const c of candidates) {
    seen.add(c.section);
    const prev = byName.get(c.section);
    const worst = c.members.reduce((a, m) => (m.forces ? {
      M: Math.max(a.M, m.forces.M3.abs),
      V: Math.max(a.V, m.forces.V2.abs),
      P: Math.max(a.P, m.forces.P.abs),
    } : a), { M: 0, V: 0, P: 0 });

    if (!prev) {
      rows.push({ section: c.section, status: 'new', members: c.members.length, now: worst, was: null });
      continue;
    }

    const was = {
      M: (prev.actions.Mu || 0) / (prev.imported.loadFactor || 1),
      V: (prev.actions.Vu || 0) / (prev.imported.loadFactor || 1),
      P: prev.imported.worstP || 0,
    };
    const moved = ['M', 'V', 'P'].filter((k) => {
      const a = was[k] || 0;
      const b = worst[k] || 0;
      const base = Math.max(Math.abs(a), Math.abs(b), 1);
      return Math.abs(b - a) / base > 0.005;
    });
    const memberChange = prev.imported.memberCount !== c.members.length;
    const caseChange = (prev.imported.cases || []).join() !== chosenCases.join();
    const factorChange = prev.imported.loadFactor !== loadFactor;

    rows.push({
      section: c.section,
      status: moved.length || memberChange || caseChange || factorChange ? 'changed' : 'unchanged',
      members: c.members.length,
      wasMembers: prev.imported.memberCount,
      now: worst, was,
      moved, memberChange, caseChange, factorChange,
      itemId: prev.id, itemNumber: prev.number,
    });
  }

  for (const [section, it] of byName) {
    if (seen.has(section)) continue;
    rows.push({ section, status: 'removed', itemId: it.id, itemNumber: it.number, members: 0, now: null, was: null });
  }

  const counts = {
    new: rows.filter((r) => r.status === 'new').length,
    changed: rows.filter((r) => r.status === 'changed').length,
    unchanged: rows.filter((r) => r.status === 'unchanged').length,
    removed: rows.filter((r) => r.status === 'removed').length,
  };
  return { rows, counts, anyChange: counts.new + counts.changed + counts.removed > 0 };
}


/* ===== src/modules/cfst/assumptions.js ===== */
// modules/cfst/assumptions.js — the assumption manager.
//
// Assumptions are first-class data, not hidden defaults. Each one carries where
// it came from, whether a human has touched it, and what it is used for. The
// engine reads only from this list, so nothing can be assumed silently.


const SOURCE = {
  AUTO: 'auto',        // generated by the platform from the code and the inputs
  USER: 'user',        // set by an engineer, with a reason
  PROJECT: 'project',  // inherited from the project record
};

/**
 * Every assumption: { key, label, value, dimension, source, basis, usedBy,
 *                     options?, min?, max?, reason?, changedAt? }
 * `basis` states where the default came from, in plain language.
 */
function generateAssumptions(item, codeId) {
  const euro = codeId.startsWith('EN');
  const list = [];

  const add = (a) => list.push({ id: uid('asm'), source: SOURCE.AUTO, reason: null, changedAt: null, ...a });

  add({
    key: 'gammaM0', label: 'Partial factor for structural steel, γ_M0',
    value: euro ? 1.0 : 1.0, dimension: null,
    basis: euro ? 'EN 1993-1-1 §6.1, recommended value. Subject to the National Annex.' : 'Not used in the AISC route; resistance factors are applied instead.',
    usedBy: 'Design yield strength of the tube',
    min: 0.9, max: 1.5,
  });
  add({
    key: 'gammaC', label: 'Partial factor for concrete, γ_C',
    value: 1.5, dimension: null,
    basis: 'EN 1992-1-1 Table 2.1N, persistent and transient design situations. Subject to the National Annex.',
    usedBy: 'Design compressive strength of the core',
    min: 1.0, max: 1.8,
  });
  add({
    key: 'gammaS', label: 'Partial factor for reinforcement, γ_S',
    value: 1.15, dimension: null,
    basis: 'EN 1992-1-1 Table 2.1N. Subject to the National Annex.',
    usedBy: 'Design strength of the longitudinal bars',
    min: 1.0, max: 1.5,
  });
  add({
    key: 'phiC', label: 'Resistance factor for compression, φ_c',
    value: 0.75, dimension: null,
    basis: 'AISC 360-22 §I2.2, LRFD.',
    usedBy: 'Design compressive strength in the AISC route',
    min: 0.6, max: 1.0,
  });
  add({
    key: 'creepCoefficient', label: 'Creep coefficient, φ_t',
    value: 1.5, dimension: null,
    basis: 'Assumed value for an interior column at 50% relative humidity, loaded at 28 days. Replace with a value from EN 1992-1-1 §3.1.4 for the actual member size, humidity and loading age.',
    usedBy: 'Effective concrete modulus, and therefore the critical load',
    min: 0, max: 4,
  });
  add({
    key: 'bucklingLengthFactor', label: 'Effective length factor, K',
    value: 1.0, dimension: null,
    basis: 'Pinned at both ends. Change to suit the actual restraint conditions; this factor is not derived by the platform.',
    usedBy: 'Buckling length, and therefore the critical load',
    min: 0.5, max: 3.0,
  });
  add({
    key: 'momentRatio', label: 'End moment ratio, r',
    value: 1.0, dimension: null,
    basis: 'Equal and opposite end moments, giving the most severe value of β. Adjust to the actual moment diagram.',
    usedBy: 'Equivalent moment factor β in the second-order amplification',
    min: -1, max: 1,
  });
  add({
    key: 'introductionLength', label: 'Load introduction length',
    value: introDefault(item), dimension: 'length',
    basis: 'EN 1994-1-1 §6.7.4.2 limits the introduction length to twice the transverse dimension or one third of the column length, whichever is smaller.',
    usedBy: 'Interface shear check at the connection',
    min: 0,
  });
  add({
    key: 'concreteFillMethod', label: 'Concrete placement',
    value: 'Pumped from the base', dimension: null,
    options: ['Pumped from the base', 'Poured from the top', 'Precast core'],
    basis: 'Affects the reliance that may be placed on natural bond at the interface.',
    usedBy: 'Load introduction assumptions and the drawing notes',
  });
  add({
    key: 'fireRating', label: 'Required fire rating',
    value: 'R90', dimension: null,
    options: ['None', 'R30', 'R60', 'R90', 'R120', 'R180'],
    basis: 'Project requirement. Not derived by the platform.',
    usedBy: 'Fire design, which is reported separately',
  });

  return list;
}

function introDefault(item) {
  const g = item.geometry || {};
  const dim = g.shape === 'CHS' ? Number(g.d) : Math.max(Number(g.b) || 0, Number(g.h) || 0);
  const byLength = (Number(g.length) || 0) / 3;
  const byDim = 2 * dim;
  const both = [byDim, byLength].filter((x) => x > 0);
  return both.length ? Math.min(...both) : byDim;
}

/** Flat map for the engine: { key: value }. */
function assumptionValues(list) {
  return Object.fromEntries((list || []).map((a) => [a.key, a.value]));
}

function findAssumption(list, key) {
  return (list || []).find((a) => a.key === key) || null;
}

/**
 * Apply an edit. A reason is mandatory — the caller cannot bypass it, because
 * the audit log rejects assumption changes without one.
 */
function applyAssumptionEdit(list, key, value, reason, at) {
  return (list || []).map((a) => (a.key === key
    ? { ...a, value, source: SOURCE.USER, reason, changedAt: at }
    : a));
}

/** Restore one assumption to the generated default. */
function resetAssumption(list, key, item, codeId) {
  const fresh = generateAssumptions(item, codeId).find((a) => a.key === key);
  if (!fresh) return list;
  return list.map((a) => (a.key === key ? { ...fresh, id: a.id } : a));
}

/**
 * Merge a regenerated set with the existing one, keeping every user edit.
 * Called when the design code changes so the list stays complete without
 * discarding decisions an engineer has already made and justified.
 */
function reconcileAssumptions(existing, item, codeId) {
  const fresh = generateAssumptions(item, codeId);
  return fresh.map((f) => {
    const prev = (existing || []).find((a) => a.key === f.key);
    if (prev && prev.source === SOURCE.USER) {
      return { ...f, id: prev.id, value: prev.value, source: SOURCE.USER, reason: prev.reason, changedAt: prev.changedAt };
    }
    return prev ? { ...f, id: prev.id } : f;
  });
}


/* ===== src/modules/cfst/engine.js ===== */
// modules/cfst/engine.js — the orchestrator.
//
// This file contains no design equations and names no code. It asks the
// registry what the selected code can do, runs whatever handlers it is given,
// and turns refusals into printable notices. Adding a code changes nothing here.


/** EN 1992-1-1 §3.1.3 secant modulus; ACI 318-19 §19.2.2 for the AISC route. */
function materialModel(m) {
  const fck = Number(m.fck) || 0;
  return {
    fy: Number(m.fy) || 0,
    fck,
    fcPrime: fck, // cylinder strength; the two codes use the same basis
    fsk: Number(m.fsk) || 0,
    Ea: 210000,
    Es: 200000,
    Ecm: 22000 * Math.pow((fck + 8) / 10, 0.3),
    Ec: 4700 * Math.sqrt(Math.max(fck, 0)),
  };
}

function buildContext(item, codeId) {
  const sec = sectionProperties(item.geometry);
  const mat = materialModel(item.materials);
  const asm = assumptionValues(item.assumptions);
  const K = Number(asm.bucklingLengthFactor) || 1;
  const L = (Number(item.geometry.length) || 0) * K;

  return {
    codeId,
    sec, mat,
    axis: 'y',
    geometry: { ...item.geometry, bucklingLength: L, K },
    actions: { ...item.actions, momentRatio: asm.momentRatio },
    assumptions: asm,
    partial: {
      gammaM0: Number(asm.gammaM0) || 1,
      gammaC: Number(asm.gammaC) || 1.5,
      gammaS: Number(asm.gammaS) || 1.15,
      phiC: Number(asm.phiC) || 0.75,
    },
  };
}

/**
 * Run the design. Never throws for an unsupported code: an uncovered check
 * becomes a check record with status NOT COVERED and the registry's own words.
 */
function runCfst(registry, item) {
  const codeId = item.code;
  const code = registry.get(codeId);
  const ctx = buildContext(item, codeId);
  const scratch = {};
  const steps = [];
  const checks = [];
  const notices = [];

  // Whole-code substitution, never per-check substitution.
  //
  // A design check is not independent: §6.7.3.5 needs the slenderness from
  // §6.7.3.3, which needs the plastic resistance from §6.7.3.2. Borrowing one
  // handler from another code mid-sequence would run it without its
  // prerequisites and produce a number that looks valid and is not. So either
  // the selected code drives the whole calculation, or — where it publishes
  // nothing at all — a single nominated code does, and every line says so.
  let workingCode = code;
  let substitution = null;

  if (!code || !code.plans || !code.plans.cfst) {
    const nominee = nominateSubstitute(registry, codeId);
    if (nominee) {
      workingCode = nominee.code;
      substitution = { from: codeId, to: nominee.code.id, note: nominee.note };
      notices.push({ cap: 'cfst', from: codeId, to: nominee.code.id, note: nominee.note });
    } else {
      const res = registry.resolve(CFST_CHECK_SEQUENCE[0], codeId);
      checks.push(check({
        id: 'coverage', title: 'Design code coverage', code: codeId, clause: null,
        status: CHECK_STATUS.NOT_COVERED,
        note: res.note || `${codeId} publishes no provisions for concrete-filled tubular columns, and no installed code was nominated in its place.`,
      }));
      return { ctx, scratch, steps, checks, notices, substitution: null,
        summary: summarise(checks), codeId, ranAt: new Date().toISOString() };
    }
  }

  const plan = workingCode.plans.cfst;
  const runCodeId = workingCode.id;

  const geometryProblems = validateGeometry(item.geometry);
  if (geometryProblems.length) {
    checks.push(check({
      id: 'geometry', title: 'Section geometry', code: runCodeId, clause: null,
      status: CHECK_STATUS.NOT_APPLICABLE,
      note: `The section as described cannot be built, so no calculation has been attempted. ${geometryProblems.join(' ')}`,
    }));
    return { ctx, scratch, steps, checks, notices, substitution,
      summary: summarise(checks), codeId, runCodeId, ranAt: new Date().toISOString() };
  }


  for (const entry of plan) {
    const cap = typeof entry === 'string' ? entry : entry.cap;
    const axis = typeof entry === 'string' ? 'y' : (entry.axis || 'y');
    const skipIf = typeof entry === 'string' ? null : entry.skipIf;

    if (skipIf && skipIf(ctx, scratch)) continue;

    // A fire check that has been declared not required is recorded as a signed
    // engineering decision, not quietly dropped. Without a written reason it
    // stays outstanding, so the verdict cannot reach SAFE by omission.
    if (cap === CAP.CFST_FIRE && item.fire && item.fire.required === false) {
      const reason = String(item.fire.reason || '').trim();
      checks.push(check({
        id: cap,
        title: capLabel(cap),
        code: 'EN 1994-1-2', clause: '4.3.5.1',
        clauseTitle: 'Composite columns — simple calculation models',
        status: reason ? CHECK_STATUS.NOT_APPLICABLE : CHECK_STATUS.NOT_COVERED,
        note: reason
          ? `Fire design declared not required for this member. Stated basis: "${reason}". This is a recorded engineering decision, not a calculation, and it prints on the sheet.`
          : 'Fire design has been marked as not required, but no reason has been given. State the basis before this design can be read as satisfactory.',
      }));
      continue;
    }

    const res = registry.resolve(cap, runCodeId);

    if (res.status === COVERAGE.COVERED && typeof res.handler === 'function') {
      ctx.axis = axis;
      let out;
      try {
        out = res.handler(ctx, scratch);
      } catch (err) {
        checks.push(check({
          id: cap, title: capLabel(cap), code: runCodeId, clause: res.clause,
          status: CHECK_STATUS.NOT_IMPLEMENTED,
          note: `The calculation could not be completed: ${err.message}`,
        }));
        continue;
      }
      if (out.steps) steps.push(...out.steps);
      if (out.check) checks.push(decorate(out.check, substitution));
      if (out.scratch) Object.assign(scratch, out.scratch);
      continue;
    }

    checks.push(decorate(check({
      id: cap,
      title: capLabel(cap),
      code: runCodeId,
      clause: res.clause,
      clauseTitle: res.clauseTitle,
      status: res.status === COVERAGE.DECLARED ? CHECK_STATUS.NOT_IMPLEMENTED : CHECK_STATUS.NOT_COVERED,
      note: [res.note, alternativeSentence(res)].filter(Boolean).join(' '),
    }), substitution));
    notices.push({ cap, from: runCodeId, to: null, note: res.note });
  }

  const summary = summarise(checks);
  return { ctx, scratch, steps, checks, notices, substitution, summary, codeId, runCodeId, ranAt: new Date().toISOString() };
}


/**
 * Pick the code that will carry the calculation when the selected one has no
 * provisions. Only a code that declares a complete CFST plan qualifies.
 */
function nominateSubstitute(registry, codeId) {
  const res = registry.resolve(CFST_CHECK_SEQUENCE[0], codeId);
  const declared = (res.alternatives || []).map((a) => registry.get(a.id)).filter(Boolean);
  const scanned = registry.list().filter((c) => c.plans && c.plans.cfst);
  const candidate = declared.find((c) => c.plans && c.plans.cfst) || scanned[0];
  if (!candidate) return null;
  return {
    code: candidate,
    note: `${codeId} publishes no design provisions for concrete-filled tubular columns. ${res.note || ''} This calculation has therefore been carried out to ${candidate.id} (${candidate.edition}). The substitution must be accepted by the checker and stated on the calculation sheet.`.trim(),
  };
}

function alternativeSentence(res) {
  const alts = (res.alternatives || []).map((a) => a.id);
  if (!alts.length) return null;
  return `Installed codes that address this check: ${alts.join(', ')}.`;
}

function decorate(c, substitution) {
  if (!substitution) return c;
  return { ...c, substituted: substitution, note: [`Carried out to ${substitution.to} because ${substitution.from} does not cover it.`, c.note].filter(Boolean).join(' ') };
}


/* ===== src/modules/rcbeam/engine.js ===== */
// modules/rcbeam/engine.js — reinforced concrete beam, ECP 203.
//
// The office had this split across six spreadsheets: moment, shear, torsion,
// deflection of cantilevers, deflection of simples, and a moment-of-resistance
// table. A beam is one member. Splitting the checks across files meant the
// section could be changed for the moment and never rechecked for shear, and it
// meant nothing ever produced a single verdict for the beam as a whole.
//
// Here it is one element with one verdict, and the same registry contract as
// the CFST engine: no equation in this file, no code named.


const BEAM_SUPPORT = {
  SIMPLE: 'simple',
  CONTINUOUS_ONE: 'continuousOne',
  CONTINUOUS_TWO: 'continuousTwo',
  CANTILEVER: 'cantilever',
};

const BEAM_SUPPORT_LABELS = {
  simple: 'Simply supported',
  continuousOne: 'Continuous one end',
  continuousTwo: 'Continuous both ends',
  cantilever: 'Cantilever',
};

/** Geometry of a rectangular or flanged section. All mm, N, MPa. */
function beamSection(g) {
  const b = Number(g.b) || 0;
  const t = Number(g.t) || 0;
  const cover = Number(g.cover) || 0;
  const barDia = Number(g.barDia) || 0;
  const stirrupDia = Number(g.stirrupDia) || 0;
  const d = Math.max(0, t - cover - stirrupDia - barDia / 2);
  return {
    b, t, cover, barDia, stirrupDia,
    d,
    dPrime: cover + stirrupDia + barDia / 2,
    area: b * t,
    barArea: Math.PI / 4 * barDia * barDia,
  };
}

function validateBeam(g) {
  const out = [];
  if (!(Number(g.b) > 0)) out.push('The beam width must be greater than zero.');
  if (!(Number(g.t) > 0)) out.push('The overall depth must be greater than zero.');
  if (!(Number(g.span) > 0)) out.push('The span must be greater than zero.');
  const s = beamSection(g);
  if (!(s.d > 0)) {
    out.push(`The cover, stirrup and bar sizes leave no effective depth: they consume ${(s.dPrime).toFixed(0)} mm of a ${g.t} mm section.`);
  }
  return out;
}

/** Bars needed for a required steel area, and the area they actually give. */
function barSchedule(asRequired, barDia) {
  const one = Math.PI / 4 * barDia * barDia;
  if (!(one > 0)) return { count: 0, provided: 0, ratio: 0 };
  const count = Math.max(2, Math.ceil(asRequired / one));
  const provided = count * one;
  return { count, provided, ratio: asRequired > 0 ? provided / asRequired : 0 };
}

function buildBeamContext(item) {

// modules/rccolumn/engine.js — reinforced concrete column, ECP 203.
//
// Replaces four office sheets — rectangular columns, circular columns, sections
// under M and N, and biaxial bending — with one member. Slenderness runs first
// because it produces the additional eccentricity the moments depend on.


const COL_SHAPE = { RECT: 'RECT', CIRC: 'CIRC' };

function columnSection(g) {
  const circular = g.shape === COL_SHAPE.CIRC;
  const b = Number(g.b) || 0;
  const t = circular ? (Number(g.D) || 0) : (Number(g.t) || 0);
  const D = Number(g.D) || 0;
  const n = Math.max(0, Number(g.bars) || 0);
  const barDia = Number(g.barDia) || 0;
  const Asc = n * Math.PI / 4 * barDia * barDia;
  const gross = circular ? Math.PI / 4 * D * D : b * t;
  return {
    circular, b: circular ? D : b, t, D, gross, Asc,
    bars: n, barDia,
    cover: Number(g.cover) || 0,
    tieDia: Number(g.tieDia) || 0,
  };
}

function validateColumn(g) {
  const out = [];
  const circular = g.shape === COL_SHAPE.CIRC;
  if (circular) {
    if (!(Number(g.D) > 0)) out.push('The column diameter must be greater than zero.');
  } else {
    if (!(Number(g.b) > 0)) out.push('The column width must be greater than zero.');
    if (!(Number(g.t) > 0)) out.push('The column depth must be greater than zero.');
  }
  if (!(Number(g.height) > 0)) out.push('The column height must be greater than zero.');
  const s = columnSection(g);
  if (s.Asc > 0 && s.Asc >= s.gross) out.push('The bars do not fit inside the column section.');
  const clear = (circular ? Number(g.D) : Math.min(Number(g.b), Number(g.t))) - 2 * (s.cover + s.tieDia) - s.barDia;
  if (s.bars > 0 && !(clear > 0)) out.push('The cover, ties and bar size leave no room inside the section.');
  return out;
}

// modules/plategirder/engine.js — welded plate girder.
//
// Classification runs first: the class decides whether the plastic or the
// elastic modulus applies, and whether there is a resistance to compute at all.


function plateSection(g) {
  const bf = Number(g.bf) || 0;
  const tf = Number(g.tf) || 0;
  const hw = Number(g.hw) || 0;
  const tw = Number(g.tw) || 0;
  const h = hw + 2 * tf;
  const A = 2 * bf * tf + hw * tw;
  const I = (bf * Math.pow(h, 3) - (bf - tw) * Math.pow(hw, 3)) / 12;
  return {
    bf, tf, hw, tw, h, A, I,
    weldLeg: Number(g.weldLeg) || 0,
    Wel: h > 0 ? (2 * I) / h : 0,
    Wpl: bf * tf * (h - tf) + (tw * hw * hw) / 4,
    massPerMetre: A * 1e-6 * 7850,
  };
}

  const out = [];
  if (!(Number(g.bf) > 0)) out.push('The flange width must be greater than zero.');
  if (!(Number(g.tf) > 0)) out.push('The flange thickness must be greater than zero.');
  if (!(Number(g.hw) > 0)) out.push('The web depth must be greater than zero.');
  if (!(Number(g.tw) > 0)) out.push('The web thickness must be greater than zero.');
  if (Number(g.tw) >= Number(g.bf)) out.push('The web is wider than the flange it sits under.');
  return out;

// modules/retaining/engine.js — cantilever retaining wall.
//
// Order matters more here than anywhere else: the pressures produce the
// overturning moment, the weights produce the resisting moment, and only with
// both does stability mean anything. The structural design of the stem comes
// last because it is pointless on a wall that slides away.


function wallGeometry(g) {
  const toe = Number(g.toe) || 0;
  const heel = Number(g.heel) || 0;
  const stemThickness = Number(g.stemThickness) || 0;
  return {
    H: Number(g.H) || 0,
    Df: Number(g.Df) || 0,
    toe, heel, stemThickness,
    baseThickness: Number(g.baseThickness) || 0,
    baseLength: toe + stemThickness + heel,
    cover: Number(g.cover) || 0,
    barDia: Number(g.barDia) || 0,
  };
}

function validateWall(g) {
  const out = [];
  const w = wallGeometry(g);
  if (!(w.H > 0)) out.push('The wall height must be greater than zero.');
  if (!(w.stemThickness > 0)) out.push('The stem thickness must be greater than zero.');
  if (!(w.baseThickness > 0)) out.push('The base thickness must be greater than zero.');
  if (!(w.baseLength > 0)) out.push('The base length must be greater than zero.');
  if (w.baseThickness >= w.H) out.push('The base is as deep as the whole wall, leaving no stem.');
  if (w.stemThickness > w.cover * 2 + w.barDia) { /* fine */ } else {
    out.push('The cover and bar size leave no effective depth in the stem.');
  }
  return out;
}

const WALL_PLAN = ['wall.pressure', 'wall.weights', 'wall.stability', 'wall.stem'];

function buildWallContext(item) {
  return {

// modules/steelbeam/engine.js — rolled steel beam, AISC 360-16.
//
// Section properties are derived from the plate dimensions so a section can be
// typed in by hand, and so a section imported from an analysis model can be
// checked against what the model actually used.


/**
 * Properties of a rolled section.
 *
 * Where a catalogue section is named, its published properties are used. The
 * values derived from the plate dimensions come out about five per cent low,
 * because the root radius adds material exactly where it does most good and the
 * dimension columns do not carry it. Five per cent of a bending resistance is
 * not a rounding difference, and being wrong in the safe direction is still
 * being wrong.
 *
 * With no catalogue name — a welded section, or one typed in by hand — the
 * properties are derived, and the sheet says so.
 */
function steelBeamSection(g) {
  const cat = g.catalogue ? sectionByName(g.catalogue) : null;
  if (cat && !cat.suspect) {
    const h = cat.h;
    const ho = h - cat.tf;
    const Iz = cat.Iz * 1e4;
    const Sx = cat.Wely * 1e3;
    const Cw = (Iz * ho * ho) / 4;
    return {
      d: h, bf: cat.b, tf: cat.tf, tw: cat.tw,
      h: h - 2 * cat.tf,
      A: cat.A * 100,
      Ix: cat.Ix * 1e4,
      Iy: Iz,
      Sx,
      Zx: cat.Wply * 1e3,
      ry: cat.iz * 10,
      ho,
      J: cat.It * 1e4,
      Cw,
      rts: Sx > 0 ? Math.sqrt(Math.sqrt(Iz * Cw) / Sx) : 0,
      massPerMetre: cat.massPerMetre,
      source: cat.name,
    };
  }
  return derivedSection(g);
}

function derivedSection(g) {
  const d = Number(g.d) || 0;
  const bf = Number(g.bf) || 0;
  const tf = Number(g.tf) || 0;
  const tw = Number(g.tw) || 0;
  const h = Math.max(0, d - 2 * tf);
  const A = 2 * bf * tf + h * tw;

  const Ix = (bf * Math.pow(d, 3) - (bf - tw) * Math.pow(h, 3)) / 12;
  const Iy = (2 * tf * Math.pow(bf, 3) + h * Math.pow(tw, 3)) / 12;
  const Sx = d > 0 ? (2 * Ix) / d : 0;
  const Zx = bf * tf * (d - tf) + (tw * h * h) / 4;
  const ry = A > 0 ? Math.sqrt(Iy / A) : 0;
  const ho = d - tf;                       // distance between flange centroids
  const J = (2 * bf * Math.pow(tf, 3) + h * Math.pow(tw, 3)) / 3;
  const Cw = (Iy * ho * ho) / 4;
  const rts = Sx > 0 ? Math.sqrt(Math.sqrt(Iy * Cw) / Sx) : 0;

  return { d, bf, tf, tw, h, A, Ix, Iy, Sx, Zx, ry, ho, J, Cw, rts, massPerMetre: A * 1e-6 * 7850, source: null };
}

function validateSteelBeam(g) {
  const out = [];
  const cat = g.catalogue ? sectionByName(g.catalogue) : null;
  if (cat && cat.suspect) {
    out.push(`${cat.name} cannot be used: ${cat.suspect}`);
    return out;
  }
  if (!(Number(g.d) > 0)) out.push('The overall depth must be greater than zero.');
  if (!(Number(g.bf) > 0)) out.push('The flange width must be greater than zero.');
  if (!(Number(g.tf) > 0)) out.push('The flange thickness must be greater than zero.');
  if (!(Number(g.tw) > 0)) out.push('The web thickness must be greater than zero.');
  if (Number(g.d) <= 2 * Number(g.tf)) out.push('The flanges are as deep as the section, leaving no web.');
  if (Number(g.tw) >= Number(g.bf)) out.push('The web is wider than the flange above it.');
  return out;
}

const STEEL_BEAM_PLAN = ['steelb.compact', 'steelb.flexure', 'steelb.shear'];

function buildSteelBeamContext(item) {
  return {
    codeId: item.code,
    sec: steelBeamSection(item.geometry),
    mat: { fy: Number(item.materials.fy) || 0 },
    geometry: {
      Lb: Number(item.geometry.Lb) || 0,

      span: Number(item.geometry.span) || 0,
    },
    actions: item.actions,

function runSteelBeam(registry, item) {
  const codeId = item.code;
  const ctx = buildSteelBeamContext(item);
  const scratch = {};
  const steps = [];
  const checks = [];
  const notices = [];

  const problems = validateSteelBeam(item.geometry);
  if (problems.length) {
    checks.push(check({
      id: 'geometry', title: 'Section geometry', code: codeId, clause: null,

    }));
    return { ctx, scratch, steps, checks, notices, summary: summarise(checks), codeId, runCodeId: codeId, platformVersion: PLATFORM_VERSION, ranAt: new Date().toISOString() };
  }

  for (const cap of STEEL_BEAM_PLAN) {

    if (res.status === COVERAGE.COVERED && typeof res.handler === 'function') {

        }));
        continue;
      }
      if (out.steps) steps.push(...out.steps);

// modules/doublechannel/engine.js — double channel member.
//
// One element serves both the beam and the column case, because a double

// strengths side by side. Slenderness runs first: how far apart the connectors
// sit decides everything that follows.


function validateDoubleChannel(g) {
  const out = [];
  const ch = channelByName(g.channel);
  if (!ch) out.push(`"${g.channel}" is not in the channel catalogue.`);
  if (!(Number(g.Lc) > 0)) out.push('The effective length must be greater than zero.');
  if (!(Number(g.connectorSpacing) > 0)) out.push('The connector spacing must be greater than zero: without connectors the two channels are two members, not one.');

// modules/run.js — the single entry point the UI calls.
//
// Runs the member and then the base, and rolls both into one verdict. Keeping
// this separate means the two engines never import each other.


function runDesign(registry, item) {
  // Each element kind has its own engine. The router is here so no engine has
  // to know that any other exists.
  if (item.kind === 'rcbeam') return runBeam(registry, item);
  if (item.kind === 'rccolumn') return runColumn(registry, item);
  if (item.kind === 'footing') return runFooting(registry, item);
  if (item.kind === 'slab') return runSlab(registry, item);
  if (item.kind === 'combined') return runCombined(registry, item);
  if (item.kind === 'plategirder') return runPlateGirder(registry, item);
  if (item.kind === 'retaining') return runRetainingWall(registry, item);
  if (item.kind === 'steelbeam') return runSteelBeam(registry, item);
  if (item.kind === 'doublechannel') return runDoubleChannel(registry, item);
  const member = runCfst(registry, item);
  const base = runBasePlate(registry, item);

  const checks = [...member.checks, ...base.checks];
  const steps = [...member.steps, ...base.steps];

  return {
    ...member,
    platformVersion: PLATFORM_VERSION,
    baseRunCodeId: base.runCodeId,
    memberSteps: member.steps,
    baseSteps: base.steps,
    memberChecks: member.checks,
    baseChecks: base.checks,
    baseCtx: base.ctx || null,
    steps,
    checks,
    notices: [...member.notices, ...(base.notices || [])],
    summary: summarise(checks),
  };
}


/* ===== src/codes/ecp203-rc.js ===== */
// codes/ecp203-rc.js — ECP 203 reinforced concrete, ultimate limit state.
//
// WRITTEN FROM THE CODE, NOT CONVERTED FROM A SPREADSHEET.
//
// The office sheets were used only to confirm that the results agree. Their
// formulas were not copied: several were third-party work under copyright, and
// several were written as opaque constants that no checker could verify, for
// example the reinforcement area expressed as
//
//     As = ((fcu/115) - sqrt((fcu/115)^2 - 3.384372e-4 fcu^2 R / fy)) / (1.6921739e-4 fcu^2 / fy)
//
// That is a correct rearrangement of the ECP flexural equations, but it hides
// which clause it came from. Here the same result is produced from the stated
// equilibrium, so every line can be checked against the code.
//
// COEFFICIENTS FLAGGED FOR CONFIRMATION
// Values marked `verify: true` are the numbers this engine cannot derive and
// must read from the published tables. They print on the sheet with a note. Set
// them from the office controlled copy before issuing anything.


const ECP = 'ECP 203-2020';

/**
 * Table data, held separately so it can be corrected in one place.
 * Each entry names the clause it belongs to and whether it needs confirming.
 */
const ECP203_DATA = {
  gammaC: { value: 1.5, clause: '2.4', desc: 'Partial factor for concrete', verify: false },
  gammaS: { value: 1.15, clause: '2.4', desc: 'Partial factor for reinforcement', verify: false },

  // Rectangular stress block: depth a = beta1 * c, intensity alpha1 * fcu/gammaC
  alpha1: { value: 0.67, clause: '4.2', desc: 'Intensity of the equivalent rectangular stress block', verify: true },
  beta1: { value: 0.80, clause: '4.2', desc: 'Ratio of the stress block depth to the neutral axis depth', verify: true },

  // Maximum neutral axis depth, to keep the section under-reinforced
  cMaxOverD: {
    clause: '4.2',
    desc: 'Maximum neutral axis depth ratio (c/d)max',
    byGrade: { 240: 0.50, 280: 0.48, 360: 0.44, 400: 0.42, 450: 0.40, 500: 0.38 },
    verify: true,
  },

  // Shear
  qcuFactor: { value: 0.24, clause: '4.2.2', desc: 'Concrete shear strength coefficient in q_cu = 0.24 sqrt(f_cu/gamma_c)', verify: false },
  qumaxFactor: { value: 0.70, clause: '4.2.2', desc: 'Upper limit coefficient in q_umax = 0.70 sqrt(f_cu/gamma_c)', verify: true },
  qumaxCap: { value: 4.0, clause: '4.2.2', desc: 'Absolute cap on q_umax in N/mm2', verify: true },

  // Minimum reinforcement
  asMinFactor: { value: 0.225, clause: '4.2', desc: 'Coefficient in As,min = (0.225 sqrt(f_cu)/f_y) b d', verify: true },
  asMinFloorPct: { value: 0.15, clause: '4.2', desc: 'Absolute floor on As,min as a percentage of b d', verify: true },
  asMaxPct: { value: 4.0, clause: '4.2', desc: 'Maximum tension reinforcement as a percentage of b d', verify: true },

  // Deflection control by span to depth
  spanDepth: {
    clause: '4.3',
    desc: 'Span to effective depth limits for deflection without calculation',
    simple: 16, continuousOne: 18, continuousTwo: 21, cantilever: 8,
    verify: true,
  },
};

function dataStep(key, extra = {}) {
  const d = ECP203_DATA[key];
  return step({
    code: ECP, clause: d.clause,
    symbol: extra.symbol || key,
    description: d.desc,
    value: d.value,
    verify: d.verify,
    note: d.verify ? 'Read from a published table. Confirm against the controlled copy before issue.' : null,
    ...extra,
  });
}

function strengths(ctx) {
  const { mat } = ctx;
  return {
    fcd: mat.fcu / ECP203_DATA.gammaC.value,
    fyd: mat.fy / ECP203_DATA.gammaS.value,
  };
}

function cMaxRatio(fy) {
  const table = ECP203_DATA.cMaxOverD.byGrade;
  const grades = Object.keys(table).map(Number).sort((a, b) => a - b);
  const exact = table[fy];
  if (exact) return exact;
  // Between listed grades, take the lower (more restrictive) value rather than
  // interpolating a number the code does not publish.
  const below = grades.filter((g) => g <= fy).pop();
  return below ? table[below] : table[grades[grades.length - 1]];
}

/* ------------------------------------------------------------------ */
/* flexure                                                             */
/* ------------------------------------------------------------------ */

function ecp_flexure(ctx) {
  const { sec, mat, actions } = ctx;
  const { fcd, fyd } = strengths(ctx);
  const a1 = ECP203_DATA.alpha1.value;
  const b1 = ECP203_DATA.beta1.value;
  const b = sec.b;
  const d = sec.d;
  const Mu = Math.abs(Number(actions.Mu) || 0);

  // Equilibrium of the rectangular stress block:
  //   C = alpha1 (fcu/gammaC) b a          T = As fyd
  //   Mu = C (d - a/2)   ->  quadratic in a
  const k = a1 * fcd * b;
  const disc = d * d - (2 * Mu) / k;
  const aDepth = disc >= 0 ? d - Math.sqrt(disc) : NaN;
  const cDepth = aDepth / b1;
  const cOverD = cDepth / d;
  const cMax = cMaxRatio(mat.fy);

  const As = Number.isFinite(aDepth) ? (k * aDepth) / fyd : NaN;

  // The useful comparison is against the largest moment this section can carry
  // while staying under-reinforced. Comparing M_u with the moment produced by
  // its own solved stress block would be circular and would always read 1.000.
  const aMax = b1 * cMax * d;
  const MuMax = k * aMax * (d - aMax / 2);

  const asMinA = (ECP203_DATA.asMinFactor.value * Math.sqrt(mat.fcu) / mat.fy) * b * d;
  const asMinB = (ECP203_DATA.asMinFloorPct.value / 100) * b * d;
  const asMin = Math.max(asMinA, asMinB);
  const asMax = (ECP203_DATA.asMaxPct.value / 100) * b * d;
  const AsProvided = Math.max(As, asMin);

  const steps = [
    step({
      code: ECP, clause: '2.4', symbol: 'f_cd', description: 'Design compressive strength of concrete',
      expression: 'f_cd = f_cu / γ_c', substitution: `${mat.fcu} / ${ECP203_DATA.gammaC.value}`,
      value: fcd, dimension: 'stress',
    }),
    step({
      code: ECP, clause: '2.4', symbol: 'f_yd', description: 'Design yield strength of reinforcement',
      expression: 'f_yd = f_y / γ_s', substitution: `${mat.fy} / ${ECP203_DATA.gammaS.value}`,
      value: fyd, dimension: 'stress',
    }),
    dataStep('alpha1', { symbol: 'α₁' }),
    dataStep('beta1', { symbol: 'β₁' }),
    step({
      code: ECP, clause: '4.2', symbol: 'a', description: 'Depth of the equivalent rectangular stress block, from moment equilibrium',
      expression: 'M_u = α₁ f_cd b a (d − a/2)  solved for a',
      value: aDepth, dimension: 'length',
      note: Number.isFinite(aDepth) ? null : 'The section cannot carry this moment as singly reinforced. Compression steel or a deeper section is required; doubly reinforced design is not implemented.',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'c/d', description: 'Neutral axis depth ratio',
      expression: 'c = a / β₁',
      value: cOverD,
    }),
    step({
      code: ECP, clause: '4.2', symbol: '(c/d)max', description: `Maximum neutral axis depth ratio for f_y = ${mat.fy}`,
      value: cMax, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'A_s', description: 'Tension reinforcement from force equilibrium',
      expression: 'A_s = α₁ f_cd b a / f_yd',
      value: As, dimension: 'area',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'A_s,min', description: 'Minimum tension reinforcement',
      expression: 'A_s,min = max[ (0.225 √f_cu / f_y) b d , 0.15% b d ]',
      substitution: `max(${asMinA.toFixed(0)}, ${asMinB.toFixed(0)})`,
      value: asMin, dimension: 'area', verify: true,
    }),
    derived({
      symbol: 'A_s,req', description: 'Reinforcement adopted, being the larger of the calculated and the minimum',
      value: AsProvided, dimension: 'area',
    }),
    step({
      code: ECP, clause: '4.2', symbol: 'M_u,max',
      description: 'Largest moment this section can carry while remaining under-reinforced',
      expression: 'M_u,max = α₁ f_cd b a_max (d − a_max/2), a_max = β₁ (c/d)max d',
      value: MuMax, dimension: 'moment', verify: true,
    }),
  ];

  const checks = [
    check({
      id: 'flexure',
      title: 'Flexural reinforcement',
      code: ECP, clause: '4.2', clauseTitle: 'Design of sections subject to bending',
      demand: Mu,
      capacity: MuMax,
      dimension: 'moment',
      failureMode: 'The moment exceeds what the section can carry as singly reinforced, so compression steel or a deeper section is required',
      steps,
      note: Number.isFinite(aDepth) ? null : 'No singly reinforced solution exists for this moment. Increase the depth or design as doubly reinforced, which this engine does not do.',
    }),
    check({
      id: 'ductility',
      title: 'Section is under-reinforced',
      code: ECP, clause: '4.2', clauseTitle: 'Limit on the neutral axis depth',
      demand: cOverD, capacity: cMax, dimension: null,
      failureMode: 'Over-reinforced section: the concrete crushes before the steel yields, giving a brittle failure',
      verify: true,
      steps: [],
    }),
    check({
      id: 'asmax',
      title: 'Reinforcement within the maximum',
      code: ECP, clause: '4.2', clauseTitle: 'Maximum tension reinforcement',
      demand: AsProvided, capacity: asMax, dimension: 'area',
      failureMode: 'Congested section; the code limit on tension steel is exceeded',
      verify: true,
      steps: [],
    }),
  ];

  return { steps, checks, scratch: { fcd, fyd, As, asMin, asMax, AsProvided, aDepth, cOverD, cMax } };
}

/* ------------------------------------------------------------------ */
/* shear                                                               */
/* ------------------------------------------------------------------ */

function ecp_shear(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const fyStirrup = Number(ctx.mat.fyStirrup) || mat.fy;
  const gC = ECP203_DATA.gammaC.value;
  const gS = ECP203_DATA.gammaS.value;
  const b = sec.b;
  const d = sec.d;
  const Qu = Math.abs(Number(actions.Qu) || 0);

  const qu = Qu / (b * d);
  const qcu = ECP203_DATA.qcuFactor.value * Math.sqrt(mat.fcu / gC);
  const qumax = Math.min(
    ECP203_DATA.qumaxFactor.value * Math.sqrt(mat.fcu / gC),
    ECP203_DATA.qumaxCap.value,
  );

  let regime;
  let qsu = 0;
  if (qu <= qcu / 2) { regime = 'No shear reinforcement required; minimum stirrups govern.'; qsu = 0; }
  else if (qu <= qcu) { regime = 'Minimum shear reinforcement governs.'; qsu = 0; }
  else { regime = 'Shear reinforcement designed for the excess above half the concrete strength.'; qsu = qu - qcu / 2; }

  // Ast/s for the designed stirrups
  const astOverS = qsu > 0 ? (qsu * b) / (fyStirrup / gS) : 0;

  const steps = [
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_u', description: 'Applied shear stress',
      expression: 'q_u = Q_u / (b d)', value: qu, dimension: 'stress',
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_cu', description: 'Shear stress carried by the concrete',
      expression: 'q_cu = 0.24 √(f_cu / γ_c)',
      substitution: `0.24 × √(${mat.fcu} / ${gC})`,
      value: qcu, dimension: 'stress',
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_umax', description: 'Upper limit on the shear stress, to prevent web crushing',
      expression: 'q_umax = 0.70 √(f_cu / γ_c) ≤ 4.0 N/mm²',
      value: qumax, dimension: 'stress', verify: true,
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'q_su', description: 'Shear stress to be carried by the stirrups',
      expression: 'q_su = q_u − q_cu / 2 where q_u > q_cu',
      value: qsu, dimension: 'stress', note: regime,
    }),
    step({
      code: ECP, clause: '4.2.2', symbol: 'A_st / s', description: 'Stirrup area per unit length',
      expression: 'A_st / s = q_su b / (f_yst / γ_s)',
      value: astOverS,
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'shear',
        title: 'Shear stress within the web crushing limit',
        code: ECP, clause: '4.2.2', clauseTitle: 'Shear',
        demand: qu, capacity: qumax, dimension: 'stress',
        failureMode: 'Crushing of the concrete web under diagonal compression. Stirrups cannot help; the section must be enlarged.',
        steps, verify: true,
      }),
    ],
    scratch: { qu, qcu, qumax, qsu, astOverS, shearRegime: regime },
  };
}

/* ------------------------------------------------------------------ */
/* deflection by span to depth                                         */
/* ------------------------------------------------------------------ */

function ecp_deflection(ctx) {
  const { sec, geometry } = ctx;
  const t = ECP203_DATA.spanDepth;
  const condition = geometry.condition || 'simple';
  const limit = t[condition] || t.simple;
  const ratio = geometry.span / sec.d;

  const steps = [
    step({
      code: ECP, clause: '4.3', symbol: 'L/d', description: 'Span to effective depth ratio',
      value: ratio,
    }),
    step({
      code: ECP, clause: '4.3', symbol: '(L/d)max',
      description: `Limit for a ${condition} member, below which deflection need not be calculated`,
      value: limit, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy, including any modification for the reinforcement ratio.',
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'deflection',
      title: 'Deflection controlled by span to depth',
      code: ECP, clause: '4.3', clauseTitle: 'Control of deflection',
      demand: ratio, capacity: limit, dimension: null,
      failureMode: 'Excessive deflection. Beyond this ratio the code requires deflection to be calculated rather than deemed to satisfy.',
      steps, verify: true,
      note: 'This is the deemed-to-satisfy route. Exceeding it does not mean the member fails, only that deflection must be calculated explicitly, which this engine does not do.',
    })],
    scratch: { spanDepthRatio: ratio, spanDepthLimit: limit },
  };
}

/* ------------------------------------------------------------------ */
/* torsion — declared, not implemented                                 */
/* ------------------------------------------------------------------ */

function ecp_torsion(ctx) {
  const Tu = Math.abs(Number(ctx.actions.Tu) || 0);
  if (!Tu) {
    return {
      steps: [notice({
        code: ECP, clause: '4.2.3', symbol: 'T_u', description: 'Torsion',
        note: 'No torsional moment is applied, so the torsion provisions do not apply.',
      })],
      checks: [check({
        id: 'torsion', title: 'Torsion', code: ECP, clause: '4.2.3',
        clauseTitle: 'Design for torsion', status: CHECK_STATUS.NOT_APPLICABLE,
      })],
      scratch: {},
    };
  }
  return {
    steps: [notice({
      code: ECP, clause: '4.2.3', symbol: 'T_u', description: 'Torsion',
      note: 'Not calculated. The torsion provisions require the shear flow around the closed section together with combined shear and torsion interaction, which this engine does not implement.',
    })],
    checks: [check({
      id: 'torsion', title: 'Torsion', code: ECP, clause: '4.2.3',
      clauseTitle: 'Design for torsion',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Torsional cracking and failure of the section',
      note: 'A torsional moment is applied. Complete this check by hand against ECP 203 §4.2.3.',
    })],
    scratch: {},
  };
}

const ECP203_RC_HANDLERS = {
  flexure: ecp_flexure,
  shear: ecp_shear,
  deflection: ecp_deflection,
  torsion: ecp_torsion,
};


/* ===== src/codes/ecp203-col.js ===== */
// codes/ecp203-col.js — ECP 203 reinforced concrete columns.
//
// Written from the code. The office had this across four sheets: rectangular
// columns, circular columns, sections under M and N, and biaxial bending. They
// are one member: a column has a slenderness, an axial load, and moments about
// one or both axes, and the answer depends on all of them together.
//
// Values marked verify: true are read from published tables and must be
// confirmed against the office controlled copy.


const ECPC = 'ECP 203-2020';

const ECP203_COL_DATA = {
  // Short column capacity, braced, ultimate limit state
  tiedConcrete: { value: 0.35, clause: '6.4', desc: 'Concrete coefficient for a tied column, P_u = 0.35 f_cu A_c + 0.67 f_y A_sc', verify: true },
  tiedSteel: { value: 0.67, clause: '6.4', desc: 'Steel coefficient for a tied column', verify: true },
  spiralConcrete: { value: 0.40, clause: '6.4', desc: 'Concrete coefficient for a spirally reinforced column', verify: true },
  spiralSteel: { value: 0.76, clause: '6.4', desc: 'Steel coefficient for a spirally reinforced column', verify: true },

  // Reinforcement limits
  rhoMin: { value: 0.008, clause: '6.4', desc: 'Minimum longitudinal reinforcement ratio', verify: true },
  rhoMax: { value: 0.040, clause: '6.4', desc: 'Maximum longitudinal reinforcement ratio', verify: true },

  // Slenderness
  slendernessBraced: { value: 15, clause: '6.4', desc: 'Slenderness ratio below which a braced column is short', verify: true },
  slendernessUnbraced: { value: 10, clause: '6.4', desc: 'Slenderness ratio below which an unbraced column is short', verify: true },
  slendernessMax: { value: 30, clause: '6.4', desc: 'Slenderness ratio beyond which the simplified method may not be used', verify: true },

  // Biaxial bending: beta against the axial load level R_b
  betaTable: {
    clause: '6.4',
    desc: 'Coefficient β for the magnified moment method, against R_b = N_u / (f_cu b t)',
    rows: [[0.2, 0.80], [0.3, 0.75], [0.4, 0.70], [0.5, 0.65], [1.0, 0.60]],
    verify: true,
  },
};

function colD(key) { return ECP203_COL_DATA[key].value; }

function colDataStep(key, symbol) {
  const e = ECP203_COL_DATA[key];
  return step({
    code: ECPC, clause: e.clause, symbol: symbol || key,
    description: e.desc, value: e.value, verify: e.verify,
    note: e.verify ? 'Read from a published table. Confirm against the controlled copy before issue.' : null,
  });
}

/* ------------------------------------------------------------------ */
/* slenderness                                                         */
/* ------------------------------------------------------------------ */

function ecpc_slenderness(ctx) {
  const { sec, geometry } = ctx;
  const braced = geometry.braced !== false;
  const k = Number(geometry.effectiveLengthFactor) || 1;
  const He = k * (Number(geometry.height) || 0);
  const leastDim = sec.circular ? sec.D : Math.min(sec.b, sec.t);
  const lambda = leastDim > 0 ? He / leastDim : Infinity;
  const shortLimit = braced ? colD('slendernessBraced') : colD('slendernessUnbraced');
  const isShort = lambda <= shortLimit;

  // Additional eccentricity for a slender column
  const delta = isShort ? 0 : (lambda * lambda * leastDim) / 2000;

  const steps = [
    step({
      code: ECPC, clause: '6.4', symbol: 'H_e', description: 'Effective height',
      expression: 'H_e = k H', substitution: `${k} × ${geometry.height}`,
      value: He, dimension: 'length',
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'λ', description: 'Slenderness ratio on the least dimension',
      expression: 'λ = H_e / b_min', value: lambda,
    }),
    colDataStep(braced ? 'slendernessBraced' : 'slendernessUnbraced', 'λ_short'),
    step({
      code: ECPC, clause: '6.4', symbol: 'δ', description: 'Additional eccentricity for a slender column',
      expression: 'δ = λ² b / 2000, taken as zero for a short column',
      value: delta, dimension: 'length', verify: true,
      note: isShort ? 'The column is short, so no additional eccentricity applies.' : null,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'slenderness',
      title: isShort ? 'Column is short' : 'Column is slender',
      code: ECPC, clause: '6.4', clauseTitle: 'Slenderness of columns',
      demand: lambda, capacity: colD('slendernessMax'), dimension: null,
      failureMode: 'Buckling of a slender column. Beyond the tabulated limit the simplified method may not be used at all.',
      steps, verify: true,
      note: isShort ? null : `The column is slender (λ = ${lambda.toFixed(1)}). An additional eccentricity of ${delta.toFixed(0)} mm has been applied to the moments.`,
    })],
    scratch: { lambda, He, isShort, delta, leastDim, braced },
  };
}

/* ------------------------------------------------------------------ */
/* axial capacity                                                      */
/* ------------------------------------------------------------------ */

function ecpc_axial(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const spiral = !!ctx.geometry.spiral;
  const kc = spiral ? colD('spiralConcrete') : colD('tiedConcrete');
  const ks = spiral ? colD('spiralSteel') : colD('tiedSteel');

  const Asc = sec.Asc;
  const Ac = sec.gross - Asc;
  const Pu = kc * mat.fcu * Ac + ks * mat.fy * Asc;
  const Nu = Math.abs(Number(actions.Nu) || 0);

  const rho = sec.gross > 0 ? Asc / sec.gross : 0;
  const ascMin = colD('rhoMin') * sec.gross;
  const ascMax = colD('rhoMax') * sec.gross;

  const steps = [
    colDataStep(spiral ? 'spiralConcrete' : 'tiedConcrete', spiral ? '0.40' : '0.35'),
    colDataStep(spiral ? 'spiralSteel' : 'tiedSteel', spiral ? '0.76' : '0.67'),
    step({
      code: ECPC, clause: '6.4', symbol: 'A_c', description: 'Net concrete area',
      expression: 'A_c = A_g − A_sc', value: Ac, dimension: 'area',
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'P_u', description: `Ultimate axial capacity of a ${spiral ? 'spirally reinforced' : 'tied'} column`,
      expression: spiral ? 'P_u = 0.40 f_cu A_c + 0.76 f_y A_sc' : 'P_u = 0.35 f_cu A_c + 0.67 f_y A_sc',
      substitution: `${kc} × ${mat.fcu} × ${Ac.toFixed(0)} + ${ks} × ${mat.fy} × ${Asc.toFixed(0)}`,
      value: Pu, dimension: 'force', verify: true,
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'μ', description: 'Longitudinal reinforcement ratio',
      value: rho,
    }),
  ];

  return {
    steps,
    checks: [
      check({
        id: 'axial', title: 'Axial capacity',
        code: ECPC, clause: '6.4', clauseTitle: 'Design of columns subject to axial load',
        demand: Nu, capacity: Pu, dimension: 'force',
        failureMode: 'Crushing of the column under axial compression',
        steps, verify: true,
      }),
      check({
        id: 'rhoMin', title: 'Minimum longitudinal reinforcement',
        code: ECPC, clause: '6.4', clauseTitle: 'Reinforcement limits for columns',
        demand: ascMin, capacity: Asc, dimension: 'area',
        failureMode: 'Insufficient longitudinal steel for a column',
        verify: true, steps: [],
      }),
      check({
        id: 'rhoMax', title: 'Maximum longitudinal reinforcement',
        code: ECPC, clause: '6.4', clauseTitle: 'Reinforcement limits for columns',
        demand: Asc, capacity: ascMax, dimension: 'area',
        failureMode: 'Congested section; the code limit on longitudinal steel is exceeded',
        verify: true, steps: [],
      }),
    ],
    scratch: { Pu, Ac, Asc, rho, ascMin, ascMax, spiral },
  };
}

/* ------------------------------------------------------------------ */
/* biaxial bending, magnified moment method                            */
/* ------------------------------------------------------------------ */

function betaFor(Rb) {
  for (const [limit, beta] of ECP203_COL_DATA.betaTable.rows) {
    if (Rb <= limit) return beta;
  }
  return ECP203_COL_DATA.betaTable.rows[ECP203_COL_DATA.betaTable.rows.length - 1][1];
}

function ecpc_biaxial(ctx, sc) {
  const { sec, mat, actions } = ctx;
  const Nu = Math.abs(Number(actions.Nu) || 0);
  const Mx = Math.abs(Number(actions.Mx) || 0) + Nu * (sc.delta || 0);
  const My = Math.abs(Number(actions.My) || 0) + Nu * (sc.delta || 0);

  if (!(Mx > 0 && My > 0)) {
    return {
      steps: [notice({
        code: ECPC, clause: '6.4', symbol: 'M_D',
        description: 'Combined axial load and biaxial bending',
        note: 'Moments are applied about one axis at most, so the magnified moment method does not apply.',
      })],
      checks: [check({
        id: 'biaxial', title: 'Combined axial load and biaxial bending',
        code: ECPC, clause: '6.4', clauseTitle: 'Sections subject to axial load and biaxial bending',
        status: CHECK_STATUS.NOT_APPLICABLE,
      })],
      scratch: {},
    };
  }

  if (sec.circular) {
    return {
      steps: [notice({
        code: ECPC, clause: '6.4', symbol: 'M_D',
        description: 'Biaxial bending of a circular column',
        note: 'A circular section has no distinct axes, so the two moments are combined as a resultant rather than by the magnified moment method.',
      })],
      checks: [check({
        id: 'biaxial', title: 'Combined axial load and biaxial bending',
        code: ECPC, clause: '6.4', clauseTitle: 'Sections subject to axial load and biaxial bending',
        status: CHECK_STATUS.NOT_IMPLEMENTED,
        failureMode: 'Combined axial load and bending about a resultant axis',
        note: 'Not implemented for circular sections. Combine the moments as a resultant and design for uniaxial bending, or complete this by hand.',
      })],
      scratch: {},
    };
  }

  // Reduced dimensions to the centroid of the outer bars
  const cover = sec.cover + sec.tieDia + sec.barDia / 2;
  const aPrime = sec.b - 2 * cover;
  const bPrime = sec.t - 2 * cover;

  const Rb = (mat.fcu * sec.b * sec.t) > 0 ? Nu / (mat.fcu * sec.b * sec.t) : Infinity;
  const beta = betaFor(Rb);

  // The larger relative moment governs which axis is magnified
  const ratioX = Mx / bPrime;
  const ratioY = My / aPrime;
  const magnifyAboutX = ratioX >= ratioY;
  const MD = magnifyAboutX
    ? Mx + beta * (bPrime / aPrime) * My
    : My + beta * (aPrime / bPrime) * Mx;

  const steps = [
    step({
      code: ECPC, clause: '6.4', symbol: 'R_b', description: 'Axial load level',
      expression: 'R_b = N_u / (f_cu b t)',
      substitution: `${(Nu / 1e3).toFixed(1)} kN / (${mat.fcu} × ${sec.b} × ${sec.t})`,
      value: Rb,
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'β', description: 'Coefficient for the magnified moment method, from R_b',
      value: beta, verify: true,
      note: 'Read from a published table. Confirm against the controlled copy.',
    }),
    step({
      code: ECPC, clause: '6.4', symbol: 'M_D', description: 'Design moment about the governing axis',
      expression: magnifyAboutX
        ? 'M_D = M_x + β (b′/a′) M_y'
        : 'M_D = M_y + β (a′/b′) M_x',
      value: MD, dimension: 'moment', verify: true,
    }),
  ];

  return {
    steps,
    checks: [check({
      id: 'biaxial',
      title: `Combined axial load and biaxial bending, magnified about the ${magnifyAboutX ? 'x' : 'y'}-axis`,
      code: ECPC, clause: '6.4', clauseTitle: 'Sections subject to axial load and biaxial bending',
      status: CHECK_STATUS.NOT_IMPLEMENTED,
      failureMode: 'Combined axial load and bending about both axes',
      steps, verify: true,
      note: `The design moment M_D = ${(MD / 1e6).toFixed(1)} kN·m has been established, but the interaction diagram that would verify the section against N_u and M_D together is not implemented. Read M_D and N_u against the published design chart, or complete this by hand.`,
    })],
    scratch: { Rb, beta, MD, magnifyAboutX, aPrime, bPrime, MxTotal: Mx, MyTotal: My },
  };
}

const ECP203_COL_HANDLERS = {
  slenderness: ecpc_slenderness,
  axial: ecpc_axial,
  biaxial: ecpc_biaxial,
};


/* ===== src/codes/ecp203-fdn.js ===== */
// codes/ecp203-fdn.js — ECP 203 isolated footings.
//
// The office had this as one sheet duplicated sixteen times, F(1) to F(16), one
// tab per footing. A register of items replaces that: the same engine, sixteen
// records, and a change to the method reaches all of them at once.
//
// Values marked verify: true are read from published tables.


const ECPF = 'ECP 203-2020';

const ECP203_FDN_DATA = {
  ownWeight: { value: 1.10, clause: '7.1', desc: 'Allowance for the footing self weight and overburden, as a factor on the column working load', verify: true },
  qcuSlab: { value: 0.16, clause: '4.2.2', desc: 'One-way shear strength of a slab without stirrups, q_cu = 0.16 sqrt(f_cu/gamma_c)', verify: true },
  qcupBase: { value: 0.316, clause: '4.2.4', desc: 'Punching shear strength coefficient, q_cup = 0.316 sqrt(f_cu/gamma_c)', verify: true },
  qcupCap: { value: 1.60, clause: '4.2.4', desc: 'Upper limit coefficient on punching shear strength', verify: true },
  tensionShift: { value: 0, clause: '4.2', desc: 'Critical section for bending taken at the column face', verify: false },
};

function fD(k) { return ECP203_FDN_DATA[k].value; }

function fDataStep(k, symbol) {
  const e = ECP203_FDN_DATA[k];
  return step({
    code: ECPF, clause: e.clause, symbol: symbol || k,
    description: e.desc, value: e.value, verify: e.verify,
    note: e.verify ? 'Read from a published table. Confirm against the controlled copy before issue.' : null,
  });
}

/* ---------------- bearing pressure ---------------- */

function ecpf_bearing(ctx) {
  const { sec, actions, soil } = ctx;
  const Nw = Math.abs(Number(actions.Nw) || 0);
  const Mw = Math.abs(Number(actions.Mw) || 0);
  const factor = fD('ownWeight');
  const Ntotal = Nw * factor;

  const A = sec.L * sec.B;
  const Z = (sec.B * sec.L * sec.L) / 6;
  const ecc = Ntotal > 0 ? Mw / Ntotal : 0;
  const kern = sec.L / 6;

  const fMax = A > 0 ? (Ntotal / A) + (Z > 0 ? Mw / Z : 0) : Infinity;
  const fMin = A > 0 ? (Ntotal / A) - (Z > 0 ? Mw / Z : 0) : -Infinity;

  const steps = [
    fDataStep('ownWeight', 'k_ow'),
    derived({
      symbol: 'N_total', description: 'Working load including the allowance for the footing weight',
      expression: 'N_total = k_ow N_w', value: Ntotal, dimension: 'force',
    }),
    step({
      code: ECPF, clause: '7.1', symbol: 'e', description: 'Eccentricity of the resultant',
      expression: 'e = M_w / N_total', value: ecc, dimension: 'length',
      note: ecc > kern ? `The resultant falls outside the middle third (L/6 = ${kern.toFixed(0)} mm), so part of the base lifts and the linear pressure distribution below does not apply.` : null,
    }),
    step({
      code: ECPF, clause: '7.1', symbol: 'f_max', description: 'Maximum bearing pressure under the footing',
      expression: 'f = N_total/A + M_w/Z', value: fMax, dimension: 'stress',
    }),
    step({
      code: ECPF, clause: '7.1', symbol: 'f_min', description: 'Minimum bearing pressure under the footing',
      expression: 'f = N_total/A − M_w/Z', value: fMin, dimension: 'stress',
    }),
  ];

  const checks = [
    check({
      id: 'bearing', title: 'Bearing pressure on the soil',
      code: ECPF, clause: '7.1', clauseTitle: 'Bearing pressure under isolated footings',
      demand: fMax, capacity: soil.qall, dimension: 'stress',
      failureMode: 'Bearing failure of the soil beneath the footing',
      steps, verify: true,
    }),
    check({
      id: 'uplift', title: 'Resultant within the middle third',
      code: ECPF, clause: '7.1', clauseTitle: 'Eccentric loading of footings',
      demand: ecc, capacity: kern, dimension: 'length',
      failureMode: 'Part of the base lifts off the soil, so the assumed linear pressure distribution is invalid',
